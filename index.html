6-10-05 | 子方案建立 |\n"}, {"id": "SP6", "title": "AI 陣營外交 (Sovereign Agents)", "status": "not_started", "progress": 0, "owner": "Opus", "models": ["Opus", "Codex", "Gemini"], "milestone": "M4", "updated": "2026-10-05", "file": "docs/subprojects/SP6_ai-factions.md", "questions": [{"done": false, "text": "宣戰權限護欄：頻率上限、營運否決權、決策可回溯"}, {"done": false, "text": "每伺服器常駐 LLM 的成本預算"}, {"done": false, "text": "加入陣營條件（Lv.50）與更換陣營懲罰"}], "body": "# SP6 AI 陣營外交 (Sovereign Agents)\n\n## 目標\n\n四位 LLM 陣營首領代理人：記憶、人格、外交決策。M4 目標為封閉模擬中驗證外交合理性。\n\n- 對應 GDD 章節：§7\n- 里程碑：M4\n- 主責：Opus；參與模型：Opus, Codex, Gemini\n\n## 交付物\n\n- [ ] 首領 Agent 架構（狀態機 + LLM 決策層）\n- [ ] 文字模擬對局框架\n- [ ] 人格設定（Gemini 協作）\n\n## 待討論\n\n- [ ] 宣戰權限護欄：頻率上限、營運否決權、決策可回溯\n- [ ] 每伺服器常駐 LLM 的成本預算\n- [ ] 加入陣營條件（Lv.50）與更換陣營懲罰\n\n## 進度紀錄\n\n| 日期 | 內容 |\n|---|---|\n| 2026-10-05 | 子方案建立 |\n"}, {"id": "SP7", "title": "AI Director 動態事件 (Dynamic Events)", "status": "not_started", "progress": 0, "owner": "Codex", "models": ["Codex", "Opus"], "milestone": "M3/M4", "updated": "2026-10-05", "file": "docs/subprojects/SP7_ai-director.md", "questions": [{"done": false, "text": "AI Director 可動用的權限邊界（能否改地形、能否影響經濟）"}, {"done": false, "text": "事件頻率與玩家疲勞"}], "body": "# SP7 AI Director 動態事件 (Dynamic Events)\n\n## 目標\n\n中央事件調度器：生態壓力閥、陣營爭端事件、突發史詩副本。Codex 負責實驗性原型。\n\n- 對應 GDD 章節：§8\n- 里程碑：M3/M4\n- 主責：Codex；參與模型：Codex, Opus\n\n## 交付物\n\n- [ ] 事件觸發規則原型\n- [ ] 生態模擬（怪物密度/刷取壓力）\n- [ ] 事件模板庫\n\n## 待討論\n\n- [ ] AI Director 可動用的權限邊界（能否改地形、能否影響經濟）\n- [ ] 事件頻率與玩家疲勞\n\n## 進度紀錄\n\n| 日期 | 內容 |\n|---|---|\n| 2026-10-05 | 子方案建立 |\n"}, {"id": "SP8", "title": "技術架構與伺服器 (Tech Architecture)", "status": "not_started", "progress": 0, "owner": "Opus", "models": ["Opus", "Sonnet"], "milestone": "M1–M4", "updated": "2026-10-05", "file": "docs/subprojects/SP8_tech-arch.md", "questions": [{"done": true, "text": "引擎版本：統一 **UE 5.8**（ADR-0007）"}, {"done": false, "text": "**SpatialOS 已停止支援**，需選定替代的空間分區/無縫世界方案"}, {"done": false, "text": "伺服器語言與雲平台"}, {"done": false, "text": "團隊規模、預算、目標平台（PC/主機/行動）"}], "body": "# SP8 技術架構與伺服器 (Tech Architecture)\n\n## 目標\n\n客戶端、伺服器、AI 微服務、資料層整體架構。\n\n- 對應 GDD 章節：§9\n- 里程碑：M1–M4\n- 主責：Opus；參與模型：Opus, Sonnet\n\n## 交付物\n\n- [ ] 架構決策紀錄 (ADR)\n- [ ] 伺服器分區方案評估\n- [ ] AI 微服務介面規格\n\n## 待討論\n\n- [x] 引擎版本：統一 **UE 5.8**（ADR-0007）\n- [ ] **SpatialOS 已停止支援**，需選定替代的空間分區/無縫世界方案\n- [ ] 伺服器語言與雲平台\n- [ ] 團隊規模、預算、目標平台（PC/主機/行動）\n\n## 進度紀錄\n\n| 日期 | 內容 |\n|---|---|\n| 2026-10-05 | 子方案建立 |\n"}], "logs": [{"date": "2026-10-07", "title": "P4 第一批：歐羅巴三城形象圖", "tags": ["SP1"], "body": "- **參與**：Codex（SP1-008，worktree `D:\\MMO_-cities`）、Opus（審閱）\n- **內容**：艾森堡、霧環堡、霜灣港各一張平面圖（含編號版）＋兩張近景，共 9 張，全數通過；平面圖與 P3 後的配置檔一致。\n- **答覆 Codex**：霜灣港峽灣橋面離水約 18 m，大型帆船停在橋南、橋下只過小船；霧環堡「七十二道銅環」是設定數字，不必逐一畫出。\n- **進行中**：P4 震旦四城（Codex）、P5 UE NavMesh 驗證（Sonnet）。"}, {"date": "2026-10-07", "title": "P1 灰盒工具、P3 九城量測", "tags": ["SP8", "SP1"], "body": "- **參與**：Sonnet（SP8-001 實作）、Opus（審查、量測與修正）\n- **P1**：`tools/greybox/` 完成：`greybox.py`（量測報告、示意圖）、`blender_build.py`（Blender 5.2 產生 .glb）、`viewer.html`、11 項單元測試。所有判定數值集中在一張常數表並註明出自 ADR-0010。\n- **P3 首輪**：艾森堡不通過（外圍軍營→鐵心要塞主線 91.5 s）；其餘 8 城通過但有標註。\n- **修正**：\n  1. 所有升降台改為垂直井道（上端加空中平台節點，以步道接回上站），採納 Sonnet 的建議；原本的水平偏移被算成步行時間。\n  2. 艾森堡、霧環堡：城市主傳送點移到城中央（閘門橋廣場、下城），原入口保留為新手起點。\n  3. 鯨骨自由港：公共鍛造台移到工坊階東側（73.0 s → 59.7 s）。斷雲關：軍需庫移到校場（74.8 s → 27.5 s）。\n- **結果**：九城全部通過；接受的標註：雲闕城主線 70.5 s（懸浮皇闕刻意設在高處）、落星穹頂主線 66.8 s、其餘超出目標 1–3 s。\n- **未採納（留待之後）**：Sonnet 建議的 zone 代表點 `rep`、節點 `kind`、非凸多邊形支援、節點與 zone 撞名。\n- **下一步**：P4 Codex 八城形象圖（分批）、P5 UE NavMesh 驗證，兩者並行。"}, {"date": "2026-10-07", "title": "P2 九城配置檔 v0.1", "tags": ["SP1"], "body": "- **參與**：Opus\n- **內容**：依 `docs/lore/geography.md` 與 `story.md` 的城市設定，設計其餘八城的街區配置（`docs/lore/cities/*.json`）。服務分級：艾森堡、雲闕城、碧瀾商都、鯨骨自由港為完整主城；霧環堡、霜灣港、斷雲關無拍賣行；凌霄宗只量 The Forge 與主線任務，落星穹頂只量銀行與主線任務。設計時已手算各路段坡度。\n- **格式**：新增選填欄位 `base_z`（浮空平台底部）與 `water`（河流、運河、峽灣），已通知 Sonnet 一併支援。\n- **下一步**：等灰盒工具（P1）完成後跑量測（P3）。"}, {"date": "2026-10-07", "title": "九城形象圖與灰盒打樣計畫啟動", "tags": ["SP1", "SP8"], "body": "- **參與**：Rex（指示「列計畫後下去做、同步進度」）、Opus\n- **計畫**：P0 量測標準 → P1 灰盒工具（Sonnet）→ P2 九城配置檔 → P3 量測與修正 → P4 八城基礎形象圖（Codex）→ P5 UE 5.8 NavMesh 驗證 → P6 整合。詳見 SP1「九城形象圖與灰盒打樣計畫」。\n- **決策**：ADR-0010 城市動線量測標準（跑速 6.0 m/s、樓梯 ×1.15、升降台 3 m/s＋6 s；坡道 ≤ 20°、樓梯 25–35°、硬上限 40°；核心服務 ≤ 60 s 目標／90 s 上限）。\n- **內容**：城市配置檔格式 `docs/lore/cities/README.md`；RA-01 鯨骨自由港由 WB-00 v0.2 轉成 `RA-01.json`。tasks 新增 E12、E13（灰盒工具、UE 驗證）與 A10–A17（八城場景）。\n- **環境**：UE 5.8.3（`E:/Epic/UE_5.8`）、Blender 5.2.2 已安裝；UE 驗證用暫存專案 `E:/UEProjects/CityGreybox`，不動 E01。\n- **下一步**：Sonnet 實作灰盒工具；Opus 設計其餘八城配置檔。"}, {"date": "2026-10-07", "title": "設定集網頁上線", "tags": ["SP0", "SP1"], "body": "- **參與**：Rex、Opus（Cowork）\n- **內容**：追蹤網頁新增「設定集」頁 `tracker/lore.html`：世界觀聖經（docs/lore 全部）、專有名詞對照表、GDD、ADR 全文，含全文搜尋、章節目錄、文件間連結與世界地圖。由 `build_tracker.py` 一併產生，`publish_tracker.ps1` 一併發布（含 `tracker/assets/`）。\n- **注意**：Pages repo 為公開，世界觀與 GDD 全文發布後即公開。\n- **下一步**：Rex 執行 publish_tracker.ps1 發布。"}, {"date": "2026-10-06", "title": "SP1-007 鯨骨自由港街區配置與近景建築圖", "tags": ["SP1"], "body": "- **參與**：Codex（`codex exec`，worktree `D:\\MMO_-whalebone`）、Opus（配置設計、審閱、翻譯）\n- **內容**：Opus 設計九區四層配置 v0.1（西歐羅巴、東震旦、中軸評議會）；Codex 產出程式繪製的規劃示意圖 WB-00、平面圖、剖面圖與五張近景。\n- **審閱**：r1 退回 WB-01（看不出東西分側、編號錯）、WB-03 與 WB-05（評議會建築畫成震旦殿宇）；r2 改為鯨骨、拆船木料、銅頂、玄武岩的群島建築，全數通過。\n- **決策**：採納 Codex 的配置審查 → v0.2：高差可壓縮到 60–80 m、東澳之字坡道、升降台站點設在市集與工坊內、暗灣入口移到防波堤西端、繩橋只當捷徑、盛行風東北→西南。安全區邊界用守望隊關卡＋稅關閘門＋燈光材質過渡。定稿寫入 `docs/lore/whalebone-freeport.md`。\n- **tasks**：新增 A09 鯨骨自由港主城場景（概念，in_progress）。\n- **下一步**：灰盒打樣（SP8）、評議會建築模組、戈德里克石碑近景、決鬥場位置（SP2、SP7）。"}, {"date": "2026-10-06", "title": "鯨骨自由港安全區與地標名詞", "tags": ["SP1"], "body": "- **參與**：Rex、Opus\n- **決策**：ADR-0009。鯨骨自由港（街區 1–8）為安全區，城內禁止 PvP，由評議會守望隊維持秩序；決鬥場交 SP2、SP7；暗灣入口以外恢復懸賞與 PvP。其他主城是否為安全區留給 SP6、SP7。\n- **內容**：glossary 新增 4 個歷史地標、4 個街區名（配置 v0.1）、評議會守望隊、安全區；補收 lore 已有但漏收的三個陣營群島設施、晦明研究所、鏽錨走私暗灣。GDD §3.1 補一句安全區規則。\n- **下一步**：SP1-007（Codex）出圖中；審閱後若街區改名，同步 glossary。"}, {"date": "2026-10-06", "title": "SP1-005 EU-01-N1 奧古斯都 r2", "tags": ["SP1"], "body": "- **參與**：Codex（重畫）、Opus（審閱）\n- **內容**：Codex 額度恢復後重畫奧古斯都：大元帥全身板甲、厚重披風、元帥權杖與入鞘長劍；銀獅徽記清楚出現在胸甲與旗幟。r1 保留為 `EU-01-N1-r1.jpg`，manifest 記錄完整 prompt。\n- **審閱**：通過；份量已與赫連烈、溫九娘相當。建模時保留胸甲與旗幟的銀獅，簡化腰帶與肩部的重複獅子配件。\n- **狀態**：SP1-005 形象圖 v0.1 全數完成（44 張＋1 張 r1 存檔）。"}, {"date": "2026-10-06", "title": "SP1-004 世界觀聖經整合進 docs/lore/", "tags": ["SP1"], "body": "- **參與**：Opus\n- **內容**：把 Gemini SP1-004 原稿整合為 `docs/lore/` 下 4 份 v0.1 文件，另加索引 `README.md`：`geography.md`（地區、九城、四陣營據點、預留擴充區）、`history-mythology.md`（紀元年表、兩洲信仰、工坊的世界觀解釋、天塹之裂三假說）、`factions.md`（四陣營卡與首領人格）、`naming.md`（三區命名規則、禁用清單、檢查表）。\n- **整合時修正**：套用 SP1-001／004／006 審閱與 ADR-0005、0008；據點配合形象圖（商盟總部在碧瀾商都九海聚寶樓、修會總部在霧環堡、千帆商館在霜灣港）；首領年齡與經歷對齊 story.md；鐵銀公約在群島改為外海護航；「金銀十字驛站」改「金銀岔口驛站」；落星海溝（海域）與落星穹頂（城市）分開。glossary 再補 21 詞。\n- **狀態**：SP1 三項主要交付物完成，progress 60 → 80；SP1-004、SP1-006 簡報改為 integrated。\n- **剩餘**：SP1-005 manifest 補城市名與 EU-03-N3 角色名；EU-01-N1 奧古斯都 r2 重畫；遊戲名與城市名撞名／商標查核。"}, {"date": "2026-10-06", "title": "命名定案：九座城市、駐地、赫連烈格言", "tags": ["SP1"], "body": "- **參與**：Rex（決定）、Opus\n- **決策**：Rex 全部採用 Opus 建議（ADR-0008）：「租界」改為「駐地 / Enclave」；九座城市為艾森堡、霧環堡、霜灣港、雲闕城、碧瀾商都、斷雲關、凌霄宗、鯨骨自由港、落星穹頂；赫連烈格言為「天行剛健，唯武自強；強者立命，逆海奪鼎。」\n- **連帶**：glossary 新增 27 個名詞（城市、世界觀核心詞、預留擴充區、四位首領）；GDD §7.1、SP1 城市表、`docs/lore/story.md` 同步更新。SP1 progress 55 → 60。發布追蹤網頁。\n- **下一步**：整合 SP1-004 世界觀聖經（地理、神話、命名規範、陣營卡）進 `docs/lore/`；補 SP1-005 manifest 的城市名與 EU-03-N3 角色名；城市名與遊戲名一起做撞名查核。"}, {"date": "2026-10-06", "title": "SP1-006 遊戲故事：兩大陸各六章", "tags": ["SP1"], "body": "- **參與**：Rex（方向）、Gemini（`agy -p`，r1、r2）、Opus（簡報、審閱、整合）\n- **內容**：Rex 指示：兩大陸各 6 章，第 1–5 章補背景，第 6 章描述現況，並保留未來擴充性。先提交 SP1-004 世界觀聖經 v0.1 並完成審閱（艾森加德與《魔戒》Isengard 撞名、Prime Radiant 與艾西莫夫撞名、現實地名等），再撰寫 SP1-006 簡報。\n- **r1 → 退回**：首領年齡與時間線矛盾、鉤子表與內文不符（5 條）、九州／江南／南海等現實指涉、把天塹之裂真相寫成單一答案。\n- **r2 → 通過**：Opus 修正兩處殘留（姜守虛的朝代、九州），整合為 `docs/lore/story.md` v0.1。\n- **決策（Opus）**：第四個擴充方向為「南溟歸墟 / The Abyssal Return」；EU-03-N3 為賽蓮娜（溫和派魔女），伊索爾德為黑森林敵對首領；第 6 章衝突分工：陣營衝突交 SP6，環境事件與前哨摩擦交 SP7。SP1 progress 40 → 55。\n- **下一步**：Rex 定案名稱（租界改名、9 座城市、赫連烈格言）→ ADR、glossary、全文替換；整合 SP1-004 世界觀聖經進 `docs/lore/`。"}, {"date": "2026-10-06", "title": "SP1-005 2D 世界觀形象圖 v0.1", "tags": ["SP1"], "body": "- **參與**：Codex（`codex exec`＋內建 image_generation，worktree `D:\\MMO_-concept-art`）、Opus（簡報、分階段審圖、補件、翻譯）\n- **內容**：分四階段產出 44 張概念圖——`STYLE.md` 與世界地圖（r1→r2：碎島改為完整大陸、震旦較大）、九座主要城市、六職業男女設定圖、27 名城市 NPC（含四位陣營首領）。原始 PNG 存 `out/raw/`（不進 git），repo 只放 1600px JPG（約 17MB）。\n- **審閱**：OR-02 r1 像威尼斯（西式鐘樓、羅馬拱橋、西式城堡）→ 退回改為江南水鄉，r2 通過；其餘全數通過。EU-01-N1 奧古斯都首領份量不足，列 r2 待辦。\n- **問題**：(1) Phase 2 時 Codex 為了寫入 `out/raw/` 曾改動資料夾 ACL 再改回；已確認恢復，之後指令禁止改權限。(2) Phase 4 匯出後 Codex 撞到 ChatGPT 用量上限，沒寫 manifest 與回覆；Opus 補上 manifest 條目（prompt 未記錄）、複製原圖，並撰寫 Phase 4 審閱。\n- **決策**：畫風以 `STYLE.md` 為準；場景亮度以 OR-04、職業特效以 Arcanist 為上限。tasks：A01、A02 進入「概念」in_progress。\n- **下一步**：Codex 額度恢復後重畫 EU-01-N1；城市正式名稱待 SP1-004 世界觀聖經；建模前補職業三視圖與武器正交圖。"}, {"date": "2026-10-06", "title": "引擎版本鎖定 UE 5.8", "tags": ["SP2", "SP8"], "body": "- **參與**：Rex、Opus（Cowork）\n- **內容**：比較 UE 5.6 與 5.8，對本專案有意義的差異為官方 MCP 插件、Iris 正式可用、Mover 與重定向改善、Lumen Lite。全隊統一 UE 5.8（最新 hotfix），工具鏈 VS 2026（最低 VS 2022 17.14）。見 ADR-0007。\n- **連帶**：SP2 §11.1 的 Iris／Mover 加註重新評估；SP8 勾選引擎版本；安裝文件新增 UE 安裝段；E01 註記版本。\n- **下一步**：E01 以 5.8 建立 UE 專案骨架；D9 改為評估 Iris。"}, {"date": "2026-10-06", "title": "編號與分支整理", "tags": ["ALL"], "body": "- **參與**：Rex、Opus\n- **內容**：兩個 session 共用 `D:\\MMO_` 造成三個問題，已修正：\n  1. 執行追蹤 commit（d61ad66）誤落在 `exp/concept-art` → fast-forward 回 `main`；主目錄固定留在 `main`，Codex 實驗改用 worktree `D:\\MMO_-concept-art`（分支 `exp/sp1-005-concept-art`）。\n  2. handoff 撞號：Codex 形象圖任務 SP1-004 → **SP1-005**（Gemini 世界觀聖經保留 SP1-004）。\n  3. ADR 撞號：命名定案先提交，保留 **ADR-0005**；執行層進度追蹤改為 **ADR-0006**（同步上方 log 引用）。\n- **規範建議**：多個 session 並行時，不在主目錄切換分支；開新 handoff／ADR 前先 `git pull` 並檢查最大編號。\n- **下一步**：SP1-005 Phase 2（九座城市＋世界地圖 r2）Codex 執行中。"}, {"date": "2026-10-06", "title": "執行層進度追蹤上線", "tags": ["SP0", "SP2"], "body": "- **參與**：Rex、Opus\n- **內容**：新增 `tasks/` 四個 CSV 與追蹤網頁「執行看板」，追蹤 3D 資產、動畫與動作、引擎系統、AI 任務。粒度為系統／資產群組，階段管線與自動進度見 `tasks/README.md`。首批資料以 M1 為主。見 ADR-0006。\n- **下一步**：Rex 指派 3D 資產與動作的負責人（自製、外包或素材替身）。"}, {"date": "2026-10-06", "title": "SP0 專案基建結案", "tags": ["SP0"], "body": "- **參與**：Rex、Opus\n- **內容**：Rex 確認兩項待討論都已完成：GitHub 遠端（主 repo 私有、追蹤網頁公開 Pages repo）與本機 CLI 安裝登入。四項交付物全部勾選，SP0 狀態改為完成（100%）。\n- **後續維護**：協作流程有調整時，直接修訂 CLAUDE.md 並新增 ADR，不再另開 SP0 任務。"}, {"date": "2026-10-05", "title": "暫定遊戲名稱", "tags": ["SP1"], "body": "- **參與**：Rex、Opus\n- **決策**：Rex 暫定採用 G8 天塹星瀾 / The Sundered Reach（ADR-0004）。\n- **內容**：更新追蹤網頁標題（`tracker/template.html`）、GDD 標題、README、glossary、SP1 待討論。repo、追蹤網址、協作規範檔與程式模組名暫不改。\n- **風險**：Opus 原評等 C（Sundered 同名遊戲、與 RIFT 相近、與交界區「天塹群島」重疊），已記入 ADR-0004。\n- **下一步**：正式定名前做商標與網域查核。"}, {"date": "2026-10-05", "title": "SP1-002 / SP1-003 遊戲正式名稱提案", "tags": ["SP1"], "body": "- **參與**：Gemini（`agy -p`）、Codex（`codex exec`，英文）、Opus（翻譯、提案、彙整）\n- **內容**：Gemini 依 handoff-gemini skill 提出 10 個中英名稱（首選：神鑄紀元 / Soulforged）。Codex 在 `exp/game-title` 分支以英文執行（`-s workspace-write --add-dir handoff/codex` 讓它能寫回覆），寫了 Node 名稱產生器 `experiments/game-title/`，並做基本撞名檢索，提出 10 個英文名（首選：Palimarch）。Opus 把 Codex 回覆翻成中文，依原意改編中文名（易鼎、御筆、鑄史…，附翻譯註記），再加入 5 個自己的提案（晨昏 / Twinlight 等）。\n- **決策**：三方共 25 個候選彙整進 SP1 文件「遊戲正式名稱候選表」，附評等與 Opus 推薦決選 5 名：晨昏 / Twinlight（Opus 首選）、易鼎 / Palimarch、史未央 / The Unwritten Age、鑄史 / Loreweld、神鑄紀元 / Soulforged。SP1 progress 25 → 30。\n- **注意**：Gemini 回覆仍使用已否決的「星天儀軌」；Codex 原文沒有 frontmatter，翻譯版已補。\n- **下一步**：Rex 選定名稱 → ADR、glossary、GDD 標題；最終 2–3 名做商標、Steam、網域與社群帳號查核。"}, {"date": "2026-10-05", "title": "遊戲正式名稱提案任務", "tags": ["SP1"], "body": "- **參與**：Rex、Opus\n- **內容**：Rex 不喜歡「大陸計畫」這個名稱。Opus 撰寫兩份命名簡報：Gemini 走世界觀／文學方向（SP1-002，中英名稱），Codex 走非典型、造詞方向（SP1-003，中英雙版簡報）。\n- **下一步**：在本機 Claude Code 執行兩份簡報；Opus 翻譯 Codex 回覆、加入自己的提案，彙整成候選清單給 Rex 挑選。"}, {"date": "2026-10-05", "title": "GitHub 託管", "tags": ["SP0"], "body": "- **參與**：Rex、Opus\n- **內容**：安裝 GitHub CLI 並登入（HaaaNaaaBiii）。主 repo 推到 private `HaaaNaaaBiii/MMO_`；追蹤網頁另外推到 public `HaaaNaaaBiii/continents-tracker`，用 GitHub Pages 托管：https://haaanaaabiii.github.io/continents-tracker/\n- **決策**：Rex 選擇「主 repo 私有＋另開公開 Pages repo」。注意：`tracker/index.html` 內嵌了各 SP 文件內容，所以發布後這些內容會公開。\n- **工具**：新增 `tools/publish_tracker.ps1`。腳本保持純 ASCII，因為 PowerShell 5.1 會誤讀沒有 BOM 的 UTF-8。\n- **下一步**：每次 build_tracker 後執行 publish_tracker.ps1，網頁就會同步更新。"}, {"date": "2026-10-05", "title": "SP1-001 陣營與大陸命名 r1", "tags": ["SP1"], "body": "- **參與**：Gemini（`agy -p`）、Opus（審閱）\n- **內容**：首次正式以 `agy -p` 執行。第一次嘗試時 Gemini 想執行 shell 指令，被 headless 模式拒絕；在 handoff-gemini skill 加入「不執行任何終端指令，只用檔案工具」後重跑成功（約 5 分鐘）。Gemini 提交陣營結構比較、四陣營與大陸命名方案、交界區政治地位、四位首領人格。\n- **審閱**：同意結構方案 C（地緣雙核＋跨洲分支）與首領人格。修正命名：「儀軌」為佛教用語，不適合歐羅巴陣營 → 建議「星盤修會」；Empyrean 是西方宗教語感，不適合震旦陣營；「獅心」仍未對應英文 → 建議「鐵銀公約」；「歐菲利亞」與 Europia 不對應；「神洲」過度指涉現實。交界區建議「天塹群島」。整合至 SP1 文件（status: review, 25%）。\n- **下一步**：Rex 確認 SP1 待討論 6 項；定案後寫 ADR、更新 glossary 與 GDD §3、§7.1。"}, {"date": "2026-10-05", "title": "Opus（Claude Code）— Codex 中英雙版本流程", "tags": ["SP0"], "body": "- **參與**：Rex、Opus\n- **內容**：Rex 提議 Codex 改用英文工作以避開中文亂碼，並同時保留中英兩版內容。\n- **決策**：ADR-0003。Opus 把中文簡報翻成 `<id>.en.md` → Codex 以英文產出 `<id>.response.en.md` → Opus 翻回中文 `<id>.response.md`（附翻譯註記）。翻譯保留語意與語境：專有名詞依新建的 `docs/glossary.md`，簡報附 Context notes，命名附 meaning/etymology/tone。簡報改由 stdin 傳入。\n- **驗證**：英文 prompt 經 stdin 傳給 `codex exec`（Git Bash 與 PowerShell 皆測過）回覆正常，無亂碼。\n- **下一步**：以 `agy -p` 執行 SP1-001；第一個 Codex 任務走新流程。"}, {"date": "2026-10-05", "title": "Opus（Claude Code）— ADR-0002 驗證", "tags": ["SP0"], "body": "- **內容**：執行 `scripts/setup/test-orchestration.ps1`。`agy -p` 基本回應正常；handoff-gemini skill 首次因 headless 模式自動拒絕 `write_file` 而失敗。\n- **修正**：Rex 在 `~/.gemini/antigravity-cli/settings.json` 加入 `permissions.allow: [\"write_file(D:/MMO_/handoff/gemini)\"]`（最小授權，不用 `--dangerously-skip-permissions`），重測三項通過。\n- **決策**：ADR-0002 狀態改為「已採納」；刪除 SP0-000 測試簡報與回覆。\n- **已知問題**：`codex exec` 經 PowerShell 傳入的中文 prompt 會亂碼（Codex 仍回應），之後改用 stdin 或 UTF-8 設定處理。\n- **下一步**：以 `agy -p` 執行 SP1-001 陣營命名簡報。"}, {"date": "2026-10-05", "title": "Opus（Cowork）— SP0 本機環境", "tags": ["ALL"], "body": "- **內容**：使用者完成 Claude Code、Codex 安裝與登入。gemini-cli 已停用，改用 Antigravity。\n- **決策**： "status": "done", "progress": 100, "owner": "Sonnet", "depends_on": [], "updated": "2026-10-05", "note": "Opus 審閱完成", "stage_idx": 4}, {"id": "SP1-003", "group": "遊戲正式名稱：非典型提案（取代「大陸計畫 / Project: Continents」）", "sp": "SP1", "milestone": "", "stage": "已整合", "status": "done", "progress": 100, "owner": "Codex", "depends_on": [], "updated": "2026-10-05", "note": "來自 handoff/codex/SP1-003-game-title.md", "stage_idx": 4}, {"id": "SP1-005", "group": "2D 世界觀形象圖：世界地圖、主要城市、職業、城市 NPC", "sp": "SP1", "milestone": "", "stage": "已整合", "status": "done", "progress": 100, "owner": "Codex", "depends_on": [], "updated": "2026-10-06", "note": "來自 handoff/codex/SP1-005-concept-art.md", "stage_idx": 4}, {"id": "SP1-007", "group": "鯨骨自由港（RA-01）近景建築與街區配置圖", "sp": "SP1", "milestone": "", "stage": "已整合", "status": "done", "progress": 100, "owner": "Codex", "depends_on": [], "updated": "2026-10-06", "note": "來自 handoff/codex/SP1-007-whalebone-layout.md", "stage_idx": 4}, {"id": "SP1-008", "group": "八城基礎形象圖：繪製平面圖＋近景（依灰盒配置）", "sp": "SP1", "milestone": "", "stage": "簡報", "status": "not_started", "progress": 0, "owner": "Codex", "depends_on": [], "updated": "2026-10-07", "note": "來自 handoff/codex/SP1-008-city-concepts.md", "stage_idx": 0}, {"id": "SP1-001", "group": "四大陣營與大陸的定位、命名審查", "sp": "SP1", "milestone": "", "stage": "已整合", "status": "done", "progress": 100, "owner": "Gemini", "depends_on": [], "updated": "2026-10-05", "note": "來自 handoff/gemini/SP1-001-faction-naming.md", "stage_idx": 4}, {"id": "SP1-002", "group": "遊戲正式名稱提案（取代「大陸計畫 / Project: Continents」）", "sp": "SP1", "milestone": "", "stage": "已整合", "status": "done", "progress": 100, "owner": "Gemini", "depends_on": [], "updated": "2026-10-05", "note": "來自 handoff/gemini/SP1-002-game-title.md", "stage_idx": 4}, {"id": "SP1-004", "group": "世界觀聖經 v0.1 起草（地理、歷史、神話、命名規範、四陣營設定卡）", "sp": "SP1", "milestone": "", "stage": "已整合", "status": "done", "progress": 100, "owner": "Gemini", "depends_on": [], "updated": "2026-10-06", "note": "來自 handoff/g <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={not_started:'未開始',in_progress:'進行中',review:'審閱中',blocked:'受阻',done:'完成'};
const md=s=>{try{return window.marked?marked.parse(s):'<pre class="raw">'+esc(s)+'</pre>'}catch(e){return '<pre class="raw">'+esc(s)+'</pre>'}};
const sps=D.subprojects;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let filter='all', current=store.get('sp')||sps.find(s=>s.status==='in_progress')?.id||sps[0]?.id, tab=store.get('tab')||'q';

const totalQ=sps.reduce((a,s)=>a+s.questions.filter(q=>!q.done).length,0);
$('overall').textContent=Math.round(sps.reduce((a,s)=>a+s.progress,0)/sps.length)+'%';
$('active').textContent=sps.filter(s=>s.status==='in_progress').length+' / '+sps.length;
$('openq').textContent=totalQ;
$('updated').textContent=D.generated.slice(0,10);
$('foot').textContent='由 tools/build_tracker.py 於 '+D.generated+' 從 docs/ 與 logs/ 產生。資料以 git repo 為準。';

// milestones
const MS=[['M1','戰鬥手感原型'],['M2','AI 工坊數值沙盒'],['M3','雙大陸場景與採集循環'],['M4','AI 陣營領袖演習']];
$('miles').innerHTML=MS.map(([m,n])=>{const ss=sps.filter(s=>(s.milestone||'').includes(m));
  const p=ss.length?Math.round(ss.reduce((a,s)=>a+s.progress,0)/ss.length):0;
  return `<div class="mile"><div class="eyebrow">${m} · ${p}%</div><h3>${n}</h3><div class="chips">${ss.map(s=>`<button class="chip" data-sp="${s.id}">${s.id}</button>`).join('')}</div></div>`}).join('');
$('miles').addEventListener('click',e=>{const b=e.target.closest('[data-sp]');if(b)select(b.dataset.sp)});

// filters
const FL=[['all','全部'],...Object.entries(ST)];
$('filters').innerHTML=FL.map(([k,v])=>`<button data-f="${k}" aria-pressed="${k===filter}">${v}</button>`).join('');
$('filters').addEventListener('click',e=>{const b=e.target.closest('[data-f]');if(!b)return;filter=b.dataset.f;
  [...$('filters').children].forEach(x=>x.setAttribute('aria-pressed',x===b));renderRoster()});

function renderRoster(){
  const list=sps.filter(s=>filter==='all'||s.status===filter);
  $('roster').innerHTML=list.length?list.map(s=>{const oq=s.questions.filter(q=>!q.done).length;
   return `<button class="sp s-${s.status}" data-sp="${s.id}" aria-current="${s.id===current}">
    <span class="id">${s.id}</span><span class="t">${esc(s.title)}</span><span class="pct">${s.progress}%</span>
    <span class="sub"><span class="pill">${ST[s.status]||s.status}</span><span>${esc(s.milestone||'')}</span><span>${esc(s.owner)}</span>${oq?`<span>待決 ${oq}</span>`:''}</span>
    <span class="bar"><i style="width:${s.progress}%"></i></span></button>`}).join(''):'<p class="eyebrow">此狀態下沒有子方案</p>';
}
$('roster').addEventListener('click',e=>{const b=e.target.closest('[data-sp]');if(b)select(b.dataset.sp)});

function select(id){current=id;store.set('sp',id);renderRoster();renderDossier();
  if(window.innerWidth<860)$('dossier').scrollIntoView({behavior:'smooth',block:'start'})}
function setTab(t){tab=t;store.set('tab',t);['q','doc','log'].forEach(k=>$('tab-'+k).setAttribute('aria-selected',k===t));renderBody()}
['q','doc','log'].forEach(k=>$('tab-'+k).addEventListener('click',()=>setTab(k)));

function renderDossier(){const s=sps.find(x=>x.id===current);if(!s)return;
  $('d-id').textContent=s.id+' · '+s.file;
  $('d-title').textContent=s.title;
  $('d-facts').innerHTML=`<span class="pill s-${s.status}">${ST[s.status]||s.status}</span><span>進度 <b class="mono">${s.progress}%</b></span><span>主責 <b>${esc(s.owner)}</b></span><span>模型 <b>${esc(s.models.join('、'))}</b></span><span>里程碑 <b>${esc(s.milestone)}</b></span><span>更新 <b class="mono">${esc(s.updated)}</b></span>`;
  setTab(tab)}
function renderBody(){const s=sps.find(x=>x.id===current);if(!s)return;const b=$('d-body');
  if(tab==='q'){b.innerHTML=s.questions.length?`<ul class="qlist">${s.questions.map(q=>`<li class="${q.done?'done':''}"><span class="box" aria-label="${q.done?'已決定':'未決定'}"></span><span>${md(q.text).replace(/^<p>|<\/p>\s*$/g,'')}</span></li>`).join('')}</ul>`:'<p>目前沒有待討論事項。</p>'}
  else if(tab==='doc'){b.innerHTML=md(s.body)}
  else{const L=D.logs.filter(l=>l.tags.includes(s.id));b.innerHTML=L.length?L.map(logHTML).join(''):'<p>尚無相關紀錄。</p>'}
  b.scrollTop=0}
function logHTML(l){return `<div class="entry"><div class="when"><span>${l.date}</span><span class="tag">${l.tags.join(' ')}</span></div><h3>${esc(l.title)}</h3><div class="body">${md(l.body)}</div></div>`}

$('log').innerHTML=D.logs.map(logHTML).join('');
$('logcount').textContent=D.logs.length+' 筆';
$('models').innerHTML=D.models.map(m=>`<div class="model"><b>${m.name}</b><span><span>${esc(m.role)}</span><br><span class="w">${esc(m.sps)}</span></span></div>`).join('');
$('adrs').innerHTML=D.adrs.map(a=>`<div class="row"><span>${esc(a.title)}</span><span class="tag">${esc(a.status)}</span></div>`).join('')||'<p class="eyebrow">尚無</p>';
$('handoffs').innerHTML=D.handoffs.map(h=>`<div class="row"><span><span class="tag">${esc(h.model)}</span> ${esc(h.title)}</span><span class="tag">${esc(h.status)}</span></div>`).join('')||'<p class="eyebrow">尚無</p>';
renderRoster();renderDossier();

// 執行看板
(function(){
const T=D.tracks||[]; if(!T.length) return;
let tk=store.get('track')||T[0].key, ms=store.get('ms')||'all';
const sel=$('ms-filter'); sel.value=ms;
const byId={}; T.forEach(t=>t.rows.forEach(r=>byId[r.id]=r));
const inMs=r=>ms==='all'||(r.milestone||'').includes(ms);
const avg=a=>a.length?Math.round(a.reduce((x,r)=>x+r.progress,0)/a.length):0;
function renderTracks(){
  $('tracks').innerHTML=T.map(t=>{const rs=t.rows.filter(inMs);const bl=rs.filter(r=>r.status==='blocked').length;
   const ip=rs.filter(r=>r.status==='in_progress').length;const dn=rs.filter(r=>r.status==='done').length;
   return `<button class="track" data-k="${t.key}" aria-pressed="${t.key===tk}"><span class="tn">${esc(t.name)}</span><span class="tp">${avg(rs)}%</span>
   <span class="tc"><span>${rs.length} 項</span><span>進行 ${ip}</span><span>完成 ${dn}</span>${bl?`<span class="bl">受阻 ${bl}</span>`:''}</span></button>`}).join('')}
function renderTable(){
  const t=T.find(x=>x.key===tk)||T[0]; const rs=t.rows.filter(inMs);
  $('exec-tbl').innerHTML=`<thead><tr><th>ID</th><th>群組</th><th>子方案</th><th>階段（${t.stages.join(' → ')}）</th><th>進度</th><th>狀態</th><th>負責</th><th>相依</th><th>備註</th><th>更新</th></tr></thead><tbody>`+
   (rs.length?rs.map(r=>{const done=r.status==='done';
    const pipe=t.stages.map((st,i)=>`<i class="${done||i<r.stage_idx?'d':(i===r.stage_idx?'c':'')}" title="${esc(st)}"></i>`).join('');
    const deps=r.depends_on.map(d=>`<span class="dep ${byId[d]&&byId[d].status==='done'?'ok':''}" title="${esc(byId[d]?byId[d].group:'')}">${esc(d)}</span>`).join('')||'—';
    return `<tr class="s-${r.status}"><td class="gid">${esc(r.id)}</td><td class="gname">${esc(r.group)}</td><td class="mono">${esc(r.sp)}${r.milestone?' · '+esc(r.milestone):''}</td>
     <td><div class="pipe">${pipe}</div><div class="stage-l">${esc(done?'完成':r.stage)}</div></td><td class="mono">${r.progress}%</td>
     <td><span class="pill">${ST[r.status]||esc(r.status)}</span></td><td class="own">${esc(r.owner)}</td><td>${deps}</td><td class="note">${esc(r.note)}</td><td class="mono">${esc(r.updated)}</td></tr>`}).join('')
   :`<tr><td colspan="10">這個里程碑在此軌道沒有項目。</td></tr>`)+'</tbody>';
  $('exec-note').textContent='資料來源：tasks/'+({assets:'assets.csv',animation:'animation.csv',engine:'engine.csv',ai:'ai_tasks.csv 與 handoff/'}[t.key]||'')+'。進度留空時依階段自動計算。'}
$('tracks').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;tk=b.dataset.k;store.set('track',tk);renderTracks();renderTable()});
sel.addEventListener('change',()=>{ms=sel.value;store.set('ms',ms);renderTracks();renderTable()});
renderTracks();renderTable();
})();
})();
</script>
</body>
</html>
