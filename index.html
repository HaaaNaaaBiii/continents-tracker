<style>
/* Layout: war-table ledger — header strip with milestones, sub-project roster left, open dossier right, chronicle below */
:root{
  --bg:#eef1ef; --surface:#ffffff; --sunk:#e3e8e5; --line:#cfd8d4;
  --fg:#18211f; --muted:#5b6965;
  --accent:#2c7a6e; --accent-ink:#ffffff; --brass:#9a7428;
  --st-none:#8a9692; --st-prog:#2f6fb0; --st-review:#b07a12; --st-block:#b8432f; --st-done:#2e8a4e;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121817; --surface:#1a2220; --sunk:#0e1312; --line:#2c3735;
  --fg:#e3ebe8; --muted:#93a39e; --accent:#4fb3a2; --accent-ink:#0b1413; --brass:#d1a94f;
  --st-none:#7b8884; --st-prog:#6aa6e6; --st-review:#e0a83a; --st-block:#e57560; --st-done:#5cc07c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121817; --surface:#1a2220; --sunk:#0e1312; --line:#2c3735;
  --fg:#e3ebe8; --muted:#93a39e; --accent:#4fb3a2; --accent-ink:#0b1413; --brass:#d1a94f;
  --st-none:#7b8884; --st-prog:#6aa6e6; --st-review:#e0a83a; --st-block:#e57560; --st-done:#5cc07c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:28px 64px;display:grid;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--fg);padding-bottom:16px}
header.top h1{font-size:clamp(26px,4vw,38px);font-weight:800;letter-spacing:.02em}
header.top .meta{display:flex;gap:24px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;font-weight:500}
.miles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.mile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.mile h3{font-size:16px}
.mile .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);cursor:pointer;color:var(--fg)}
.chip:hover,.chip:focus-visible{border-color:var(--accent);outline:none}
.main{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.filters button{font:inherit;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.roster{display:grid;gap:8px}
.sp{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;text-align:left;width:100%;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--stc,var(--st-none));border-radius:var(--r);padding:10px 12px;cursor:pointer}
.sp:hover{border-color:var(--accent);border-left-color:var(--stc)}
.sp:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sp[aria-current="true"]{background:var(--sunk);border-color:var(--fg);border-left-color:var(--stc)}
.sp .id{font-family:var(--f-mono);font-weight:500;color:var(--muted)}
.sp .t{font-weight:700;min-width:0}
.sp .pct{font-family:var(--f-mono);font-size:13px}
.sp .sub{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted)}
.bar{grid-column:1/4;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--stc,var(--st-none))}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--stc)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--stc)}
.s-not_started{--stc:var(--st-none)} .s-in_progress{--stc:var(--st-prog)} .s-review{--stc:var(--st-review)} .s-blocked{--stc:var(--st-block)} .s-done{--stc:var(--st-done)}
.dossier{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.dossier .head{padding:16px 20px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.dossier .head h2{font-size:24px}
.dossier .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted)}
.dossier .facts b{color:var(--fg);font-weight:500}
.tabs{display:flex;gap:4px;padding:0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-size:14px;background:none;border:0;border-bottom:2px solid transparent;padding:10px 8px;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
.doc{padding:8px 24px 28px;max-height:78vh;overflow:auto}
.doc h1{font-size:22px;margin-top:16px} .doc h2{font-size:19px;margin-top:28px;padding-top:12px;border-top:1px solid var(--line)} .doc h3{font-size:16px;margin-top:20px} .doc h4{margin-top:16px}
.doc p,.doc li{max-width:72ch}
.doc table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;max-width:100%;margin:10px 0}
.doc th,.doc td{border:1px solid var(--line);padding:5px 9px;vertical-align:top}
.doc th{background:var(--sunk);text-align:left}
.doc code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:1px 4px;border-radius:3px}
.doc pre{background:var(--sunk);padding:12px;border-radius:var(--r);overflow-x:auto;font-size:13px}
.doc pre code{background:none;padding:0}
pre.raw{white-space:pre-wrap;word-break:break-word;font-family:var(--f-body);font-size:14px;background:none;padding:0;margin:0}
.doc blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--brass);background:var(--sunk);color:var(--fg)}
.doc a{color:var(--accent)}
.qlist{list-style:none;padding:0;display:grid;gap:8px;margin:16px 0}
.qlist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;padding:10px 12px;background:var(--sunk);border-radius:var(--r)}
.qlist .box{width:16px;height:16px;border:2px solid var(--brass);border-radius:3px;margin-top:3px}
.qlist .done .box{background:var(--st-done);border-color:var(--st-done)}
.lower{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.lower{grid-template-columns:minmax(0,1fr)}}
section.panel h2{font-size:20px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px}
.log{display:grid;grid-template-columns:minmax(0,1fr);gap:0;border-left:2px solid var(--line);margin-left:6px}
.entry{position:relative;padding:0 0 18px 20px}
.entry::before{content:"";position:absolute;left:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--accent)}
.entry .when{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.entry h3{font-family:var(--f-body);font-size:15px;font-weight:700;margin:2px 0 4px}
.entry .body{font-size:14px;color:var(--fg)}
.entry .body ul{margin:0;padding-left:18px}
.side{display:grid;gap:20px}
.models{display:grid;gap:8px}
.model{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);font-size:13px}
.model b{font-family:var(--f-mono);font-size:14px}
.model .w{color:var(--muted)}
.list{display:grid;gap:6px;font-size:14px}
.list .row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.list .row span:first-child{min-width:0}
.tag{font-family:var(--f-mono);font-size:12px;color:var(--brass);white-space:nowrap}
.lore-link{display:inline-block;margin-top:6px;font-size:14px;color:var(--accent);text-decoration:none}
.lore-link:hover{text-decoration:underline}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}

/* 執行看板 */
.exec{display:grid;gap:12px}
.exec-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:10px}
.exec-head h2{font-size:20px}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.track{font:inherit;color:inherit;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;cursor:pointer;display:grid;gap:4px}
.track:hover{border-color:var(--accent)}
.track:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.track[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 -3px 0 var(--accent)}
.track .tn{font-weight:700}
.track .tp{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.track .tc{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.track .tc .bl{color:var(--st-block)}
.exec-tools{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.exec-tools select{font:inherit;font-size:13px;padding:3px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--fg)}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.exec-tbl{border-collapse:collapse;width:100%;min-width:820px;font-size:13px}
.exec-tbl th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.04em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.exec-tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.exec-tbl tr:last-child td{border-bottom:0}
.exec-tbl .gid{font-family:var(--f-mono);color:var(--muted);white-space:nowrap}
.exec-tbl .gname{font-weight:500;min-width:180px}
.exec-tbl .note{color:var(--muted);font-size:12px;min-width:160px}
.pipe{display:flex;gap:3px;align-items:center;min-width:150px}
.pipe i{flex:1;height:8px;border-radius:2px;background:var(--sunk);border:1px solid var(--line)}
.pipe i.d{background:var(--st-done);border-color:var(--st-done)}
.pipe i.c{background:var(--stc,var(--st-none));border-color:var(--stc,var(--st-none))}
.stage-l{font-size:12px;margin-top:3px;white-space:nowrap}
.exec-tbl td.mono,.exec-tbl td.own,.exec-tbl .pill{white-space:nowrap}
.dep{font-family:var(--f-mono);font-size:11px;padding:0 5px;border-radius:3px;background:var(--sunk);margin-right:3px;white-space:nowrap}
.dep.ok{color:var(--st-done)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s ease}}
</style>
</head>

<div class="wrap">
  <header class="top">

      <div class="eyebrow">The Sundered Reach（暫定）· 開發追蹤與紀錄</div>

      <div class="tabs" role="tablist">

    <div class="tracks" id="tracks" role="group" aria-label="軌道"></div>
    <div class="tbl-wrap"><table class="exec-tbl" id="exec-tbl"></table></div>
    <p class="eyebrow" id="exec-note"></p>
  </section>

  <div class="lower">
    <section class="panel">
      <h2>開發日誌 <span class="eyebrow" id="logcount"></span></h2>
      <div class="log" id="log"></div>

    <div class="side">
      <section class="panel">
        <h2>模型分工</h2>
        <div class="models" id="models"></div>

      <section class="panel">
        <h2>決策紀錄</h2>
        <div class="list" id="adrs"></div>
      </section>
      <section class="panel">
        <h2>外派任務</h2>
        <div class="list" id="handoffs"></div>
      </section>
    </div>
  </div>
  <footer id="foot"></footer>

hipelago；領航者評議會自治的自由城邦（遊戲名「天塹星瀾」刻意呼應）\n- [x] 跨洲據點：混合制——駐地（原稱租界，ADR-0008）不可攻佔、周邊前哨可攻佔；數量與規則交 SP6、SP7\n- [x] 首領人格量化：交 SP6；SP1 只提供文字人格\n- [x] 遊戲正式名稱（取代「大陸計畫 / Project: Continents」）：Rex 暫定採用 G8 **天塹星瀾 / The Sundered Reach**（ADR-0004）；正式定名前仍需商標查核，可再改選\n\nSP1-004、SP1-006 留下的命名待決事項：2026-10-06 由 Rex 全部採用 Opus 建議（ADR-0008）。\n\n- [x] 「租界」改為 **駐地 / Enclave**\n- [x] EU-01：**艾森堡 / Eisenburg**\n- [x] OR-01：**雲闕城 / Cloudgate**\n- [x] 赫連烈格言：「天行剛健，唯武自強；強者立命，逆海奪鼎。」\n- [x] 其餘 7 座城市：EU-02 霧環堡 / Nebelburg、EU-03 霜灣港 / Frostfjord Port、OR-02 碧瀾商都 / Jade-Ripple Emporium、OR-03 斷雲關 / Cloud-Sever Pass、OR-04 凌霄宗 / Cloud-Loft Sect、RA-01 鯨骨自由港 / Whalebone Freeport、RA-02 落星穹頂 / Falling Star Vault\n\nSP1-007 鯨骨自由港街區配置的待決事項：2026-10-06 由 Rex 決定（ADR-0009）。\n\n- [x] 鯨骨自由港為 **安全區 / Safe Zone**：街區 1–8 禁止 PvP，評議會守望隊維持秩序；決鬥場位置交 SP2、SP7；暗灣入口以外恢復懸賞與 PvP\n- [x] 城內歷史地標（公約石階、東澳、九方客棧、戈德里克導航石碑）與配置 v0.1 的街區名稱收入 glossary；順帶補收三個陣營群島設施、晦明研究所、鏽錨走私暗灣\n- [ ] 其他主城（各陣營首府）是否為安全區：與攻城戰規則一起交 SP6、SP7\n\n\n## SP1-001 r1 審閱（Opus，2026-10-05）\n\n**整體**：品質可用。結構分析與首領人格可直接進入下一輪；命名有幾處語感或對應錯誤，需要修正後才能定案。\n\n### 1. 陣營與大陸結構 → 同意方案 C\n\n歐羅巴根基：鐵銀公約、星盤修會；震旦根基：天行赤焰軍、雲海商盟；四陣營都在對岸與交界區設分部。這符合 GDD「出生不綁定陣營」（Lv.50 入盟後才有跨洲動機），也給 AI 首領「本土 vs. 海外」的取捨空間。風險：玩家可能傾向加入本洲陣營，導致人口失衡；需要在 SP6 用跨洲任務獎勵平衡。\n\n### 2. 陣營命名\n\n| 現名 | Gemini 首選 | Opus 建議 | 理由 |\n|---|---|---|---|\n| 白銀獅心同盟 / The Iron & Silver Concord | 鐵銀獅心公約 | **鐵銀公約** / The Iron & Silver Concord（徽記：銀獅） | Gemini 首選仍保留英文沒有的「獅心」，中英不一致的問題沒有解決。獅子改為徽記，名稱中英直接對應。 |\n| 星象觀星者 / Starlight Astrolabe | 星天儀軌學會 / Order of the Starlight Astrolabe | **星盤修會** / Order of the Starlight Astrolabe | 「儀軌」是佛教密宗用語（儀式規範），用在歐羅巴陣營語感錯置，比 Gemini 自己否決的「天儀」更東方。「星盤」是 astrolabe 的標準譯名，「修會」對應 Order 且帶歐式修道院氣質。英文名採 Gemini 建議。 |\n| 天行赤焰軍 / The Crimson Vanguard | 天行赤焰軍 / The Empyrean Crimson Vanguard | **中文保留；英文待議** | Empyrean 源自基督教／但丁的「最高天」，是西方宗教語感，放在震旦陣營反而錯置。候選：維持 The Crimson Vanguard，或改 Sky-Striding Crimson Vanguard。另：首領格言「天行健而逆天爭」與「天行健」（順天自強）原意相反，需改寫或明確設定為刻意反諷。 |\n| 雲海商盟 / Cloudveil Syndicate | 不變 | **同意不變** | 中英契合。 |\n\n### 3. 大陸與交界區\n\n- **歐羅巴 Europa、震旦 Orientis 維持原名，不加別名。** Gemini 提的「歐菲利亞 (Europia)」中英不對應（歐菲利亞是 Ophelia 的音譯）；「神洲／赤縣九洲」直接指涉現實中國，比「震旦」更貼近地球實名，與「奇幻化」方向相反。\n- **交界區：建議「天塹群島」(The Rift Archipelago)。** 「天塹」（天然屏障、隔絕兩岸的海）切合「Rift」，也比「天塹裂境群島」簡潔。\n- **政治地位：同意「自由城邦託管」。** 由「領航者評議會 (Council of Helmsmen)」自治，四陣營只能設領事館與商館；島上禁正規軍交戰，私掠與懸賞合法。Gemini 的英文 The Free League of Helmsmen 與中文「領航者自由城邦公會」不對應，需統一。新名詞（鯨骨自由港、落星穹頂、《天塹海岬不戰公約》）待定案後入 glossary。\n\n### 4. 首領人格 → 可用\n\n四位首領（奧古斯都、奧蕾莉亞、赫連烈、溫九娘）人格鮮明，彼此的外交傾向有區隔（防禦條約／均勢操縱／擴張／經濟絞殺），適合當 SP6 的 system prompt 底稿。量化參數（Aggression、Greed 等）屬於 SP6 決策狀態機的設計範圍，不在 SP1 決定。\n\n## 遊戲正式名稱候選表（SP1-002 ／ SP1-003 ／ Opus，2026-10-05）\n\n來源：Gemini `handoff/gemini/SP1-002-game-title.response.md`；Codex `handoff/codex/SP1-003-game-title.response.md`（英文原文 `.response.en.md`，產生器 `experiments/game-title/`）。Codex 只提英文名，中文名是 Opus 依原意改編（譯法見翻譯註記）。\n\n評等（Opus）：**A** 建議進決選／**B** 可考慮，有明顯缺點／**C** 不建議。所有名稱都還沒做商標查核；表中風險只是初步判斷。\n\n| # | 來源 | 方向 | 中文名 | English | 含義（一句話） | 主要風險 | 評等 |\n|---|---|---|---|---|---|---|---|\n| O1 | Opus | 東西交會＋神話地理 | **晨昏** | **Twinlight** | 震旦的「震」是東方卦位、「旦」是破曉；Europa 有「日落之地」的民間詞源（源自閃語 *ereb*，學界有爭議）。東晨西昏，一個太陽、兩岸文明。Twinlight＝twin＋twilight。 | 「晨昏」是常用詞，中文搜尋難獨占；Twinlight 需查商標；與 Gemini「雙曜」概念重疊 | **A** |\n| C1 | Codex | 活的世界（造詞） | 易鼎 | **Palimarch** | palimpsest（刮去重寫的手稿）＋march（邊境）：被歷代統治者反覆改寫的世界。「易鼎」即改朝換代。 | 英文字義不直觀、念法不一；中文「鼎」偏東方，西方元素少 | **A** |\n| O2 | Opus | 活的世界 | **史未央** | **The Unwritten Age** | 「未央」＝未盡（漢未央宮、「夜未央」）：歷史還沒寫完，由 AI 首領與玩家續寫。 | 英文 The Unwritten 已是知名漫畫名；英文較泛用 | **A** |\n| C3 | Codex | 鍛造＋活的世界（造詞） | 鑄史 | **Loreweld** | lore＋weld：話語與素材焊成兵刃，玩家與首領的作為焊成同一部歷史；接縫可見，兩種文化不被抹平。 | 英文像製作類遊戲；字尾子音難念 | **A** |\n| C2 | Codex | 活的世界（造詞） | 御筆 | **Crownscript** | 王冠們在書寫歷史，但沒有一頂王冠能掌控整份文稿。 | script 易被理解為「劇本寫死」或軟體 | **B** |\n| G6 | Gemini 首選 | 鍛造與神兵 | 神鑄紀元 | **Soulforged** | 以魂核結晶與心念鑄造神兵，直接點題智能工坊。 | Soulforge／Soulforged 在奇幻作品中極常見（如龍槍系列小說 *The Soulforge*），英文幾乎不可能獨占搜尋；「紀元」是常見套詞 | **B** |\n| G1 | Gemini | 東西交會 | 雙曜之境 | **Twin Horizons** | 日月同輝，兩大文明隔天塹對望。 | Horizon 系列撞詞；與 O1 概念重疊，O1 中英對應更緊 | **B** |\n| G5 | Gemini | 活的世界 | 天機弈局 | **Sovereign Fates** | 天地為局、諸王執子，AI 首領與玩家共同博弈。 | 中英不對應；「天機」是極常用的作品詞；可能被誤認為策略戰棋 | **B** |\n| G7 | Gemini | 鍛造與神兵 | 鑄刃之約 | **The Iron Word** | 以言語向工坊立約鑄刃。 | 中英不對應（約／Word）；英文偏文藝 | **B** |\n| C4 | Codex | 活的世界（造詞） | 經緯 | **Crownweft** | 君主鋪下經線、玩家穿梭為緯；中文「經緯天下」本身有治理之意。 | weft 冷僻字；中文「經緯」太常用 | **B** |\n| O3 | Opus | 鍛造＋活的世界 | **鑄世** | **Worldforged** | 不只鑄兵，也在鑄造世界。 | WorldForge 是既有開源遊戲專案；與 C3「鑄史」接近 | **B** |\n| O4 | Opus | 鍛造與神兵 | **銘鋒** | **Edgeword** | 在鋒刃上銘刻話語；edge＋word 對應「用語言鍛造」。 | 兩個名稱都偏冷，需要副標說明 | **B** |\n| O5 | Opus | 神話地理 | **浮槎** | **Starsail** | 張華《博物志》：有人乘浮槎從海上直達天河。渡海通往新世界，也預留未來新大陸。 | 「槎」是冷僻字（音 chá）；易聯想《崩壞：星穹鐵道》的星槎 | **B** |\n| G2 | Gemini | 東西交會 | 雙冕紀元 | Dual Crowns | 教廷與皇朝兩頂王冠。 | 英文偏純西方題材 | C |\n| G3 | Gemini | 東西交會 | 裂海同瀾 | Sundered Tides | 天塹潮汐拉扯兩洲。 | 像航海遊戲；四字拗口 | C |\n| G4 | Gemini | 活的世界 | 萬象演紀 | Living Epoch | 歷史由 AI 與玩家動態推演。 | 中文抽象、英文平淡 | C |\n| G8 | Gemini | 神話地理 | 天塹星瀾 | The Sundered Reach | 天塹與星象航道。 | 沿用已否決的「星天儀軌」語感；Rift／Sundered 撞名 | C |\n| G9 | Gemini | 神話地理 | 星軌天塹 | The Great Divide | 天上星軌、地下海溝。 | 英文是通用詞，搜尋困難 | C |\n| G10 | Gemini | 神話地理 | 界海彼端 | Beyond the Boundless | 大洋彼端的未知。 | 偏探索抒情，缺乏戰鬥感 | C |\n| C5 | Codex | 鍛造（造詞） | 淬史 | Loretemper | 金屬與傳統都在衝突中淬鍊。 | temper 易聯想「脾氣」；不夠俐落 | C |\n| C6 | Codex | 鍛造（造詞） | 言鑄 | Wordwrought | 以語言造成物質。 | 難拼難念；已有作家網站使用 | C |\n| C7 | Codex | 活的世界（造詞） | 世詔 | Worldwrit | 作用於世界的權威文書。 | Litplay 已有同名 AI 功能（Codex 自己也不建議） | C |\n| C8 | Codex | 鍛造 | 言爐 | The Speaking Forge | 玩家描述，工坊以物質回答。 | 像療癒打鐵遊戲；不提政局 | C |\n| C9 | Codex | 活的世界 | 易冠 | The Mutable Crown | 同盟、戰爭與王權都是變數。 | 學術感重；不提戰鬥與鍛造 | C |\n| C10 | Codex | 活的世界 | 未書諸王 | Sovereigns Unwritten | 首領沒有寫定的未來。 | 像大戰略遊戲；Sovereign 難拼 | C |\n\n### Opus 審閱重點\n\n- **三方共識**：最有辨識度的不是「兩塊大陸」，而是 **「歷史會自己寫」** 和 **「用話語鍛造」**。Codex 的分析最到位；Gemini 前三名有兩個也落在這兩條線上。\n- **Gemini**：方向涵蓋完整，但多數名稱中英不對應（天機／Sovereign、鑄刃之約／The Iron Word），而且偏好「紀元」「之境」這類常見套詞，Logo 辨識度弱。G8 還沿用了 SP1-001 已否決的「星天儀軌」。\n- **Codex**：造詞品質高，也有實際做撞名檢索（淘汰了 Sunderwake、Voxforge、Oathloom）。缺點是只有英文，部分造詞（Palimarch）需要解釋才懂。\n- **英文要能獨占**：MMO 在海外要靠搜尋和社群帳號，Soulforged、The Great Divide 這類常見詞幾乎搶不到第一頁。\n\n### Opus 推薦決選（5 選 1）\n\n1. **晨昏 ／ Twinlight**（Opus 首選）——中英對應最緊，名稱本身就是世界觀：東方的「旦」與西方的「昏」，一句話就能解釋雙大陸；未來加入新大陸也不衝突（太陽依然東升西落）。\n2. **易鼎 ／ Palimarch**——最大膽、最能獨占的世界品牌；適合接受「先陌生、後專屬」策略。\n3. **史未央 ／ The Unwritten Age**——最直接傳達 AI 首領與活的歷史，中文名有古典韻味。\n4. **鑄史 ／ Loreweld**——唯一同時扣住「鍛造」與「活的世界」兩大特色。\n5. **神鑄紀元 ／ Soulforged**——Gemini 首選，代表「主打 AI 鍛造」路線；英文需改成更能獨占的詞才建議採用。\n\n也可以採用「主標＋副標」結構（Gemini 建議），例如《晨昏：史未央》／*Twinlight: The Unwritten Age*；主標當世界品牌，副標留給各資料片。\n\n**Rex 決定後**：寫 ADR、更新 glossary 與 GDD 標題，並對最終 2–3 個名稱做商標（第 9、41 類）、Steam、網域與社群帳號查核。\n\n## 2D 形象圖 v0.1（SP1-005，Codex，2026-10-06）\n\n內部方向探索用的概念圖，不是最終美術。圖檔：`experiments/concept-art/`；畫風規範：`experiments/concept-art/STYLE.md`；Codex 回覆與審閱：`handoff/codex/SP1-005-concept-art.response.md`。\n\n| 類別 | 檔案 | 張數 | 審閱 |\n|---|---|---|---|\n| 世界地圖 | `map/world-map.jpg`、`map/world-map-labeled.jpg` | 2 | r2 通過 |\n| 主要城市 | `cities/EU-01`～`EU-03`、`OR-01`～`OR-04`、`RA-01`、`RA-02` | 9 | 通過（OR-02 退回一次，r2 改為江南水鄉） |\n| 職業 | `classes/<職業>.jpg`（男女並列） | 6 | 通過 |\n| 城市 NPC | `npcs/<城市ID>-N1`～`N3`（含四位陣營首領） | 27 | 通過（EU-01-N1 奧古斯都 r2 加強首領份量與銀獅徽記） |\n\n**城市與 NPC 配置（城市正式名稱見 ADR-0008）**\n\n| ID | 城市 | N1 | N2 | N3 |\n|---|---|---|---|---|\n| EU-01 | 艾森堡｜鐵銀公約首府（河谷要塞聖城） | 首領 奧古斯都 | 兵工廠鐵匠大師（The Forge 工坊主） | 騎士團招募官 |\n| EU-02 | 霧環堡｜星盤修會學院城（迷霧低地） | 首領 奧蕾莉亞 | 鍊金術教授 | 見習修士 |\n| EU-03 | 霜灣港｜北境峽灣港 | 港務總長 | 雲海商盟駐歐主事 | 異端魔女（賽蓮娜） |\n| OR-01 | 雲闕城｜古王朝皇城 | 禁軍統領 | 欽天監官員 | 坊市說書人 |\n| OR-02 | 碧瀾商都｜雲海商盟水鄉商都 | 首領 溫九娘 | 錢莊掌櫃 | 運河船家女 |\n| OR-03 | 斷雲關｜天行赤焰軍北境雄關 | 首領 赫連烈 | 熔谷兵器鑄師 | 邊關老兵 |\n| OR-04 | 凌霄宗｜雲海宗門 | 宗門掌門 | 藏經閣長老 | 外門弟子 |\n| RA-01 | 鯨骨自由港 | 評議會港口代表 | 黑市懸賞掮客 | 混血航海家 |\n| RA-02 | 落星穹頂 | 評議會議長 | 隕星學者 | 星盤修會使節 |\n\n**審閱定案**\n- 畫風採 `STYLE.md`：不透明水彩＋數位接景，三區各有色板與造形語彙；震旦依唐宋明木構與仙俠空間邏輯，禁止日本元素。\n- 亮度上限：場景以 OR-04（雲海宗門）為上限；職業圖以 Arcanist 法環為上限，戰鬥特效要更低。\n- 建模前需另做：職業三視圖、唐刀與戟的武器正交圖、減量衣擺（綁骨與布料模擬）。\n\n**待辦**\n- [x] EU-01-N1 奧古斯都 r2：已完成並通過（2026-10-06）；建模時保留胸甲與旗幟的銀獅，簡化次要獅子配件。\n- [x] 城市正式名稱定案（ADR-0008），已更新本表；manifest 待補\n- [x] 選一座城市做近景建築與街區配置 → 鯨骨自由港（SP1-007），配置 v0.2 見 `docs/lore/whalebone-freeport.md`。\n\n## SP1-004 世界觀聖經 v0.1 審閱（Opus，2026-10-06）\n\nGemini 原稿：`handoff/gemini/SP1-004-lore-bible.response.md`（約 5.5 萬字元）。\n\n**整體**：結構完整，地理、年表、神話、命名規範、陣營卡都可作底稿；「天塹之裂 → 盲霧隔絕 → 星瀾引航 → 不戰公約 → 四強成形 → 魂核狂潮」這條主線清楚，也替智能工坊與預算平衡提供了世界觀解釋（靈質守恆）。整合進 `docs/lore/` 前，以下問題必須修正。\n\n### 1. 必須修正（Opus 已決定）\n\n| 問題 | 原稿 | 修正 |\n|---|---|---|\n| 撞名：《魔戒》 | 艾森加德（Isengard 的標準中譯） | 不採用；改由 Rex 決定（見待討論） |\n| 撞名：艾西莫夫《基地》 | 原初光輝 The Prime Radiant | 原初光輝 / **The First Radiance** |\n| 中英不對應 | 瓦倫泰 / Waltheof；重鋼要塞 / Ironheart Bastion；血煞大營 / Blood-Oath Citadel；萬嵐雲海浮空峰 / Cloudveil；八卦紫虛定靈**鏡** / Talisman | 瓦爾瑟夫；**鐵心要塞**；**血誓大營**；**雲海浮空峰**；…Hexagram **Mirror** |\n| 與 Sovereign Agents 撞詞、與一神信仰矛盾 | 萬神機爐 / The Sovereign Crucible | **聖言熔爐 / The Logos Crucible** |\n| 真實宗教人物 | 聖格列高利 St. Gregory | 改為虛構聖人（如 聖貝里克 St. Berric） |\n| 現實地名、時代錯置 | 溫九娘：旗袍、蜀錦、兩淮、江南；「九洲第一」 | 交領大袖、流金錦緞、「兩河商道」、水鄉；「震旦第一」 |\n| 現代或殖民語感 | 董事總會、期貨、票號、領事裁判權、「全服」寫進設定文本 | 九海議事堂；匯兌與票據；刪除領事裁判權；設定文本不用遊戲術語 |\n| 拼音英文 | Bibo Waterlands；Jiufang Exchange | Jade-Ripple Waterlands；Nine-Seas Countinghouse |\n| 「天塹」「星瀾」英文混用 | 天塹之裂與星象航道都寫成 The Sundered Reach | **天塹 = the Reach（海溝與海域）**；**星瀾 = the Star-Tide（引航星流）**；遊戲名「天塹星瀾 / The Sundered Reach」維持；當代紀元稱 **星瀾紀 / Age of the Star-Tide** |\n| 火器 | 朗姆酒、火藥、火炮 | 烈酒；**鍊金火藥**，船載武器為弩炮與鍊金炮（未定案前不出現一般槍砲） |\n\n### 2. 與已通過的 2D 形象圖（SP1-005）不一致 → 設定配合圖\n\n形象圖已經過審閱，所以設定配合圖：\n\n- **雲海商盟總部**：原稿放在震旦主城下層 → 改為 **OR-02 水鄉商都**（溫九娘所在城）；主城另為 OR-01 古王朝皇城。\n- **星盤修會總部**：原稿為北部雪峰聖塔 → 改為 **EU-02 迷霧低地學院城**，聖塔是城內地標。\n- **千帆商館**（雲海商盟駐歐據點）→ 定在 **EU-03 北境峽灣港**（圖中已有雲海商盟駐歐主事）。\n- 九座城市除首府外大多還沒有正式名稱，交 SP1-006 一併提案。\n\n## SP1-006 遊戲故事 r1 審閱（Opus，2026-10-06）\n\nGemini 原稿：`handoff/gemini/SP1-006-story-chapters.response.md`。結構：兩大陸各六章，第 1–5 章背景史、第 6 章現況，附開放結局與擴充鉤子表。\n\n**整體**：骨架可用。兩線在五個共同事件（天塹之裂、盲霧隔絕、星瀾引航、重會之戰與公約、四強成形）上各自以本方視角記述，對照表清楚。首領的家族前史（瓦爾瑟夫→奧古斯都、赫連鐵山→赫連烈、溫積善→溫九娘）把當代外交恩怨接上了歷史。第 6 章的 6 條進行中衝突都沒有寫結局，可以直接交給 SP6、SP7。以下問題退回 r2。\n\n### 退回 r2 的問題\n\n| # | 類型 | 問題 | 要求 |\n|---|---|---|---|\n| 1 | 時間線 | 首領年齡不成立：第 5 章寫四強在「約八十年前」成形，但奧古斯都 30 歲、溫九娘 20 歲時就創立陣營，換算到現在已經 100 歲以上（溫九娘的外貌設定是三十多歲）。 | 改為「前身組織約八十年前成形，現任首領約 10–25 年前上位或重組」，四位首領的年齡要與 SP1-004 外貌相符。 |\n| 2 | 時間線 | 長夜紀在第 2 章寫成「三千年前至一千年前」，第 3 章卻是五百年前才破霧；赫連鐵山一人統帥百年海戰。 | 長夜紀統一為三千年前至五百年前；赫連鐵山、康斯坦丁改為戰爭末期的統帥。 |\n| 3 | 時間線 | 姜守虛是「皇朝**開國**大天師」，卻與「**末代**人皇」昊宣帝同時。 | 釐清是哪個朝代的開國與末代。 |\n| 4 | 一致性 | 擴充鉤子表有 5 條與章節內文不符（歐 2、歐 3、震 3、震 4、震 5；例如歐 2 內文是莫爾甘的冰火鎖鏈遺言，表中卻是「未腐魔女之心」）。 | 鉤子表以各章內文為準，逐條對齊。 |\n| 5 | 一致性 | 歐 1 把海溝寫成「神罰天塹 (The Sundered Reach)」。 | The Sundered Reach 只作遊戲名；神罰天塹 = The Cleavage of Wrath；天塹 = the Reach。 |\n| 6 | 一致性 | 伊索爾德（圍攻 EU-03 的魔女領袖）被配成 EU-03-N3 城內 NPC。 | 二擇一：N3 改為潛伏港內的溫和派魔女聯絡人；或讓伊索爾德不駐城。 |\n| 7 | 現實指涉 | 九州／九洲（6 處）、江南兩河、南海、「天朝自古藩屬」、十字東征 Crusade。 | 九州→震旦諸道；南海→**南溟**（化用《莊子》）；藩屬改寫；Crusade 改名。 |\n| 8 | 術語 | 設定文本中出現「全服」「Tier 3」「期貨」「黑火藥」、萬嵐雲海浮空峰。 | 改為設定語（「三階以上魂核」等）；火藥只有鍊金火藥；浮空峰依審閱統一為「雲海浮空峰」。 |\n| 9 | 擴充性 | 鉤子表把「有大能自星海擲之」直接定成「飛升星海／域外天魔」終極主線。 | 天塹之裂的真相只留 2–3 個互相矛盾的假說，不指定答案。 |\n\n### Opus 決定\n\n- **新擴充方向**：接受 Gemini 新提的第四個方向，改名為 **南溟歸墟 / The Abyssal Return**（暫定），列入擴充鉤子的保留方向；只留線索，不寫地理與民族設定。\n- **衝突分工**：同意 Gemini 的建議——陣營衝突交 SP6，環境事件交 SP7，跨洲前哨摩擦作為 PvPvE 熱點。\n- **城市名**：Gemini 為 7 座城市提案，交 Rex 與 SP1-004 的 4 項待決事項一起定案（見「待討論」）。Opus 意見：EU-03 霜灣港、OR-03 斷雲關、RA-01 鯨骨自由港、RA-02 落星穹頂可採用。EU-02「威斯帕學院城 / Whisperingburg」英德混搭、中文是音譯加意譯，建議另提；OR-04「凌霄劍宗」會把宗門窄化成只有劍修（OR-04 同時是道士的師門），建議改為「凌霄宗」。\n\n## SP1-006 遊戲故事 r2 審閱與定稿（Opus，2026-10-06）\n\nr2 原稿：`handoff/gemini/SP1-006-story-chapters.response.r2.md` → 整合為 **`docs/lore/story.md`（v0.1）**。\n\n**r1 退回的 9 項問題**：\n\n| # | 結果 |\n|---|---|\n| 1 首領年齡 | 已修正：前身組織約八十年前成形；奧古斯都 58 歲（22 年前重組公約）、奧蕾莉亞 42 歲（18 年前脫離教廷）、赫連烈 45 歲（18 年前建軍）、溫九娘 34 歲（12 年前創商盟）。r2 開頭新增人物年代表。 |\n| 2 時間線 | 已修正：長夜紀為三千年前至五百年前；康斯坦丁、赫連鐵山改為戰爭末期（約 170–150 年前）的統帥。 |\n| 3 姜守虛的朝代 | r2 仍有矛盾（「開國／首任」大天師與末代人皇同時）→ Opus 整合時改為「欽天道院開山大天師」。 |\n| 4 鉤子表 | 已修正：12 章各一條主鉤子，次要線索都出現在內文中。 |\n| 5 天塹的英文 | 已修正：神罰天塹 = The Cleavage of Wrath。 |\n| 6 伊索爾德 | 已修正：EU-03-N3 改為城內溫和派魔女「黑鴉草藥師」賽蓮娜 (Selene the Raven-Herbalist)；伊索爾德不駐城，是黑森林的敵對首領。**Opus 同意**，與形象圖相符（N3 立繪是「異端魔女」）。 |\n| 7、8 現實指涉與遊戲術語 | 已修正；殘留一處「九州」，Opus 整合時改掉。 |\n| 9 天塹之裂真相 | 已修正：保留三個互相矛盾的假說（星海大能投擲／祖龍陰陽週期反噬／太古文明過度抽取原核），不指定答案。 |\n\n**擴充接口**（詳見 `docs/lore/story.md` §D）：極北冰原、烈日荒原、西方失落新大陸、南溟歸墟（第四個方向）、天塹群島獨立線（領航者評議會、黑羽引航者），以及跨洲事件（深淵巨瞳、雙陸神代同源、地心熔岩通道）。兩大陸第 7 章以後的走向，各列 3 個開放結局，交由陣營戰與 AI 首領決定。\n\n**待辦**\n- [x] 名稱定案（ADR-0008）；`docs/lore/story.md` 已使用定案名\n- [ ] SP1-005 manifest 的 EU-03-N3 補上角色名「賽蓮娜」。\n- [ ] 第 6 章的 6 條進行中衝突，交 SP6（陣營衝突）與 SP7（環境事件、前哨摩擦）設計。\n\n## 九城形象圖與灰盒打樣計畫（Opus，2026-10-07）\n\n目標：九座主要城市都有「街區配置＋基礎形象圖」，並用灰盒驗證步行時間與坡度。鯨骨自由港（SP1-007）是範本。進度在本節勾選，並同步 `tasks/`、log 與追蹤網頁。\n\n**單一資料來源**：每座城市一份配置檔 `docs/lore/cities/<ID>.json`（街區多邊形、高度、POI、路線）。示意圖、灰盒模型、量測報告都由它產生；繪製圖以它為準。\n\n| 階段 | 內容 | 執行 | 狀態 |\n|---|---|---|---|\n| P0 | 量測標準 ADR（參考移速、坡度上限、服務距離）；本計畫 | Opus | ✅ ADR-0010、配置格式 `docs/lore/cities/README.md` |\n| P1 | 灰盒工具 `tools/greybox/`：讀配置檔 → 路線時間與坡度報告、示意圖 SVG、Blender 灰盒 .glb、網頁 3D 檢視器 | Sonnet | ✅ SP8-001（11 項測試通過） |\n| P2 | 九座城市配置檔：鯨骨自由港由 WB-00 轉成資料，另外八城由 Opus 設計 v0.1 | Opus | ✅ 九城配置檔（P3 後 EU-01、EU-02、OR-03 為 v0.2，RA-01 為 v0.3） |\n| P3 | 跑量測、修配置，直到九城全部達標 | Opus＋工具 | ✅ 九城通過（7 城有標註）；報告 `experiments/greybox/<ID>/report.md` |\n| P4 | 八城基礎形象圖：每城繪製平面圖＋2 張近景（共 24 張），以 P1 的示意圖為準 | Codex | 進行中：歐羅巴三城 9 張 ✅（SP1-008）；震旦四城執行中 |\n| P5 | UE 5.8 引擎內驗證：匯入灰盒、建 NavMesh、量實際路徑長度與可行走坡度 | Sonnet | 進行中（SP8-002） |\n| P6 | 整合：`docs/lore/cities/` 各城文件、glossary、tasks、追蹤網頁加灰盒檢視 | Opus | 未開始 |\n\n**範圍說明**\n- 「灰盒」是可以走的量體模型（平台、樓梯、坡道、升降台、橋），不含美術。P1 先在 Blender 產生並在網頁檢視；P5 進 UE 用 NavMesh 驗證。\n- UE 驗證用獨立的暫存專案 `E:/UEProjects/CityGreybox`（不進 repo），不動 E01 的遊戲專案骨架。\n- Codex 有用量上限；P4 分批執行，撞到上限就等額度恢復再繼續。\n\n## 進度紀錄\n\n| 日期 | 內容 |\n|---|---|\n| 2026-10-05 | 子方案建立 |\n| 2026-10-05 | SP1-001 r1：Gemini 提交結構、命名、首領人格提案；Opus 審閱，命名待 Rex 確認 |\n| 2026-10-05 | 新增遊戲正式名稱任務：SP1-002（Gemini）、SP1-003（Codex） |\n| 2026-10-05 | SP1-002（Gemini）、SP1-003（Codex）回覆；Opus 翻譯 Codex 回覆、加入 Opus 提案，彙整 25 個候選與決選 5 名，待 Rex 選定 |\n| 2026-10-05 | Rex 暫定遊戲名為 G8 天塹星瀾 / The Sundered Reach（ADR-0004）；GDD、README、追蹤網頁標題同步更新 |\n| 2026-10-06 | SP1-005（Codex）2D 形象圖 v0.1 完成：地圖 2、城市 9、職業 6、NPC 27，Opus 分四階段審閱 |\n| 2026-10-06 | SP1-004 世界觀聖經 v0.1 審閱；SP1-006 遊戲故事 r1 退回、r2 通過，整合為 docs/lore/story.md v0.1 |\n| 2026-10-06 | Rex 採用全部命名建議：駐地 / Enclave、九座城市名、赫連烈格言（ADR-0008）；glossary 新增 27 個名詞 |\n| 2026-10-06 | SP1-004 世界觀聖經整合進 docs/lore/（geography、history-mythology、factions、naming、README）v0.1；三項主要交付物完成 |\n| 2026-10-06 | SP1-005 EU-01-N1 奧古斯都 r2 通過，形象圖 v0.1 全數完成 |\n| 2026-10-06 | ADR-0009：鯨骨自由港設為安全區；地標與街區名稱收入 glossary |\n| 2026-10-06 | SP1-007（Codex）鯨骨自由港街區配置與近景圖：r1 退回 3 張（評議會建築畫成震旦殿宇、平面圖看不出東西分側），r2 通過；配置 v0.2 定稿進 docs/lore/ |\n| 2026-10-07 | 九城形象圖與灰盒計畫啟動：ADR-0010 量測標準、城市配置檔格式、RA-01 配置檔 |\n| 2026-10-07 | P1 灰盒工具完成；P3 量測：首輪艾森堡不通過（主線 91.5 s），修正四城後九城全部通過 |\n"}, {"id": "SP2", "title": "戰鬥系統 (Combat)", "status": "in_progress", "progress": 20, "owner": "Opus", "models": ["Opus", "Sonnet"], "milestone": "M1", "updated": "2026-10-05", "file": "docs/subprojects/SP2_combat.md", "questions": [{"done": false, "text": "**D1 M1 職業組合是否定案為 Blademaster + Templar**：若偏好其他組合（如加入遠程獵魔斥候）會增加彈道 / 弱點系統工期"}, {"done": false, "text": "**D2 「可隨時中斷後搖」之邊界**：GDD 說閃避可「隨時」中斷攻擊後搖；是否也允許中斷 S（起手）？允許會使攻擊零風險，削弱出招決策"}, {"done": false, "text": "**D3 軟吸附是否加入**：與「無鎖定」支柱衝突程度？手把玩家尤其需要；PvP 是否關閉？"}, {"done": false, "text": "**D4 打擊感標竿取向**：對標《黑色沙漠》（偏慢、重、肉）還是《龍之谷》（更快、更輕、更高階連段）？這會決定全表幀數基調"}, {"done": false, "text": "**D5 PvP 在 M1 之後的定位**：是否有 PvP（決鬥 / 戰場 / 陣營戰）？決定 §10 是否需要 Rewind 與 hitbox 完整骨骼判定，成本差異很大"}, {"done": false, "text": "**D6 玩家受擊無敵 / 受傷保護**：是否提供受擊後短無敵（12 幀）？影響多段傷害 Boss 設計與難度"}, {"done": false, "text": "**D7 Locomotion 是否用 Motion Matching**：戰鬥動作用手 K + Montage；跑走位移是否導入 Motion Matching（動畫資源成本高、效果好）？"}, {"done": false, "text": "**D8 是否有跳躍 / 空中機動**：目前 M1 不做跳躍。《黑沙》無跳；但 Blademaster 有浮空飛劍、懸空概念"}, {"done": false, "text": "**D9 網路框架：SpatialOS 與 GAS / Iris 的相容**：SpatialOS 方案會影響 Actor Authority 與 Rewind 實作；是否提前做技術 Spike？"}, {"done": false, "text": "**D10 體力是否限制普攻**：目前普攻不耗體力；若需加深資源決策，可令連段消耗少量體力。會影響節奏與新手體驗"}, {"done": false, "text": "**D11 劍意「精準窗」難度**：6 幀窗對手把 / 高延遲是否合理？是否提供「寬鬆模式」（10 幀）為預設？"}, {"done": false, "text": "**D12 資源命名與 UI**：Templar 使用「MP」還是改為「信仰 Faith」？6 職業各自資源名稱是否統一 UI 外觀？"}, {"done": false, "text": "**D13 無障礙 / 暈動症**：是否列為 M1 必做（關閉震動 / 縮 hitstop / 色盲提示）？"}, {"done": false, "text": "**D14 完美閃避慢動作的範圍**：是否僅做本地視覺（建議），還是真實的 PvE 局部時間減慢（影響怪物）？後者多人同步複雜"}], "body": "# SP2 戰鬥系統設計規格 v0.1\n\n> **Opus 審閱註記（2026-10-05）**\n> - 本版由 Sonnet 子代理起草、Opus 審閱，結構與數值可作為 M1 起點，全部數值以 DataTable 外部化後再試玩調整。\n> - **§10.4 / D9 的 SpatialOS 需重新評估**：Improbable 已停止 SpatialOS for Unreal 的支援，空間分區方案改列為 SP8 待決事項；M1 為單人原型不受影響。\n> - 優先需 Rex 決定：**D4 打擊感標竿（黑沙 vs 龍之谷）**、D2 取消邊界、D3 軟吸附、D5 PvP 定位——這四項會改動全表幀數基調。\n\n> 來源：GDD §2（戰鬥）、§4（職業）、§9（技術架構）、§10（M1）。\n> 讀者：UE5 戰鬥/動畫/網路工程師、技術美術、關卡設計。\n> 約定：所有時間以 **60 fps 幀** 為單位（1 幀 = 16.67 ms），除非另註。所有數值為「**初始建議值（Initial, 需試玩調整）**」，統一放在 DataTable／DataAsset，禁止寫死於程式。\n> 幀數記法：`S` = startup（起手，含第 1 個 active 幀之前）、`A` = active（判定幀）、`R` = recovery（收招）。總幀數 = S + A + R。`CW` = cancel window（可取消窗，幀區間以動作第 1 幀 = 第 1 幀起算）。\n\n---\n\n## 1. 目標與範圍\n\n### 1.1 M1 目標（對應 GDD §10-M1）\n\n實現單人地圖的 3D 無鎖定攻擊、連招與打擊硬直、格擋、翻滾手感，對標《黑色沙漠》。**M1 只驗證「手感」，不驗證數值生態、不接 AI 鍛造、不做多人。**\n\n### 1.2 職業選擇：Blademaster + Templar\n\n| 項目 | 游俠劍客 Blademaster | 聖堂騎士 Templar |\n|---|---|---|\n| 定位 | 高速、輕裝、攻擊導向 | 厚重、防守反擊導向 |\n| 節奏 | 快、取消多、位移多 | 慢、承受多、決斷重 |\n| 驗證重點 | 連招取消、浮空連擊、i-frame 閃避、劍意時機 | 格擋、完美格擋、霸體、破霸、受擊反饋 |\n| 遠程元素 | 無（純近戰＋飛劍終結） | 無 |\n\n**選擇理由：**\n\n1. **覆蓋對立的兩端**：一快一慢、一攻一守，兩職業合起來幾乎覆蓋 M1 要驗證的全部子系統（閃避 / 格擋 / 取消 / 霸體 / 浮空 / 破霸）。\n2. **跨大陸各一**（歐 + 震旦），M1 就能驗證兩套動畫語彙與美術風格的差異，避免日後單一風格定型。\n3. **核心機制都是「近戰手感」型**：Aegis（受擊累積）與 Sword Intent（時機疊加）都只依賴 hitbox / 判定窗 / 資源，不需要弩、陷阱、元素連鎖、道法等額外子系統（那些屬於彈道系統 / 狀態疊加系統的擴充，會拉長 M1）。\n4. **刻意不選獵魔斥候 / 秘術賢者**：遠程、部位弱點（Insight）、元素反應需要額外的彈道、部位 hurtbox、反應矩陣，風險高，放到 M1.5 / M2 後。但本規格 §6 仍預留部位 hurtbox 與彈道資料結構，避免日後重工。\n5. 不選 Titan Guard：與 Templar 的「重、霸體」重疊度高；不選 Taoist：陰陽雙相屬於狀態切換系統，複雜度高。\n\n### 1.3 M1 範圍\n\n| 類別 | 內容 |\n|---|---|\n| 地圖 | 單人測試場（平地 + 一段斜坡 + 一個矮牆/高低差 + 一個封閉 arena 作 Boss 區），無 NPC、無經濟 |\n| 角色 | 2 職業，各 5–6 技能 + 4 段普攻 + 閃避 + 格擋（Templar）/ 劍意系統（Blademaster） |\n| 敵人 | 見 §1.4 三種測試敵人 |\n| 網路 | M1 以 **單機 Listen Server（PIE）＋本機模擬延遲** 驗證，**架構必須與 DS 一致**（見 §10），但不實測多人 |\n| 不做 | 裝備數值 / 鍛造、輸出平衡、PvP、生活技能、LLM、技能樹、第三職業 |\n\n### 1.4 三種測試敵人\n\n| ID | 名稱 | HP | Poise | 霸體 | 行為 | 驗證目標 |\n|---|---|---|---|---|---|---|\n| E1 | 雜兵 Grunt | 300 | 30 | 無 | 慢速接近 → 單發橫斬（S=24 A=4 R=30）→ 後撤；偶爾 2 連擊 | 基本打擊感、浮空、倒地追擊、閃避、格擋 |\n| E2 | 精英 Elite（霸體） | 1500 | 150 | 攻擊起手至 active 結束全程霸體（Poise 傷害仍累積）；Poise 歸零 → 進入 45f 破霸硬直 | 3 連擊（含一次可完美格擋的「紅光」重擊）＋ 衝刺突刺 | 破霸、霸體對撞、完美閃避/格擋、技能選擇 |\n| E3 | Boss 木樁 Dummy Boss | 50000（不死，血量僅供 DPS 統計） | 400 | 可由 Debug 面板切換：無 / 常駐 / 週期性 | 可編程：按劇本表放出指定攻擊（直線、範圍、投射物、不可格擋）；可選擇「站樁」 | 部位 hurtbox、DPS 統計、判定視覺化、幀數驗證 |\n\n> 木樁需附 **Debug HUD**：顯示每次命中的傷害、命中幀、combo 計數、Poise、hitstop 幀數，並可輸出 CSV。這是 M1 驗收的主要工具。\n\n---\n\n## 2. 操作與鏡頭\n\n### 2.1 朝向模型（True Action Combat）\n\n* **十字準星朝向**：螢幕中央準星射線（Line Trace，最長 50 m，通道 `Trace_Aim`）決定「瞄準點 AimPoint」。若射線無命中，取射線 30 m 處。\n* **角色朝向 ≠ 鏡頭朝向的處理**：\n  * 移動中：角色面向移動方向（Orient to Movement），旋轉速度 720°/s。\n  * **攻擊 / 技能起手瞬間（S 的第 1 幀）**：角色以 **最大 540°/s**（Templar 360°/s）轉向 AimPoint 水平方向，轉向期間受 Motion Warping 限制（見 §11）。旋轉預算在 S 幀內消耗完畢，active 之後朝向鎖定，避免「揮刀途中甩頭」。\n  * 格擋（持續）：角色持續朝向鏡頭水平方向（Strafe 模式），移動速度 ×0.5。\n* **垂直瞄準**：近戰僅水平朝向（保持動畫完整）；遠程 / 飛劍終結技才使用垂直角度。\n\n### 2.2 軟吸附（Soft Magnetism）建議\n\nGDD 明定「無鎖定、無 Tab 切換」。**不加鎖定，但建議加弱輔助「軟吸附」**，作為手感調校選項（M1 內做 A/B 測試，見待討論 D3）：\n\n| 參數 | 建議值 | 說明 |\n|---|---|---|\n| 觸發條件 | 玩家按下攻擊 / 技能的瞬間 | 只在起手一次性計算，不持續追蹤 |\n| 吸附錐角 | 水平 ±20°（準星為中心） | 錐內有敵人才吸附 |\n| 吸附距離 | 近戰 ≤ 4.0 m | 超過不吸附 |\n| 最大修正角 | 15°（技能 10°） | 修正量 = min(實際角度差, 最大修正角) |\n| 位移吸附 | 攻擊 1~4 段向目標前進 0.3 / 0.3 / 0.5 / 0.8 m（Motion Warping） | 目標距離小於此值則停在 0.9 m 處 |\n| 優先權 | 離準星中心角度最小者；同分取距離近者 | 不可跨越障礙（需視線 Trace） |\n| 開關 | 設定選單「攻擊輔助：關 / 弱 / 強」（強 ×1.5 角度） | PvP 預設「關」（待決） |\n| 不做 | 不顯示鎖定框、不跟隨目標移動 | 守住「無鎖定」支柱 |\n\n### 2.3 輸入綁定表\n\n使用 **Enhanced Input**（Input Mapping Context 分層：Gameplay / UI / Debug）。\n\n| 動作 | 鍵鼠（預設） | 手把（Xbox 配置） | 備註 |\n|---|---|---|---|\n| 移動 | W A S D | 左搖桿 | 8 向類比（手把）、4 向合成（鍵盤） |\n| 鏡頭 | 滑鼠移動 | 右搖桿 | 手把設死區 0.15、曲線指數 1.6 |\n| 普攻 | 滑鼠左鍵（LMB） | RT | 可緩衝 |\n| 重擊 / 技能修飾 | 滑鼠右鍵（RMB） | LT（Templar 為格擋） | 見下 |\n| 格擋（Templar）/ 招架（Blademaster 無） | RMB（按住） | LT（按住） | Blademaster 的 RMB = 劍意技 |\n| 閃避 | Space | B | 方向 = 移動輸入；無輸入則後撤 |\n| 技能 1~4 | Q / E / R / F | LB+X / LB+Y / LB+B / LB+A | 手把以 LB 為技能層，避免占用過多按鍵 |\n| 終結 / 大招 | Shift + 技能鍵或 X | RB+LT | 劍意飛劍終結、Aegis 反擊 |\n| 衝刺 | Left Shift（按住） | 左搖桿按下 | 體力消耗，見 §7 |\n| 跳躍 | （M1 不實作） | — | 見待討論 D8 |\n| 互動 | G | Y | M1 僅 Debug |\n| Debug | F1 判定視覺化 / F2 幀顯示 / F3 時間縮放 | — | Shipping 移除 |\n\n**輸入規則：**\n\n* **輸入緩衝（Input Buffer）**：緩衝窗 **6 幀（100 ms）**，保留最後一個攻擊類輸入與最後一個閃避輸入（各自獨立 slot）。收招（R）最後 6 幀內輸入可在收招結束瞬間發動；取消窗內輸入立即生效。\n* **同幀輸入優先級**：閃避 > 格擋 > 技能 > 普攻 > 移動。\n* **按住 vs 點按**：普攻按住 = 自動接下一段（保持節奏，需在 CW 內仍視為輸入）。\n* **手把震動**：見 §8。\n\n### 2.4 鏡頭參數\n\n| 參數 | 建議值 | 備註 |\n|---|---|---|\n| 鏡頭模式 | 過肩第三人稱（Spring Arm） | 右肩偏移 |\n| 預設 FOV | 75°（戰鬥）/ 70°（探索）；選單可調 60–95 | 衝刺 +4° 漸變 12 幀 |\n| 臂長 | 4.2 m（戰鬥）/ 5.0 m（探索） | |\n| Socket 偏移 | X0 / Y +45 cm（右肩）/ Z +60 cm | 可切左右肩 |\n| 俯仰限制 | -55° ~ +70° | |\n| 位置跟隨延遲（Lag） | 水平 0.12 s、垂直 0.08 s | 使用 `CameraLagSpeed ≈ 12 / 18` |\n| 旋轉延遲 | 0（鏡頭旋轉必須即時） | 避免瞄準飄移 |\n| 碰撞 | Probe 半徑 12 cm，貼牆時拉近，恢復速度 6 m/s | |\n| 攻擊鏡頭推進 | 普攻命中時臂長 -0.15 m（6 幀進、10 幀回） | 輕度；大招 -0.4 m |\n| 敵人過多時 | 自動 +0.4 m 臂長（半徑 6 m 內 ≥3 敵） | 可選，M1 先關 |\n| 暈動症選項 | 關閉鏡頭震動 / 關閉 FOV 動效 / 降低 hitstop 鏡頭效果 | 無障礙必備 |\n\n### 2.5 準星 UI\n\n* 預設白色小圓點，命中時閃紅；對準可受擊敵人時放大 15%。**不顯示敵人血條鎖定框**（血條走頭頂）。\n* 準星資訊（可選）：Blademaster 顯示劍意層數、Templar 顯示 Aegis 值。\n\n---\n\n## 3. 動作狀態機與優先級\n\n### 3.1 狀態列表\n\n高層狀態機（單一主狀態 + 可疊加的 Gameplay Tags），在 GAS 中以 Tag 表示（見 §11）。\n\n| 狀態 | Tag | 說明 | 可被輸入打斷 | 備註 |\n|---|---|---|---|---|\n| Idle | `State.Idle` | 站立 | 全部 | |\n| Move | `State.Move` | 走 / 跑 / 衝刺 | 全部 | 衝刺為子狀態 `State.Move.Sprint` |\n| Attack | `State.Attack.N1~N4` | 普攻 | 依取消矩陣 | |\n| Skill | `State.Skill.<ID>` | 技能 | 依取消矩陣 | |\n| Dodge | `State.Dodge` | 閃避 / 翻滾 | 僅 R 後段 | 有 i-frame |\n| Block | `State.Block` | 格擋（持續） | 可轉閃避 / 反擊 | Templar 專屬 |\n| BlockHit | `State.Block.Hit` | 格擋受擊（短硬直） | 見 §4 | |\n| Hitstun | `State.Hit.Light/Heavy` | 受擊硬直 | 否（僅 DI/閃避受身，見 §5） | |\n| Stagger | `State.Hit.Stagger` | 破霸硬直（Poise 歸零） | 否 | 與 Hitstun 區分，時間更長 |\n| Knockback | `State.Hit.Knockback` | 擊退（地面滑行） | 否 | |\n| Airborne | `State.Hit.Airborne` | 浮空 | 否（可受身見 §5） | 受重力與 Juggle 規則約束 |\n| Knockdown | `State.Hit.Down` | 倒地 | 否 | 倒地期間有「起身保護」 |\n| Getup | `State.Getup` | 起身（含受身） | 僅 Wakeup 無敵窗後 | 有短無敵 |\n| Grabbed / Stunned | `State.CC.*` | 控制狀態（M1 僅 Stun） | 否 | 預留 |\n| Dead | `State.Dead` | 死亡 | — | |\n\n### 3.2 優先級（高 → 低）\n\n`Dead` > `Knockdown/Airborne/Stagger`（被動狀態）> `Hitstun` > `Dodge` > `Block` > `Skill` > `Attack` > `Move` > `Idle`\n\n**規則：**\n\n1. **被動狀態覆蓋主動狀態**：受擊成功（未被 i-frame/霸體擋下）立即中斷 Attack/Skill/Block（見 §5 霸體例外）。\n2. **主動輸入只能「向上」中斷**：只能由低優先動作取消至同級或高級（Dodge > Block > Skill > Attack），反向取消需在明確列出的取消窗。**閃避是唯一可「無條件」中斷 Attack/Skill 後搖（R）的主動動作**（GDD §2.1：翻滾可隨時強制中斷當前攻擊動作後搖）。\n3. **「隨時」之定義**：R 的任意幀 + 部分 A 的後半（見矩陣）。**起手（S）與 active 前半不可被閃避取消**，防止「無風險出招」。（待討論 D2：是否放寬 S 後段。）\n\n### 3.3 取消矩陣\n\n欄位為「目前狀態」，列為「新輸入」。內容為「可取消的幀窗（動作總幀數內，1 起算）」，`—` = 不可，`R*` = 收招期全程，`Buf` = 可進輸入緩衝並在窗口開啟時自動執行。\n\n#### 3.3.1 通用取消矩陣\n\n| 目前狀態 \\ 輸入 | 普攻 | 技能 | 閃避 | 格擋 | 移動 | 衝刺 |\n|---|---|---|---|---|---|---|\n| Idle | 立即 | 立即 | 立即 | 立即 | 立即 | 立即 |\n| Move / Sprint | 立即（衝刺攻擊另計） | 立即 | 立即 | 立即 | — | — |\n| Attack N1 | CW（見 §3.4）接 N2 | CW 後段 | 第 **12** 幀至結束（A 後半 + R*） | CW 後段（Templar） | R 最後 6 幀 | — |\n| Attack N2 | 同上接 N3 | 同上 | 第 **12** 幀至結束 | 同上 | R 最後 8 幀 | — |\n| Attack N3 | 同上接 N4 | 同上 | 第 **14** 幀至結束 | 同上 | R 最後 8 幀 | — |\n| Attack N4（終結） | —（回 Idle 後可重起 N1，Buf） | CW | 第 **18** 幀至結束 | CW 後段 | R 最後 10 幀 | — |\n| Skill（一般） | Buf（R 前 6 幀） | 依技能表 `CancelInto` | 第 `A_end` 幀至結束 | R 後半 | R 末 | — |\n| Skill（大招） | — | — | 僅 R 後 50% | — | — | — |\n| Dodge | R 最後 8 幀（回擊 / 閃避攻擊） | R 最後 8 幀 | 不可連續（冷卻 12 幀 + 體力足） | R 最後 6 幀 | R 最後 4 幀 | 可（R 最後 4 幀） |\n| Block（持續） | 反擊攻擊（見 §9） | 反擊技能（耗 Aegis） | **任意幀（耗體力）** | — | 慢走 | — |\n| BlockHit | 第 8 幀後可反擊（見 §4） | 第 10 幀後 | 第 6 幀後 | — | — | — |\n| Hitstun / Stagger / Down | — | — | 僅「受身 / 緊急閃避」窗（見 §5.7） | — | — | — |\n| Getup | — | — | 第 N 幀（見 §5.6） | — | — | — |\n\n#### 3.3.2 取消優先級小抄（工程用）\n\n```\nPriorityTable (higher number wins at same frame):\n  Dodge        = 100\n  BlockRelease = 90   // 放開格擋視為狀態結束，非動作\n  Block        = 80\n  Skill        = 60\n  Attack       = 40\n  Move         = 20\nCancel allowed iff:\n  (target.priority >= current.priority AND frame in current.CancelWindow[target.tag])\n  OR (target.tag == Dodge AND frame >= current.DodgeCancelStart)\n```\n\n### 3.4 普攻四段連擊幀數表（60 fps）\n\n> 通用參考表（Blademaster 用，輕快）。Templar 見 §3.5。「CW」= 下一段輸入有效窗；窗內輸入立即切段，窗後輸入進緩衝，於 R 結束前最後 6 幀仍可接，超過則連段中斷（回 N1）。連段重置：N1 起手時間距上段 R 結束 > 18 幀（0.3 s）→ 回 N1。\n\n| 段 | S | A | R | 總幀 | 取消窗 CW（接下一段） | 閃避可取消起點 | 位移（Motion Warp） | 傷害倍率 | Poise 傷害 | 命中 hitstop |\n|---|---|---|---|---|---|---|---|---|---|---|\n| N1 橫斬 | 8 | 4 | 14 | 26 | 14–22 | 12 | 前進 0.3 m | 100% | 8 | 3 f |\n| N2 反斬 | 7 | 4 | 14 | 25 | 13–21 | 12 | 前進 0.3 m | 105% | 8 | 3 f |\n| N3 突刺 | 10 | 3 | 16 | 29 | 16–25 | 14 | 前進 0.5 m | 115% | 10 | 4 f |\n| N4 終結重斬（浮空） | 14 | 5 | 24 | 43 | —（可接技能 28–38） | 18 | 前進 0.8 m | 160% | 22 | 7 f（命中終結） |\n\n**單段完整範例（N1，逐幀）：**\n\n| 幀 | 內容 |\n|---|---|\n| 1–8 | S：轉向（至多 540°/s）＋ Motion Warp 前進；**不可被取消**（除受擊） |\n| 9–12 | A：武器軌跡 sweep 開啟（AnimNotifyState `HitWindow`）；9 為首個判定幀 |\n| 12 | 閃避取消起點（與 A 最後幀重疊，使「揮空後立即閃」可行） |\n| 13 | R 開始 |\n| 14–22 | CW：普攻輸入 → N2；技能輸入 → 技能（依表） |\n| 23–26 | R 末段，僅接受緩衝輸入與移動 |\n\n**總連段時間**：N1→N4 理想時間約 N1(14)+N2(13)+N3(16)+N4 起手… ≈ **1.2 s 至終結命中**。目標普攻 DPS 約為技能 DPS 的 55%（待平衡）。\n\n### 3.5 Templar 普攻四段（劍盾）幀數表\n\n| 段 | S | A | R | 總幀 | CW | 閃避取消起點 | 位移 | 傷害倍率 | Poise 傷害 | hitstop | 備註 |\n|---|---|---|---|---|---|---|---|---|---|---|---|\n| N1 斜斬 | 12 | 4 | 18 | 34 | 18–28 | 16 | 0.3 m | 100% | 14 | 4 f | |\n| N2 盾擊 | 10 | 3 | 18 | 31 | 16–26 | 14 | 0.2 m | 70% | **26** | 4 f | 高 Poise 傷害，主要用於破霸 |\n| N3 反斬 | 14 | 4 | 20 | 38 | 20–32 | 18 | 0.5 m | 125% | 16 | 5 f | |\n| N4 重劈（擊倒） | 20 | 5 | 30 | 55 | —（可接技能 36–48） | 24 | 0.7 m | 200% | 30 | 9 f | 命中者倒地；Super Armor 自第 14–25 幀（見 §5.2） |\n\n> **設計注意**：Templar 比 Blademaster 慢約 30–40%，但 N2/N4 的 Poise 傷害高、N4 帶自身霸體，形成「慢但穩」的手感。\n\n### 3.6 衝刺攻擊 / 跳躍攻擊（M1 範圍）\n\n| 動作 | 條件 | S/A/R | 說明 |\n|---|---|---|---|\n| 衝刺攻擊 | 衝刺中按普攻 | 12/5/22 | 前進 1.5 m，傷害 130%，可接 N2 |\n| 跳躍攻擊 | M1 不做 | — | 見 D8 |\n\n---\n\n## 4. 閃避與格擋\n\n### 4.1 閃避（Dodge / Roll）\n\n| 參數 | Blademaster | Templar | 說明 |\n|---|---|---|---|\n| 總幀數 | 28（S4 / 位移 16 / R8） | 36（S6 / 位移 20 / R10） | 位移段內角色面向位移方向 |\n| 位移距離 | 4.0 m | 2.8 m | 以 Motion Warping 修正避免穿牆 |\n| **i-frame（無敵）** | 第 **3–17** 幀（**15 幀 = 0.25 s**） | 第 **5–17** 幀（**13 幀 = 0.22 s**） | 對所有傷害判定無敵，**不含**環境持續傷害（可配置） |\n| 體力消耗 | 20 | 28 | 見 §7 |\n| 冷卻 | 12 幀（0.2 s）連續閃避間隔 | 18 幀 | 連按有懲罰：第 2 次連續閃避（<1 s 內）消耗 ×1.25 |\n| 閃避方向 | 8 向 + 無輸入後撤 | 同 | 以相機相對方向輸入 |\n| 可被取消 | R 最後 4 幀接攻擊（閃避攻擊） | 同 | |\n| 閃避中受擊 | i-frame 外：受擊中斷，進 Hitstun | 同 | |\n\n> **關於「隨時中斷後搖」的設計邊界**：i-frame 在閃避 S 階段已開始（Blademaster 第 3 幀），因此「出手取消 → 閃避」的反應容錯很高，這是對標《黑色沙漠》「閃避優先」的核心手感。為避免濫用：連續取消「攻擊→閃避」會讓體力快速耗盡（見 §7），以體力作為單一制衡來源。\n\n### 4.2 完美閃避（Perfect Dodge）\n\n| 參數 | 值 | 說明 |\n|---|---|---|\n| 判定窗 | 在 i-frame 期間，**敵方攻擊判定 active 開始前 ≤ 8 幀（0.13 s）內** 閃避起手 | 也可寫為：閃避第 3–11 幀（Blademaster）內有敵方判定「被閃過」 |\n| 判定方式 | 以「被 i-frame 擋下的敵方攻擊判定」＋「閃避起手距離該攻擊 active 首幀 ≤ 8 幀」 | 伺服器重算（見 §10） |\n| 獎勵 | 1) 全職業：回復體力 15；2) 時間減慢 0.25×、持續 12 幀（僅「本地視覺 + 敵人動畫」，非全局，防多人同步問題，詳 §8）；3) Blademaster：+1 劍意 | 數值待試玩 |\n| 反擊窗 | 完美閃避後 **30 幀（0.5 s）** 內攻擊：傷害 +30%、Poise 傷害 +50% | 稱「破綻反擊」 |\n| 不可觸發 | 持續傷害區、不可閃避攻擊（`Attack.Unavoidable` Tag，如全螢幕範圍） | |\n| 冷卻 | 完美閃避獎勵之間 **60 幀** | 避免連續觸發慢動作 |\n\n### 4.3 格擋（Block）— Templar 專屬（Blademaster 以閃避為主，另見 §9.2「劍意招架」）\n\n| 參數 | 值 | 說明 |\n|---|---|---|\n| 舉盾（Raise）幀數 | 6 幀進入有效格擋 | 這 6 幀內被擊中視為正常受擊 |\n| 持續格擋 | 按住期間有效，面向鏡頭方向，**正面 ±100° 錐形** | 背後 / 側後方攻擊不可格擋 |\n| 格擋傷害減免 | 80%（盾）/ 60%（無盾兵器自帶招架，M1 不含） | |\n| **格擋體力消耗** | 每次格擋受擊：`攻擊 Poise 傷害 × 1.2 + 基礎 5` | 例：Poise 傷害 20 → 29 體力 |\n| 持續格擋體力 | 不消耗；但格擋期間不回體力 | 回復暫停見 §7 |\n| 體力耗盡 | 被格擋時體力 ≤ 0 → **破防（Guard Break）**：進入 Stagger 60 幀，Aegis 值清零 | |\n| 格擋受擊硬直 | 輕擊：4 幀（可持續格擋）；重擊：10 幀；格擋後退 0.3 / 0.8 m | |\n| **完美格擋窗** | 舉盾後 **第 1–9 幀**（約 0.15 s）內被擊中，或放開再按的「重按」同樣有效 | |\n| 完美格擋獎勵 | 傷害 100% 減免；0 體力消耗；Aegis +攻擊值的 150%；敵人受 Poise 傷害 20；Templar 可立即進入「反擊窗」（**第 4 幀起 24 幀內**不須冷卻接反擊技） | |\n| 完美格擋失敗懲罰 | 連續「亂按」格擋：舉盾 → 放開 → 再舉盾的間隔 < 12 幀，則完美窗縮為 5 幀 | 防止無腦連點（Anti-mash） |\n| 不可格擋攻擊 | 標記 `Attack.Unblockable`（紅光、地面危險區、抓取）；僅可閃避 | 表現規範：**紅色光圈 + 音效提示** |\n| 可格擋但需完美 | `Attack.PerfectOnly`（黃光）：一般格擋依舊破防，僅完美格擋有效 | 精英的招牌技 |\n\n### 4.4 閃避 vs 格擋決策基準（設計意圖）\n\n| 攻擊類型 | 光效提示 | 正解 |\n|---|---|---|\n| 一般攻擊 | 無 | 閃避或格擋皆可 |\n| 重擊（可格擋，高 Poise） | 黃光 | 完美格擋或閃避 |\n| 不可格擋 | 紅光 | 閃避 |\n| 地面範圍 | 地面紅圈 | 離開範圍（i-frame 或位移） |\n\n---\n\n## 5. 受擊系統\n\n### 5.1 受擊分級\n\n| 等級 | 觸發 | 結果 |\n|---|---|---|\n| L0 無反應 | 霸體生效且 Poise 未歸零 | 受傷害，不中斷，僅白閃（hit flash） |\n| L1 輕受擊 Light | Poise 傷害 < 閾值，無霸體 | 輕硬直（見 §5.3） |\n| L2 重受擊 Heavy | Poise 傷害 ≥ 閾值 或 招式標記 Heavy | 重硬直 + 擊退 |\n| L3 擊飛 Launch | 招式標記 Launch | 浮空（見 §5.5） |\n| L4 擊倒 Knockdown | 招式標記 Knockdown / 浮空落地 | 倒地（見 §5.6） |\n| L5 破霸 Stagger | Poise 歸零 | 長硬直，可被追擊（見 §5.2） |\n\n### 5.2 霸體（Super Armor）與破霸值（Poise）模型\n\n**Poise 資料模型（每個 Actor 有 Poise 屬性）：**\n\n| 屬性 | 說明 | 初始建議值（玩家 / 雜兵 / 精英 / Boss） |\n|---|---|---|\n| `PoiseMax` | 破霸值上限 | 玩家 100（Templar 140）/ 30 / 150 / 400 |\n| `PoiseRegenDelay` | 受擊後多久開始回復 | 玩家 90 幀；怪物 120 幀 |\n| `PoiseRegenRate` | 回復速率（/秒） | 玩家 40；雜兵 10；精英 20；Boss 30 |\n| `ArmorLevel` | 霸體等級（0–3） | 0：無；1：輕霸體；2：中霸體；3：完全霸體（免疫硬直，仍受傷害） |\n| `PoiseDamage`（來源） | 每個攻擊的 Poise 傷害（見技能/普攻表） | |\n\n**霸體判定邏輯（Hit Resolution）：**\n\n```\nReceivePoiseDamage(d, hitLevel):\n  Poise -= d\n  if ArmorLevel == 3: result = L0          // 完全霸體：僅 Poise 累積，不硬直\n  elif ArmorLevel == 2: result = (hitLevel >= Launch) ? hitLevel : L0\n  elif ArmorLevel == 1: result = (hitLevel >= Heavy) ? hitLevel : L0\n  else: result = hitLevel\n  if Poise <= 0 and not InStaggerImmunity:\n      result = L5 Stagger; Poise = PoiseMax; StartStaggerImmunity(300 frames)\n```\n\n* **破霸硬直（Stagger）**：玩家 / 雜兵 60 幀；精英 90 幀；Boss 120 幀（僅 E3 可設定）。期間受傷 +20%（`StaggerDamageBonus`）。\n* **破霸後免疫期（Stagger Immunity）**：Stagger 結束後 **300 幀（5 s）**內不可再次被破霸（Poise 傷害仍累積但不觸發），防止精英被「破霸連鎖」。\n* **霸體覆蓋**：精英「攻擊起手後 → active 結束」ArmorLevel = 2；Boss ArmorLevel = 3 於特定招式；其餘時間 0。\n* **玩家霸體**：僅 Templar 技能 S3「不動如山」與 N4 提供 ArmorLevel = 1（M1）。玩家霸體不免疫擊飛 / 擊倒。\n* **霸體對撞**：雙方皆有霸體時，各自受傷害但不硬直，Poise 仍累積 → 先歸零者 Stagger。\n\n### 5.3 硬直時長表（60 fps）\n\n| 等級 | 受擊動畫 | 硬直（不可行動） | 可被「受身 / 緊急閃避」 | 擊退位移 | 備註 |\n|---|---|---|---|---|---|\n| L1 輕受擊 | 側頭 / 縮身 | **12 幀**（0.2 s） | 否 | 0.2 m | 含 hitstop 後計 |\n| L2 重受擊 | 後仰踉蹌 | **24 幀**（0.4 s） | 第 14 幀後可緊急閃避（耗體力 ×1.5） | 0.8 m | |\n| L3 擊飛 | 浮空（見 §5.5） | 至落地 | 落地前 `AirTech`（見 §5.7） | 水平 2.0 m | |\n| L4 擊倒 | 倒地 | 倒地 **40 幀** + 起身 **30 幀** | 倒地期間受身（見 §5.6） | 滑行 1.0 m | |\n| L5 破霸 | 蹲跪 | 玩家 60 / 雜兵 60 / 精英 90 / Boss 120 | 否 | 0.4 m | 期間傷害 +20% |\n| 格擋輕 | 盾牌震動 | 4 幀 | — | 0.3 m | 見 §4.3 |\n| 格擋重 | 盾牌後退 | 10 幀 | — | 0.8 m | |\n\n> **硬直縮減（Hitstun Decay）**：同一 combo 中，連續被同一對象命中時，每次受擊的硬直乘以 `0.9^n`（n = 已受擊次數，下限 0.5×）。與 §5.5 Juggle 保護配合，避免玩家 / 怪被「小技無限連」。\n\n### 5.4 擊退 / 命中反應方向\n\n* 受擊方向取「攻擊判定中心 → 受擊者」之水平向量，混合 30% 攻擊者面向向量（避免橫斬把敵人推向斜後方不合理方向）。\n* 動畫選擇：前 / 後 / 左 / 右 4 向 Hit 動畫（Chooser 選擇，見 §11）。\n\n### 5.5 擊飛 / 浮空 / Juggle 規則（防無限連）\n\n**浮空物理（Launch Profile）：**\n\n| 參數 | 值（普通擊飛） | 說明 |\n|---|---|---|\n| 初始垂直速度 | 650 cm/s（約 3.0 m 高） | 每招可覆寫 |\n| 初始水平速度 | 300 cm/s | |\n| 基礎重力 | 1.8× 標準重力（UE 預設 -980 → -1764 cm/s²） | 浮空時間 ≈ 0.75 s ≈ 45 幀 |\n| 落地判定 | 觸地 → 倒地（L4） | |\n\n**Juggle（空中連擊）規則：**\n\n| 規則 | 值 | 目的 |\n|---|---|---|\n| **Juggle Points（JP）** | 每次浮空起始 JP = 100；每次空中命中消耗 JP：輕 15 / 中 20 / 重 30 / 終結 40 | JP ≤ 0 則該浮空段不再受攻擊影響「上升」，改為直接下落（Spike） |\n| **重力遞增（Gravity Scaling）** | 每次空中被命中（hit n），重力倍率 `g_n = 1.8 × (1 + 0.15 × n)`，最大 3.0× | 連越多，落得越快 |\n| **垂直推力遞減** | 空中命中提供的垂直速度 `v_n = v_0 × 0.7^n`（下限 0） | 第 4 擊起幾乎無法再抬高 |\n| **最大浮空時間** | 120 幀（2.0 s）硬上限，到時強制下落 | 絕對保險 |\n| **最大空中命中數** | 8 | 超過則轉為擊倒（Knockdown） |\n| **同源重複限制** | 同一技能（SkillID）在同一浮空段內僅可有效命中 2 次 | 防止同一技能反覆黏住 |\n| **落地不是無敵** | 落地倒地後見 §5.6 | |\n| **再浮空保護（Re-launch Protection）** | 一個目標被「擊飛」後，**落地後起身 + 180 幀（3 s）**內，再次被擊飛，其初始垂直速度 ×0.5、JP ×0.5 | 防止「倒地→起身→立刻再擊飛」的循環 |\n| **怪物 Boss** | Boss 類（ArmorLevel 3）免疫擊飛，改為受 Poise 累積 | |\n\n### 5.6 倒地 / 追擊 / 受身\n\n| 階段 | 幀數 | 規則 |\n|---|---|---|\n| 倒地滑行 | 12 幀 | 不可行動，可被追擊（傷害 ×1.0，**倒地追擊傷害上限：僅可被命中 2 次**，每次 ×0.6） |\n| 倒地靜止 | 28 幀 | 同上；**同一倒地段最多接受 3 次追擊傷害（含滑行段）**，之後視為「倒地保護」，額外命中傷害 ×0.1 且不延長倒地 |\n| 起身 Getup | 30 幀 | **起身無敵：第 1–20 幀（0.33 s）**，防「起身即被秒」 |\n| **受身（Tech Roll）** | 落地前 6 幀至落地後 8 幀內輸入「閃避」 | 成功：跳過倒地，翻滾起身（總 24 幀，i-frame 第 1–12 幀），消耗體力 15；失敗無懲罰（正常倒地） |\n| **空中受身（Air Tech）** | 浮空期間、JP ≤ 50 時，輸入「閃避」 | 立即脫離浮空，滑翔落地（i-frame 10 幀）；每個浮空段僅能一次，冷卻 5 s（PvE 怪無此功能） |\n| 倒地追擊判定 | 追擊技能需標記 `CanHitDowned`，普通 AoE 對倒地者傷害 ×0.5 | |\n\n### 5.7 被動受身一覽\n\n| 情境 | 玩家輸入 | 結果 | 條件 |\n|---|---|---|---|\n| 重受擊 L2 後 14 幀 | 閃避 | 緊急閃避（體力 ×1.5） | 體力足夠 |\n| 浮空中 | 閃避 | Air Tech | JP ≤ 50，5 s CD |\n| 即將落地 / 剛落地 | 閃避 | Tech Roll | 見上 |\n| 倒地 | 無 | 起身無敵 20 幀 | |\n| Stagger | 無 | 無法脫離（設計意圖：失誤成本） | 玩家 Stagger 僅由精英破防造成 |\n\n### 5.8 玩家受傷與死亡（M1 簡化）\n\n* 玩家 HP 初始 1000，無死亡懲罰；Debug 可切「不死」。\n* 玩家受擊 hitstop 比攻擊方 hitstop 少 1 幀（見 §8）。\n* 每次受傷 1 秒內再受傷：**受傷無敵 12 幀**（僅 L1 後；避免多段瞬間秒殺，可在 Debug 關閉）。待討論 D6。\n\n---\n\n## 6. Hitbox / Hurtbox\n\n### 6.1 通道與資料\n\n| 物件 | 碰撞通道 | 形狀 | 說明 |\n|---|---|---|---|\n| 角色 Capsule（移動） | `Pawn` | Capsule | 僅用於移動，**不用於傷害判定** |\n| Hurtbox（受擊） | `Hurtbox`（Object Channel） | 多個 Capsule/Sphere 附於 Bone（Physics Asset 衍生，專用 `PA_Hurtbox`） | 由 USkeletalMeshComponent 的 PhysicsAsset 構成，僅 Query（無物理模擬） |\n| Hitbox（攻擊） | 無（以 Trace/Sweep 主動查詢） | 武器 Socket 之間的 sweep（見 6.2） | 不使用 Overlap 事件，避免 tick 順序與穿透問題 |\n| 世界遮擋 | `WorldStatic/Dynamic` | — | 判定 Trace 需檢查視線（防穿牆） |\n\n### 6.2 武器軌跡掃掠（Swept Hit）\n\n**目標**：高速揮砍不穿透、不依賴單幀 overlap。\n\n* 武器上定義 **2–3 個 Socket**（`Hit_Base`、`Hit_Mid`、`Hit_Tip`）；每個 Tick 以「**上一幀位置 → 本幀位置**」做 **SphereSweepMulti**（半徑 12 cm，隨武器 / 招式資料）。\n* 當一幀內 Tip 移動超過 40 cm 時，**子步細分（Substep）**：以每 20 cm 一個子步插值 Socket Transform，上限 4 子步。\n* 掃掠以 **動畫時間為準**（AnimNotifyState `HitWindow` 的 `NotifyTick`），**不用遊戲時間**，確保 hitstop / 時間縮放下判定與動畫一致。\n* 每個 `HitWindow` 對應一組 `HitDef`（資料資產），包含：傷害係數、Poise 傷害、擊中等級、擊退向量、hitstop 幀、擊中特效 ID、**HitGroupId**、`MaxHitsPerTarget`、`RehitInterval`。\n\n### 6.3 多段命中去重\n\n| 機制 | 規則 |\n|---|---|\n| HitGroupId | 同一 `HitGroupId` 在同一次攻擊實例（`AttackInstanceId`）中，每個目標只命中一次 |\n| 多段技能 | 每「段」用不同 `HitGroupId`；或同一 Group 設定 `RehitInterval`（幀）允許對同一目標重複命中（如旋風斬每 12 幀） |\n| 範圍技 | `MaxHitsPerTarget` = 1（預設）；`MaxTargets` 上限 8（M1），超過則依距離優先 |\n| 多個 hitbox 同時命中同一目標 | 同幀內取 **最先接觸（Time of Impact 最小）**，其餘忽略 |\n| 去重資料 | `TMap<TWeakObjectPtr<AActor>, int32 LastHitFrame>`，位於 `UAttackInstance` 物件內，Window 結束時銷毀 |\n\n### 6.4 部位 Hurtbox（為獵魔斥候弱點機制預留）\n\nM1 敵人（至少 E3 木樁）**必須** 支援下表部位，即使 M1 兩職業不使用弱點。\n\n| 部位 | Bone | 傷害倍率 | Poise 倍率 | 說明 |\n|---|---|---|---|---|\n| 頭 Head | head | 1.5× | 1.0× | 弱點 |\n| 軀幹 Torso | spine_02 | 1.0× | 1.0× | |\n| 四肢 Limbs | upperarm/thigh | 0.8× | 1.0× | |\n| 弱點核心 Core（Boss 專屬） | 自定義 Socket | 2.0× | 1.5× | 平時隱藏，破霸/特定狀態時暴露 |\n| 盾 / 護甲部位 | 自定義 | 0.3× | 0.5× | 玩家 Templar 盾牌格擋時視為格擋判定，而非 hurtbox |\n\n* **實作**：每個 Hurtbox Shape 帶 `FName PartTag`（透過 PhysicsAsset 的 BodySetup 名稱映射），Hit 結果回傳 `FHitResult.BoneName` → `PartTag` → 倍率表（DataTable）。\n* **多 hurtbox 同時被 sweep 命中**：取傷害倍率最高者？**否**，取「最先接觸」（見 6.3）。\n* 弱點命中時 `HitDef` 中 `bWeakpointFeedback = true`（M1 僅音效 + 特寫火花）。\n\n### 6.5 遠程彈道（M1 僅 E3 / 技能飛劍使用，系統需完整）\n\n| 參數 | 建議值 | 說明 |\n|---|---|---|\n| 實作 | `AProjectileBase`（非 UE `AProjectile` 物理，自行 Tick 的 kinematic） | 伺服器權威；客戶端預測視覺 |\n| 初速 | 普通：4000 cm/s；Boss 範圍彈：1800 cm/s | |\n| 飛行時間 | 取決於距離；最大生命 3.0 s | |\n| 下墜 | 重力縮放 `GravityScale`：弩矢 0.15 / 飛劍 0 / 法術彈 0.3 | 拋物線 |\n| 預瞄（Lead） | 準星 AimPoint 為終點，弧線方向 = 解 `AimPoint` 的彈道解（簡化：先沿視線發射，重力造成下墜；M1 不做自動補償） | 保持「無鎖定」 |\n| 判定 | 以 SphereSweep（半徑 15 cm）沿每 Tick 位移，**不用 Overlap** | 避免高速穿透 |\n| 穿透係數 | `PierceCount`（可穿透敵數，預設 0）、`PierceDamageFalloff`（每穿一隻 ×0.7）、對牆壁 `PierceWorld = false` | |\n| 彈道去重 | 每個目標只命中一次（同 HitGroup 規則） | |\n| 可被攔截 | 玩家格擋（Templar）可擋；標記 `Projectile.Reflectable` 的可被完美格擋反彈 | 預留 |\n| 同步 | 生成事件走 RPC（見 §10），客戶端用起點/速度/種子本地積分 | |\n\n### 6.6 判定視覺化（Debug 必備）\n\n* `CVar combat.debug.hitbox 1`：繪製 sweep 球 / hurtbox（綠＝hurtbox、紅＝active hitbox、黃＝去重被忽略）。\n* `CVar combat.debug.frames 1`：HUD 顯示目前動作 S/A/R 階段與幀號。\n* `CVar combat.debug.timescale`：慢動作調試（0.1–1.0）。\n* 命中日誌以 CSV 輸出：`frame, attacker, defender, hitDef, part, dmg, poiseDmg, result`。\n\n---\n\n## 7. 資源系統\n\n### 7.1 Stamina（體力）\n\n| 參數 | Blademaster | Templar | 說明 |\n|---|---|---|---|\n| 上限 | 100 | 120 | |\n| 基礎回復 | 25 /s | 20 /s | 回復延遲後才開始 |\n| 回復延遲 | 消耗後 **40 幀（0.67 s）** | 50 幀 | |\n| 回復倍率 | 站立 ×1.0；行走 ×0.8；衝刺 / 格擋 / 攻擊中 ×0 | | 格擋中回復暫停 |\n| 低體力懲罰 | 體力 = 0：進入「力竭」**90 幀**（無法衝刺、閃避、格擋，攻擊速度 -10%） | | 力竭結束後體力回復到 25 |\n| 力竭保護 | 閃避可在體力 ≥ 1 時發動（容許透支至 0，不扣至負） | | 減少「差一點」的挫折感 |\n\n**消耗表：**\n\n| 動作 | 消耗（Blademaster / Templar） | 備註 |\n|---|---|---|\n| 閃避 | 20 / 28 | 連續（<1 s）×1.25 |\n| 衝刺 | 8 /s（持續） | 啟動時 5 |\n| 普攻 N1–N4 | 0 | 普攻不耗體力，避免挫折 |\n| 格擋受擊 | 見 §4.3 公式 | Templar |\n| 完美格擋 | 0 | |\n| 緊急閃避（受擊中） | ×1.5 | |\n| Tech Roll | 15 | |\n| 完美閃避獎勵 | +15 | |\n\n### 7.2 MP / Qi（技能資源）\n\nM1 兩職業共用「資源槽」架構（`ResourceBar`），但命名與回復邏輯各異：\n\n| 參數 | Blademaster（Qi 內勁） | Templar（MP → 稱「信仰 Faith」，M1 沿用 MP 欄） |\n|---|---|---|\n| 上限 | 100 | 100 |\n| 自然回復 | 3 /s（戰鬥外 8 /s） | 3 /s（戰鬥外 8 /s） |\n| 戰鬥脫離判定 | 5 s 無傷害往來 | 同 |\n| 命中回復 | 普攻命中 +4 / 段（N4 +8） | 普攻命中 +3；**受擊 / 格擋回復 +攻擊 Poise × 0.3** |\n| 完美閃避 / 格擋 | +10 | +12 |\n| 消耗 | 技能 15–40（見 §9） | 技能 15–45 |\n| 不足行為 | 技能鍵閃爍提示，不施放（不消耗緩衝） | 同 |\n\n> 設計意圖：**普攻生 Qi、技能耗 Qi** 形成「打-放-打」循環，避免技能亂放；Templar 因防守反擊額外由「被打」生資源。\n\n### 7.3 HP（M1 簡化）\n\n玩家 1000（Templar 1300）；回復：無自然回復（M1 以 Debug 按鍵補血）。傷害公式 M1：`Dmg = BaseAtk × SkillMult × PartMult × (1 + ComboBonus) × RandomSpread(0.95~1.05)`；不套用防禦（M2 後接鍛造數值）。\n\n---\n\n## 8. 打擊感（Game Feel）\n\n### 8.1 Hitstop（頓幀）\n\nHitstop = 命中瞬間，**雙方** 動畫與位移暫停 N 幀（透過 `CustomTimeDilation` 設 0.0 或 0.02，非全局 `GlobalTimeDilation`，以免影響其他玩家，多人時尤其重要）。\n\n| 命中等級 | 攻擊方 hitstop | 受擊方 hitstop | 備註 |\n|---|---|---|---|\n| 輕擊（N1–N2） | 3 f | 4 f | 受擊方多 1 幀，增加「肉感」 |\n| 中擊（N3、輕技能） | 4 f | 5 f | |\n| 重擊（N4、重技能） | 7–9 f | 8–10 f | |\n| 終結 / 大招 | 10–12 f | 12–14 f | 可附時間慢動作 0.3×、12 幀 |\n| 格擋（輕） | 3 f | 3 f | |\n| 完美格擋 / 完美閃避 | 8 f | — | 另加畫面效果 |\n| 擊殺 | 12 f | — | 小怪 6 f |\n| 打在霸體上 | 攻擊方 2 f | 受擊方 0 f | **無硬直不頓幀太多**，避免打霸體時手感卡頓 |\n\n* **Hitstop 期間可緩衝輸入**；結束後立即讀取。\n* **Hitstop 期間 hitbox 不推進**（不重複判定），且 `HitWindow` 計時暫停（動畫暫停即自然成立）。\n* **多目標命中**：以最重 hitstop 取代，不累加，上限 14 f。\n* 玩家受擊：hitstop 同上，但玩家受擊 hitstop 可由選項縮減。\n\n### 8.2 鏡頭震動（Camera Shake）\n\n| 事件 | 振幅（位置 / 旋轉） | 時長 | 頻率 | 備註 |\n|---|---|---|---|---|\n| 輕擊命中 | 0.4 cm / 0.1° | 6 f | 25 Hz | 方向 = 攻擊方向 |\n| 中擊 | 0.8 cm / 0.25° | 8 f | 22 Hz | |\n| 重擊 | 1.8 cm / 0.5° | 12 f | 20 Hz | 附 FOV +2° 衝擊（6 f 回彈） |\n| 終結 / 大招 | 3.0 cm / 0.9° | 18 f | 18 Hz | 附 radial blur 輕微（可關） |\n| 玩家受擊 | 1.2 cm / 0.4° | 10 f | 24 Hz | 受重擊 + 邊緣紅暈 |\n| 完美格擋 / 閃避 | 無震動 | — | — | 以 FOV 收縮 -3°（6 f）+ 色差 |\n\n### 8.3 時序（命中事件 Timeline，以命中幀 = T0）\n\n| 時間 | 事件 |\n|---|---|\n| T0 | 伺服器 / 客戶端判定命中（客戶端預測，見 §10）；播放命中音效第一層（金屬撞擊 / 肉感低頻）；觸發 Niagara 命中火花 |\n| T0 | 開始 hitstop（雙方） |\n| T0 | 受擊方白閃（material parameter `HitFlash`，3 f） |\n| T0+0 | 手把震動（見 8.5） |\n| T0+hitstop | 鏡頭震動開始；動畫恢復；受擊動畫 / 擊退位移開始 |\n| T0+2 f | 傷害數字彈出（輕：白；弱點：黃；暴擊：橘；玩家受傷：紅） |\n| T0+4 f | 第二層音效（血 / 盔甲 / 魔法尾音） |\n| T0+6 f | 地面殘留 decal / 屍體粒子（可選） |\n\n### 8.4 命中回饋分級\n\n| 級別 | 條件 | 音效 | 特效 | 鏡頭 | 手把 |\n|---|---|---|---|---|---|\n| F1 輕 | 輕擊、非弱點 | 輕打擊 | 小火花 | 輕震 | 弱 80ms |\n| F2 中 | 中擊、技能 | 中打擊＋揮鞭尾音 | 中火花＋刀光殘影 | 中震 | 中 120ms |\n| F3 重 | 重擊、浮空起手、破霸 | 重打擊＋低頻衝擊 | 大火花＋衝擊波環 | 重震＋FOV | 強 200ms |\n| F4 終結 | 終結 / 大招 / 擊殺 | 爆擊音＋殘響 | 全螢幕閃 + 時間緩 | 大震 | 強 300ms，漸弱 |\n| FW 弱點 | 命中弱點部位 | 清脆「叮」疊層 | 黃色火花 | 同級別 | 同級別 |\n| FB 格擋 | 擋下 | 金屬碰撞 | 盾牌火花 | 小震 | 弱 |\n| FP 完美 | 完美格擋 / 閃避 | 鐘聲式清響 | 光環 + 色差 | FOV 收縮 | 雙脈衝 |\n| FA 打在霸體 | 敵人霸體 | 悶響（較沉） | 無硬直，小火花 | 無 | 弱 |\n\n### 8.5 其他回饋\n\n* **手把震動（Haptics）**：使用 Force Feedback Effect（高頻+低頻雙馬達），強度表見上表；可在設定中縮放 0–100%。\n* **武器拖尾（Trail）**：Niagara Ribbon 附加於武器 Socket，只在 `HitWindow` 前 2 幀至結束後 4 幀顯示。\n* **動畫速度**：命中後攻擊方可輕微「加速收招」（R 階段速度 ×1.1，持續 6 幀）以抵銷 hitstop 造成的鈍感（可在 Debug 關閉比較）。\n* **音訊**：命中音效須在 **客戶端預測命中** 時立即播放（不等伺服器），避免延遲感（見 §10.3）。\n\n---\n\n## 9. 兩個 M1 職業核心機制與技能\n\n### 9.1 聖堂騎士 Templar — 神聖防衛 Aegis\n\n**機制摘要（GDD §4）**：受擊累積格擋值，釋放高爆發光屬性反擊。\n\n**Aegis 值（資源）：**\n\n| 參數 | 值 | 說明 |\n|---|---|---|\n| 上限 | 100 | 分三段：0–33（I）、34–66（II）、67–100（III） |\n| 累積來源 | 格擋：`被格擋傷害 × 0.15`（上限單次 15）；完美格擋：`被擋傷害 × 0.3`（上限單次 30）；非格擋受擊：`傷害 × 0.05`（上限單次 5） | 防守表現更好 → 累積更快 |\n| 衰減 | 脫戰（5 s 無受擊 / 格擋）後 -5 /s | |\n| 釋放 | 反擊技「聖裁 Judgment Counter」耗 Aegis ≥ 33，**傷害倍率隨段數**：I = ×1.5 / II = ×2.5 / III = ×4.0，並附光屬性 AoE | |\n| 超載 | Aegis 100 時保持：下一次反擊自動為 III 段，且攻擊附帶 ArmorLevel 2 | |\n| 設計意圖 | 逼迫玩家「站在敵人面前格擋」，高風險高報酬；與 Qi/Faith 資源獨立 | |\n| 平衡待驗證 | 防止玩家刻意「挨打堆值」：非格擋受擊貢獻極低 | |\n\n**Templar 技能清單（共 6 個）：**\n\n| # | 技能 | 鍵位 | S / A / R（幀） | 消耗 | CD | 傷害 | Poise | 特性 / 備註 |\n|---|---|---|---|---|---|---|---|---|\n| T1 | 盾衝 Shield Rush | Q | 12 / 18 / 16 | 15 MP | 6 s | 90% | 24 | 前衝 4 m（Motion Warp）；衝刺中 ArmorLevel 1；命中 L2 擊退；可接 N1 |\n| T2 | 光輝重劈 Radiant Cleave | E | 22 / 5 / 32 | 25 MP | 8 s | 220% | 40 | 擊倒；前 15 幀可被閃避取消（耗 S 全部 → 作廢 MP 退 50%） |\n| T3 | 不動如山 Bulwark | R | 8 / 90 / 12 | 20 MP | 14 s | — | — | 90 幀（1.5 s）ArmorLevel 1（受傷 -40%），格擋體力消耗 -50%；可移動 ×0.4 |\n| T4 | 聖裁反擊 Judgment Counter | F（格擋中） | 6 / 6 / 24 | 消耗 Aegis ≥33 | 3 s | 150/250/400% | 60 | 僅格擋 / 完美格擋後 24 幀窗內可用；光屬性 AoE 半徑 3 m；III 段命中浮空 |\n| T5 | 審判之錘 Hammer of Faith（遠程光波） | Shift+Q | 24 / 4 / 28 | 30 MP | 10 s | 140% | 28 | 發射光波（投射物，速度 2400 cm/s，穿透 1，射程 18 m）；用以驗證彈道 |\n| T6 | 神恩衝鋒 Divine Charge（大招） | Shift+E | 30 / 24 / 40 | 45 MP + 50 Aegis（選擇性） | 30 s | 350% | 80 | 前衝 8 m，沿途撞飛，終點光爆；全程 ArmorLevel 2；中途不可取消；Aegis ≥50 時額外 +30% 傷害 |\n\n**Templar 取消關係（`CancelInto`）：**\n\n| 技能 | 可接 |\n|---|---|\n| N4 | T1（36–48 幀）、T2（36–48） |\n| T1 | N1（A 最後 6 幀起）、T2（R 前 8 幀） |\n| T2 | 無（高風險）；R 的後 50% 可閃避 |\n| T3 | T4（任何時機，若有 Aegis）、移動 |\n| 格擋 | T4（有 Aegis 時）、閃避 |\n| T4 | 閃避（R 後 8 幀） |\n\n### 9.2 游俠劍客 Blademaster — 劍意 Sword Intent\n\n**機制摘要（GDD §4）**：精準時機出招疊加劍氣，解鎖浮空飛劍終結技。\n\n**劍意（Sword Intent）層數模型：**\n\n| 參數 | 值 | 說明 |\n|---|---|---|\n| 層數上限 | 5 層 | |\n| 疊加條件（「精準時機」） | 1) **精準取消**：在 CW 窗口最後 **6 幀** 內接下一段 / 技能（「節奏點」）→ +1；2) **完美閃避** → +1；3) **精準命中**：技能於 active 前 3 幀內（劍尖）命中 → +1（僅技能 B3、B5）；4) 弱點部位（頭）命中 → 0（不計） | 單個動作內最多 +1；整個連段內 +2 上限，防「一次連段滿層」（可調） |\n| 掉層 | 5 s 無「精準時機」→ -1 /2 s；受擊 -2 層（輕）/ 全清（重擊） | 避免平均主義，獎勵穩定節奏 |\n| 增益 | 每層：攻擊速度 +2%、傷害 +3%；劍氣可視化（劍刃光效依層數增強） | 滿層：+10% 攻速 / +15% 傷害 |\n| **解鎖浮空飛劍終結技** | 劍意 ≥ 4 層：飛劍終結「萬劍歸宗」可用（B6） | 使用後全部清零 |\n| 精準窗 UI | 在取消窗最後 6 幀顯示小光環（輔助學習），可設定關閉 | 用於「節奏遊戲化」 |\n| 設計意圖 | 獎勵「準點」而不是「猛點」；初學者即使不準也能玩，只是無加成 | |\n\n**Blademaster 技能清單（共 6 個）：**\n\n| # | 技能 | 鍵位 | S / A / R（幀） | 消耗 | CD | 傷害 | Poise | 特性 / 備註 |\n|---|---|---|---|---|---|---|---|---|\n| B1 | 瞬影突進 Shadow Dash | Q | 6 / 10 / 14 | 15 Qi | 5 s | 80% | 12 | 前突 6 m（A 內位移，穿越敵人，i-frame 第 3–10 幀）；結束後可立即接 N1（跳過 S 4 幀）；精準時機：A 最後 4 幀接普攻 |\n| B2 | 升龍劍 Rising Slash | E | 10 / 4 / 22 | 20 Qi | 7 s | 150% | 20 | **擊飛起手（L3）**，垂直 650 cm/s；可接 N3 / B4（空中）；可閃避取消 R 前 8 幀 |\n| B3 | 迴旋斬 Whirlwind | R | 12 / 36（3 段，每 12 f 一段） / 20 | 25 Qi | 9 s | 3×60% | 8/段 | 範圍 3.5 m；`RehitInterval` = 12；A 期間可移動 ×0.5；精準時機：第一段前 3 幀 |\n| B4 | 凌空連刺 Aerial Thrust | F | 8 / 3 / 18 | 20 Qi | 6 s | 130% | 14 | 僅對浮空目標有效：可再次抬升（受 Juggle 規則），自身懸空 30 幀；對地面目標為普通突刺 |\n| B5 | 破影一閃 Phantom Cut | 右鍵（RMB） | 14 / 4 / 26 | 25 Qi | 10 s | 200% | 30 | 瞬移斬：位移 5 m 後出刀（i-frame 第 5–14 幀）；命中背後 +20%；精準時機：A 前 3 幀命中劍尖範圍 |\n| B6 | 萬劍歸宗 Sword Convergence（終結） | Shift+Q / X | 28 / 40 / 36 | 劍意 ≥4（耗盡）＋ 40 Qi | 20 s | 400%（4 層）/ 500%（5 層） | 70 | 召喚浮空飛劍（4–6 柄）依準星落點收束；判定範圍 5 m，光柱終結；A 期間為 ArmorLevel 1；命中浮空目標 +25% |\n\n**Blademaster 取消關係：**\n\n| 技能 | 可接 |\n|---|---|\n| N1–N3 | 技能（CW 內） |\n| N4 | B1（28–38 幀）、B2（28–38） |\n| B1 | N1（A 後 4 幀）、B2、B5（R 前 6 幀） |\n| B2 | N3（命中後 12–20 幀）、B4 |\n| B3 | 閃避（R 全段）；其他 R 後 10 幀 |\n| B4 | N 系列（落地後） |\n| B5 | 閃避（R 全段） |\n| B6 | 無（A 內不可取消；R 後 50% 可閃避） |\n\n### 9.3 核心機制驗證重點\n\n| 機制 | 要驗證的問題 | 量測方式 |\n|---|---|---|\n| Aegis | 玩家是否傾向「站樁格擋」而忽略閃避？反擊窗是否直覺？ | 測試問卷 Q8、Q9；Debug CSV 格擋 / 閃避比 |\n| Sword Intent | 精準時機窗（6 幀）是否過嚴 / 過鬆？層數維持是否輕鬆？ | 命中日誌：精準率；問卷 Q10 |\n| 兩職業比較 | 手感差異是否明顯、上手門檻 | 全問卷 + 觀察 |\n\n---\n\n## 10. 網路與權威伺服器\n\n> M1 單人不實測多人，但**架構與資料結構須與 GDD §9 的 Dedicated Server + SpatialOS 對齊**，避免 M3 之後重寫。\n\n### 10.1 權威劃分\n\n| 項目 | 客戶端（Autonomous Proxy） | 伺服器（Authority） |\n|---|---|---|\n| 輸入 | 收集、緩衝、執行本地預測 | 驗證輸入（頻率、冷卻、資源） |\n| 移動 | CMC 預測 + 重播（UE CharacterMovementComponent Prediction） | 權威位置；偏差 > 閾值（30 cm）則校正 |\n| 技能啟動 | **預測啟動** Ability（GAS Prediction Key），立即播放動畫 / 特效 | 驗證 CD / 資源 / 狀態，決定接受或回滾 |\n| 命中判定 | 可「預測命中」僅供**音效 / 特效 / 準星回饋**；傷害不由客戶端決定 | **傷害、狀態、Poise 結算皆在伺服器** |\n| 傷害數字 | 先顯示預測（灰），伺服器確認後轉實色 | |\n| 資源（Stamina / MP） | 預測扣除，伺服器校正（Attribute 複製） | 權威 |\n| 狀態（硬直、浮空） | 客戶端以 GE（GameplayEffect）複製 + 動畫 Montage 同步 | 權威 |\n\n### 10.2 客戶端預測規則\n\n* **預測內容**：攻擊動作起手動畫、閃避位移（含 i-frame 於本地呈現）、格擋舉盾。\n* **回滾**：伺服器拒絕時，客戶端中止 Montage（blend out 4 f），並以 CMC 校正位置。拒絕原因：CD、資源不足、被 CC、Tag 衝突。\n* **目標 RTT 容忍**：RTT ≤ 100 ms 為良好體驗；100–200 ms 可玩（僅 PvE）；> 200 ms 提示網路不佳。\n* **i-frame 的客戶端 / 伺服器一致性**：i-frame 由**伺服器**依其收到閃避請求的「伺服器幀」判定，並**加上一個 RTT 補償**：伺服器依客戶端回報的 `ClientActionTimestamp`（經夾限於 ≤ 150 ms）把閃避起點回推（rewind）。夾限避免作弊者宣稱超長補償。\n\n### 10.3 延遲補償（Lag Compensation / Rewind）\n\n| 場景 | 方案 | 說明 |\n|---|---|---|\n| PvE 對怪（M1/M3 主體） | **伺服器簡化判定，不 rewind 怪物位置** | 玩家攻擊以「**玩家客戶端看到的怪物位置**」為準？→ 否（成本高）。採**寬鬆容錯**：Hitbox 半徑增大 10%（PvE）+ 怪物攻擊的 telegraph 時間補償玩家 RTT：攻擊預警（S 幀）內，延遲高時玩家有更多時間反應（伺服器對玩家閃避判定採「寬鬆邊緣 ≤ 6 幀」） |\n| PvE 玩家受擊 | 伺服器權威，**玩家的閃避 i-frame 以客戶端時間戳回推（≤ 150 ms）** | 「在我螢幕上我已經閃開了」問題的主要補償 |\n| PvP（嚴格判定，M3+ 範圍） | **伺服器 Rewind**：保留各角色過去 **12 幀（200 ms）** 的 hurtbox 快照（環形緩衝）；攻擊判定時依攻擊者客戶端 `RenderTime`（夾限 ≤ 150 ms）回溯目標 hurtbox 位置，再執行 sweep | 成本：每 Tick 每角色記錄 ≈ 10 個膠囊體 Transform（約 400 B） |\n| PvP 防作弊 | 驗證客戶端攻擊起手時間戳合理性、攻擊頻率 ≤ 動畫幀數允許、位置與伺服器偏差 | |\n| 防「濫用延遲」 | 超過 150 ms 部分不補償，高延遲玩家需自行預判；顯示連線品質 | |\n\n### 10.4 MMO 多人情境成本取捨\n\n| 面向 | 取捨 |\n|---|---|\n| 伺服器 Tick | 戰鬥角色 30 Hz 逻辑 tick（hitbox sweep 在 30 Hz 下以兩個 60fps 幀子步補償；M3 評估是否 60Hz） |\n| Hitbox 數量 | 每個 `HitWindow` 同時最多 3 條 sweep；單機器人 Tick 預算：每玩家攻擊判定 ≤ 0.05 ms |\n| 怪物判定簡化 | **雜兵 / 小怪**：伺服器使用單一 Capsule + 距離 / 角度扇形判定（無骨骼 hurtbox）；**精英 / Boss**：完整 hurtbox（含部位） |\n| 玩家對玩家 | 完整 hurtbox（至少頭 / 軀幹 / 腿三段）、Rewind |\n| 遠距離 LOD | > 40 m 的角色停用骨骼 hurtbox 與 Trail、只複製狀態 Tag；動畫以 URO（Update Rate Optimization）降頻 |\n| 同螢幕上限 | 單螢幕「完整戰鬥動畫角色」上限 40，其餘降頻（M3 驗證） |\n| 頻寬 | 技能啟動 RPC（Ability ID 2B + PredictionKey 4B + AimPoint 6B 量化）；命中結果以 GE / Attribute 複製；Hit 事件以 **Unreliable Multicast** 播放特效（不影響狀態） |\n| Hitstop 同步 | **僅區域（Per-Actor）CustomTimeDilation**，不做全局；多人時只影響攻防雙方與其觀戰者呈現 |\n| 完美閃避慢動作 | 僅**本地視覺**（客戶端相機 / 本機 Actor 動畫速率），不影響伺服器模擬 |\n| 空間分區（SpatialOS） | 戰鬥關聯 Actor 的跨分區戰鬥（邊界 5 m 緩衝）需保證同一戰鬥的 Authority 不頻繁切換：戰鬥中鎖定 Authority 至戰鬥結束（M3 設計） |\n\n---\n\n## 11. UE5 實作映射\n\n### 11.1 技術選型總表\n\n> 引擎版本：**UE 5.8**（ADR-0007）。\n\n| 項目 | 是否採用 | 說明 |\n|---|---|---|\n| **GAS（Gameplay Ability System）** | **採用（核心）** | 技能 / 閃避 / 格擋 / 受擊皆為 GameplayAbility；Attribute（HP / Stamina / MP / Poise / Aegis / Intent）；GameplayEffect 處理狀態；內建預測與複製，符合 §10 |\n| **AnimNotifyState 判定窗** | **採用** | `ANS_HitWindow`、`ANS_CancelWindow`、`ANS_IFrame`、`ANS_SuperArmor`、`ANS_PerfectWindow`、`ANS_MotionWarp`；動畫為判定窗唯一事實來源（Single Source of Truth），避免資料與動畫不同步 |\n| **Motion Warping** | **採用** | 近戰起手面向 / 位移吸附至 AimPoint 或軟吸附目標；閃避避牆；`WarpTarget` 由 GA 在起手時設定 |\n| **Chooser Table / PoseSearch（Motion Matching）** | **M1：Chooser 採用；Motion Matching 不採用於戰鬥動作** | 戰鬥動作（攻擊 / 技能）為**手 K 動畫 + Montage**，因幀精度要求高，Motion Matching 會破壞幀資料。**Chooser** 用於「受擊動畫選擇（方向 / 等級）、閃避方向選擇、格擋 Hit 反應」。**Motion Matching 僅考慮用於「非戰鬥移動 locomotion」**，M1 可先用 Blend Space（待討論 D7） |\n| **Montage** | 採用 | 攻擊、技能、閃避、受擊皆為 Montage，Section 對應段落；Root Motion 設定見下 |\n| **Root Motion** | 部分 | 重攻擊 / 閃避使用 Root Motion（網路預測需 `RootMotionSource`）；輕攻擊使用 Motion Warping 取代 |\n| **Enhanced Input** | 採用 | 見 §2.3 |\n| **Niagara / Camera Shake / Force Feedback** | 採用 | 見 §8；特效以 GameplayCue 觸發（`GC.Hit.Light` 等），自動處理網路與預測 |\n| **Mover 2.0** | 不採用（M1） | 若 CMC 預測支援 Root Motion + 閃避滿足需求，M1 沿用 CMC；Mover 列為 M3 評估（5.8 已改善 Montage／Root Motion 與軌跡預測，ADR-0007） |\n| **Iris（新複製系統）** | M1 不採用 | 5.8 起為 Production-Ready，且 SpatialOS 已停止支援；D9 改為評估 Iris 是否作為預設複製系統（ADR-0007） |\n| **Common UI** | 採用（HUD） | |\n\n### 11.2 Gameplay Tags（節錄）\n\n```\nState.Idle / State.Move / State.Attack.* / State.Skill.* / State.Dodge / State.Block /\nState.Hit.Light / State.Hit.Heavy / State.Hit.Airborne / State.Hit.Down / State.Hit.Stagger / State.Getup / State.Dead\nStatus.IFrame / Status.SuperArmor.L1..L3 / Status.PerfectDodgeWindow / Status.PerfectBlockWindow / Status.CounterWindow\nAttack.Light / Attack.Heavy / Attack.Launch / Attack.Knockdown / Attack.Unblockable / Attack.PerfectOnly / Attack.Unavoidable\nCancel.Normal / Cancel.Skill / Cancel.Dodge / Cancel.Block\nInput.Attack / Input.Skill.1..4 / Input.Dodge / Input.Block / Input.Sprint / Input.Ultimate\nCue.Hit.F1..F4 / Cue.Block / Cue.PerfectDodge / Cue.PerfectBlock\nData.Part.Head / Data.Part.Torso / Data.Part.Limb / Data.Part.Core\n```\n\n### 11.3 建議的模組與 C++ 類別\n\n模組（Build.cs）：\n\n| 模組 | 說明 |\n|---|---|\n| `ContinentsCombat`（Runtime） | 戰鬥核心：能力、判定、受擊、資源；不依賴 UI / 特定職業 |\n| `ContinentsCombatEditor`（Editor） | 自訂 AnimNotify 預覽、判定窗編輯工具、幀表驗證器 |\n| `ContinentsClasses`（Runtime） | 職業專屬：Templar、Blademaster Ability 與 Attribute |\n| `ContinentsCombatTests`（Test） | Automation Test / Functional Test：幀數測試、取消矩陣測試 |\n\n核心類別：\n\n| 類別 | 繼承 | 職責 |\n|---|---|---|\n| `UCombatAbilitySystemComponent` | `UAbilitySystemComponent` | 輸入緩衝、取消窗查詢、狀態 Tag 管理 |\n| `UCombatAttributeSet` | `UAttributeSet` | HP、Stamina、MP/Qi、Poise、PoiseMax、ArmorLevel |\n| `UAegisAttributeSet` / `USwordIntentAttributeSet` | `UAttributeSet` | 職業資源 |\n| `UCombatGameplayAbility` | `UGameplayAbility` | 基底：Montage 播放、CancelInto 資料、消耗、CD、預測 |\n| `UGA_MeleeCombo` | `UCombatGameplayAbility` | 普攻連段（Section 驅動）、輸入緩衝 |\n| `UGA_Dodge` / `UGA_Block` / `UGA_Skill_*` | 同上 | 各動作 |\n| `UGA_HitReaction` | 同上 | 被動：由 GE 觸發受擊狀態，處理 hitstun / launch / knockdown |\n| `UAbilityTask_WaitHitWindow` | `UAbilityTask` | 監聽 `ANS_HitWindow` 開關，驅動 sweep |\n| `UAbilityTask_WaitCancelWindow` | `UAbilityTask` | 監聽取消窗，處理緩衝輸入 |\n| `UANS_HitWindow` | `UAnimNotifyState` | 判定窗；參數：`HitDefId`、Socket 列表、HitGroupId |\n| `UANS_CancelWindow` / `UANS_IFrame` / `UANS_SuperArmor` / `UANS_PerfectWindow` | `UAnimNotifyState` | 取消窗、無敵、霸體、完美窗 |\n| `UANS_MotionWarpCombat` | `UAnimNotifyState_MotionWarping` 擴充 | 設定 AimPoint / 軟吸附 |\n| `UMeleeTraceComponent` | `UActorComponent` | 掃掠判定、子步、去重 |\n| `UHurtboxComponent` | `UActorComponent` | 部位 hurtbox 映射、PartTag 查詢、Rewind 快照（PvP） |\n| `UHitResolver`（Subsystem：`UCombatResolutionSubsystem`） | `UWorldSubsystem` | 命中結算：霸體 / Poise / 傷害 / 狀態 / Juggle / hitstop |\n| `UJuggleStateComponent` | `UActorComponent` | JP、重力遞增、空中命中計數、保護計時 |\n| `UHitstopComponent` | `UActorComponent` | Per-Actor `CustomTimeDilation` 管理與優先級 |\n| `UAimComponent` | `UActorComponent` | 準星射線、AimPoint、軟吸附 |\n| `ACombatCameraManager` / `UCombatCameraComponent` | `APlayerCameraManager` / `UCameraComponent` | 鏡頭參數、震動、FOV 動態 |\n| `AProjectileBase` | `AActor` | 彈道 |\n| `UCombatDataAsset` 系列 | `UPrimaryDataAsset` | `HitDef`、`LaunchProfile`、`ComboDef`、`ClassCombatConfig`（所有數值外部化） |\n| `UCombatDebugSubsystem` | `UGameInstanceSubsystem` | 判定視覺化、幀 HUD、CSV 輸出 |\n| `UCombatKpiRecorder` | `UActorComponent` | 輸入時間戳 → 動作首幀時間差，供 §12 KPI |\n\n### 11.4 資料驅動\n\n* 所有表（本文檔的數值表）以 **DataTable / DataAsset** 實作，並提供 CSV 匯入 / 匯出，便於 Opus / 策劃迭代；`ContinentsCombatEditor` 提供「幀表驗證器」：檢查動畫資產的 Notify 幀與資料表是否一致（容差 0 幀）。\n* **動畫為判定窗之唯一事實**：資料表中的 S/A/R 由工具從動畫 Notify 讀取（自動生成），人工僅可寫「期望值」並由驗證器比對。\n\n### 11.5 效能預算（M1）\n\n| 項目 | 預算 |\n|---|---|\n| 戰鬥邏輯（遊戲執行緒） | ≤ 1.0 ms / frame（10 敵人） |\n| 單次 sweep | ≤ 0.02 ms |\n| 目標 FPS | 60 fps（PC 中階：RTX 3060 / R5 5600，1080p） |\n\n---\n\n## 12. M1 驗收指標\n\n### 12.1 量測型 KPI（Debug CSV 自動採集）\n\n| # | KPI | 量測方式 | 通過標準（建議） |\n|---|---|---|---|\n| K1 | **輸入到動作首幀延遲**（攻擊） | 輸入事件時間戳 → Montage 第 1 幀被評估 | **≤ 2 幀（33 ms）** 本機；含顯示管線 ≤ 80 ms（高速相機實測，一次性） |\n| K2 | **閃避輸入到 i-frame 生效** | 輸入 → i-frame 啟動 | ≤ 4 幀（含 S） |\n| K3 | **取消響應**：取消窗開啟後輸入 → 新動作首幀 | 窗內輸入 → 新動作起手 | ≤ 1 幀（0 為立即） |\n| K4 | **緩衝成功率**：R 最後 6 幀輸入被接受 | 自動測試腳本 | 100% |\n| K5 | **幀資料一致性**：動畫 Notify 與資料表偏差 | 驗證器 | 0 幀偏差（全部技能） |\n| K6 | **Hitbox 一致性 / 不穿透**：高速揮砍（Tip 速度 ≤ 3000 cm/s）對 hurtbox 命中率 | 腳本機器人對木樁揮砍 1000 次 | **≥ 99.5% 命中（應命中時）**；誤命中（視覺未接觸）≤ 1% |\n| K7 | **多段去重正確性** | 旋風斬對單目標命中次數 | 恰為設定段數（3），0 重複 |\n| K8 | **Juggle 保護** | 腳本：連續浮空連擊極限測試（Blademaster 全技能循環） | 浮空時間 ≤ 120 幀；空中命中 ≤ 8；0 次無限連 |\n| K9 | **幀率穩定** | 10 敵人混戰 | 1% low ≥ 55 fps；0 次掉幀致判定漏掉 |\n| K10 | **Hitstop 一致** | Debug CSV | 各等級 hitstop 與表一致（±0） |\n| K11 | **Poise / 霸體結算正確** | 單元測試 | 全部測試案例通過（見 §5.2 偽碼） |\n| K12 | **模擬延遲下的預測** | 本機模擬 RTT 100 / 200 ms | 無回滾時動作無視覺跳動；回滾時 blend ≤ 4 幀；閃避 i-frame 補償正確 |\n\n### 12.2 主觀手感問卷（5 分制 Likert，至少 8 位測試者，每人試玩 30 分鐘）\n\n| # | 題目 | 通過標準（平均） |\n|---|---|---|\n| Q1 | 我的攻擊「打中」的感覺很扎實 | ≥ 4.0 |\n| Q2 | 按鍵後角色幾乎立刻反應（無延遲感） | ≥ 4.2 |\n| Q3 | 連段取消順暢，不覺得被動作「卡住」 | ≥ 4.0 |\n| Q4 | 閃避時感覺自己「安全」且容錯合理 | ≥ 4.0 |\n| Q5 | 完美閃避 / 完美格擋的時機可學習、成功時很爽 | ≥ 3.8 |\n| Q6 | 沒有鎖定也能輕鬆對準敵人（軟吸附 A/B 各自評分） | ≥ 3.8 |\n| Q7 | 鏡頭好用，不會被遮擋 / 暈 | ≥ 4.0；暈眩回報 ≤ 1/8 |\n| Q8 | （Templar）格擋 / 反擊循環有成就感 | ≥ 3.8 |\n| Q9 | （Templar）Aegis 反擊的時機容易理解 | ≥ 3.8 |\n| Q10 | （Blademaster）劍意疊層的時機有成就感且可掌握 | ≥ 3.8 |\n| Q11 | 敵人攻擊的預警清楚（可分辨可格擋 / 不可格擋） | ≥ 4.0 |\n| Q12 | 我被連續打到無法反抗（無限連）的情況 | 平均 ≤ 1.5（越低越好） |\n| Q13 | 與我玩過的標竿遊戲（黑色沙漠 / 龍之谷）相比，手感如何（1 較差 … 5 較好） | ≥ 3.5 |\n| Q14 | 我願意繼續玩這個戰鬥系統 30 分鐘以上（開放題補充） | ≥ 4.0 |\n\n### 12.3 M1 驗收門檻\n\n* **通過**：K1–K12 全部達標，且問卷 Q1–Q3、Q11 均達標、其餘 ≥ 80% 項目達標。\n* **有條件通過**：K1、K5、K6、K8 達標，問卷 ≥ 60% 項目達標 → 列出調整清單，進入 M1.5 調校。\n* **不通過**：K1 / K6 / K8 任一未達標。\n\n### 12.4 里程碑拆解（建議，供 Opus 排程）\n\n| 週 | 內容 |\n|---|---|\n| W1 | 專案骨架、GAS 接入、輸入 / 鏡頭 / 準星、Debug HUD |\n| W2 | 狀態機、Montage 普攻 4 段、`ANS_*` 判定窗、Sweep 判定、hitstop |\n| W3 | 閃避 / 格擋 / 完美判定、受擊系統（Poise / 硬直 / 擊飛）、資源 |\n| W4 | Templar 技能 + Aegis；Blademaster 技能 + 劍意 |\n| W5 | 三種敵人 AI（劇本式）、Juggle / 倒地保護、彈道 |\n| W6 | 打擊感整合（特效 / 音效 / 震動）、KPI 錄製、模擬延遲測試、問卷測試 |\n\n---\n\n## 13. 待討論問題清單（需 Rex 決定）\n\n| # | 標題 | 問題 | Sonnet 建議（預設） |\n|---|---|---|---|\n| D1 | M1 職業組合是否定案為 Blademaster + Templar | 若偏好其他組合（如加入遠程獵魔斥候）會增加彈道 / 弱點系統工期 | 維持建議組合 |\n| D2 | 「可隨時中斷後搖」之邊界 | GDD 說閃避可「隨時」中斷攻擊後搖；是否也允許中斷 S（起手）？允許會使攻擊零風險，削弱出招決策 | 僅 R 與 A 後半可取消（S 不可） |\n| D3 | 軟吸附是否加入 | 與「無鎖定」支柱衝突程度？手把玩家尤其需要；PvP 是否關閉？ | M1 做 A/B，預設「弱」，PvP 關閉 |\n| D4 | 打擊感標竿取向 | 對標《黑色沙漠》（偏慢、重、肉）還是《龍之谷》（更快、更輕、更高階連段）？這會決定全表幀數基調 | 偏黑沙：Blademaster 略快於黑沙、Templar 接近黑沙 |\n| D5 | PvP 在 M1 之後的定位 | 是否有 PvP（決鬥 / 戰場 / 陣營戰）？決定 §10 是否需要 Rewind 與 hitbox 完整骨骼判定，成本差異很大 | 先 PvE；PvP 戰場列 M5 後，屆時採 Rewind |\n| D6 | 玩家受擊無敵 / 受傷保護 | 是否提供受擊後短無敵（12 幀）？影響多段傷害 Boss 設計與難度 | 提供，輕受擊後 12 幀，重受擊無 |\n| D7 | Locomotion 是否用 Motion Matching | 戰鬥動作用手 K + Montage；跑走位移是否導入 Motion Matching（動畫資源成本高、效果好）？ | M1 先用 Blend Space，M3 評估 |\n| D8 | 是否有跳躍 / 空中機動 | 目前 M1 不做跳躍。《黑沙》無跳；但 Blademaster 有浮空飛劍、懸空概念 | 不做一般跳躍，僅技能懸空；保持 Juggle 簡單 |\n| D9 | 網路框架：SpatialOS 與 GAS / Iris 的相容 | SpatialOS 方案會影響 Actor Authority 與 Rewind 實作；是否提前做技術 Spike？ | M1.5 做 2 週 Spike，M1 不阻塞 |\n| D10 | 體力是否限制普攻 | 目前普攻不耗體力；若需加深資源決策，可令連段消耗少量體力。會影響節奏與新手體驗 | 保持 0 消耗 |\n| D11 | 劍意「精準窗」難度 | 6 幀窗對手把 / 高延遲是否合理？是否提供「寬鬆模式」（10 幀）為預設？ | 預設 6 幀，輔助選項 10 幀 |\n| D12 | 資源命名與 UI | Templar 使用「MP」還是改為「信仰 Faith」？6 職業各自資源名稱是否統一 UI 外觀？ | M1 統一欄位，命名之後由美術 / 文案決定 |\n| D13 | 無障礙 / 暈動症 | 是否列為 M1 必做（關閉震動 / 縮 hitstop / 色盲提示）？ | 震動 / FOV / hitstop 縮放選項 M1 做，色盲提示 M2 |\n| D14 | 完美閃避慢動作的範圍 | 是否僅做本地視覺（建議），還是真實的 PvE 局部時間減慢（影響怪物）？後者多人同步複雜 | 僅本地視覺 + 敵人動畫局部 0.25× 12 幀（PvE 單人可開，多人關） |\n\n---\n\n## 附錄 A：名詞對照\n\n| 術語 | 說明 |\n|---|---|\n| Startup / Active / Recovery | 起手 / 判定 / 收招 |\n| i-frame | 無敵幀 |\n| Poise | 破霸值（韌性） |\n| Super Armor | 霸體 |\n| Juggle | 空中連擊 |\n| Hitstop | 頓幀 |\n| Tech Roll / Air Tech | 倒地受身 / 空中受身 |\n| Soft Magnetism | 軟吸附（弱輔助瞄準） |\n| GAS | Gameplay Ability System |\n| JP | Juggle Points |\n\n## 附錄 B：版本紀錄\n\n| 版本 | 日期 | 作者 | 說明 |\n|---|---|---|---|\n| v0.1 | 2026-10-05 | Sonnet（子代理）/ Opus 審 | 初版：覆蓋 §1–§13，所有數值為初始建議值，待 M1 試玩調整 |\n"}, {"id": "SP3", "title": "職業與技能樹 (Classes)", "status": "not_started", "progress": 0, "owner": "Opus", "models": ["Opus", "Sonnet", "Codex"], "milestone": "M1/M3", "updated": "2026-10-05", "file": "docs/subprojects/SP3_classes.md", "questions": [{"done": false, "text": "跨大陸學習異域天賦的限制（數量、等級、任務門檻）"}, {"done": false, "text": "是否有二轉/進階職業"}, {"done": false, "text": "其餘四職業的推進順序"}], "body": "# SP3 職業與技能樹 (Classes)\n\n## 目標\n\n六大基礎職業的技能樹、成長曲線與跨大陸異域天賦系統。\n\n-
