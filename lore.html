 "file": "docs/lore/geography.md", "text": "# 地理 (Geography) v0.1\n\n- 狀態：v0.1 定稿（Opus 整合 SP1-004，2026-10-06）\n- 來源：Gemini `handoff/gemini/SP1-004-lore-bible.response.md` §1；Opus 審閱見 `docs/subprojects/SP1_worldbuilding.md`\n- 名稱依 `docs/glossary.md`、ADR-0005、ADR-0008；城市對應 SP1-005 形象圖（`experiments/concept-art/`）\n\n## 1. 世界格局\n\n世界被大洋環抱。約三千年前的「天塹之裂」把原本相連的大地撕成兩塊：西方的**歐羅巴 (Europa)** 與東方的**震旦 (Orientis)**。兩洲之間是深海溝與狂暴海域**天塹 (the Reach)**，海溝上隆起的島鏈就是**天塹群島 (The Rift Archipelago)**。海上長年籠罩永夜盲霧，只有沿著天頂引航星流**星瀾 (the Star-Tide)** 才能安全橫渡。\n\n```\n                        [極北冰原 - 預留擴充]\n                                  │\n【歐羅巴 Europa】 ◀──── 天塹 the Reach ────▶ 【震旦 Orientis】\n 艾森堡・霧環堡・霜灣港          │           雲闕城・碧瀾商都・斷雲關・凌霄宗\n                     【天塹群島 The Rift Archipelago】\n                        鯨骨自由港・落星穹頂\n                                  │\n              [烈日荒原・南溟歸墟・西方失落新大陸 - 預留擴充]\n```\n\n## 2. 歐羅巴 (Europa)\n\n哥德式石造建築、重工煙囪、舊神修道院、溫帶針葉黑森林。秩序、誓約與神恩是社會的核心，異端魔女與失控的鍊金術是揮之不去的威脅。\n\n| 地區（中／英） | 地貌 | 氣氛與敘事 | 玩法定位（設計註） |\n|---|---|---|---|\n| 艾森壁壘與熔鐵荒原<br>`Eisen Bastion & Iron Wastes` | 黑色花崗岩山脈、層疊要塞、重工高爐，煙塵瀰漫 | 鐵銀公約腹地，重錘與軍靴聲不絕，軍紀森嚴 | 採集、據點 PvP；鑌鐵礦、煤晶 |\n| 暮影黑森林<br>`Duskwood Primeval` | 遠古巨木、陰濕落葉層、迷霧沼澤、石南荒原 | 傳說舊神降臨前，魔女在此締結血契；魔女集會古祭壇所在 | 野外刷怪、探索；魔化獸皮、鍊金菌菇、低階魂核 |\n| 風暴之脊峽灣<br>`Stormspire Fjords` | 深邃峽灣、不凍寒流、雷雲低垂的海崖 | 深海巨獸與古泰坦遺骨沉眠海淵 | 高端副本；風暴骨髓 |\n| 晨光修道丘陵<br>`Dawn-Grace Abbeys` | 金黃麥田、白石修道院與鐘樓、朝聖大道 | 表面莊嚴安寧，地宮囚禁著狂暴異端 | 五人地下城；神聖符石、金銀原礦、純度催化劑 |\n| 悲鳴低地澤國<br>`The Weeping Lowbogs` | 黑沼、藍色磷光死水、半沉的古堡廢墟 | 長夜紀的瘟疫遺毒讓生靈異變；霧環堡建於低地邊緣 | 菁英怪聚怪；毒囊、暗影水銀 |\n| 哀慟海崖<br>`The Weeping Cliffs` | 天塹西岸的萬丈絕壁，浪擊黑石如泣 | 傾頹天柱的殘骸半埋在崖下 | 副本「傾頹天柱之地宮」 |\n\n## 3. 震旦 (Orientis)\n\n雲海浮空峰、靈脈斷崖、水鄉澤國與橫貫大陸的荒漠古道。修真悟道、天地靈氣與皇權法度構成宏大的世界氣象。\n\n| 地區（中／英） | 地貌 | 氣氛與敘事 | 玩法定位（設計註） |\n|---|---|---|---|\n| 雲海浮空峰<br>`Cloudveil Floating Peaks` | 含靈磁的山嶽懸浮於雲海之上，鐵索與飛梭滑道相連 | 凌霄宗所在；雲海商盟即以這片雲海為名 | 高端立體副本；羽飾、輕靈玉石、御劍資質石 |\n| 青冥竹海<br>`Azure Bamboo Sea` | 萬頃巨竹、清泉古剎 | 劍聖陸白衣悟道與坐化之地，劍氣長存 | 野外刷怪、劍意修煉；萬年青竹、靈露泉水 |\n| 絲沙瀚海<br>`The Silk-Sand Wastes` | 赤黃流沙、半掩的古驛站與皇朝石窟 | 沙盜出沒；烽燧點燃即是邊境警報 | 護鏢與劫鏢、荒漠 PvP |\n| 斷雲關與百戰熔谷<br>`Cloud-Sever Pass & Caldera` | 黑石雄關、熔岩裂縫、插滿殘戟的古戰場 | 天行赤焰軍總營，戰鼓與硫磺氣息 | 陣營前線攻防；赤銅、玄火精粹 |\n| 碧波水鄉<br>`Jade-Ripple Waterlands` | 縱橫水網、黑瓦白牆集市、千帆內河碼頭 | 商旅雲集，水波下藏著黑市當鋪與各派眼線 | 生活採集；魚獲、蠶絲、珍珠 |\n| 斷龍崖<br>`The Dragon-Severed Precipice` | 天塹東岸的赤黑絕壁，傳為祖龍斷尾所化 | 鎮海九鼎殘件嵌在崖壁，望朔之夜發出哀鳴 | 副本「大天師封靈殘壇」 |\n\n## 4. 天塹群島 (The Rift Archipelago)\n\n位於海溝之上，地殼不斷隆起與撕裂。沒有國界、沒有正規軍、沒有皇朝律法，只有領航者評議會的航海信條與黑市規矩。\n\n| 地區（中／英） | 地貌 | 氣氛與敘事 | 玩法定位（設計註） |\n|---|---|---|---|\n| 鯨骨自由港<br>`Whalebone Freeport` | 以太古巨鯨肋骨為防波堤，沿海崖層疊而上的木石懸空城 | 評議會首府；海風裡是烈酒、香料與鍊金火藥的氣味；最大的自由市集 | 中立主城、跨洲市集、工坊 |\n| 雙星海岬領事區<br>`Cape of Twin Stars` | 平緩海岬上的領事館建築群，評議會守望隊把守 | 四陣營領事館與商館林立；表面禮節，暗地諜戰 | 陣營外交、跨洲懸賞 |\n| 鏽錨走私暗灣<br>`Rust-Anchor Smuggler's Cove` | 海蝕洞穴深處的暗港，鏽錨與吊籃纜索 | 逃犯、私掠船長與銷贓商人的據點 | 黑市、無差別懸賞、走私魂核 |\n| 落星海溝<br>`Falling Star Abyss` | 海水墜入深淵形成的環形水瀑，中央浮著發藍光的隕星穹頂 | 重力異常、潮汐倒流，噴湧原初星髓微粒 | 世界首領、團隊副本 |\n| 萬靈自由海角<br>`Wildkin Cape` | 鯨骨自由港東澳外緣的險峻海崖，高腳木樓與浮橋相連 | 萬靈裔最大的中立集散地，荒野天平傭兵行會總部；議事廳與大校場為安全區，沿海棧道與筏城過渡區不是 | 傭兵契約、行會聲望（`wildkin.md`） |\n| 荒原漂流筏城<br>`The Drift-Raft Flotilla` | 落星海溝邊緣以廢船與鯨骨相連的浮動水寨 | 水棲氏族與流亡傭兵的走私避風港 | 走私、懸賞 |\n| 斷脊暗礁群<br>`Spine-Breaker Reefs` | 獠牙般的玄武岩暗礁與沉船殘骸，終年迷霧 | 骨礁海戰古戰場；羅盤失靈，只能看星光 | 自由海上 PvP、打撈沉船 |\n\n## 5. 九座主要城市\n\n| ID | 中文 | English | 所在 | 主要勢力 | 風貌 |\n|---|---|---|---|---|---|\n| EU-01 | 艾森堡 | Eisenburg | 歐羅巴河谷 | 鐵銀公約首府 | 黑岩巨牆、運河閘門與重工煙囪環繞，中央是刀鋒般的舊神大聖堂與公約統帥部（鐵心要塞）。城內有聖言熔爐。 |\n| EU-02 | 霧環堡 | Nebelburg | 悲鳴低地邊緣 | 星盤修會總部 | 迷霧中的哥德學院城，以巨型可運轉星盤為核心；地標是天穹星軌聖塔與七十二道懸空銅環構成的觀星真理圓環。 |\n| EU-03 | 霜灣港 | Frostfjord Port | 風暴之脊峽灣 | 港務署；雲海商盟駐地「千帆商館」 | 黑石防波堤要塞港，四面冰崖；五百年前晨星號由此出航，港口燈塔紀念其事。 |\n| OR-01 | 雲闕城 | Cloudgate | 三條靈脈交匯的斷崖 | 古王朝皇城 | 下層水道坊市，上層懸浮皇闕與欽天監；中軸懸著太古道爐「太虛玄爐」。前身為天子祭天的太初雲闕古台。 |\n| OR-02 | 碧瀾商都 | Jade-Ripple Emporium | 碧波水鄉 | 雲海商盟總部 | 千帆雲集的水上商都；九海聚寶樓是最高的木構樓閣，兼作拍賣行與商盟議事堂。 |\n| OR-03 | 斷雲關 | Cloud-Sever Pass | 北境熔谷 | 天行赤焰軍總部 | 削山為壁的黑石赤銅雄關，熔岩橫亙關前；熔谷兵器爐日夜不熄。 |\n| OR-04 | 凌霄宗 | Cloud-Loft Sect | 雲海浮空峰 | 浮空宗門（道士與劍修） | 懸於罡風之上的浮空仙山，白鶴、鐵索、瀑布；峰底封有來歷不明的太古機械核心。 |\n| RA-01 | 鯨骨自由港 | Whalebone Freeport | 天塹群島 | 領航者評議會首府 | 見上表。 |\n| RA-02 | 落星穹頂 | Falling Star Vault | 落星海溝 | 評議會議長所在；星盤修會晦明研究所 | 半浸海水、發光的隕星穹頂，周圍是研究與打撈設施。 |\n\n## 6. 四陣營據點配置\n\n採「地緣雙核＋跨洲分支」（ADR-0005）。每個陣營有三層據點：本土總部、對岸**駐地 (Enclave)**（受條約保護，不可攻佔）與周邊**前哨 (Outpost)**（可攻佔），另在天塹群島設領事或商務設施（島上禁止正規軍）。\n\n| 陣營 | 本土總部 | 對岸駐地（不可攻佔） | 前哨（可攻佔） | 天塹群島設施 |\n|---|---|---|---|---|\n| 鐵銀公約 | 鐵心要塞 `The Ironheart Bastion`（艾森堡） | 鋼錨駐地 `Iron-Anchor Enclave`（震旦東南沿海） | 鑌鐵礦脈前哨 `Cold-Steel Mine Outpost` | 銀獅海事衛所 `Silver Lion Admiralty`（鯨骨自由港） |\n| 星盤修會 | 天穹星軌聖塔 `The Astral Zenith Spire`（霧環堡） | 觀星別院 `Starlight Observatory Enclave`（震旦靈脈高山） | 靈潮勘測前哨 `Aether-Surge Survey Post` | 晦明研究所 `Dusk-Dawn Scriptorium`（落星穹頂） |\n| 天行赤焰軍 | 血誓大營 `Blood-Oath Citadel`（斷雲關） | 狂炎行館 `Wildfire Lodge`（歐羅巴西海岸裂谷） | 黑鐵原木破軍營 `Timber-Crush Outpost`（黑森林邊陲） | 戰修武閣 `Vanguard War-Hall`（鯨骨自由港） |\n| 雲海商盟 | 九海聚寶樓 `The Nine-Seas Grand Tower`（碧瀾商都） | 千帆商館 `Thousand-Sails Enclave`（霜灣港） | 金銀岔口驛站 `Golden Crossroads Waystation`（歐羅巴近郊商道） | 九方錢莊 `Nine-Seas Countinghouse`（鯨骨自由港） |\n\n前哨的數量、位置與攻佔規則由 SP6（外交）與 SP7（事件）設計。\n\n**首府也可被攻佔**（ADR-0011）：艾森堡、霧環堡、碧瀾商都、斷雲關不是安全區。失守後由 AI 首領決定去向：向盟友首府求庇護、退守駐地、流亡群島、地下抗爭、稱臣議和或借兵收復。駐地與鯨骨自由港的保護不變。\n\n## 7. 預留擴充區（只留線索）\n\n| 區域 | English | 線索（詳見 `story.md` §D） |\n|---|---|---|\n| 極北冰原 | The Boreal Wastes | 永夜天幕的血色極光；天柱基座的寒霜符文 |\n| 烈日荒原 | The Sunscorched Badlands | 赤道火海、永不冷卻的赤銅流火木 |\n| 西方失落新大陸 | The Far Western Expanse | 海底青銅廢墟、隨洋流漂來的齒輪殘片 |\n| 南溟歸墟 | The Abyssal Return | 古皇朝向無底歸墟秘密進貢的密卷 |\n", "image": {"src": "assets/world-map-labeled.jpg", "alt": "世界地圖（標註版，SP1-005 形象圖 r2）"}}, {"id": "lore-history-mythology", "group": "世界觀聖經", "title": "歷史年表與神話", "version": "v0.1", "file": "docs/lore/history-mythology.md", "text": "# 歷史年表與神話 (Timeline & Mythology) v0.1\n\n- 狀態：v0.1 定稿（Opus 整合 SP1-004 §2–3，並依 SP1-006 故事對齊年代，2026-10-06）\n- 詳細劇情見 `docs/lore/story.md`；本文件是年表與世界法則的索引\n\n## 1. 紀元與年表\n\n年代以遊戲開始的「星瀾紀元年」為原點往前推。\n\n| 紀元 | 年代（距今） | 事件 | 故事章節 |\n|---|---|---|---|\n| 太初 | 不可考 | **原核立基**：世界本為一體，元氣貫通大地經絡，各處孕育出帶有生命印記的原生晶體，即魂核結晶的源頭。 | — |\n| 神柱紀 | 約一萬年前–三千年前 | **天柱繁榮**：東西大地由中央陸橋相連。西方以聖言構築法陣與神聖天柱，東方引地脈靈泉修道。兩方往來通婚、共享知識。 | — |\n| 神柱紀末 | 約三千年前 | **天塹之裂 (The Great Sundering)**：天外災星「原初星髓」墜入中央陸橋，大地撕裂、海水倒灌，形成天塹。歐羅巴稱「神罰天塹」，震旦稱「地劫天塹」。 | 歐 1、震 1 |\n| 長夜紀 | 三千年前–五百年前 | **深淵大隔絕**：海溝噴出永夜盲霧，兩洲音訊斷絕約兩千五百年。歐羅巴：盲霧倒灌、黑森林異化、誓約裁判所獵巫（約 1200 年前）。震旦：靈脈退潮、凌霄宗拔峰入雲（約 2700 年前）、劍聖陸白衣立劍意（約 2130 年前）。 | 歐 2、震 2 |\n| 破曉紀 | 約五百年前 | **星瀾引航**：兩洲幾乎同時解讀出星瀾航道。歐羅巴的埃莉諾拉與戈德里克駕晨星號先抵鯨骨島立碑；震旦的墨衡與沈行舟駕浮槎隨後抵達，看見西方人的燈塔。 | 歐 3、震 3 |\n| 重會之戰 | 約三百年前–一百五十年前 | **骨礁海戰**：兩洲為群島的星髓礦與航道開戰，在斷脊暗礁拉鋸百餘年。末期由康斯坦丁公爵與赫連鐵山統帥。 | 歐 4、震 4 |\n| 公約期 | 約一百五十年前 | **《天塹海岬不戰公約》**：群島水手在柯特帶領下起義，成立領航者評議會；溫積善策動罷市斷糧。兩洲承認群島自治，島上禁止正規軍，只能設領事館與商館。 | 歐 4、震 4 |\n| 四強成形期 | 約八十年前–遊戲前夕 | 四陣營的前身（艾森堡防衛同盟、低地學院、北境邊關軍堡、水鄉海商行會）約八十年前成形。現任首領上位：奧古斯都（22 年前）、奧蕾莉亞與赫連烈（18 年前）、溫九娘（12 年前）。各陣營依條約在對岸設駐地。 | 歐 5、震 5 |\n| 星瀾紀 | 現在 | **魂核狂潮**：落星海溝爆發光柱，星瀾劇烈沸騰，地脈共振使魔獸異化、魂核大量湧出，古代工坊復甦。四位首領囤積軍備、試探盟友，大戰一觸即發；新一代冒險者登場。 | 歐 6、震 6 |\n\n## 2. 兩洲的信仰與世界觀\n\n世界底層是同一套法則，兩洲因長期隔絕，各自發展出不同的解釋。\n\n| | 歐羅巴：聖言與秩序 | 震旦：陰陽與靈脈 |\n|---|---|---|\n| 至高本源 | **原初光輝 (The First Radiance)**：以神聖真言 (Logos) 劃分日夜與元素，賜凡人智慧與神恩 | **無極太初**：一氣化陰陽、生五行 |\n| 萬物構成 | 律法、誓言與形相 | 清濁陰陽、經絡氣血；大地的經絡稱為「靈脈」 |\n| 異端／災厄 | **異端魔女**：操弄大地原始血肉與自然精魄、與深淵勾結者 | **妖煞**：天地暴戾之氣鬱結逆行所化的凶物 |\n| 宗教組織 | 舊神教廷、誓約裁判所、修道院 | 道門宗派、欽天監、皇朝祭天大典 |\n| 天塹之裂的解釋 | **神罰天塹 (The Cleavage of Wrath)**：凡人造塔牽引星核，觸怒舊神，神劈開大地以為懲戒 | **地劫天塹 (The Sundering of Earth-Veins)**：天外熾星刺穿祖穴，地脈祖龍受創翻身，是天地陰陽的週期大劫 |\n\n## 3. 魂核結晶與智能工坊\n\n遊戲的裝備驅動與 AI 鍛造，在世界觀中的解釋如下。\n\n### 3.1 魂核結晶 (Soul Nucleus)\n\n生靈死去時，畢生的執念、戰鬥本能與吸收的魔力／靈力不會立刻消散，而是圍繞一粒星髓碎屑凝成半透明結晶。越強大的生物，魂核蘊藏的意識印記與能量越多。魂核是一片「尚未被書寫的物質」，等待更高的意志重新塑形。\n\n### 3.2 為什麼話語能鍛造兵器\n\n世界誕生於意念與聲音；物質是凝固的語言。工匠把魂核放進太古流傳的熔爐，以話語描述想要的兵器，等於直接改寫素材的底層結構。\n\n| | 歐羅巴 | 震旦 | 中立稱呼 |\n|---|---|---|---|\n| 法則 | **聖言共鳴 (Logos Resonance)**：話語是創世律法的迴響，與魂核中的真理共振，把素材錨定為特定形體與屬性 | **言靈化形 (Qi-Word Manifestation)**：意動則氣動，氣動則形生；真言撥動五行之機 | — |\n| 熔爐 | **聖言熔爐 (The Logos Crucible)** | **太虛玄爐 (Great Void Furnace)** | **智能工坊 (The Forge)**（系統介面與天塹群島） |\n\n### 3.3 靈質守恆（平衡規則的世界觀依據）\n\n工坊不是許願池。靈質總量守恆：若鍛造者只求極限鋒銳，魂核必須透支其他面向的靈質，器胚的堅韌被抽空，甚至觸發反噬詛咒（例如降低持有者最大生命值）。這對應 GDD §6 的總預算點數與極限懲罰機制。\n\n## 4. 天塹之裂的真相（刻意不定案）\n\n兩洲各有說法，各章另有互相矛盾的證據。目前保留三個假說，答案留給未來資料片：\n\n1. **星海投擲說**：墜星不是自然災害，而是「有大能自星海擲之」（姜守虛絕筆）。\n2. **祖龍週期說**：地脈祖龍的陰陽大週期反噬，天塹是週期性大劫的一次。\n3. **神代自毀說**：太古文明過度抽取原核（羅德里克的「光輝之喉」），導致空間崩解；莫爾甘的「南北冰火拉扯的鎖鏈」讖言也指向人為或地理成因。\n\n寫作規則：任何文本都不能讓其中一個假說成為定論。\n"}, {"id": "lore-factions", "group": "世界觀聖經", "title": "四陣營設定卡", "version": "v0.1", "file": "docs/lore/factions.md", "text": "# 四陣營設定卡 (Faction Cards) v0.1\n\n- 狀態：v0.1 定稿（Opus 整合 SP1-001 首領人格、SP1-004 §5，並依 SP1-006 故事對齊年齡與經歷，2026-10-06）\n- 首領人格是 SP6 陣營首領代理人 (Sovereign Agents) 的 system prompt 底稿；量化參數（Aggression、Greed 等）由 SP6 決定（ADR-0005）\n- 據點詳見 `geography.md` §6；歷史詳見 `story.md`\n- **四座陣營首府不是安全區，可被攻佔**；失守後的去向由 AI 首領判斷（ADR-0011），各首領的傾向寫在人格段落\n\n## 總覽\n\n| | 鐵銀公約 | 星盤修會 | 天行赤焰軍 | 雲海商盟 |\n|---|---|---|---|---|\n| English | The Iron & Silver Concord | Order of the Starlight Astrolabe | The Crimson Vanguard | The Cloudveil Syndicate |\n| 根基 | 歐羅巴 | 歐羅巴 | 震旦 | 震旦 |\n| 總部 | 艾森堡 | 霧環堡 | 斷雲關 | 碧瀾商都 |\n| 理念 | 秩序、防衛、重工 | 真理、知識、超然中立 | 尚武、擴張、強者為尊 | 重商、利益、經濟支配 |\n| 首領 | 奧古斯都（58） | 奧蕾莉亞（42） | 赫連烈（45） | 溫九娘（34） |\n| 外交傾向 | 弱勢時結防禦條約，受挑釁必打消耗戰 | 操縱均勢，以情報與秘儀為籌碼 | 好戰，資源短缺或被挑釁即宣戰 | 避免親自開戰，偏好禁運、金融絞殺與代理人戰爭 |\n\n**第三方勢力**：萬靈裔（人形獸族）的**荒野天平傭兵行會**不是可加入的陣營，以契約受僱於任何一方，也是首府失守後「借兵收復」的對象（ADR-0011）。大主裁索蘭・赤尾的人格卡見 `wildkin.md` §A.6，為 SP6 第五個 AI 代理人候選。\n\n**主要關係軸**：鐵銀公約 ⇄ 天行赤焰軍（邊境與軍工資源衝突）；星盤修會 ⇄ 雲海商盟（星圖與物資交易）；鐵銀公約 ⇄ 星盤修會（同洲雙雄，魂核管制之爭）；天行赤焰軍 ⇄ 雲海商盟（糧餉互賴、利益摩擦）。\n\n---\n\n## 1. 鐵銀公約 (The Iron & Silver Concord)\n\n| 項目 | 內容 |\n|---|---|\n| 徽記 | 銜鐵銀獅 (The Iron-Biting Silver Lion)：永不折斷的法理與鋼鐵長城 |\n| 代表色 | 冷鋼灰 (Steel Gray)、秘銀白 (Mithril Silver) |\n| 口號 | 「鋼鐵鑄盾，公約立命；唯有秩序，永鎮混沌。」<br>*Steel forms the shield, the Concord binds the oath; in order alone, chaos falls.* |\n| 理念 | 天塹之裂後世界已殘破，只有以誓約把諸邦鎖成一體、構築重甲防線與要塞網，才能抵禦魔物與外敵。誓約高於一切，背信者必受嚴懲。 |\n| 領導層 | 最高防衛委員會 (Supreme Defense Council)，由大元帥主持 |\n| 派系 | 重工冶鐵師團 (The Ironfoundry Cohort)：掌控艾森堡高爐，重視工事與裝甲。<br>白銀誓約騎士修會 (The Silver Knight Chapter)：恪守古老榮譽法典，督察公約內部忠誠。 |\n| 起源 | 約八十年前艾森堡周邊的鋼鐵貴族與工坊行會結成防衛同盟；22 年前奧古斯都接掌帥印，整合三大重工師團與白銀騎士團，確立中央集權的《鐵銀公約》。 |\n| 與評議會 | 恪守不戰公約，視評議會為跨洋航運的公證人；在群島外海派護航艦（不入島）。 |\n| 招募訴求 | 「加入公約，你的背後永遠有鐵壁依靠，同袍永不背叛。」<br>（設計註：坦克、防衛、團隊榮譽、重甲） |\n\n### 首領：護國大元帥・奧古斯都 (Grand Marshal Augustus)\n\n- **年齡與出身**：58 歲。邊陲守塞世家出身，奧古斯都家族是首任誓約審判長瓦爾瑟夫・馮・埃森巴赫的後裔。年輕時曾以三千疲憊民兵依託險壁，擋住深淵獸潮三個月。36 歲接掌帥印。\n- **外貌**：石雕般高大，鬢角泛白，左眉到面頰有一道巨獸爪痕；終年穿銀獅重型板甲，披風內襯深紅鋼絲。\n- **人格**：冷峻威嚴的鋼鐵意志者，堅信「唯有鐵與秩序方能抵禦混沌」。合約至上、防禦第一，講究法律程序與陣列防禦；重視工業產出與要塞構築，極度厭惡背信偷襲。\n- **外交**：弱勢時主動締結軍事防禦條約，均勢時穩步蠶食要塞；一旦受挑釁，必打消耗戰直到對方臣服。\n- **語氣**：低沉、沉著，用詞像軍事法典與騎士誓詞，不說贅字。\n- **首府失守時的傾向**（ADR-0011）：退守鋼錨駐地，或向同洲的星盤修會求庇護；以收復為唯一目標，絕不稱臣。\n- **對其他首領**：\n  - 奧蕾莉亞：「她的星軌算式確實精準，但她眼裡只有冰冷的星空，隨時會為了『真理』把凡人要塞當成犧牲品。」\n  - 赫連烈：「一頭披著武道旗幟的嗜血猛獸；他不懂條約的分量，他的野心終將撞碎在我的鋼鐵防線上。」\n  - 溫九娘：「舌燦蓮花的水蛭；她的每枚金幣都沾著背叛的鏽，但她的補給航線暫時對公約不可或缺。」\n\n---\n\n## 2. 星盤修會 (Order of the Starlight Astrolabe)\n\n| 項目 | 內容 |\n|---|---|\n| 徽記 | 三重環形星盤與晨昏之眼 (The Tri-Ring Astrolabe & Celestial Eye) |\n| 代表色 | 夜空藍 (Midnight Blue)、星芒金 (Astral Gold) |\n| 口號 | 「天軌有常，萬物皆數；行於星芒之下，洞見真理微光。」<br>*The heavens keep their paths, all things are number; walk beneath the starlight and glimpse the truth.* |\n| 理念 | 城池攻防與帝王爭霸不過塵埃；世界底層的真理早由原初星髓刻定。修會收集魂核與古代遺物、推演星圖，追求凡人向至高法理的昇華。 |\n| 領導層 | 十二星宮真理議會 (The Conclave of Twelve Spheres)，由天星至聖主持 |\n| 派系 | 司天觀測學派 (The Astral Watch)：駐守高山與天塹海溝，記錄星潮與裂隙波動。<br>密儀鍊金隱修部 (The Arcane Scriptorium)：以工坊解析古代禁忌圖紙。 |\n| 起源 | 思想源頭是五百年前發明共鳴星盤儀的埃莉諾拉。約八十年前低地學院成形；25 年前樞機長盧西安企圖接管學院；18 年前奧蕾莉亞率學者擊退教廷聖裁騎士，宣布獨立建修會。 |\n| 與評議會 | 超然中立；定期為評議會校正星盤航道參數，換取在落星海溝打撈隕星的研究特許。 |\n| 招募訴求 | 「仰望星空，知曉萬物的命運矩陣，凡人亦可執掌神明的權柄。」<br>（設計註：法術、解謎、遠程爆發、世界真相探索） |\n\n### 首領：天星至聖・奧蕾莉亞 (Grand Astrologer Aurelia)\n\n- **年齡與出身**：42 歲，外貌看似三十許。舊神修道院出身的占星修女，後任低地學院首席占星學者；24 歲時親眼見到從落星海溝打撈出的原初星髓核心，頓悟天穹的幾何真相，帶領學者脫離教廷。\n- **外貌**：面容清冷，雙眸是星雲般的紫金漸層（傳聞因長期注視星髓所致）；深藍天鵝絨長袍繡有星軌金線，周身常有細微的星光幾何法環。\n- **人格**：超脫凡俗的星圖凝視者，視世俗權柄為過眼雲煙，只有世界底層的法理與原初星髓永恆。把萬物看作可計算的星軌矩陣，極度理性冷靜，近乎漠然。\n- **外交**：絕對務實、追求均勢，不為虛名宣戰；善用古代秘儀與星圖情報作籌碼，挑動其他陣營牽制最強者，以保住修會的學術特權。\n- **語氣**：空靈玄奧，滿是幾何、軌跡與占星詞彙，語調沒有起伏。\n- **首府失守時的傾向**（ADR-0011）：帶著學者與典籍遷往落星穹頂的晦明研究所，以星圖情報換取各方保護；城池本身不是她最在意的東西。\n- **對其他首領**：\n  - 奧古斯都：「一塊困在鋼鐵誓約裡的頑石；他拚命築牆，卻不知道風暴從來來自天上。」\n  - 赫連烈：「暴戾的日冕；但要攪動腐朽的政局，他是最好用的一枚狂躁棋子。」\n  - 溫九娘：「商人計算現世的銀錢，我計算諸天恆星的衰變；我們各取所需。」\n\n---\n\n## 3. 天行赤焰軍 (The Crimson Vanguard)\n\n| 項目 | 內容 |\n|---|---|\n| 徽記 | 焚天烈焰與破軍戰戟 (The Blazing Halberd & Soaring Flame) |\n| 代表色 | 戰血朱紅 (Crimson Red)、玄黑 (Obsidian Black) |\n| 格言 | 「天行剛健，唯武自強；強者立命，逆海奪鼎。」（ADR-0008）<br>*Heaven moves with strength, the warrior rises by will; the strong forge their fate and cross the sea to seize the realm.* |\n| 理念 | 天道剛健運行，強者不祈求神恩，而是錘鍊自身武魄、與天地爭勝。天地珍寶與魂核靈礦，唯百戰之人配據有；以戰養戰。 |\n| 領導層 | 天行帥帳與十二破軍督統 |\n| 派系 | 狂武先鋒營 (The Frenzy Vanguard)：破軍力士與狂戰士組成的衝鋒軍團。<br>赤煉兵武司 (The Scarlet Armory)：以古法把烈焰符籙與煞氣鑄進重兵器。 |\n| 起源 | 約八十年前北境邊關軍堡擺脫朝廷束縛；18 年前赫連烈整合昔日靖海軍殘部與北境狂戰士，創立赤焰軍，脫離兵部號令。 |\n| 與評議會 | 表面遵守不戰公約，暗中讓部屬偽裝私掠船，獵殺跨洋商隊奪取軍工物資。 |\n| 招募訴求 | 「加入赤焰軍，天地任你馳騁，天下神兵能者居之。」<br>（設計註：近戰、極限輸出、正面硬碰、領地爭奪） |\n\n### 首領：赤炎霸王・赫連烈 (The Crimson Sovereign, He-Lian Lie)\n\n- **年齡與出身**：45 歲。草莽寒門出身，是重會之戰靖海將軍赫連鐵山的曾孫，家道早已中落；憑一雙鐵拳與破炎戰戟從邊境死人堆中殺出，陣前斬敵七將，27 歲整合北境七軍。\n- **外貌**：身逾九尺，赤膛虯髯，胸前布滿熔岩般暗紅的「氣魄煞紋」；手持八百斤的太古破炎戰戟。\n- **人格**：傲視天下的武道霸主，信奉強者立命。崇尚個人武勇與擴張，視天地靈礦為能者居之，極度蔑視繁文縟節與懦弱的防守。\n- **外交**：極具進攻性，邊境資源寸步不讓；只尊重有骨氣的強者，對乞憐者嗤之以鼻；資源短缺或被強者挑釁時極易宣戰。\n- **語氣**：狂傲霸道、言出如雷，愛用古戰場諺語與兵家豪語。\n- **首府失守時的傾向**（ADR-0011）：幾乎不求庇護，化整為零在前哨與野外打游擊；寧可向獸族借兵反攻，也不寄人籬下。\n- **對其他首領**：\n  - 奧古斯都：「他的烏龜殼確實夠硬，但戰場不是比誰更能挨打；總有一天，本王要親手劈碎他的銀獅胸甲。」\n  - 奧蕾莉亞：「整天算計天命的瘋女人；算得再準，擋得住本王一戟嗎？」\n  - 溫九娘：「狡猾的狐狸；不喜歡她的算計，但她送來的糧草和深海寒鐵，確實養壯了本王的兒郎。」\n\n---\n\n## 4. 雲海商盟 (The Cloudveil Syndicate)\n\n| 項目 | 內容 |\n|---|---|\n| 徽記 | 金鱗靈鯉穿行雲海 (The Golden Koi Amid Cloudveil) |\n| 代表色 | 流金 (Shimmering Gold)、煙波白 (Mist White) |\n| 口號 | 「財通四海，雲遮萬象；天下之勢，皆有定價。」<br>*Wealth crosses every sea, clouds veil all things; every turn of the world has its price.* |\n| 理念 | 世上沒有不可逾越的信仰、不能化解的仇恨，只有流轉的財富永恆。以無孔不入的商業網絡支配世界，善用禁運、壟斷、海路封鎖與懸賞，殺人不見血。 |\n| 領導層 | 九海議事堂 (The Board of Nine Seas)，由總舵魁主持 |\n| 派系 | 浮雲巨艦通商會 (The Grand Fleet Commission)：執掌跨天塹的武裝貨運飛梭與遠洋巨艦。<br>無相暗樁千金堂 (The Hidden Ledger)：情報買賣、懸賞暗殺與借貸結算的地下機構。 |\n| 起源 | 一百五十年前溫積善在鯨骨島接管跨洋商棧；約八十年前水鄉海商行會成形；12 年前溫九娘兼併水鄉兩河十七家錢莊，正式整合為雲海商盟，發行通行兩洋的「雲海飛錢」與遠期提貨憑券。 |\n| 與評議會 | 深度共生；商盟是群島自由貿易體系的最大資助者，評議會過半議員暗中受其資助。 |\n| 招募訴求 | 「加入商盟，指尖撥動萬金，天下英雄皆為你所用。」<br>（設計註：經濟、拍賣行、生活製作、刺客與懸賞） |\n\n### 首領：總舵魁・溫九娘 (Grand Factor, Lady Wen Jiu-Niang)\n\n- **年齡與出身**：34 歲。水鄉破落鹽商的孤女，曾祖是促成不戰公約的溫積善；14 歲獨力執掌小錢莊，22 歲整合商盟。\n- **外貌**：容顏明艷，眉眼常帶三分笑意；身穿流金錦緞的交領大袖衫，外披白狐裘，手中常把玩兩枚以星髓打磨的小算珠。\n- **人格**：笑迎天下客的財閥，篤信「天下熙熙皆為利來，萬物皆有明碼標價」。外表溫婉、八面玲瓏，內心精於算計，黑白兩道無所不包。\n- **外交**：極力避免由自己發起全面戰爭（損耗利潤）；偏好金融絞殺、原料禁運與懸賞傭兵的代理人戰爭；隨局勢倒買倒賣，隨時可能背刺盟友。\n- **語氣**：吳儂軟語裡藏機鋒，親暱地稱呼各方首領，字字句句落在盈虧帳目上。\n- **首府失守時的傾向**（ADR-0011）：先把金庫與帳冊轉到九方錢莊或千帆商館，再用錢買通、借兵或議和收回城池；必要時暫時向佔領方稱臣做生意。\n- **對其他首領**：\n  - 奧古斯都：「大元帥的鎧甲可真威風，只是不知他麾下三萬騎士的口糧草料，又能離開奴家幾日呢？」\n  - 奧蕾莉亞：「妹妹追求的星辰真理固然高妙，可她那些大星盤的琉璃與玄冰水晶，哪一樣不是從奴家的拍賣行過手的？」\n  - 赫連烈：「霸王勇武無雙，奴家最是敬佩；只要好處給夠，他便是奴家手中最鋒利的一把刀。」\n"}, {"id": "lore-story", "group": "世界觀聖經", "title": "遊戲故事：兩大陸各六章", "version": "v0.1", "file": "docs/lore/story.md", "text": "# 遊戲故事 v0.1：兩大陸各六章 (Story Chapters)\n\n- 狀態：v0.1 定稿（Opus 審閱 SP1-006 r2 後整合，2026-10-06）\n- 來源：Gemini `handoff/gemini/SP1-006-story-chapters.response.r2.md`（r1 審閱見 `docs/subprojects/SP1_worldbuilding.md`）\n- 結構：歐羅巴、震旦各六章；第 1–5 章為背景史，第 6 章為遊戲開始時的現況（進行式，不寫結局）\n- **名稱**：城市名、駐地、赫連烈格言已定案（ADR-0008）\n- 萬靈裔（人形獸族）的故事線見 `wildkin.md`；本文件各章的「萬靈裔的身影」為 2026-10-08 補入，不改變既有事件結果\n- 擴充原則：不毀滅、不統一任何大陸或陣營；四位首領在第 6 章都還在位；天塹之裂的真相只保留互相矛盾的假說；擴充區域只留線索\n\n**Opus 整合時的修正**：姜守虛改為「欽天道院開山大天師」，避免與「末代人皇」昊宣帝的朝代矛盾；「九州」改為「震旦」。\n\n## 人物年代表 (Character Timeline Table)\n\n本表統一全劇本重要歷史與現役角色之年代線。紀年基準以當前遊戲開局之「星瀾紀元年（現世）」為原點向上逆推；徹底修正 r1 之首領年齡矛盾，確立「前身組織約八十年前成形、現任首領約 10–25 年前上位」、長夜紀統一為「三千年前至五百年前」、海戰統帥為「戰爭末期統帥」之時間架構。\n\n| 人物名（中／英） | 陣營與地緣定位 | 出生約年 | 主要事蹟年代 | 當前狀態與年齡 |\n|---|---|---|---|---|\n| **聖貝里克**<br>`St. Berric the Unbroken` | 歐羅巴古聖堂<br>初代光輝守望者 | 約 3060 年前 | 約 3000 年前天塹之裂時，以純白重盾抵擋地裂、引導數百萬西陸萬民西遷避難。 | 已故<br>（天裂後約 70 歲逝世） |\n| **大造物師 羅德里克**<br>`Master Roderic the Stone-Binder` | 歐羅巴太古巨塔<br>末代天柱工匠長 | 約 3050 年前 | 約 3000 年前主持「光輝之喉」儀式牽引星核引發天柱崩塌，自化為石封印地脈裂口。 | 已故<br>（天裂時肉
