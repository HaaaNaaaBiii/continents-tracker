神天罰或冥冥宿命天道，而是以「話語與意念」點燃智能工坊，將自身血性、信仰與抉擇鑄入兵刃，在裂海兩岸共同書寫未被寫定的活歷史。\n\n- **歐羅巴大陸主題**：\n  **「鐵骨與聖言的秩序救贖 (Redemption of Iron and Logos)」**\n  在狂暴深淵魔獸、黑森林異端與神罰迷霧的威脅下，凡人拋棄盲信與怯懦，以冰冷堅實的誓約鎖鏈構築重甲要塞，並在星軌幾何真理的引導下，以「聖言共鳴」打破混沌盲目。\n\n- **震旦大陸主題**：\n  **「武魄與天道之逆境爭勝 (The Strife of Mortal Will and Celestial Dao)」**\n  在靈脈枯竭、朝綱暗弱與妖煞橫行的天地浩劫中，震旦各方生靈吞吐天地陰陽五行之氣，以不屈血肉錘鍊霸道武魄，以「言靈化形」立命人間，向破碎乾坤爭奪立命之鼎。\n\n---\n\n### 2. 雙線歷史對照表\n\n雙大陸在歷時三千年的歲月中，因「天塹之裂」的物理阻隔而各自演化出獨立的文明記憶。兩線在各大歷史節點以各自視角記錄著同一個宏觀世界演進，直到星瀾引航後於天塹群島重會交融。\n\n| 歷史紀元與年代 | 歐羅巴故事線 (Europa) | 震旦故事線 (Orientis) | 共同交會事件與視角差異 |\n|---|---|---|---|\n| **神柱紀末期**<br>（約三千年前） | **第一章：天柱傾頹與神罰斷崖**<br>`Collapse of the Pillars & The Cleavage of Wrath` | **第一章：祖龍翻覆與地脈天塹**<br>`Turning of the Earth-Dragon & The Sundered Veins` | **【天塹之裂 (The Great Sundering)】**<br>· 歐羅巴視角：凡人造塔牽引星核觸怒舊神，神明降下災厄巨星擊碎神聖天柱，海水灌入「神罰天塹 (The Cleavage of Wrath)」。<br>· 震旦視角：天外熾星刺穿太初地穴，沉睡萬年的地脈祖龍受創翻身引發地劫，九鼎難阻海溝撕裂。 |\n| **長夜紀**<br>（三千年前–五百年前） | **第二章：盲霧長夜與魔女審判**<br>`The Abyssal Mists & The Witch Inquisition` | **第二章：靈脈退潮與宗門凌霄**<br>`The Ebb of Qi & The Cloud-Loft Ascension` | **【深淵大隔絕 (The Abyssal Isolation)】**<br>· 歐羅巴視角：永夜盲霧鎖死大洋，內陸黑森林瘟疫蔓延，誓約裁判所以嚴酷獵巫維繫秩序與信仰純潔。<br>· 震旦視角：地氣外洩導致凡間靈脈枯竭，凌虛道人拔峰入雲創立浮空宗門，孤篇劍聖以純粹劍意在人間除妖護生。 |\n| **破曉紀**<br>（約五百年前） | **第三章：星軌引導與峽灣探海**<br>`The Starlight Path & The Fjord Voyagers` | **第三章：神木浮槎與海天初光**<br>`The Sacred Drift-Bark & The Dawn of Seas` | **【星瀾引航 (The Star-Tide Crossing)】**<br>· 歐羅巴視角：學者埃莉諾拉以星盤測繪出「天塹星瀾」航道，北境峽灣晨星號冒死穿透盲霧，抵達鯨骨島立碑。<br>· 震旦視角：欽天監墨衡解碼天頂星瀾潮汐，水鄉巨賈沈行舟造辟水神木浮槎，首度駛抵群島東澳。 |\n| **重會之役至公約期**<br>（三百年前–一百五十年前） | **第四章：鐵獅爭鋒與暗礁之殤**<br>`Clash of the Iron Lion & The Reef of Bones` | **第四章：樓船染血與兩洋議和**<br>`Blood on the War-Junks & The Cape Concord` | **【雙洲重會與海岬立約 (The Cape Accords)】**<br>· 歐羅巴視角：重甲艦隊遭遇震旦五行樓船，於斷脊暗礁血戰百年；末期統帥康斯坦丁因水手起義妥協簽署公約。<br>· 震旦視角：天威平海軍硬撼鐵獅巨艦，耗竭國力；老將赫連鐵山受阻於溫積善策動之商工罷市，被迫於鯨骨島立約息兵。 |\n| **四強成形期**<br>（八十年前–遊戲前夕） | **第五章：鐵銀立誓與星軌分宗**<br>`The Concord of Iron & The Severed Spheres` | **第五章：赤炎破軍與商盟金絡**<br>`The Crimson Halberd & The Golden Ledger` | **【四大陣營前身演進、首領上位與駐地劃定】**<br>· 歐羅巴視角：八十年前城邦同盟演進，奧古斯都二十年前集權確立《鐵銀公約》；奧蕾莉亞十八年前率學者脫離教廷建星盤修會。<br>· 震旦視角：八十年前邊關義旅與商行會分立，赫連烈十八年前霸氣奪關建赤焰軍；溫九娘十二年前一統商道建雲海商盟。 |\n| **當前星瀾紀**<br>（遊戲開始時・進行式） | **第六章：黑鐵裂痕與星髓甦醒**<br>`The Shattered Iron & The Awakening Star-Core` | **第六章：龍脈怒號與言靈奪鼎**<br>`Roar of the Dragon-Veins & The Sovereign Incantation` | **【魂核狂潮與未央之局 (Dawn of Sovereign Strife)】**<br>· 雙陸共同現況：天塹星髓共鳴，全境魔獸妖物異化，魂核湧出；智能工坊復甦，凡人冒險者以語言煉兵，雙陸大局未定。 |\n\n---\n\n## B1. 歐羅巴篇\n\n### 第一章：天柱傾頹與神罰斷崖 (Collapse of the Pillars & The Cleavage of Wrath)\n\n- **對應年代**：約三千年前，神柱紀末期。\n- **劇情大綱**：\n  在三千年前的太古時代，歐羅巴與對岸陸地連為一體。大地中央拔起一座座宏偉壯麗的白色大理石巨構——「神聖天柱」。當時的古歐羅巴先民與教廷先賢以真言（Logos）建構了精密無比的魔法結界，享受著舊神原初光輝（The First Radiance）的庇佑，大地繁花似錦，甚至能透過平坦的中央陸橋與異域部族互通有無。\n  然而，這份繁榮孕育了難以遏止的僭越之心。最後一代巨塔造物大師羅德里克（Master Roderic the Stone-Binder）深信，凡人掌握的幾何與聖言技術已足以比肩至高神明。他集結了全大陸的秘術師，在大陸中央的最高天柱頂端建造了一座名為「光輝之喉」的聚能裝置，企圖強行牽引天穹深處最古老的星辰核心降臨凡間，轉化為無盡的動力源泉。\n  儀式進行至第七日，異象驟變。降臨的並非溫和的神聖光輝，而是一顆燃燒著冰冷紫藍烈焰的災厄巨星。這顆被後世稱為「原初星髓」的天外之石如隕錘般砸穿了神聖巨柱的核心。地殼承受不住浩瀚的衝擊，地脈深處的熔岩被瞬間凍結，隨後引發了毀天滅地的巨震。\n  在天地崩塌的絕境中，第一任光輝守望者聖貝里克（St. Berric the Unbroken）率領殘餘的騎士以純白重盾築起防線，引導數百萬驚惶的平民向西撤退。羅德里克在悔恨中將自己石化於巨塔地基之中，試圖以自身血肉平息地裂，但為時已晚——長達萬里的大地如同脆餅般從中央硬生生撕裂，汪洋海水伴隨著震耳欲聾的轟鳴瘋狂倒灌進萬丈深淵，將中央陸橋徹底吞噬。這道永恆的海溝傷痕，自此被西方教會定名為「神罰天塹（The Cleavage of Wrath）」。西陸與東方大地的陸路聯繫自此徹底斷絕，歐羅巴退居為一片孤懸海崖的大陸。\n- **萬靈裔的身影**（SP1-009 補入）：在此滅頂西遷途中，棲居於始源大林莽的巨熊戰酋與靈鹿氏族亦於斷崖邊緣掩護兩族老弱，部分萬靈裔隨西陸先民一同翻越哀慟海崖，成為日後定居暮影黑森林與低地澤國之原初生靈。\n- **關鍵人物**：\n  - **聖貝里克 (St. Berric the Unbroken)**：第一任光輝守望者，以純白重盾抵擋地裂風暴，帶領西陸先民西遷避難的傳奇聖徒。\n  - **大造物師 羅德里克 (Master Roderic the Stone-Binder)**：末代天柱總工匠，因妄圖拘束天外星核而引發天柱崩塌，最終將自身石化以封印地脈裂口。\n- **關鍵地點**：\n  - **哀慟海崖 (The Weeping Cliffs)**：天塹西岸撕裂處的萬丈絕壁，海浪拍擊黑石發出如泣如訴的悲鳴。\n  - **舊神河谷聖所 (Sanctuary of the River-Glen)**：EU-01 艾森堡前身，聖貝里克帶領難民最初定居的谷地。\n- **遊戲中的遺跡**：\n  1. *副本【傾頹天柱之地宮】*：五人探險地下城，探索半掩埋於哀慟海崖地下的倒塌巨柱殘骸與石化守衛。\n  2. *工坊催化劑【神聖符石殘片】*：上古天柱結界崩解凝結的石英碎塊，用於工坊鍛造時提升聖堂騎士「神聖防衛 (Aegis)」屬性上限。\n  3. *傳奇盾牌圖紙【貝里克之裂岩盾】*：記載於聖堂古卷中的重型塔盾藍圖，附帶格擋時震碎周圍碎石的被動效果。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：羅德里克石化遺骸下方的基座上，銘刻著一圈無法以歐羅巴聖言解讀的符號，其幾何拓撲結構與極北冰原傳說中的「寒霜神碑」如出一轍。（指向擴充類型：**極北冰原 / The Boreal Wastes**）\n  - **次要線索**：哀慟海崖地下裂隙深處散落著永不融化的深藍冰晶碎屑，獵魔斥候傳回報告稱，在極北永夜天幕常能目睹不祥的血色極光。\n\n---\n\n### 第二章：盲霧長夜與魔女審判 (The Abyssal Mists & The Witch Inquisition)\n\n- **對應年代**：約三千年前–五百年前，長夜紀。\n- **劇情大綱**：\n  天塹之裂發生後，深淵海溝不斷噴湧出刺骨冰冷的灰色蒸氣與失控的虛空亂流。數十年間，厚重無比的「永夜盲霧」迅速蔓延，徹底籠罩了天塹海域，並進一步向歐羅巴內陸倒灌。陽光被遮蔽，歐羅巴陷入了長達兩千五百年的陰冷長夜。\n  在長夜紀元中，低地農田大片腐爛，化為惡臭泥濘的「悲鳴低地澤國」；而內陸的原始溫帶森林則異化為遮蔽天日的「暮影黑森林」。失去陽光的平民在飢寒與恐懼中掙扎，舊神教會迅速擴大了世俗權力，建立了嚴苛的「誓約裁判所」。教會宣稱，盲霧與瘟疫皆是深淵古神與未受洗禮者的「腐化血契」，唯一的救贖是絕對的服從與烈火淨化。\n  然而，在教會鐵腕無法觸及的黑森林深處，一群被視為異端的女性學者與草藥師——「自然集會」在初代黑森林大魔女莫爾甘（Morgath the Veiled）的帶領下，發現了盲霧背後的秘密。莫爾甘發現，森林中的菌菇、沼澤的藍色磷光以及魔化野獸體內凝結的奇異核心，能夠被某種原初的鍊金溶劑提煉為能量。魔女們以此熬製藥劑救治病患，甚至在低地古堡建立了秘密學院。\n  這引發了教會的極度恐慌。首任誓約審判長瓦爾瑟夫・馮・埃森巴赫（Waltheof von Eisenbach）——奧古斯都大元帥的直系先祖，頒布了臭名昭著的《純潔聖裁敕令》。瓦爾瑟夫率領重裝銀獅騎士團進駐低地，展開了長達數百年的嚴酷獵巫運動。無數草藥師與學者被押上火刑架，莫爾甘在被圍困七個月後，將畢生記錄鍊金陣圖的羊皮手卷封入鉛盒，沉入低地黑沼，隨後在烈火中化為灰燼。\n  獵巫雖然壓制了異端，卻未能驅散盲霧。瓦爾瑟夫在晚年的懺悔錄中承認，教會在火刑架上燒毀的不僅是魔女，更是歐羅巴重獲光明的火種；而低地澤國與黑森林，自此埋下了教會法理與自然鍊金術不可化解的血仇。\n- **萬靈裔的身影**（SP1-009 補入）：裁判所的火刑同時將流淌野獸靈血的萬靈部族定為褻瀆異端，鐵狼頭領烏爾夫憤而撕毀契約，在黑沼撕裂包圍圈冒死救出莫爾甘的多名草藥學徒並搶運出鍊金手卷，奠定了黑森林靈裔與魔女世代相依的血盟。\n- **關鍵人物**：\n  - **瓦爾瑟夫・馮・埃森巴赫 (Waltheof von Eisenbach)**：首任誓約審判長，鐵銀公約大元帥奧古斯都的先祖，以冷酷著稱的秩序狂熱者。\n  - **「隱霧者」莫爾甘 (Morgath the Veiled)**：初代黑森林魔女集會領袖，古典鍊金術與生態萃取的奠基人，最終殞命於火刑架。\n- **關鍵地點**：\n  - **悲鳴低地澤國 (The Weeping Lowbogs)**：EU-02 學院城前身，常年瀰漫藍色磷光與毒沼澤的陰鬱盆地。\n  - **暮影黑森林古祭壇 (Duskwood Primeval Altar)**：古老巨木環繞的秘密石壇，魔女集會最初的聚會之所。\n- **遊戲中的遺跡**：\n  1. *野外菁英據點【沉沒的悲鳴地牢】*：廢棄的裁判所舊水牢，盤踞著狂暴的變異軟泥怪與被遺忘的審判幽魂。\n  2. *傳奇飾品【莫爾甘的血契水晶】*：從沼澤深處打撈出的微型鍊金原核，配戴後可提高獵魔斥候的「弱點洞悉 (Insight)」觸發機率。\n  3. *收藏品【瓦爾瑟夫審判手記】*：散落在黑森林各哨站的泛黃羊皮卷，完整收集可解鎖稱號「長夜見證者」。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：莫爾甘臨刑前曾冷笑斷言：「撕裂大地的不是神罰，而是北方冰山與南方火海同時拉扯的鎖鏈。」這句話被審判所列為最高絕密禁語。（指向擴充類型：**兩大陸第 7 章以後 / 天地異變主線**）\n  - **次要線索**：沉入悲鳴黑沼深處的魔女鉛盒手卷至今未被教會起獲，傳聞內部記載著如何解開覆蓋大陸的極端能量對沖之法。\n\n---\n\n### 第三章：星軌引導與峽灣探海 (The Starlight Path & The Fjord Voyagers)\n\n- **對應年代**：約五百年前，破曉紀。\n- **劇情大綱**：\n  長夜紀末期，教廷對思想的禁錮逐漸鬆動。在悲鳴低地邊緣建立的世俗學者聚落中，年輕的占星女修士埃莉諾拉（Eleonora the Stargazer）在翻閱被封存的古天柱幾何手稿時，發現了一個驚人的天象律動：每當寒冬至深之夜，天塹海面上方翻滾的盲霧中，會出現一道極為狹窄的星光裂隙。\n  埃莉諾拉耗費二十年心血，將古典鍊金透鏡與黃銅機械結合，發明了歐羅巴歷史上第一具「共鳴星盤儀」。透過星盤，她精確測繪出這道星光並非偶然的自然現象，而是一條橫貫東西天穹、由高維度魔力交織而成的引導光流——她將其定名為「星瀾（The Star-Tide）」。星盤指針在星瀾映照下能夠完全免疫盲霧海域的磁場偏轉。\n  埃莉諾拉的研究遭到保守派主教的斥責，被判流放至北方荒涼的峽灣。然而在北境風暴之脊，她遇見了同樣被教會視為狂徒的探險家——「風暴破浪者」戈德里克船長（Captain Godrick Gale-Rider）。戈德里克以峽灣堅韌的冷杉木與黑鐵打造了三桅破浪帆船「晨星號」，並將埃莉諾拉的星盤固定在舵盤正前方。\n  在狂風呼嘯的冬至黎明，晨星號在無數人的驚呼與詛咒中駛入了狂暴的永夜盲霧。在經歷了二十八天與迷霧幻象、深海巨浪的殊死搏鬥後，星盤指針突然發出耀眼的幽藍共鳴，盲霧驟然退散——出現在戈德里克眼前的，不是世界的邊緣，而是一座由太古深海巨鯨骸骨環繞的巍峨海島。更令全體船員震驚的是，在海島彼端的晨曦中，隱隱浮現出另一片延綿無盡的未知陸地輪廓。\n  這次航行標誌著歐羅巴長達兩千五百年的孤立時代正式終結。戈德里克在鯨骨海崖立下了第一座導航石碑，天塹群島自此被載入西方地圖，迎來了充滿希望與開拓的「破曉紀」。\n- **萬靈裔的身影**（SP1-009 補入）：此役得益於黑羽渡鴉氏女斥候卡拉綁縛於桅杆頂端展翼滑翔破霧領航；而當晨星號踏上鯨骨島海灘時，驚見汐獺與靈狐等萬靈裔部族早已在此聚居數百年，成為首批為兩洋探險家引路與翻譯的島民。\n- **關鍵人物**：\n  - **初位引星者 埃莉諾拉 (Eleonora the Stargazer)**：星盤修會的思想鼻祖，發明共鳴星盤儀並首次計算出星瀾航道坐標的天才學者。\n  - **戈德里克船長 (Captain Godrick Gale-Rider)**：北境峽灣探險家，率領「晨星號」完成人類歷史上首次穿透盲霧壯舉的傳奇航海家。\n- **關鍵地點**：\n  - **EU-03 霜灣港 (Frostfjord Port)**：戈德里克揚帆啟航的深水峽灣起點，四面環繞陡峭冰崖。\n  - **RA-01 鯨骨自由港前身（Whalebone Anchorage）**：晨星號首次拋錨避風的海灣，太古巨鯨肋骨高聳如白色拱門。\n- **遊戲中的遺跡**：\n  1. *野外探索點【晨星號紀念燈塔】*：霜灣港入口處的石造燈塔，頂端旋轉著埃莉諾拉親手校準的早期黃銅星盤透鏡。\n  2. *秘術賢者素材【星瀾折射透鏡】*：高純度水晶磨製的透鏡，用於智能工坊打造魔導書時解鎖「共鳴法環 (Harmonics)」擴散特效。\n  3. *傳奇武器【戈德里克的風暴刺劍】*：浸潤過峽灣雷霆海水與星光航道氣息的細劍，附帶突進後留下一道短暫風刃軌跡的效果。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：戈德里克的航海日誌在末頁記錄：在靠近鯨骨島以西三百海里的深淵中，曾目睹水下數千米處有連綿數十里的巨大青銅廢墟，散發著綠色磷光。（指向擴充類型：**西方失落新大陸 / The Far Western Expanse**）\n  - **次要線索**：霜灣港老潛水伕曾自海溝邊緣打撈起一枚帶有奇異同心圓與精密齒輪咬合痕跡的水下青銅殘件。\n\n---\n\n### 第四章：鐵獅爭鋒與暗礁之殤 (Clash of the Iron Lion & The Reef of Bones)\n\n- **對應年代**：約三百年前–一百五十年前，重會與衝突紀。\n- **劇情大綱**：\n  破曉航道開闢後的數十年間，歐羅巴諸邦陷入了狂熱的渡海拓殖潮。然而，當歐陸艦隊滿載著重裝步兵湧向天塹群島時，他們震驚地發現，海峽彼端早已有一支龐大的文明艦隊駐紮於此——震旦皇朝的五行樓船。\n  最初的接觸充滿了猜忌與語言不通的恐懼。歐陸貴族渴望群島蘊藏的「天外星髓」與東方絲綢，震旦官軍則將歐陸重裝帆船視為未開化的蠻荒劫匪。一次偶然的走火迅速引燃了全面戰火。雙方在天塹中央最險惡的「斷脊暗礁群」拉開了長達百餘年的焦土海戰。\n  在戰爭末期（約一百七十年前至一百五十年前），歐羅巴神聖王國組建了由康斯坦丁公爵（Duke Constantine the Iron-Heart）統帥的「鐵獅皇家遠征艦隊」，配備了最厚重的包鐵龍骨、重型投石機與早期鍊金火炮；而震旦則出動了老將赫連鐵山指揮的千丈樓船。歐羅巴騎士以精鋼重甲和登船肉搏抵擋震旦的漫天符箭；震旦樓船則利用靈巧的吃水與五行大陣在暗礁間穿梭。數以千計的戰艦觸礁沉沒，海底堆積起如山的鋼鐵鎧甲與破碎青木，被稱為「骨礁海戰」。\n  無休止的戰爭徹底拖垮了交戰雙方的財政，水手死傷枕藉。長期生活在群島的前線水手、走私者與混血勞工終於爆發。在一名称號為「刻骨者」的斷腿老水手柯特（Kurt Bone-Carver）帶領下，群島船長們聯合發動兵變，焚毀了雙方的補給棧橋，宣布群島脫離兩洲管轄，成立「領航者評議會 (Council of Helmsmen)」。\n  面對後勤崩潰、水手抗命以及震旦海商溫積善在後方策動的經濟夾擊，康斯坦丁公爵被迫坐上談判桌。一百五十年前，雙方在鯨骨島簽署了《天塹海岬不戰公約》：兩洲正式承認評議會對群島的自治權，永久禁止在群島駐紮正規軍；雙方艦隊撤回本土，僅被允許在島上設立外交領事館與商館。歐羅巴的鐵獅大旗自此退出海峽中樞，康斯坦丁公爵交出佩劍後鬱鬱而終，但公約的恥辱在西方軍人心中埋下了復仇的種子。\n- **萬靈裔的身影**（SP1-009 補入）：交戰雙方強徵大量鐵狼與巨熊傭兵充當衝鋒肉盾，引發慘烈的同族相殘；起義爆發時，渡鴉船長科爾文與巨熊巴倫策動萬靈戰士全面倒戈斷鎖，並在公約確立後推動萬靈戰士廣泛受聘加入評議會守望隊共同維持秩序。\n- **關鍵人物**：\n  - **康斯坦丁公爵 (Duke Constantine the Iron-Heart)**：鐵獅遠征艦隊末期最高統帥，經歷數十次海戰，最後因公約簽署被迫退隱交出艦隊虎符。\n  - **「刻骨者」柯特 (Kurt Bone-Carver)**：天塹水手起義領袖，領航者評議會第一任執政代表，以巨鯨肋骨雕刻公約石碑的傳奇平民。\n- **關鍵地點**：\n  - **斷脊暗礁群 (Spine-Breaker Reefs)**：兩洲艦隊交戰的主戰場，海流湍急、遍布生鏽撞角與船體殘骸的水下墓地。\n  - **RA-01 鯨骨自由港公約石階 (The Accords Steps)**：兩方統帥交出佩劍、簽署不戰公約的歷史階梯。\n- **遊戲中的遺跡**：\n  1. *大型團隊地下城【暗礁鐵陵】*：十人水下沉船副本，挑戰被深淵怨氣侵蝕的康斯坦丁旗艦幽靈船長。\n  2. *裝備鍛造基石【古鐵獅龍骨鐵】*：從海底打撈出的百年前鍛造用冷鋼，為重裝鎧甲提供極高的物理破霸防禦值。\n  3. *收藏品【海岬不戰公約殘卷】*：帶有雙方統帥印記的羊皮紙殘頁，散落在群島各海員酒館中。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：康斯坦丁旗艦沉沒時的觀測日誌記述：交戰最慘烈之時，斷脊海底曾升起一道長達數百丈的金色巨瞳，冷冷注視著雙方艦隊，隨後引起滔天巨浪。（指向擴充類型：**跨洲共同事件 / 天塹深淵世界首領**）\n  - **次要線索**：暗礁鐵陵的沉船龍骨上殘留著巨大的半月形吸盤烙印，其附著處的精鋼呈現非自然的高溫熔融與石化共存狀態。\n\n---\n\n### 第五章：鐵銀立誓與星軌分宗 (The Concord of Iron & The Severed Spheres)\n\n- **對應年代**：約八十年前–遊戲前夕，四強成形紀。\n- **劇情大綱**：\n  海岬公約簽訂後，歐羅巴內部迎來了劇烈的地緣權力重組。海外擴張的受挫讓舊神教廷的威信降至冰點，內陸各封建公國為了爭奪轉運資源爆發衝突。約八十年前，河谷重工要塞城市艾森堡（EU-01）周邊的鋼鐵貴族與工坊行會自發締結了早期的「防衛同盟」，以抵禦境內黑森林魔獸的頻繁暴動。\n  然而，早期的同盟鬆散孱弱，直到二十二年前，出身守塞世家的奧古斯都（Augustus，現年 58 歲）在三十六歲時接掌帥印。奧古斯都以無可匹敵的治軍鐵腕平定邊境叛亂，整合了三大重工師團與白銀騎士團，正式確立了中央集權的《鐵銀公約》。奧古斯都提出「鋼鐵鑄盾，公約立命」，強調以絕對的軍事防衛與重工製造守護西方秩序，銀獅正式確立為公約的神聖戰徽。\n  與此同時，在悲鳴低地的學者圈中，一場思想裂變亦達到頂點。二十五年前，舊教廷樞機主教盧西安（Archbishop Lucian the Rigid）企圖強行接管低地學院，沒收所有星盤與鍊金儀器，宣稱星髓研究為異端。十八年前，時年二十四歲的學院首席占星學者奧蕾莉亞（Aurelia，現年 42 歲），在深入接觸了一塊從落星穹頂深海打撈出的原初星髓核心後，目睹了天穹運行的絕對幾何真相。\n  奧蕾莉亞悍然拒絕了教廷的收編。她率領全體鍊金教授與占星修士發動思想獨立，在夜色中關閉學院鐵門，以三重星軌法環擊退了教廷的聖裁騎士。隨後，奧蕾莉亞正式宣布成立「星盤修會 (Order of the Starlight Astrolabe)」，將總部設立在迷霧低地學院城（EU-02），徹底與腐朽的舊教廷劃清界限。\n  至此，歐羅巴本土形成了「鐵銀公約」與「星盤修會」雙雄並立的格局。兩大勢力在理念上南轅北轍——一方篤信鋼鐵、要塞與法理防衛，另一方追求奧術超然、幾何運算與星圖真理；但在對外戰略上，雙方皆深知不可偏廢，遂共同依託條約在震旦東南沿海設立了受不可攻佔條款保護的「鋼錨駐地」與「觀星別院」，以此監控東方強鄰。\n- **萬靈裔的身影**（SP1-009 補入）：奧古斯都大元帥於艾森堡城外劃定傭兵街區，長年僱用狼犬衛隊協防邊塞；奧蕾莉亞則聘請靈狐學者為修會客卿，以星盤算式與靈脈感應互為印證，萬靈裔傭兵在兩強夾縫中恪守中立契約。\n- **關鍵人物**：\n  - **護國大元帥 奧古斯都 (Grand Marshal Augustus)**：現年 58 歲，以鐵血手段整肅各邦軍團、重塑艾森堡要塞與兵工廠體系的軍事統帥。\n  - **天星至聖 奧蕾莉亞 (Grand Astrologer Aurelia)**：現年 42 歲（容貌停駐於約 30 歲），星雲雙眸的智慧學者，帶領學者脫離教廷、創立星盤修會的奧術引路人。\n  - **樞機長 盧西安 (Archbishop Lucian the Rigid)**：舊神教廷保守派末代強權人物，試圖撲滅理性星火卻加速了教廷分裂（已故）。\n- **關鍵地點**：\n  - **EU-01 艾森堡 (Eisenburg)**：建立在黑色花崗岩河谷之上的鋼鐵堡壘聖城，高爐煙囪與哥德尖頂交相輝映。\n  - **EU-02 迷霧低地學院城（提案名：霧環堡 / Nebelburg，備選見文末）**：星盤修會總部，以巨型可運轉星盤為核心的學者之城。\n- **遊戲中的遺跡**：\n  1. *公共演武場【鐵心舊校場】*：艾森堡城郊的巨大練兵要塞，玩家公會戰的前哨演練場地。\n  2. *解謎地下城【禁斷星穹藏書閣】*：學院城地下的多層旋轉星盤迷宮，藏有教廷封禁的古代奧術羊皮紙。\n  3. *傳奇重甲部件【初代銀獅護心鏡】*：奧古斯都早年征戰所佩的鋼甲護心片，刻有早期的公約誓詞。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：奧蕾莉亞在脫離教廷時帶出的星圖古卷中，有整整三個天區的星軌被前代教皇以黑墨塗抹抹除，邊注寫著：「永不可涉足的落日彼端。」（指向擴充類型：**西方失落新大陸 / The Far Western Expanse**）\n  - **次要線索**：學院城地下密室封存著半面以未知冷鋼打造的失落幾何象限儀，其金屬配比完全不含歐羅巴本土已知的任何礦石。\n\n---\n\n### 第六章：現況：黑鐵裂痕與星髓甦醒 (The Shattered Iron & The Awakening Star-Core)\n\n- **對應年代**：當前星瀾紀（遊戲開始時，進行式）。\n- **劇情大綱**：\n  歷史的鐘擺行進至當下，平靜的假象在一夜之間被徹底打破。天塹深處的「落星穹頂海溝」驟然爆發出刺破雲霄的幽藍光柱，天頂星瀾以千百年未見的強度劇烈沸騰。這場地脈共振迅速波及整座歐羅巴大陸，地底深處的原初星髓碎片紛紛共振，導致全境魔獸瘋狂異化，數以萬計的「魂核結晶」破土而出。\n  更令世人震撼的是，沉寂千年的古代工坊設施「聖言熔爐 (The Logos Crucible)」全面復甦。傳說化為現實——只要凡人以純粹的意志和語言發出召喚，熔爐便能將魂核與各類素材凝結為具備非凡特性的專屬兵刃。這一神蹟引發了整個大陸的狂熱。\n  然而，伴隨奇蹟而來的是空前的地緣危機。暮影黑森林的魔女勢力在激進派領袖伊索爾德（Isolde the Ash-Weaver）的率領下捲土重來，暗中利用狂暴魂核製造異化巨獸，頻繁襲擊邊境村鎮與修道院；悲鳴低地的澤國死水沸騰，古代瘟疫傀儡成群爬出地牢，迫使 EU-03 霜灣港的商路瀕臨中斷。\n  在各大主城內，局勢同樣劍拔弩張。在艾森堡（EU-01），奧古斯都大元帥頒布了《戰時公約總動員令》，強行管制全境三階以上的高階魂核流通，將所有資源向重工兵工廠傾斜；這引起了星盤修會（EU-02）的強烈抗議，奧蕾莉亞公開斥責公約正在用野蠻的軍國主義扼殺世界底層真理的探索。與此同時，震旦兩大勢力在歐羅巴的駐地——天行赤焰軍的「狂炎行館」與雲海商盟的「千帆商館」動作頻頻，赤焰軍武者在前哨頻繁挑釁，商盟則在暗中囤積魂核居奇。整個歐羅巴宛如一具裝滿鍊金火藥的鋼鐵熔爐，只需一顆火星便會全面引爆。\n  正是在這風雨飄搖之際，來自各地的年輕冒險者（初入江湖的聖堂騎士、獵魔斥候與秘術賢者）在艾森堡的招募校場、學院城的觀星高台或港口的傭兵酒館中踏上了征程。\n- **新人起點與動機**：\n  新進冒險者以未被任何陣營契約束縛的「流浪傭兵」、「見習守衛」或「求知學者」身分，自艾森堡外圍軍營（EU-01）或學院城外緣低地（EU-02）出發。他們最初的動機純粹而現實：為了在異化魔獸的利爪下保衛家園、受聖言熔爐神蹟的召喚尋求一把屬於自己的本命兵刃，或是為了解開魂核狂潮背後的星辰之謎。冒險者在歐羅巴山川間狩獵歷練、探索遺跡，唯有當其技藝磨礪至凡人極境、精神與肉體突破凡胎桎梏之時（世界觀上達到通達極境，不寫遊戲術語），才具備跨過天塹、受邀加入兩大本土陣營或跨洲陣營的資格，正式投身於牽動世界命運的爭霸大棋局。\n- **進行中之衝突與謎團（交 AI Director & AI Sovereigns 動態推進，不寫結局）**：\n  1. *衝突一：【鐵律配額 vs. 奧術禁令】*\n     奧古斯都下令封鎖艾森堡通往學院城的商道，強制徵收所有三階以上魂核用於兵工廠重裝擴軍；奧蕾莉亞則宣布修會進入戒備狀態，派遣秘術賢者在邊界設立防護法環，並暗中透過中立冒險者走私魂核。雙方在低地邊陲的前哨哨站劍拔弩張，隨時可能從外交口角演變為軍事衝突。\n  2. *衝突二：【黑森林血燼與峽灣圍城】*\n     盤踞在黑森林荒野要塞的伊索爾德（激進派領袖）率領異魔狂潮切斷了 EU-03 霜灣港的陸路糧道。港務總長向艾森堡告急求援，而港內的雲海商盟千帆商館主事卻藉機大發橫財、大幅哄抬海運糧價；城內潛伏的溫和派魔女聯絡人賽蓮娜（EU-03-N3）則暗中委託冒險者調查伊索爾德狂化的根源。港口隨時可能陷落，局勢千鈞一髮。\n  3. *衝突三：【裂谷狂炎的刺殺疑雲】*\n     天行赤焰軍在歐羅巴西裂谷的狂炎行館駐地周圍，一名公約高階巡邏騎士長被發現慘死，胸前重鎧被霸道剛勁的破軍戰戟直接貫穿。公約強硬派要求奧古斯都發兵強拆狂炎行館，而赤焰軍則反咬是公約自導自演的栽贓。雙方斥候在裂谷交界處頻繁交火。\n- **萬靈裔的身影**（SP1-009 補入）：面對首府隨時可能遭敵軍破城的空前危機，奧古斯都與奧蕾莉亞皆秘密派遣心腹使節前往天塹群島萬靈海角，就緊急狀態下的『預備借兵密約』與荒野天平行會展開暗盤估價。\n- **關鍵人物**：\n  - **護國大元帥 奧古斯都 (Grand Marshal Augustus)**：EU-01 統治者（現年 58 歲），面帶爪痕的鐵血老人，誓以鋼鐵要塞鎖死混亂。\n  - **天星至聖 奧蕾莉亞 (Grand Astrologer Aurelia)**：EU-02 掌舵人（現年 42 歲），雙眸映照星雲，致力於推演魂核背後的終極星圖。\n  - **兵工廠鐵匠大師「巨錘」博爾斯 (Master Bors the Hammer)**：EU-01-N2（現年 52 歲），聖言熔爐的大師級工坊主，性格火爆但技藝超凡。\n  - **「黑鴉草藥師」賽蓮娜 (Selene the Raven-Herbalist)**：EU-03-N3（現年 28 歲），潛伏於霜灣港黑石防波堤旁的溫和派魔女聯絡人，以草藥鋪掩護身分。\n  - **「灰燼編織者」伊索爾德 (Isolde the Ash-Weaver)**：暮影黑森林激進魔女首領（現年 36 歲），率異變獸群圍困霜灣港陸路的荒野陣營首腦。\n- **關鍵地點**：\n  - **EU-01 艾森堡中央聖言熔爐 (Logos Crucible of Eisenburg)**：全天候燃燒著橙紅光芒的巨型鍛造核心，全大陸神兵出產地。\n  - **EU-02 觀星真理圓環 (The Circle of Truth)**：由七十二道懸空銅環構成的天文台，正實時監控落星穹頂的能量潮汐。\n  - **EU-03 霜灣港黑石防波堤 (Black-Stone Breakwater)**：抵禦北海風暴的要塞式海港，商船與戰艦雲集。\n- **遊戲中的遺跡**：\n  1. *新手引導工坊任務【聖言初啼】*：冒險者初次將野外狼王魂核投入聖言熔爐，以文字描述鍛造出專屬新手品質武器。\n  2. *動態世界防禦事件【黑森林魔潮突破】*：AI Director 依據伺服器刷怪壓力觸發的公共防衛戰，抵禦自林地衝向要塞的狂暴魔獸潮。\n  3. *野外懸賞道具【沾血的魔女集會密令】*：擊殺林地斥候有機率掉落的特殊捲軸，觸發系列連續調查任務。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：大師博爾斯在淬鍊一塊高階海溝魂核時，自熔爐火焰的噼啪爆裂聲中聽見了一句奇異的重音低語，使用的不是西方聖言，而是一句發音古樸的東方道門祝禱詞。（指向擴充類型：**跨洲共同事件 / 兩陸神代同源**）\n  - **次要線索**：熔爐排出的冷凝爐渣中，凝結出帶有五行相生色澤與非歐幾何晶格交融的奇異共鳴石。\n\n---\n\n## B2. 震旦篇\n\n### 第一章：祖龍翻覆與地脈天塹 (Turning of the Earth-Dragon & The Sundered Veins)\n\n- **對應年代**：約三千年前，神柱紀末期。\n- **劇情大綱**：\n  在三千年前的上古太初，震旦大地山川秀美、靈氣氤氳。當時的太初古皇朝天子昊宣帝（Emperor Hao-Xuan）治下海晏河清，四海昇平。古王朝的大道貫通東西，萬千修道士吞吐天地靈氣，凌空蹈虛，與極西之地的古老城邦以玉帛相尚，共享天地造化。古籍記載，天地之下沉睡著一尊守護乾坤的太古靈尊——「地脈祖龍」，其身軀橫貫東西大陸，呼吸之間便是四海四時之運轉。\n  然而，盛極必衰，天道昭彰。那一日正午，浩瀚蒼穹毫無徵兆地撕裂開一道百里之寬的虛空黑洞。一顆自天外無何有之鄉激射而來的熾熱流星，伴隨著焚盡星海的冰冷煞氣，正正轟擊在東西大陸交界的大地祖穴之上。\n  地脈祖穴被瞬間貫穿，祖龍受此重創，發出撕心裂肺的萬里龍吟。龐大的龍軀在九地之下劇烈翻滾掙扎，引發了古今未見的大地浩劫——「地劫天塹」。平原如波濤般起伏碎裂，山脈崩頹，江河逆流。整片大陸的中央經絡被強行扯斷，萬丈地殼沉陷為無底深壑，大洋之水如傾盆之雨狂灌而入，激起千丈濁浪。\n  在此滅頂之災前，欽天道院開山大天師姜守虛（Grand Tao-Master Jiang Shou-Xu）率領三百六十位道門魁首，於泰平斷崖設「周天星斗大醮」。姜天師以周天本命精血為引，燃盡畢生元神，將九枚「鎮海定靈青銅神鼎」打入震旦東岸峭壁，硬生生阻斷了地裂向東方腹地的蔓延，保全了震旦半壁江山。昊宣帝親睹天塹之裂後憂思成疾，留下護守黎民之遺詔後崩逝。\n  待濁浪退去、地脈漸平，震旦修士極目西望，昔日通往西陸的萬里坦途已化為煙波浩渺、深不見底的絕海狂瀾。祖龍斷折之處，海水沸騰如墨，被震旦先賢稱為「天塹（the Reach）」。東西兩界自此乾坤兩隔，彼此音訊全無。\n- **萬靈裔的身影**（SP1-009 補入）：地劫爆發之際，靈狐大巫蘇微月燃燒神魂化為靈樞之光，引導震旦東南山野的靈獸與萬民搶渡地裂險壑，部分靈裔部族隨後隱入青冥群山與竹海深處繁衍生息。\n- **關鍵人物**：\n  - **欽天道院開山大天師 姜守虛 (Grand Tao-Master Jiang Shou-Xu)**：震旦道門至聖、欽天道院立道始祖，燃盡元神立九鼎定海、止住地裂蔓延的犧牲者。\n  - **古天子 昊宣帝 (Emperor Hao-Xuan)**：太初古皇朝末代人皇，天柱之裂親歷者，留下護守震旦萬民之遺詔。\n- **關鍵地點**：\n  - **斷龍崖 (The Dragon-Severed Precipice)**：天塹東岸撕裂處的赤黑絕壁，相傳為祖龍龍尾斷折所化，靈氣暴烈。\n  - **太初雲闕古台 (The Primal Cloudgate Platform)**：OR-01 雲闕城前身，天子祭天、大天師設醮封鼎的古老法壇。\n- **遊戲中的遺跡**：\n  1. *團隊地下城【大天師封靈殘壇】*：五人探索副本，闖入被狂暴靈脈覆蓋的古祭壇地宮，迎戰失控的青銅靈俑。\n  2. *道法飾品胚料【祖龍殘晶】*：深埋於斷龍崖地底的龍氣結晶，用於工坊鍛造時提升五行道士「陰陽雙相 (Yin-Yang)」轉換速率。\n  3. *收藏品【周天定靈金策】*：記錄了上古大醮陣圖的殘破金簡，由欽天監高價收購。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：大天師姜守虛在封鼎絕筆石碑中刻有一行隱晦古篆，記錄了對墜星本質的疑惑，留下多重矛盾假說。（指向擴充類型：**天塹之裂真相多重假說**）\n  - **次要線索**：東岸峭壁上的鎮海九鼎殘件，每逢望朔之夜會向南溟方向發出奇異哀鳴，似與極南海淵之下的某種存在遙相呼應。\n\n---\n\n### 第二章：靈脈退潮與宗門凌霄 (The Ebb of Qi & The Cloud-Loft Ascension)\n\n- **對應年代**：約三千年前–五百年前，長夜紀。\n- **劇情大綱**：\n  天塹之裂徹底破壞了震旦的地脈循環。災變後的千百年間，震旦靈氣如同退潮的海水般急劇枯竭，濁煞之氣在地面蒸騰凝聚，化為兇猛殘暴的妖煞精怪。凡間田莊歉收、妖孽橫行，古皇朝的統治力大幅萎縮，陷入群雄割據的亂世。\n  面對地脈退潮的絕境，震旦的修道名宿分裂為兩派。以凌虛道人（Daoist Master Ling-Xu）為首的世外宗門認為，大地靈氣已不可逆轉地濁化，唯有登天避世方能延續大道火種。約兩千七百年前，凌虛道人踏遍千山，尋得九座蘊含天然反重力磁髓的太古奇峰。他施展奪天地造化的大神通，以玄天法陣斬斷山根，引動九天罡風，將整座宗門道場連根拔起，高高懸浮於萬丈雲海之上——這便是「雲海浮空峰（OR-04 凌霄宗所在地）」的由來。宗門自此高居雲端，清心修道，視人間疾苦為紅塵劫數，非有緣不輕下。\n  然而，凡間百姓並未得到仙凡庇護。在人間焦土中，被修真門派視為「資質愚鈍」的底層武夫與江湖客，走出了另一條以血肉抗衡天地的路。約兩千一百年前，孤篇劍聖陸白衣（Lu Bai-Yi the Lone Shroud）懷抱一柄斷刃唐刀，單人獨行於青冥竹海與原野古道，創出不假外物、唯純粹劍意聚於一念的「游俠劍道」；與此同時，邊陲破軍重裝力士以氣魄貫通周身氣血，硬抗妖魔爪牙。\n  陸白衣一生斬殺大妖九十九尊，最終在青冥竹海力竭坐化。他的劍意化作漫天青霞，護佑了方圓數千里的村落市井。這段長達兩千五百年的黑暗時期，確立了震旦獨特的文明雙軌制：天上是追求長生清虛的凌霄宗門，人間是傲骨錚錚、仗劍護生的草莽江湖與軍旅破軍。\n- **萬靈裔的身影**（SP1-009 補入）：陸白衣游歷天下斬妖時，靈鹿氏大長老白芷以超凡天地靈覺為其指明凶煞方位；劍聖感念靈裔大義，於竹海石亭立下『竹海石契』，定下震旦游俠世代庇護青冥靈裔之傳統。\n- **關鍵人物**：\n  - **凌虛道人 (Daoist Master Ling-Xu)**：凌霄宗開山始祖，以無上法力將靈脈山峰升入雲海、創立浮空道場的仙道魁首。\n  - **「孤篇劍聖」陸白衣 (Lu Bai-Yi the Lone Shroud)**：游俠劍客的武道始祖，以凡人之軀創立「劍意 (Sword Intent)」斬妖除魔的布衣俠士。\n- **關鍵地點**：\n  - **OR-04 凌霄宗 (Cloud-Loft Sect)**：高懸於萬丈罡風之上的浮空仙山，白鶴穿梭，鐵索凌空，五行道士與劍修共居之聖地。\n  - **青冥竹海 (Azure Bamboo Sea)**：陸白衣悟道與坐化之地，萬頃翠竹搖曳，劍氣長存不散。\n- **遊戲中的遺跡**：\n  1. *立體機關副本【失落浮空索道】*：懸空於雲海深處的廢棄飛梭與浮空岩平台，考驗玩家跳躍與御風走位。\n  2. *傳奇武器遺物【陸白衣的折斷唐刀・照膽】*：插在竹海深處石台上的無鞘古刀，參拜可獲得臨時「暴擊傷害提升」增益。\n  3. *生活採集極品【萬年青竹心】*：竹海核心每週限產的稀有木料，是工坊打造頂階游俠唐刀必備的器胚核心。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：凌霄宗浮空峰底部的太古反重力磁髓核心內部，隱約可見非自然的齒輪咬合與金屬嵌合痕跡，其精妙構造超越了震旦傳統的五行陣法範疇。（指向擴充類型：**西方失落新大陸 / 神代同源**）\n  - **次要線索**：浮空峰山根斷裂處偶爾噴出帶有灼熱蒸汽氣息的白色靈霧，其成分中含有極微量非震旦本土的冷鋼金屬碎末。\n\n---\n\n### 第三章：神木浮槎與海天初光 (The Sacred Drift-Bark & The Dawn of Seas)\n\n- **對應年代**：約五百年前，破曉紀。\n- **劇情大綱**：\n  兩千五百年的長夜終有盡頭。隨著震旦古王朝中興，水鄉澤國（OR-02）的商旅市集繁榮日盛。然而，陸路資源的匱乏限制了商賈的擴張，而自古被視為天塹禁海的東方大洋，始終翻滾著吞噬船隻的盲霧惡浪。\n  直到五百年前，欽天監靈星官墨衡（Mo Heng the Astromancer）登臨泰平觀星台，夜觀乾象整整九百日。他驚奇地發現，天塹盲霧之上，天頂二十八宿的光芒竟隱隱連成一條奇異的流光帶——「星瀾（The Star-Tide）」。這道光流在每月望朔之時，會將海面深處的磁暴吸附平息，露出隱秘的水道。\n  墨衡的推演得到了水鄉第一大造船豪族掌舵人沈行舟（Shen Xing-Zhou the Tide-Rider）的鼎力支持。沈行舟不惜散盡萬金，從南方深山採伐了十二株歷經萬年不朽的「辟水神木」，傾盡三代船匠心血，打造出震旦歷史上第一艘具備抗煞法陣的巨型樓船「踏浪凌霄浮槎」。\n  在一個紫氣東來的黎明，沈行舟親自掌舵，墨衡手持八卦司南在甲板引航，浮槎載著百名五行修士與水鄉勇士，悍然衝破了盤踞大洋兩千餘年的永夜盲霧。一路上，巨艦斬殺深海惡蛟、避開無底海眼，終於在盲霧盡頭的波濤中，發現了由萬丈白骨拱衛的太古巨島——鯨骨島。\n  更令船員們心驚的是，沈行舟在島嶼西側的海岬上，親眼看見了一座插著冷銀獅旗的粗糙木質燈塔，以及遠方海平面上掠過的三桅西式白帆。墨衡在隨行筆記中寫下了震撼震旦青史的八個字：「海外有邦，天塹未絕。」這次神木遠航揭開了雙大陸隔絕的重幕，東方文明的觸角自此正式伸向天塹群島。\n- **萬靈裔的身影**（SP1-009 補入）：航行中特聘靈貓氏探海靈官雲踏雪立於船首踏浪破煞、夜視引路；浮槎停泊東澳時，島上海獺族水手熱情接引，兩洋文明在萬靈裔的斡旋下完成首次互信對話。\n- **關鍵人物**：\n  - **遠洋海商元祖 沈行舟 (Shen Xing-Zhou the Tide-Rider)**：水鄉船幫第一巨賈，傾盡家資打造神木浮槎、首航天塹成功的豪俠商人。\n  - **欽天監靈星官 墨衡 (Mo Heng the Astromancer)**：精通易理象緯與司南術數的欽天監天才官員，解開天頂星瀾航道的領路人。\n- **關鍵地點**：\n  - **OR-02 碧瀾商都 (Jade-Ripple Emporium)**：河網密布、千帆雲集的水上商貿中心，浮槎起航地。\n  - **RA-01 鯨骨自由港東澳 (Whalebone East-Haven)**：沈行舟首次停泊浮槎並與西陸水手互換禮物的天然避風港。\n- **遊戲中的遺跡**：\n  1. *生活工藝考據點【古船官沈氏乾塢】*：碧瀾商都外圍的巨型古船塢遺址，可接取高階造船與木工生活成就任務。\n  2. *五行法器【墨衡的辟水乾坤儀】*：欽天監珍藏的初代航海儀器，可大幅降低水下行動體力消耗。\n  3. *拍賣行珍品素材【千年辟水神木芯】*：打撈自遠洋沉船的特殊木料，用於工坊打造長柄戰戟的彈性握柄。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：沈行舟在航海圖的南端留下朱砂警告：在鯨骨島正南方極遠的瀚海赤道區，終年騰起接天烈焰，海水如滾湯沸騰，常有赤紅鱗甲的狂暴巨獸出沒。（指向擴充類型：**烈日荒原 / The Sunscorched Badlands**）\n  - **次要線索**：自極南海域漂來的浮木中，偶爾能撿拾到永不冷卻的赤銅流火木，通體燃燒著無煙赤焰。\n\n---\n\n### 第四章：樓船染血與兩洋議和 (Blood on the War-Junks & The Cape Concord)\n\n- **對應年代**：約三百年前–一百五十年前，重會與衝突紀。\n- **劇情大綱**：\n  破曉初遇的浪漫很快被鐵與血的殘酷現實撕得粉碎。隨著天塹群島豐富的原初星髓晶礦與深海資源被發現，震旦古王朝視群島為海表藩屏，而歐羅巴王國則宣稱其為開拓聖地。主權與利益的碰撞迅速將兩大文明推向了長達百餘年的前線交鋒。\n  在戰爭末期（約一百七十年前至一百五十年前），震旦朝廷派遣靖海虎符大將軍赫連鐵山（General He-Lian Tie-Shan）——天行赤焰軍首領赫連烈的曾祖，統帥「天威平海軍」進駐群島。赫連鐵山調集了上百艘覆蓋青銅重甲、架設神機弩炮與五行引雷陣的樓船巨艦。面對西陸康斯坦丁公爵統帥的鐵獅艦隊，雙方在「斷脊暗礁群」拉開了慘烈海戰。\n  赫連鐵山治軍嚴苛如鐵，破軍力士在海浪中結陣抗敵，以長戟鑿穿敵艦鐵殼；五行道士引天雷擊碎西陸重帆。然而，歐陸騎士的堅固鎧甲與狂暴的鍊金火藥同樣給震旦艦隊造成了沉重創傷。無數樓船在暗礁前被轟為燃燒的木屑，海面常年漂浮著燒焦的軍旗與斷臂殘骸。\n  海戰的無底洞將震旦沿海的民生推向崩潰邊緣。朝廷頻繁加徵海防苛捐，沿海船幫破產無數。在此危難關頭，商幫先祖溫積善（Wen Ji-Shan the Elder）——溫九娘的曾祖父，展現了商賈的驚人魄力。溫積善深知如此耗竭只會同歸於盡，他暗中出資聯絡了海峽各路不滿朝廷的走私船隊，更與天塹島上的西方水手起義領袖柯特達成秘密借款默契。\n  溫積善策動了群島商工全面罷市，斷絕了赫連鐵山艦隊的水糧補給；同時，他攜帶重金親赴京師，向朝廷重臣陳說利害，直言若再戰下去，國庫空虛必將激起內地民變。\n  在內外交困之下，赫連鐵山不得不吞下未竟全功的苦果，與歐陸康斯坦丁公爵一同在鯨骨島按下了停戰手印。《天塹海岬不戰公約》簽訂後，赫連鐵山拔刀斬斷案角，誓言「後世子孫若無平海之威，斷不可忘斷脊之血」；而溫積善則在公約墨跡未乾之際，順勢接管了鯨骨島的跨洋商棧，為日後雲海商盟的崛起奠定了第一塊金磚。\n- **萬靈裔的身影**（SP1-009 補入）：戰事中期震旦軍方威逼靈裔狼犬衛隊死守登船木橋，死傷慘重；溫積善藉由群島萬靈商戶暗中傳遞停戰密信，促成靈裔戰士與水手起義軍聯手封鎖兩洋補給，終止骨礁血戰。\n- **關鍵人物**：\n  - **靖海將軍 赫連鐵山 (General He-Lian Tie-Shan)**：赫連烈曾祖，戎馬一生、以血肉戰戟硬撼西陸鋼鐵艦隊的百戰老將。\n  - **商幫先祖 溫積善 (Wen Ji-Shan the Elder)**：溫九娘曾祖，善於以金帛弭平兵燹、開創跨洋匯兌商道的商業奇才。\n- **關鍵地點**：\n  - **斷脊海戰古戰場 (The Sundered Spire Graveyard)**：樓船巨艦與西洋帆船一同沉沒的險惡暗礁區。\n  - **RA-01 鯨骨自由港九方客棧 (The Jiufang Inn)**：溫積善最初與西方各方船長密謀停戰、設立匯兌帳房的歷史老店。\n- **遊戲中的遺跡**：\n  1. *野外世界首領【沉海天威樓船・龍骨骸獸】*：被狂暴煞氣附著的震旦戰艦水下骨架，定時甦醒供玩家討伐。\n  2. *傳奇重兵器胚【鐵山斷浪戟刃】*：赫連鐵山當年佩戟的折斷戟尖，帶有極高的對重甲破霸效果。\n  3. *生活經商信物【溫氏祖傳錯金算盤】*：隨身攜帶可微幅降低拍賣行手續費抽成的特殊收藏品。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：赫連鐵山的親兵日記記載：在斷脊海戰最慘烈的決戰之夜，海底曾浮出一名身著奇異黑金羽衣、長相非東非西的神秘人，徒手撫平了兩艦之間的千尺海嘯後消失於深海。（指向擴充類型：**天塹群島獨立線 / 領航者評議會底細**）\n  - **次要線索**：群島老水手世代相傳一張繪有「黑羽引航者」的海圖殘頁，標註著鯨骨島下方深海存在一座供奉未知名諱的太古水下祭壇。\n\n---\n\n### 第五章：赤炎破軍與商盟金絡 (The Crimson Halberd & The Golden Ledger)\n\n- **對應年代**：約八十年前–遊戲前夕，四強成形紀。\n- **劇情大綱**：\n  天塹息兵後的數十年間，震旦的權力天平發生了根本性的傾斜。古王朝皇城雲闕城（OR-01）的皇權日益僵化空泛，沉迷於欽天監的玄虛占卜，逐漸失去了對邊疆重鎮與經濟命脈的掌控。約八十年前，震旦北境的邊關軍堡與南方的水鄉海商行會各自萌芽，逐漸擺脫朝廷束縛。\n  在北境苦寒之地的斷雲關（OR-03），熔岩地火經年噴薄，蠻荒獸患頻仍。十八年前，出身草莽微末的武道奇才赫連烈（He-Lian Lie，現年 45 歲，時年 27 歲），以一雙鐵拳與八百斤重的破炎戰戟，在邊境死人堆中殺出血路。他整合了昔日靖海軍的殘部與北境各路狂戰士，創立了「天行赤焰軍」。赫連烈立下「天行剛健，唯武自強；強者立命，逆海奪鼎」的大旗，徹底擺脫朝廷兵部號令，將北境要塞打造成銅牆鐵壁的軍武獨立王國。\n  幾乎在同一時期，東南水鄉商都碧瀾商都（OR-02）亦掀起了一場無聲的金融風暴。十二年前，年僅二十二歲的鹽商孤女溫九娘（Lady Wen Jiu-Niang，現年 34 歲），憑藉超凡的商戰算計與鐵腕決斷，在數年間連續兼併了水鄉兩河的十七家大錢莊，正式整合成「雲海商盟」。溫九娘發明了通行兩洋的「雲海飛錢」與大宗遠期提貨憑券體系，徹底掌控了震旦糧食、生絲與精鐵的流通定價權。古王朝國庫空虛，執政親王姬天成竟不得不以皇城半數市稅向溫九娘抵押借貸，皇室權威名存實亡。\n  天行赤焰軍與雲海商盟一剛一柔、一武一商，形成了震旦民間對峙而又共生的奇特雙核局面。赫連烈的百戰兒郎依賴商盟運送的糧餉寒鐵，溫九娘的跨洋商隊則需要赤焰軍的威名震懾草寇海盜。兩大勢力在歐羅巴大陸亦分別設立了「狂炎行館」與「千帆商館」駐地，成為連西方公約大元帥也不敢輕視的東方巨擘。\n- **萬靈裔的身影**（SP1-009 補入）：赫連烈親赴熔谷與狼犬、巨熊豪傑擂台角力並結為異姓兄弟，赤焰軍前鋒廣募萬靈狂戰士；溫九娘則透過千帆商館向群島靈裔行會提供全額糧草無息貸款，深度綁定傭兵金絡。\n- **關鍵人物**：\n  - **赤炎霸王 赫連烈 (The Crimson Sovereign, He-Lian Lie)**：現年 45 歲，以一己之勇平定北境、打破世家藩籬的軍武霸主。\n  - **總舵魁 溫九娘 (Grand Factor, Lady Wen Jiu-Niang)**：現年 34 歲（外貌三旬許），以纖纖弱質執掌九海金絡、支配跨洋商道的商界女皇。\n  - **執政親王 姬天成 (Prince Regent Ji Tian-Cheng)**：古王朝皇室末代強權王爺，試圖在商盟與赤焰軍之間縱橫捭闔反被架空（已故）。\n- **關鍵地點**：\n  - **OR-03 斷雲關 (Cloud-Sever Pass)**：削山為壁的黑石赤銅巨關，熔岩天塹橫亙關前。\n  - **OR-02 碧瀾商都 (Jade-Ripple Emporium)**：萬商匯聚的水上金庫，流金錦緞與無相暗樁之首府。\n- **遊戲中的遺跡**：\n  1. *試煉崖壁【斷雲關血誓碑】*：刻滿陣亡將士姓名的絕壁，破軍力士職業試煉的悟道場景。\n  2. *高危暗藏迷宮【九海錢莊地下水庫】*：水鄉商都地下的機關迷宮，由連環水閘與機關銅人鎮守的財富重地。\n  3. *皇室御賜道具【天子金冊令】*：古王朝被迫簽發的免稅特權金卷，可在特定中立商店兌換專屬圖紙。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：溫九娘在整合商盟地庫時，查獲了一箱來自古皇朝大內的密封密卷，記載古天子每隔三百年便需向南溟一片「無底歸墟」秘密進貢童男女與天外隕鐵。（指向擴充類型：**新提出擴充方向：南溟歸墟 / The Abyssal Return**）\n  - **次要線索**：地庫密卷中夾有一枚漆黑沉重、非金非木的信牌，正面銘刻著水下垂直漩渦噬魂圖騰。\n\n---\n\n### 第六章：現況：龍脈怒號與言靈奪鼎 (Roar of the Dragon-Veins & The Sovereign Incantation)\n\n- **對應年代**：當前星瀾紀（遊戲開始時，進行式）。\n- **劇情大綱**：\n  天頂星瀾的空前異變同樣在震旦大陸掀起了驚天波瀾。天塹深處的能量倒灌使得震旦沉睡的三千丈地脈祖龍發出陣陣痛苦的悶吼，震旦各地的靈穴紛紛爆發煞氣噴湧，沉寂百年的名山大川妖煞橫行。山精水怪被暴烈地脈感染狂化，無數泛著各色靈光的「魂核結晶」散落於草莽林泉之間。\n  在此天地大變之際，震旦各派供奉的古老道爐——「太虛玄爐 (Great Void Furnace)」驟然火光沖天。修煉者們震撼地發現，凡人不再需要歷經百年苦修採集天地精華，只需在太虛玄爐前吐納精氣、發出心中願景言靈（言靈化形），熔爐便能借魂核靈韻與天地五行，熔鑄出神意交融的絕世神兵。\n  神兵現世的誘惑點燃了震旦天下的野心。在斷雲關（OR-03），赤炎霸王赫連烈高舉破炎戰戟，在十萬將士面前吼出了令天地變色的誓詞：「天行剛健，唯武自強；強者立命，逆海奪鼎！」赤焰軍宣布進入全面動員，在熔谷晝夜不停鑄造重戟甲冑，毫不掩飾其強渡天塹、問鼎天下的野心。\n  而在碧瀾商都（OR-02），溫九娘斜倚狐裘，撥動金算盤，冷靜地布下了一張無形的經濟殺網。商盟迅速啟動「天機銀號」，一方面暗中以超高溢價大肆收購各方的高階魂核與神木，另一方面透過九方錢莊操縱匯率，大幅收緊對赤焰軍與歐羅巴駐地的物資貸款，逼迫天下英雄為商盟驅使。\n  古王朝皇城雲闕城（OR-01）則陷入了空前恐慌。欽天監的地動儀九龍吐珠長鳴不止，皇城禁軍日夜戒嚴；而高懸雲端的凌霄宗（OR-04）亦感到天劫將至，宗門長老開始派遣外門弟子下山，收納英才。\n  動盪之世，正是英雄輩出之時。來自民間的游俠劍客、深山道童與草莽力士紛紛收拾行囊，踏入了這個充滿機遇與殺戮的狂潮之中。\n- **新人起點與動機**：\n  新進冒險者以初涉江湖的「布衣劍客」、「下山道童」或「鏢局趟子手」身分，自碧瀾商都水道（OR-02）、青冥竹海草廬或雲闕城下層坊市（OR-01）出發。他們初出茅廬，或為求在妖煞亂世中保全宗族鄉梓，或為求得太虛玄爐言靈召喚、親手鑄就一把傳世神兵，亦或為了追尋劍意真諦與仙道長生。冒險者在震旦大地上除妖衛道、探尋秘境，唯有一身武魄真氣圓融貫通、衝破生死玄關（世界觀上達到通達極境，不寫遊戲術語），方能名動各方，受邀踏入斷雲帥帳、水鄉商盟總舵或跨洲駐地，抉擇陣營歸屬，爭奪天下霸權。\n- **進行中之衝突與謎團（交 AI Director & AI Sovereigns 動態推進，不寫結局）**：\n  1. *衝突一：【逆海戰鼓 vs. 金絡鎖喉】*\n     赫連烈在邊境悍然扣押了商盟運往歐羅巴的三艘滿載精鐵的飛梭，聲明全數充作軍資；溫九娘隨即在九海錢莊實施反制，凍結赤焰軍在全洲所有的票號帳戶，並暗中僱用跨洲游俠伏擊赤焰軍的採礦前哨。兩大勢力在邊界頻繁交火，邊關劍拔弩張。\n  2. *衝突二：【皇城地動與欽天凶卦】*\n     雲闕城宮城深處的祖龍地穴連續七日傳出凶煞戾鳴，欽天監官員批出「九鼎裂、天子移」的驚天凶卦。古王朝禁軍統領尉遲風（OR-01-N1）奉詔封閉九街坊市，大舉搜捕「散布妖言」的江湖術士與商盟暗樁，引發市井劇烈反彈，皇城下層騷亂不斷。\n  3. *衝突三：【宗門遺訓與浮空危機】*\n     凌霄宗（OR-04）雲海浮空峰的太古靈磁核心近期出現劇烈紊亂，浮島高度下沉百丈。藏經閣長老虛玄長老（OR-04-N2）發現，封印在峰底的古代西方機械幾何法陣正在與海峽對岸某處共鳴，宗門內部對是否與歐羅巴學者接觸產生了嚴重分裂。\n- **萬靈裔的身影**（SP1-009 補入）：在首府面臨戰火攻城威脅之際，赫連烈與溫九娘均透過群島暗線接觸萬靈行會大主裁索蘭，商討一旦首府遭敵軍奇襲時出動『鐵狼突擊軍團』之馳援代價。\n- **關鍵人物**：\n  - **赤炎霸王 赫連烈 (The Crimson Sovereign, He-Lian Lie)**：OR-03 統帥（現年 45 歲），身形逾九尺的武道狂人，誓以鐵拳戰戟打破世界秩序。\n  - **總舵魁 溫九娘 (Grand Factor, Lady Wen Jiu-Niang)**：OR-02 掌舵人（現年 34 歲），容顏傾城、算無遺策的商盟女皇，指掌間撥動萬國財富。\n  - **禁軍統領 尉遲風 (Commander Yuchi Feng)**：OR-01-N1（現年 48 歲），恪盡職守的古王朝禁軍宿將，在皇權衰落與狂潮亂世中竭力維持秩序。\n  - **凌霄宗藏經閣長老 虛玄長老 (Elder Xu-Xuan)**：OR-04-N2（現年 86 歲），白鬚垂胸的道門碩學，暗中追查浮空峰底西方幾何法陣之謎。\n- **關鍵地點**：\n  - **OR-01 雲闕城太虛玄爐天工殿 (The Void Furnace of Cloudgate)**：懸浮於皇城中軸的太古道爐，青煙直透霄漢。\n  - **OR-02 碧瀾商都九海聚寶樓 (The Nine-Seas Grand Tower)**：水鄉最高木構樓閣，拍賣行與商盟議事堂所在地。\n  - **OR-03 斷雲關熔谷兵器爐 (Caldera Forge of Cloud-Sever Pass)**：赤焰翻滾的地熱熔岩谷，赤焰軍鍛造萬人戰戟之所。\n- **遊戲中的遺跡**：\n  1. *新手引導工坊任務【言靈初契】*：冒險者初次將野外竹精魂核置入太虛玄爐，以口訣心念煉成專屬新手品質兵刃。\n  2. *動態公共事件【絲路鏢隊爭奪戰】*：AI Director 根據陣營資源動態生成的跨圖護送事件，商盟玩家護鏢，赤焰軍或游俠劫鏢。\n  3. *地脈異變道具【欽天監裂靈符】*：擊殺野外暴動妖首獲得的特殊符籙，可在特定靈穴召喚出隱藏的菁英地脈怨靈。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：斷雲關熔谷兵器鑄師在鍛造一柄赤銅大戟時，自地底赤熱岩漿中撈起了一截未融化的古怪黑色金屬殘片，上面竟刻有西方教廷風格的「雙翼神鳥」紋章。（指向擴充類型：**跨洲共同事件 / 兩陸神代同源與地底通道**）\n  - **次要線索**：熔谷地熱裂隙深處每逢子夜會傳出宛如遠古管風琴共振的奇異嗡鳴，音階規律完全符合西方幾何聖言音律。\n\n---\n\n## C. 開放結局\n\n兩條大陸故事線在第 6 章皆停在山雨欲來的進行式。世界的未來並非寫死的腳本，而是交由四大陣營首領代理人（Sovereign Agents）、中央事件調度器（AI Director）以及全體玩家的陣營戰與工坊鍛造行為動態演進。以下為每條線列出三個可能的發展走向：\n\n### 歐羅巴大陸後續走向（三選一演進）：\n\n- **走向一：鋼鐵壁壘的誓約東征 (The Silver Bastion Vow-March)**\n  若鐵銀公約在陣營博弈中佔據絕對優勢，奧古斯都大元帥將全面下達《渡海動員令》。公約軍團將聯合誓約騎士，強渡天塹，全面封鎖天塹群島，並以鋼鐵要塞戰術強攻震旦前哨，試圖以冰冷法理與重甲秩序終結海峽動亂。\n- **走向二：星軌共鳴與奧術狂潮 (The Astral Zenith Awakening)**\n  若星盤修會成功收集到足夠的深海星髓數據，奧蕾莉亞將啟動學院城頂端的「超限星盤矩陣」。這將在歐羅巴引發全域魔力潮汐，徹底喚醒地底沉睡的神聖天柱遺跡，但亦可能導致黑森林魔女與深淵巨獸全面失控狂暴，將歐陸推向未知的奧術異變。\n- **走向三：黑金滲透與要塞內訌 (The Gilded Fracture)**\n  若雲海商盟與赤焰軍在歐陸的滲透達到臨界點，溫九娘將藉由千帆商館實施軍工原料禁運，導致艾森堡底層工匠大暴動。公約防線自內部瓦解，迫使奧古斯都不得不向修會或對岸妥協，歐羅巴陷入長期的多方割據亂局。\n\n### 震旦大陸後續走向（三選一演進）：\n\n- **走向一：赤炎焚天與逆海奪鼎 (The Crimson Sea-Cleaving)**\n  若天行赤焰軍在邊境戰略中奪得霸權，赫連烈將率領破軍鐵騎全員出關，公然撕毀《天塹海岬不戰公約》，以萬人血煞強佔鯨骨自由港，並將戰旗直插歐羅巴沿海。天下尚武豪傑紛紛歸附，掀起席捲兩洲的大陸全面爭霸戰。\n- **走向二：九海金網支配乾坤 (The Sovereign Ledger's Reign)**\n  若雲海商盟在經濟暗戰中取得全盤控制，溫九娘將透過九方錢莊操縱全境拍賣行的命脈與神兵流通，以巨額賞金僱用跨洋傭兵架空古王朝皇權，甚至迫使三大軍事首領低頭，建立一個由商盟財閥暗中統治的兩洋金融帝國。\n- **走向三：祖龍天劫與群仙入世 (The Earth-Dragon Cataclysm)**\n  若天塹深淵的地脈共振突破閾值，震旦祖龍將爆發二次裂變，雲闕城皇宮深陷地底天坑。面對沉陸之危，凌霄宗全體御劍出山，古代仙魔封印全面崩解，天下俠士在宗門號召下組建救世同盟，文明格局面臨推倒重來的大洗牌。\n\n---\n\n## D. 擴充鉤子登錄表\n\n本表嚴格逐條對齊兩大陸 12 章內文，每章正好對應一條主鉤子，並增列章節中出現的次要線索。第四個擴充方向依 Opus 審閱定案為「南溟歸墟 / The Abyssal Return」；天塹之裂真相僅保留 2–3 個互相矛盾的假說，不寫死單一宇宙解答。\n\n| 伏筆名稱（主鉤子） | 出處章節 | 指向的擴充類型 | 章節內文次要線索 | 未解之謎線索與未來可能的展開方向 |\n|---|---|---|---|---|\n| **神聖巨塔的極北寒霜符文** | 歐羅巴 第 1 章 | **極北冰原**<br>`The Boreal Wastes` | 哀慟海崖地下散落的不融深藍冰晶；極北永夜天幕長年翻滾的血色極光。 | 羅德里克石化基座銘刻之拓撲符號直指極北寒霜神碑。傳說永凍土層下封存著神柱紀元更古老之耐寒神聖天柱，預留為未來極北冰原探險資料片，探索萬年玄冰封印之遠古遺跡。 |\n| **莫爾甘的冰火鎖鏈讖言** | 歐羅巴 第 2 章 | **兩大陸第 7 章以後**<br>（天地異變主線） | 初代魔女莫爾甘沉入悲鳴黑沼深處的鉛盒鍊金手卷，至今未被教會搜獲。 | 莫爾甘臨刑前斷言大地是被南北極端能量對沖撕裂。若玩家在後續版本解開黑沼鉛盒封印，將推翻舊神教會千年的「神罰」法理，引爆全大陸宗教革命與第 7 章主線演進。 |\n| **深海青銅廢墟的航海筆記** | 歐羅巴 第 3 章 | **西方失落新大陸**<br>`The Far Western Expanse` | 霜灣港老潛水伕打撈出的精密同心圓青銅齒輪殘片。 | 戈德里克船長在鯨骨島以西三百海里深處目睹連綿數十里的發光青銅廢墟。證實西大洋彼岸存在未受天塹之裂毀滅的高階青銅機械文明，預留為未來遠洋跨海探索新大陸版本。 |\n| **斷脊海底的深淵凝視巨瞳** | 歐羅巴 第 4 章 | **跨洲共同事件**<br>（深淵世界首領） | 暗礁鐵陵沉船龍骨上殘留的巨大半月形吸盤烙印與石化痕跡。 | 康斯坦丁旗艦日誌記載海底百丈金色巨瞳。天塹深淵最底部沉眠著超越凡人認知的太古活體星核巨獸。當天頂星瀾達到共振峰值時，巨瞳甦醒將引發全服跨洲聯合討伐戰。 |\n| **教廷古星圖的被塗黑象限** | 歐羅巴 第 5 章 | **西方失落新大陸**<br>`The Far Western Expanse` | 學院城地下密室鎖藏的未知冷鋼失落幾何象限儀。 | 奧蕾莉亞珍藏古星圖中三個被前代教皇塗黑抹除的落日天區。邊注警語暗示教會高層知曉西方失落大陸之存在並極力封鎖消息，預留為秘術學者發起遠洋探勘之資料片線索。 |\n| **聖言熔爐中的東方祝禱重音** | 歐羅巴 第 6 章 | **跨洲共同事件**<br>（雙陸神代同源） | 熔爐排出的廢渣中凝結出非歐幾何晶格與五行色澤共存的共鳴石。 | 大師博爾斯淬鍊高階魂核時聽見東方道門祝禱。暗示智能工坊底層技術（聖言共鳴與言靈化形）本為同一神代法則，預留為跨洲神兵鍛造融合機制（合璧傳奇武器）之世界觀依據。 |\n| **大天師的大醮絕筆石碑** | 震旦 第 1 章 | **天塹之裂真相**<br>（多重矛盾假說） | 峭壁上的鎮海九鼎殘片，每逢望朔之夜向南溟方向發出週期哀鳴。 | 大天師姜守虛斷言墜星恐非自然之災。此處不設固定宇宙答案，保留**三大矛盾假說**：① 天外神明降罰/星海大能投擲說；② 地脈祖龍陰陽大週期反噬說；③ 太古文明過度抽取原核導致空間崩解說。留待終極資料片由玩家探尋。 |\n| **浮空峰底部的太古機械嵌合核心** | 震旦 第 2 章 | **西方失落新大陸 / 神代同源** | 浮空峰山根斷裂處定期噴出的高溫熱蒸汽靈霧與冷鋼碎屑。 | 凌霄宗浮空仙山底部核心可見非自然齒輪咬合構造，超越五行法陣範疇。證實神代文明具備高度機械工藝，未來可引導道士與學者跨洲聯合考古，解鎖「反重力仙舟」跨海空戰玩法。 |\n| **沈行舟航海圖的赤道火海警告** | 震旦 第 3 章 | **烈日荒原**<br>`The Sunscorched Badlands` | 極南海域漂流而來的赤銅流火木，通體燃燒無煙赤焰。 | 沈行舟航海圖記錄南方瀚海赤道區終年沸騰、烈焰接天，有赤鱗巨獸出沒。南方大洋彼岸的烈日荒原是一片火山狂暴噴發的蠻荒大陸，預留為未來高難度極限環境生存與火屬性擴充。 |\n| **斷脊海戰現身的黑金羽衣神秘人** | 震旦 第 4 章 | **天塹群島獨立線**<br>（領航者評議會底細） | 群島世代流傳的「黑羽引航者」古海圖殘頁與水下太古祭壇傳聞。 | 赫連鐵山親兵目睹黑金羽衣神秘人徒手撫平千尺海嘯。該人物非西非東，疑為太古海魂化身或評議會議長本體，揭示天塹群島背後隱藏著守護落星穹頂星髓之遠古守望者組織。 |\n| **皇朝密檔的南溟歸墟進貢錄** | 震旦 第 5 章 | **新提出擴充方向：**<br>**南溟歸墟**<br>`The Abyssal Return` | 商盟地庫中查獲的非金非木黑木信牌，刻有水下垂直漩渦噬魂圖騰。 | 古天子密卷記載每三百年需向南溟無底歸墟進貢童男女與隕鐵。南溟歸墟為大洋沉陷之垂直深淵，連通九地幽冥與死者魂核歸宿，預留為未來「幽冥航海、靈界引渡與水下深淵討伐」資料片。 |\n| **熔谷岩漿撈出的雙翼神鳥殘片** | 震旦 第 6 章 | **跨洲共同事件**<br>（地心通道 / 神代同源） | 熔谷地熱裂隙深處定期傳出管風琴共鳴般的地心嗡鳴。 | 震旦地底岩漿撈出西方雙翼神鳥紋章殘片，且伴隨管風琴音律地鳴。佐證兩大陸在地殼深處依然存在未完全切斷的熔岩通道，預留為未來「地心大空洞地下世界」地圖接口。 |\n\n---\n\n## 新名詞清單（中文／English／類別／出處／世界觀簡述）\n\n本清單整理自本企劃（含 r2 修訂），嚴格遵循專有名詞規範，避免現實地名與宗教混淆，待主控審閱後可補入 `docs/glossary.md`。\n\n| 中文名稱 | English Name | 類別 | 出處章節 | 世界觀簡述 |\n|---|---|---|---|---|\n| **神聖天柱** | The Sky-Pillars | 歷史 / 建築 | 歐羅巴 §1 | 太古中央陸橋矗立的通天大理石幾何巨構。 |\n| **原初光輝** | The First Radiance | 信仰 / 神話 | 歐羅巴 §1 | 歐羅巴舊神教廷崇拜之至高神聖本源（修正 Prime Radiant）。 |\n| **神罰天塹** | The Cleavage of Wrath | 歷史 / 地理 | 歐羅巴 §1 | 歐羅巴舊教廷對天塹之裂的神學稱謂（不作遊戲名）。 |\n| **哀慟海崖** | The Weeping Cliffs | 地理 | 歐羅巴 §1 | 天塹西岸浪擊黑石發出悲鳴的萬丈絕壁。 |\n| **聖貝里克** | St. Berric the Unbroken | 歷史人物 | 歐羅巴 §1 | 第一任光輝守望者，以純白重盾掩護萬民西遷之聖徒。 |\n| **大造物師 羅德里克** | Master Roderic the Stone-Binder | 歷史人物 | 歐羅巴 §1 | 末代巨塔總工匠，引發天柱崩塌後將自身石化封印地裂。 |\n| **瓦爾瑟夫・馮・埃森巴赫** | Waltheof von Eisenbach | 歷史人物 | 歐羅巴 §2 | 首任誓約審判長，奧古斯都先祖，嚴酷獵巫敕令推行者。 |\n| **「隱霧者」莫爾甘** | Morgath the Veiled | 歷史人物 | 歐羅巴 §2 | 初代黑森林魔女領袖，古典草藥鍊金術奠基人，留冰火讖言。 |\n| **初位引星者 埃莉諾拉** | Eleonora the Stargazer | 歷史人物 | 歐羅巴 §3 | 星盤修會思想鼻祖，發明共鳴星盤儀並測繪星瀾航道。 |\n| **戈德里克船長** | Captain Godrick Gale-Rider | 歷史人物 | 歐羅巴 §3 | 風暴破浪者，率晨星號首航衝破盲霧的北境探險家。 |\n| **霜灣港** | Frostfjord Port | 地理 (EU-03) | 歐羅巴 §3, §6 | 歐羅巴北境峽灣深水海港，千帆商館駐地。 |\n| **康斯坦丁公爵** | Duke Constantine the Iron-Heart | 歷史人物 | 歐羅巴 §4 | 鐵獅遠征艦隊末期統帥，骨礁海戰指揮官，公約簽署者。 |\n| **「刻骨者」柯特** | Kurt Bone-Carver | 歷史人物 | 歐羅巴 §4 | 天塹水手起義領袖，領航者評議會首任執政代表。 |\n| **斷脊暗礁群** | Spine-Breaker Reefs | 地理 | 歐羅巴 §4, 震旦 §4 | 天塹中央險惡暗礁水下墓地，骨礁海戰主戰場。 |\n| **樞機長 盧西安** | Archbishop Lucian the Rigid | 歷史人物 | 歐羅巴 §5 | 舊神教廷保守派末代強權大主教，激化星盤修會獨立。 |\n| **聖言熔爐** | The Logos Crucible | 系統 / 建築 | 歐羅巴 §6 | 歐羅巴對智能工坊之神聖稱謂（修正萬神機爐）。 |\n| **兵工廠鐵匠大師 博爾斯** | Master Bors the Hammer | 城市 NPC (EU-01-N2) | 歐羅巴 §6 | 艾森堡聖言熔爐主理人，性烈如火的鍛造大師。 |\n| **「黑鴉草藥師」賽蓮娜** | Selene the Raven-Herbalist | 城市 NPC (EU-03-N3) | 歐羅巴 §6 | 霜灣港黑石防波堤旁的溫和派魔女聯絡人，經營隱秘草藥鋪。 |\n| **「灰燼編織者」伊索爾德** | Isolde the Ash-Weaver | 陣營威脅 / 野外首領 | 歐羅巴 §6 | 暮影黑森林激進派魔女首領，率異化獸群圍困霜灣港陸路。 |\n| **昊宣帝** | Emperor Hao-Xuan | 歷史人物 | 震旦 §1 | 太初古皇朝末代人皇，天柱之裂親歷者。 |\n| **欽天道院開山大天師 姜守虛** | Grand Tao-Master Jiang Shou-Xu | 歷史人物 | 震旦 §1 | 震旦道門至聖、欽天道院始祖，燃元神立九鼎定海阻裂。 |\n| **地脈祖龍** | The Earth-Dragon | 神話 / 生物 | 震旦 §1 | 沉睡於厚土之下維繫乾坤氣運的太古靈尊。 |\n| **斷龍崖** | The Dragon-Severed Precipice | 地理 | 震旦 §1 | 天塹東岸祖龍折尾所化之赤黑絕壁。 |\n| **凌虛道人** | Daoist Master Ling-Xu | 歷史人物 | 震旦 §2 | 凌霄宗開山始祖，以無上法力拔九峰入雲創立浮空仙境。 |\n| **凌霄宗** | Cloud-Loft Sect | 地理 / 宗門 (OR-04) | 震旦 §2, §6 | 懸浮於萬丈雲海之上的浮空仙山，道士與劍修修道之地。 |\n| **「孤篇劍聖」陸白衣** | Lu Bai-Yi the Lone Shroud | 歷史人物 | 震旦 §2 | 游俠劍客鼻祖，創純粹劍意斬妖護生的布衣傳奇。 |\n| **欽天監靈星官 墨衡** | Mo Heng the Astromancer | 歷史人物 | 震旦 §3 | 欽天監術數名臣，以二十八宿推演解碼星瀾航道坐標。 |\n| **遠洋海商元祖 沈行舟** | Shen Xing-Zhou the Tide-Rider | 歷史人物 | 震旦 §3 | 水鄉船幫先驅，傾資造辟水神木浮槎首航群島。 |\n| **碧瀾商都** | Jade-Ripple Emporium | 地理 (OR-02) | 震旦 §3, §6 | 雲海商盟總部，水網密布的水上貿易首府。 |\n| **靖海大將軍 赫連鐵山** | General He-Lian Tie-Shan | 歷史人物 | 震旦 §4 | 赫連烈曾祖，率五行樓船征戰海岬末期的百戰老將。 |\n| **商幫先祖 溫積善** | Wen Ji-Shan the Elder | 歷史人物 | 震旦 §4 | 溫九娘曾祖，策動群島罷市、開創跨洋商路之商界奇才。 |\n| **執政親王 姬天成** | Prince Regent Ji Tian-Cheng | 歷史人物 | 震旦 §5 | 古皇朝末代攝政王，試圖制衡軍閥與商賈反被架空。 |\n| **斷雲關** | Cloud-Sever Pass | 地理 (OR-03) | 震旦 §5, §6 | 天行赤焰軍總部，黑石赤銅巨關，地熱熔谷環繞。 |\n| **太虛玄爐** | Great Void Furnace | 系統 / 建築 | 震旦 §6 | 震旦對智能工坊之道門稱謂。 |\n| **禁軍統領 尉遲風** | Commander Yuchi Feng | 城市 NPC (OR-01-N1) | 震旦 §6 | 雲闕城古皇朝禁軍統領，維持坊市秩序的忠肅宿將。 |\n| **藏經閣長老 虛玄長老** | Elder Xu-Xuan | 城市 NPC (OR-04-N2) | 震旦 §6 | 凌霄宗藏經閣長老，追查浮空峰底西方機械幾何法陣之謎。 |\n| **南溟歸墟** | The Abyssal Return | 地理 (保留擴充) | 震旦 §5, §D | 南溟大洋沉陷形成的水下垂直深淵，全新擴充方向。 |\n\n---\n\n"}, {"id": "lore-naming", "group": "世界觀聖經", "title": "命名規範", "version": "v0.1", "file": "docs/lore/naming.md", "text": "# 命名規範 (Naming Conventions) v0.1\n\n- 狀態：v0.1 定稿（Opus 整合 SP1-004 §4，並納入 SP1-001／004／006 審閱與 ADR-0005、0008 的規則，2026-10-06）\n- 中英對照的唯一來源是 `docs/glossary.md`；本文件規定新名詞**怎麼取**\n\n## 1. 三區語感規則\n\n### 歐羅巴 (Europa)\n\n- **基調**：沉重、莊嚴、神聖、冷峻。取材自中古高地德語、古諾曼語、古英語與教會拉丁語。\n- **地名**：城市優先用德語系構詞（`Eisen-burg`、`Nebel-burg`），不在同一個名字裡混用英語與德語；中文可音譯（艾森堡）或意譯（霧環堡）。聖人地名用**虛構**聖人。\n- **組織**：Order（修會）、Chapter（分會）、Concord（盟約）、Inquest（審判）。\n\n| 類別 | 中文 | English | 說明 |\n|---|---|---|---|\n| 人名 | 瓦爾瑟夫・馮・埃森巴赫 | Waltheof von Eisenbach | 貴族帶封地介詞 von／de；音節硬朗 |\n| 地名 | 聖貝里克裂骨崖 | St. Berric's Crag | 虛構聖人＋嚴酷地貌 |\n| 組織 | 白銀審判騎士修會 | Chapter of the Silver Inquest | |\n| 重裝物品 | 鐵衛之誓重裝板甲 | Iron-Oath Bulwark Cuirass | 鐵、銀、誓言、防衛 |\n| 秘術物品 | 日蝕共鳴星盤儀 | Eclipse Resonating Astrolabe | 幾何、天文、法術 |\n\n### 震旦 (Orientis)\n\n- **基調**：空靈、沉雄、典雅。取材自先秦古風、邊塞詩、市井風物與仙俠志怪；講究平仄。\n- **人名**：複姓或古風單名，名含天地、道家或金石刀戈之意。英文用拼音，姓與名分開、雙字名以連字號連接（He-Lian Lie、Wen Jiu-Niang）。\n- **地名與組織**：閣、司、宗、關、渡、樓；英文多意譯（Cloud-Sever Pass、Cloud-Loft Sect）。\n\n| 類別 | 中文 | English | 說明 |\n|---|---|---|---|\n| 人名 | 司徒無涯 | Situ Wu-Ya | |\n| 地名 | 九霄凌雲渡 | Nine-Heavens Cloud-Ford | |\n| 組織 | 萬象天工閣 | Pavilion of Celestial Artifice | |\n| 武器 | 霜毫照影唐刀 | Frost-Plume Shadow-Blade | 自然元素融入鋒芒 |\n| 法器 | 八卦紫虛定靈鏡 | Purple-Void Hexagram Mirror | 陰陽、五行、卦象 |\n\n### 天塹群島 (The Rift Archipelago)\n\n- **基調**：粗獷、多語混雜、海上冒險、黑市俚語。東西姓氏混用，常帶綽號；地名直白殘酷。\n\n| 類別 | 中文 | English |\n|---|---|---|\n| 人名 | 「盲眼」巴托洛繆・陳 | \"Blind-Eye\" Bart Chen |\n| 地名 | 溺亡水手暗礁灣 | Drowned Mariner's Cove |\n| 組織 | 領航者私掠互保會 | Helmsmen's Privateer Guild |\n| 航海物品 | 裂隙穿浪羅盤 | Rift-Breaker Drift-Compass |\n| 黑市物品 | 浸血渡鴉刺青針 | Blood-Soaked Raven Needle |\n\n### 萬靈裔 (The Wildkin)\n\n- **基調**：野性自然、古樸厚重；歐羅巴系支系用硬朗短名＋稱號（烏爾夫・破誓者），震旦系支系用草木天候為姓的古意名（蘇微月）。完整規則見 `wildkin.md` §A.8。\n- **支系英文**：統一為 `The [形容詞] Kin`（Vulpine、Feline、Lupine、Ursine、Cervine、Corvid、Lutrine）。\n\n## 2. 中英翻譯原則\n\n1. **意譯**：職業、系統、組織、條約。例：聖堂騎士 → Templar；魂核結晶 → Soul Nucleus；鐵銀公約 → The Iron & Silver Concord。\n2. **音譯**：人名，以及沒有合適意譯的東方專名。例：赫連烈 → He-Lian Lie。\n3. **對等創譯**：直譯會失去意境或讓外國玩家看不懂時，英文另取氣質相當的名字。例：天行赤焰軍 → The Crimson Vanguard；雲海商盟 → The Cloudveil Syndicate。\n4. **中英必須互相對應**：不能出現英文沒有的意象（如「獅心」對 Concord），也不能中文是 A、英文是 B（如「瓦倫泰／Waltheof」「定靈鏡／Talisman」）。\n5. 新名詞在提案中標「暫譯」，由 Opus 定案後才寫入 glossary。\n\n## 3. 禁用清單\n\n| 分類 | 禁用 | 原因 | 替代 |\n|---|---|---|---|\n| 歐羅巴 | 儀軌、法印、丹田、渡劫、元神、靈脈、天人合一 | 佛道／修真語感 | 律法、符文、神恩之環、魔力經絡、聖痕 |\n| 歐羅巴 | 耶穌、基督、梵蒂岡、十字軍、羅馬、真實聖人名（如 St. Gregory） | 現實宗教與歷史 | 原初光輝、舊神教廷、虛構聖人 |\n| 震旦 | Empyrean、主保聖人、彌撒、樞機、修道會、公爵 | 西方宗教與封建語感 | 蒼穹、祖師、祭天大典、掌門、藩王 |\n| 震旦 | 中國、神州、華夏、赤縣、九州／九洲、江南、兩淮、蜀、南海、天朝藩屬 | 現實國名、地名或史觀 | 震旦、皇朝、碧波水鄉、兩河、南溟 |\n| 震旦 | 旗袍 | 時代錯置（近代服飾） | 交領大袖、錦緞 |\n| 天塹群島 | 管委會、特別行政區、自貿區、非軍事區 | 現代公文語感 | 領航者評議會、自由海岬、不戰海域 |\n| 全域 | 租界、領事裁判權、期貨、董事、股份 | 殖民史或現代經濟語感 | 駐地、匯兌、票據、議事堂 |\n| 全域 | 槍、砲、一般火藥 | 火器尚未定案 | 弩炮、**鍊金火藥**、鍊金炮 |\n| 萬靈裔 | 獸人（易與 orc 混淆）、Therian（現實次文化用語）、「狸」指貓族（易聯想日本狸貓）、九尾妖狐套路、日系萌化用語（獸耳娘、喵喵等）、現實原住民族名 | 誤解、現實指涉或風格不符 | 萬靈裔、靈貓、單尾寫實狐族 |\n| 全域 | 艾森加德、Prime Radiant、Soulforge 等既有作品專名 | 撞名 | 新造詞，並做撞名檢索 |\n| 設定文本 | 全服、Lv.、副本、Boss、Tier | 遊戲術語（設計註、遺跡欄可用） | 天下、極境、地宮、三階魂核 |\n\n## 4. 名稱提案檢查表\n\n提案新名詞前逐項確認：\n\n- [ ] 屬於哪個區域？語感符合該區規則？\n- [ ] 中英互相對應？\n- [ ] 不在禁用清單？沒有指涉現實國家、民族、宗教人物或地名？\n- [ ] 與 glossary 現有名詞不重複、不易混淆？\n- [ ] 英文名做過基本撞名檢索（知名遊戲、小說、影視）？\n"}, {"id": "lore-whalebone-freeport", "group": "世界觀聖經", "title": "鯨骨自由港 Whalebone Freeport（RA-01）— 街區配置", "version": "v0.2", "file": "docs/lore/whalebone-freeport.md", "text": "# 鯨骨自由港 Whalebone Freeport（RA-01）— 街區配置 v0.2\n\n天塹群島首府、領航者評議會所在，全遊戲的**中立主城**。城市設定見 `geography.md` §4–§5；歷史地標的典故見 `story.md`。\n\n- 配置設計：Opus（v0.1）；依 SP1-007 Codex 的審查建議修訂為 v0.2。\n- 圖：`experiments/whalebone-layout/`。**`WB-00.png` 是規劃基準**，繪製圖與它有出入時以 WB-00 為準。\n- 規則：ADR-0009（安全區）。\n- **公制數值以 `cities/RA-01.json`（v0.4）為準**：灰盒量測後，公約石階各平台間距加大、公共鍛造台移到工坊階東側、港口到東澳改為坡道（見 `cities/RA-01.md`）。\n\n## 1. 整體\n\n| 項目 | 設定 |\n|---|---|\n| 地形 | 朝南的海崖，城市分四層沿崖而上；太古巨鯨的肋骨構成防波堤與城內的拱架 |\n| 規模 | 約 600 m × 400 m；高差 0–120 m 是外觀目標，打樣時可壓縮到 60–80 m，但要保留四層 |\n| 東西分側 | 西半部偏歐羅巴（石牆、石板瓦、哥德山牆），東半部偏震旦（木構、青瓦），中軸是評議會的群島建築（鯨骨、拆船木料、銅頂、玄武岩） |\n| 盛行風 | 由東北吹向西南海面，把工坊的煙帶離城市 |\n| 規則 | 街區 1–8 為**安全區**，禁止一切 PvP，由評議會守望隊維持秩序；穿過街區 9 進入鏽錨走私暗灣後，懸賞與 PvP 恢復 |\n\n## 2. 街區\n\n| # | 街區 | 高度層 | 內容 | 玩法功能 |\n|---|---|---|---|---|\n| 1 | 肋骨港 Rib Harbor | 海平面 | 鯨骨防波堤圍成的主港；兩洲船隻、起重吊臂、評議會稅關（群島建築） | 玩家抵達點、海運、碼頭任務 |\n| 2 | 東澳 Whalebone East-Haven | 海平面（東側小灣） | 震旦式泊位；九方客棧、九方錢莊 | 銀行／倉庫、雲海商盟任務、歷史地標 |\n| 3 | 自由市集 Free Market | 下層（中軸偏西） | 層層攤位與倉庫、拍賣大廳 | 拍賣行、玩家擺攤、交易 NPC |\n| 4 | 工坊階 Forge Terraces | 中層西側 | 依崖而建的鍛造工坊與淬火槽；智能工坊 The Forge 的公共鍛造台 | 生產玩家核心區、AI 鍛造 |\n| 5 | 公約石階 The Accords Steps | 中軸，下層→上層 | 儀式性大階梯；中段平台的公約浮雕：兩把交叉放下的入鞘劍、船與海浪，無文字 | 主幹動線、歷史地標 |\n| 6 | 評議會廳 Helmsmen's Hall | 上層中央 | 銅頂議事廳、守望隊駐所、玄武岩與銅的引航燈塔 | 主線任務、外交、懸賞榜 |\n| 7 | 戈德里克導航石碑 Godrick's Stele | 上層西端崖頂 | 第一座導航石碑與觀景台 | 地標、劇情點 |\n| 8 | 陣營館區 | 中層兩翼 | 西：銀獅海事衛所（歐式石造，銀獅徽記）；東：戰修武閣（震旦木構）。隔中軸對望 | 陣營任務、跨洲懸賞 |\n| 9 | 暗灣入口 | 防波堤西端 | 從稅關倉庫後方的潮汐維修通道進入，不在抵達點的視線內；海蝕洞位於港口下方 | 安全區邊界；通往城外黑市 |\n\n## 3. 動線\n\n- **服務距離**：從抵達點（1）步行到拍賣行（3）、銀行（2）、The Forge（4），都在約 60–90 秒內。\n- **公約石階**：主幹動線，沿途要有足夠的休息平台。\n- **兩條公共升降台**：玩家一抵達就能使用，站點設在服務街區**裡面**，坐升降台不會跳過市集與工坊。\n  - 西線：下站在自由市集，中站在工坊階旁，不放在使用中的鍛造區內。\n  - 東線：下站在東澳。\n- **東澳之字坡道**：從東澳通往東翼陣營館的第二條路線，與東線升降台分開，避免銀行人流和陣營人流互相擋路；不能穿過九方錢莊的後勤空間。可以有短段階梯，因為兩條升降台全時開放。\n- **繩橋**：掛在鯨骨拱之間，只當捷徑，不能是唯一的路線；寬度、欄杆與墜落復原規則另訂。\n\n## 4. 安全區邊界（街區 9）\n\n以場景本身呈現邊界，不只靠 UI 提示：通道口設**守望隊關卡與稅關閘門**，穿過時燈光與材質從評議會的暖色琥珀燈，轉為潮濕的鏽鐵與暗色岩洞。\n\n## 5. 圖\n\n| 圖 | 檔案 | 用途 |\n|---|---|---|\n| 配置示意圖（基準） | `WB-00.png`、`WB-00.svg` | 關卡規劃 |\n| 平面圖 | `WB-01.jpg`、`WB-01-labeled.jpg` | 東西分側與建築語彙 |\n| 剖面圖 | `WB-02.jpg` | 四層高度、升降台、海蝕洞（暗灣入口位置以 WB-00 為準） |\n| 近景 | `WB-03`（肋骨港）、`WB-04`（自由市集）、`WB-05`（公約石階與評議會廳）、`WB-06`（工坊階）、`WB-07`（東澳與陣營館） | 建築構造、出入口與氣氛 |\n\n## 6. 待辦\n\n- [ ] 灰盒打樣 (greybox)：驗證高度壓縮後的步行時間、坡度與升降台運量（交 SP8 與關卡製作）。\n- [ ] 評議會建築模組 (Council kit)：鯨骨拱、銅頂模組、玄武岩門洞、琥珀信號燈，作為之後群島建築的共用部件。\n- [ ] 戈德里克導航石碑近景圖。\n- [ ] 決鬥場位置（交 SP2、SP7）。\n- [ ] 評議會守望隊徽章；在定案之前，評議會建築一律不放徽記。\n"}, {"id": "lore-classes", "group": "世界觀聖經", "title": "職業與天賦", "version": "v0.1", "file": "docs/lore/classes.md", "text": "# 職業與天賦 (Classes & Specializations) v0.1\n\n- 狀態：v0.1 定稿（Opus 審閱 SP3-001 Gemini 原稿，2026-10-08）\n- 依據：GDD §4、ADR-0012（每職業雙天賦；不做二轉、進階職業；跨大陸學習暫緩）\n- 本文件只寫世界觀與定位；技能數值、幀數、技能歸屬以 `docs/subprojects/SP3_classes.md` 與 SP2 §9 為準\n- 「代表技能」是意象草案，技能表定稿時可改名；天賦名稱已收入 `glossary.md`\n\n## 總覽\n\n| 大陸 | 職業 | 核心機制 | 天賦 A | 天賦 B |\n|---|---|---|---|---|\n| 歐羅巴 | 聖堂騎士 Templar | 神聖防衛 Aegis | 誓約壁壘 Oathbound Bulwark（坦克） | 聖裁懲戒 Inquest Retribution（輸出） |\n| 歐羅巴 | 獵魔斥候 Inquisitor Scout | 弱點洞悉 Insight | 掣電連弩 Quickdraw Repeater（遠程輸出） | 荊棘刺客 Thorn Duelist（近戰輸出） |\n| 歐羅巴 | 秘術賢者 Arcanist | 共鳴法環 Harmonics | 星軌時輪 Chrono-Weaver（治療） | 元素星象 Astral Fusion（輸出） |\n| 震旦 | 游俠劍客 Blademaster | 劍意 Sword Intent | 瞬影疾刃 Phantom Edge（近身輸出） | 御劍凌霄 Cloud-Soaring Swords（中距離輸出） |\n| 震旦 | 五行道士 Taoist | 陰陽雙相 Yin-Yang | 太陰玄照 Lunar Dew（治療、控場） | 純陽天雷 Solar Thunder（輸出） |\n| 震旦 | 破軍力士 Titan Guard | 氣魄 Unstoppable Qi | 鎮嶽巨戟 Mountain-Anchor Halberd（坦克） | 狂煞巨斧 Blood-Fury Cleaver（輸出） |\n\n---\n\n## 聖堂騎士 Templar\n\n### 職業描述\n聖堂騎士的傳承源於三千年前天柱傾頹之浩劫。初代光輝守望者聖貝里克以純白重盾抵禦地裂、庇護萬民西遷，立下了恪守誓約、守護眾生的古老戒律。無論是在艾森堡的外圍軍營，或是晨光修道丘陵的白石鐘樓，聖堂騎士皆是不可動搖的防線中樞。他們身著厚重板甲，將舊神原初光輝的意志化為力量，堅信「誓約為甲，法理為刃」。在戰鬥中，聖堂騎士既是能以重盾化解萬鈞衝擊的鋼鐵要塞，亦能雙手高舉大劍化身審判者，以剛猛的光屬性重擊撕裂敵陣，給予玩家厚重、沉穩且極具安全感的攻防手感。\n\n### 核心機制：神聖防衛 (Aegis)\n神聖防衛源於騎士對誓約律法的堅定信念。當聖堂騎士以盾刃承受衝擊時，意志與外力碰撞引發聖言共鳴，將受擊震盪轉化為純白光輝儲存於護甲中。隨著防禦成功不斷充能，這股神聖能量可化作高爆發的光屬性反擊，破除黑暗。\n\n### 天賦 A：誓約壁壘 Oathbound Bulwark（坦克）\n- 描述：繼承聖貝里克以身作盾的苦修信條。此流派堅信「守護弱者即為至高誓約」，專精於重塔盾防禦術與陣列防守。他們將 Aegis 能量轉化為凝實的力場，使正面衝擊如撞磐石，並藉由防衛反擊提振陣線士氣。\n- 定位：立於首領正面吸收暴烈打擊，以完美防禦累積聖能，藉反擊回饋陣列庇護。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 盾衝 | Shield Rush | 舉盾衝鋒破開前線阻礙，以重盾邊緣沉重撞退強敵。 |\n  | 不動如山 | Bulwark | 頓盾立誓引發聖光庇護，大幅強化格擋韌性並硬抗衝擊。 |\n  | 聖域護佑 | Sanctuary Aegis | 展開環形聖光結界，為周遭同袍分攤所受衝擊。 |\n\n### 天賦 B：聖裁懲戒 Inquest Retribution（輸出）\n- 描述：延續長夜紀大審判長掃蕩異端的冷酷作風。此派深信「唯有斬除惡源方能守護純潔」，毅然卸下重盾、雙手執掌厚重大劍。他們以大劍招架與斬擊積聚 Aegis，並將能量直接附魔於劍刃之上，將防衛之光逆轉為暴烈的光屬性斬擊。\n- 定位：放棄大盾換取極限破壞力，以大劍招架與命中累積聖能，蓄力劈斬轉化為毀滅性的範圍聖光爆發。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 光輝重劈 | Radiant Cleave | 雙手高舉大劍凝聚熾烈光輝，重劈撕裂地面擊倒強敵。 |\n  | 聖裁反擊 | Judgment Counter | 以劍脊格開攻擊後迅猛橫斬，釋放蓄積聖能轟出巨大半月光浪。 |\n  | 審判之錘 | Hammer of Faith | 揮劍引召天頂神聖光槌砸落敵陣，以貫穿光束轟擊遠處目標。 |\n\n---\n\n## 獵魔斥候 Inquisitor Scout\n\n### 職業描述\n獵魔斥候源自長夜紀獵巫時期的黑森林巡邏隊。彼時教會裁判所為清除深林異化魔獸與禁忌集會，選拔了一批精通追蹤、解剖與荒野求生的敏捷武裝者。他們既受裁判所冷酷審訊法令的薰陶，又長期遊走於暮影黑森林與低地澤國的幽暗邊陲。獵魔斥候摒棄了沉重板甲與空泛誓詞，依賴淬毒彈藥、精密機械連弩、冷鋼刺劍與鍊金陷阱生存。其戰鬥哲學講求「伺機而動、一擊致命」，視戰鬥為一場精密的肢解手藝。在團隊中，他們是神出鬼沒的弱點狙擊手與戰場伏擊者，提供極高頻率的機動破防與爆發傷害。\n\n### 核心機制：弱點洞悉 (Insight)\n弱點洞悉源於解剖學眼光與鍊金痕跡追蹤。獵魔斥候交鋒時能瞬間捕捉魔獸關節暗傷、護甲接縫或魔力停滯點並加以標記；當攻擊精準命中這些脆弱部位時，便能引發深刻的撕裂創傷，破壞目標體態。\n\n### 天賦 A：掣電連弩 Quickdraw Repeater（輸出）\n- 描述：歐羅巴工坊機械射術的極致代表。此流派放棄近身糾纏，專注操縱精巧的手持連射雙弩。斥候遊走於戰場外圍，以超高射速壓制對手，並將特製鍊金彈藥源源不絕傾瀉至被標記的弱點處，在敵人近身前徹底瓦解其生機。\n- 定位：於中遠距離高速遊走輸出，以密集而精準的連弩射擊撕裂目標弱點。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 暴雨疾射 | Hailstorm Barrage | 雙手連弩急速交替扣動，向前方傾瀉如暴雨般的穿甲箭矢。 |\n  | 穿心重矢 | Heartseeker Bolt | 沉身換裝高壓貫通重矢，精準狙擊遠程破綻並引發巨量撕裂流血。 |\n  | 煙幕翻滾 | Smoke Evade | 向後翻滾拉開距離，原處爆開刺鼻鍊金煙霧阻斷敵人視線。 |\n\n### 天賦 B：荊棘刺客 Thorn Duelist（輸出）\n- 描述：脫胎於黑森林密林伏擊與地牢格殺的近身戰技。該派擅長在敵人的必經路徑預埋淬毒捕獸夾與酸蝕爆彈，同時以輕巧冷厲的刺劍穿透重甲縫隙。當獵物踏入陷阱受困哀鳴之時，便是其刺劍點穿咽喉之刻。\n- 定位：穿梭於陷阱與近身刀光間的決鬥刺客，藉牽制機關創造破綻，以高速突刺奪人性命。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 蝕骨鋼夾 | Corrosive Bear-Trap | 於地面佈設塗抹酸蝕鍊金藥劑的重型獵夾，禁錮目標並粉碎護甲。 |\n  | 穿喉連刺 | Lunging Puncture | 踏步突進連遞刺劍，如毒蜂尾針般連環穿透目標要害。 |\n  | 詭步截擊 | Riposte Shift | 偏身閃避攻擊並反手刺穿敵背，順勢踢爆微型震盪火藥震退敵手。 |\n\n---\n\n## 秘術賢者 Arcanist\n\n### 職業描述\n秘術賢者源於五百年前初位引星者埃莉諾拉的研究。彼時埃莉諾拉發明共鳴星盤儀，以幾何算式測繪出「天塹星瀾」，打破了教廷的思想枷鎖。如今，這門傳承在霧環堡的星盤修會與落星穹頂的研究所發揚光大。秘術賢者手持魔導書與星象法杖，不向盲目神明祈禱，而是將魔力視為可測量的空間常數與星辰軌道。他們深研「聖言共鳴」與古代天體規律，戰鬥時宛如嚴謹的幾何學者。在團隊中，他們既能操縱時空微調生機、回溯致命傷痕，亦能激發元素劇變引發連鎖星爆，是戰場上不可或缺的法則掌控者。\n\n### 核心機制：共鳴法環 (Harmonics)\n共鳴法環建立在「萬物皆為幾何頻率」的法理之上。秘術賢者施法時周身會凝結交錯的魔力幾何法環；當不同特性的共鳴波長在目標體內交匯疊加時，將引發連鎖法術共鳴，使治療或毀滅能量產生倍增擴散。\n\n### 天賦 A：星軌時輪 Chrono-Weaver（治療）\n- 描述：專注於推演天體重力與時序曲率的秘術分支。他們深知肉體受創不過是物質在某一時刻的混亂狀態，藉由在微觀尺度逆轉局域時流，能將同袍受創的軀體「回溯」至無損瞬間，甚至能遲滯敵人的動作以平息危機。\n- 定位：掌控時間維度的戰場管理者，藉回溯創傷、延緩時流與扭轉因果來維持全隊生機。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 時光回溯 | Temporal Rewind | 撥動星盤逆轉局域時鐘，將友方目標近期承受的創傷直接回溯平復。 |\n  | 遲滯力場 | Stasis Field | 展開扭曲時空的幾何光環，深陷其中的敵人動作與飛行軌跡皆陷入停滯。 |\n  | 命運微秒 | Destiny Epoch | 為瀕死同袍錨定因果印記，承受致死打擊瞬間強制逆轉時序並爆發治癒波紋。 |\n\n### 天賦 B：元素星象 Astral Fusion（輸出）\n- 描述：延續太古天柱「光輝之喉」能量奧秘的毀滅學派。他們將寒霜、熾炎與天雷納入星軌幾何矩陣，利用不同元素的對衝與坍縮，在戰場上催生出宛如小型恆星爆發般的連鎖聚變，焚盡一切抵抗。\n- 定位：掌控大範圍元素聚變的毀滅施法者，以冰火雷三相交織的連鎖法環撕裂敵陣。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 聚變星爆 | Supernova Convergence | 引導烈焰與天雷於一點急遽坍縮，隨後爆發出吞噬四周的耀眼星核。 |\n  | 霜極雷暴 | Rime-Storm Surge | 召喚極寒暴風雪冰封敵陣，隨即引天頂霹靂碎冰引爆，造成次級散射。 |\n  | 共鳴裂隙 | Harmonic Fissure | 撕開一道充滿微型星髓激波的魔力地裂，使踏入其中的敵人遭受連續元素震盪。 |\n\n---\n\n## 游俠劍客 Blademaster\n\n### 職業描述\n游俠劍客之名，始於長夜紀「孤篇劍聖」陸白衣。當其時地脈枯竭、妖煞橫行，修仙大派拔山避世，唯陸白衣懷抱斷刃唐刀行走人間，於青冥竹海創出不假外物、唯純粹劍意聚於一念的游俠之道。這份薪火在民間草莽與凌霄宗洗劍池世代延續。游俠劍客手執單手唐刀或三尺青鋒，遊歷於竹海市井與絲沙瀚海之間。其戰鬥哲學講求「心正意誠、身隨刃動」，視出招節奏為生死樞機。在團隊中，游俠劍客是追求極限攻速、靈巧身法與華麗終結的頂尖鋒刃，以行雲流水般的劍招給予玩家極致的操作快感。\n\n### 核心機制：劍意 (Sword Intent)\n劍意是劍客將神念與周天罡氣凝於一處的鋒銳氣場。它全憑出招節奏與身法變換的精準契合；每一次在毫釐之差間化解攻勢或接續連段，皆使劍意層節攀升，蓄至極境即可喚出浮空飛劍施展萬劍終結。\n\n### 天賦 A：瞬影疾刃 Phantom Edge（輸出）\n- 描述：得陸白衣「十步一殺、片葉不沾身」之真傳。該流派追求肉身與唐刀的高度契合，以無可比擬的步法在方寸之間穿梭騰挪。出刀如行雲流水，刀刀相扣，在敵人防禦露出破綻的剎那間切入背後，打出致命連段。\n- 定位：貼身纏鬥的高速連擊刺客，依託精準時機取消與無敵穿刺在刀尖起舞，爆發極限傷害。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 瞬影突進 | Shadow Dash | 身化殘影向前穿透敵陣，刀光掠過之際無縫銜接連斬。 |\n  | 破影一閃 | Phantom Cut | 踏破虛空瞬移至目標身後拔刀橫斬，借背刺破綻引發暴烈斬擊。 |\n  | 升龍劍 | Rising Slash | 沉身反手揮刃撩天，帶起狂暴氣旋將對手擊飛至半空。 |\n\n### 天賦 B：御劍凌霄 Cloud-Soaring Swords（輸出）\n- 描述：深受凌霄宗雲海浮空峰洗劍池薰陶的劍道分支。此派將苦修積蓄之劍意具象化為數柄實體飛劍，納於神念與隨身劍匣之中。臨敵時並指成劍，飛劍化作游龍離鞘破空，於數十步外圍絞殺強敵，兼顧牽制與絕殺。\n- 定位：游弋於中距離的御劍宗師，召喚浮空飛劍協同索敵，以廣域劍氣與萬劍收束終結戰局。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 萬劍歸宗 | Sword Convergence | 號令周身積蓄之浮空飛劍自天頂如暴雨收束，轟然貫穿目標區域。 |\n  | 青鋒化形 | Spectral Blades | 掐訣召出數柄靈氣飛劍盤旋護體，隨普攻自主追魂激射遠處強敵。 |\n  | 斷空劍氣 | Sky-Cleaving Wave | 隔空揮刃劈出裂地半月劍罡，將前路阻擋之敵重重擊退。 |\n\n---\n\n## 五行道士 Taoist\n\n### 職業描述\n五行道士承繼自三千年前欽天道院大天師姜守虛之法脈。當年姜天師燃盡元神立九鼎以定海波，奠定了震旦道門「替天行道、匡扶社稷」的宗綱。歷經凌虛道人拔峰創立凌霄宗，五行道士在震旦享有崇高威望。他們身著寬袍大袖、手執拂塵符劍，吞吐天地清虛之氣，深諳五行生剋與陰陽消長之理。戰鬥哲學講求「順應天時、動靜相生」。在團隊中，五行道士既能引玄水甘露撫慰同袍經脈、驅散凶煞，亦能祭純陽神霄雷火焚盡妖孽，是具備深厚底蘊的雙相核心。\n\n### 核心機制：陰陽雙相 (Yin-Yang)\n陰陽雙相源於天地造化的動態平衡。道士吐納天地元氣，體內自轉太極；身處「太陰」時真氣化為柔水，主掌潤澤生機與化勁控場；轉入「純陽」則化為烈火天雷，主掌破煞天罰。陰陽流轉之際相生互濟，迸發真氣波瀾。\n\n### 天賦 A：太陰玄照 Lunar Dew（治療）\n- 描述：秉承水德少陰之氣的清修流派。此道深明「上善若水，柔能克剛」，以太陰符水、甘霖咒平息同袍經脈之逆亂，撫平骨血之創；同時能布下奇門遁甲化解強敵戾氣，令敵陣深陷泥沼不可脫身。\n- 定位：掌控廣域持續治療與八卦控場的輔助支柱，以甘霖滋養同袍，以奇門柔勁化解戰場危機。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 甘露清泉 | Celestial Dewfall | 輕揚拂塵引召祥雲甘霖，持續潤澤區域內同袍並洗滌濁氣。 |\n  | 玄水護身符 | Aqueous Ward | 為隊友加持流轉不息的水德氣罩，將受到的衝擊轉化為生機滋養。 |\n  | 奇門困仙陣 | Hexagram Stagnation | 擲出三道陰相靈符化為緩速八卦陣，陷於陣中者舉步維艱、攻速驟跌。 |\n\n### 天賦 B：純陽天雷 Solar Thunder（輸出）\n- 描述：發揚太陽燥熱與神霄九天雷法的降魔流派。該派堅信「天地不仁，當以雷火滌盪妖孽」。道士以符劍導引離火天火與九天轟雷，化為無堅不摧的天地刑罰，對成群妖煞傾瀉極致的範圍真實傷害。\n- 定位：掌控大範圍天火燃燒與高爆發天雷天罰的施法打手，對魔潮實施毀滅性的真傷洗禮。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 九天神霄雷 | Nine-Heavens Thunderstrike | 仗劍步罡引下落雷重劈地面，引發連環天雷炸裂並造成震懾硬直。 |\n  | 離火燎原 | Blazing Prairie Talisman | 祭出火煞靈符化作烈焰炎龍席捲前方，地表化為焦土並持續造成灼燒。 |\n  | 乾坤天陽印 | Radiant Solar Seal | 於目標頭頂凝聚熾烈純陽古印重重壓落，崩解護甲並激盪出爆烈火環。 |\n\n---\n\n## 破軍力士 Titan Guard\n\n### 職業描述\n破軍力士崛起於長夜紀邊關死生之地。在古皇朝衰微、蠻荒異獸衝擊邊關的歲月裡，邊塞軍伍與草莽勇士拋棄了繁複術法，以自身血肉為熔爐、以天地苦寒為鐵砧，熬煉出百死不屈的筋骨魄力。如今，這一脈在斷雲關校場與熔谷兵器爐、天行赤焰軍的大營中大放異彩。破軍力士身材巍峨如山、膀大腰圓，手執長柄戰戟或百斤開山巨斧，恪守赫連霸王「天行剛健，唯武自強」的鐵律。在戰鬥中，他們不避刀斧、正面破陣。在團隊中，他們既是長戟立地萬夫莫開的鐵血衛士，亦是手掄巨斧所向披靡的狂暴先鋒。\n\n### 核心機制：氣魄 (Unstoppable Qi)\n氣魄是力士將周身氣血與戰場殺伐煞氣熔鑄而成的橫練金身。當力士蓄力重擊或正面抗傷時，氣血沸騰轉為不屈霸體；承受的痛苦反化為外功煞勁，使下一次重擊的暴擊與破甲之威更上層樓。\n\n### 天賦 A：鎮嶽巨戟 Mountain-Anchor Halberd（坦克）\n- 描述：承襲昔日平海軍在暗礁戰場以長戟鎮守樓船的軍旅戰法。該流派講求「重戟如山，鎮海鎖岳」，將沉重的長柄戰戟作為封鎖敵陣的核心。以大開大闔的戟法挑刺架招，強行聚攏並壓制群敵，以霸體金身為後方隊友構築堅固壁壘。\n- 定位：前線陣地的鋼鐵定海神針，利用長戟廣域壓制、強力抓取與霸體硬抗，牢牢掌控仇恨。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 萬夫莫開 | Ironclad Stance | 巨戟頓地激盪出如山氣勁，怒吼震懾強敵並為自身加持巍峨金身。 |\n  | 裂地迴旋戟 | Caldera Sweep | 雙手掄動長戟化作狂暴旋風橫掃四周，擊退敵群並踏裂地面。 |\n  | 鎖龍倒鉤 | Dragon-Hook Pull | 挺戟前刺以月牙利刃鉤鎖敵將，暴喝發力強行將其拖拽至身前摔砸。 |\n\n### 天賦 B：狂煞巨斧 Blood-Fury Cleaver（輸出）\n- 描述：完全契合赫連烈「強者立命、以武爭鼎」之霸道哲學。此派摒棄防禦招式，雙手橫握沉重百斤開山巨斧，以自身精血引爆氣魄煞紋。身軀越受重創，煞氣越是洶湧，以勢不可擋的霸體強行換傷，斧刃過處披荊斬棘。\n- 定位：近身狂暴戰士，受創轉化為高額暴擊，以蓄力霸體硬抗換傷，大範圍重斧狂舞摧毀敵陣。\n- 代表技能：\n  | 中文 | English | 意象 |\n  |---|---|---|\n  | 裂石斷嶽劈 | Earth-Cleaving Slam | 騰空躍起將狂暴煞氣灌入重斧，悍然下劈於大地撕裂出熔岩溝壑。 |\n  | 狂煞血誓 | Blood-Oath Roar | 仰天怒吼催動周身煞紋，短時間內受創不退，並大幅激發外功暴擊。 |\n  | 狂風連環絞 | Whirlwind Havoc | 以腰為軸狂暴掄動雙手巨斧旋轉切入敵群，沿途掀起連環血色風暴。 |\n\n---\n\n## v0.1 整合時的 Opus 修正（相對 SP3-001 原稿）\n\n- 英文名：Ballista Quickdraw → Quickdraw Repeater（ballista 是攻城弩）；Astrological Fusion → Astral Fusion（astrology 偏占卜）；Sovereign Flying-Sword → Cloud-Soaring Swords（對應「凌霄」）。\n- 地點：「黑色壁壘軍營」改為艾森堡既有街區「外圍軍營」；「熔谷校場」改為斷雲關既有的「校場與熔谷兵器爐」。\n- 聖裁懲戒的 Aegis 來源改為「大劍招架與命中」，不靠受擊：輸出天賦若靠挨打累積資源，會鼓勵不閃不擋。\n- 核心機制的釋放技（Templar 聖裁反擊、Blademaster 萬劍歸宗）由兩個天賦共用，不專屬單一天賦，詳見 SP3。\n- 刪除各天賦的備選名稱，原稿保留在 `handoff/gemini/SP3-001-class-specs.response.md`。\n"}, {"id": "lore-wildkin", "group": "世界觀聖經", "title": "萬靈裔：人形獸族", "version": "v0.1", "file": "docs/lore/wildkin.md", "text": "# 萬靈裔：人形獸族 (The Wildkin) v0.1\n\n- 狀態：v0.1 定稿（Opus 審閱 SP1-009 r2 後整合，2026-10-08）\n- 來源：Gemini `handoff/gemini/SP1-009-beastfolk.response.r2.md`（r1 審閱見 `docs/subprojects/SP1_worldbuilding.md`）\n- 相關決策：ADR-0011（首府可攻佔、可向第三方借兵）、ADR-0014（可玩種族：**首發 NPC 勢力，第一部資料片開放**，首波為靈狐、靈貓、狼犬三支系）\n- Rex 決定：萬靈自由海角的議事廳與大校場為安全區，沿海棧道與筏城過渡區可決鬥、懸賞\n- 萬靈裔是**第三方傭兵勢力**，不是可加入的第五陣營。故事線與 `story.md` 的歐羅巴、震旦兩線平行；兩線中萬靈裔的身影已補入 `story.md`（只做加法）\n- 本文件中「遊戲中的遺跡」「動態衝突」的數值（如 20%、30%、50 米）只是給 SP6、SP7 的設計示例，不是定案\n\n## 獸族人物年代表 (Character Timeline Table)\n\n本表統一全劇本獸族重要歷史人物與現役角色之年代線，對齊 `history-mythology.md` 紀元年表與 `story.md` 之人物年代表。紀年基準以遊戲開局之「星瀾紀元年（現世）」為原點向上逆推。\n\n| 人物名（中／英） | 支系與地緣定位 | 出生約年 | 主要事蹟年代 | 當前狀態與年齡 |\n|---|---|---|---|---|\n| **「靈樞始祖」蘇微月**<br>`Su Wei-Yue the Spirit-Pivot` | 靈狐氏<br>太古原初林莽大巫 | 約 3060 年前 | 約 3000 年前天塹之裂時，以靈契通幽溝通祖龍殘息，引導萬千部族搶渡裂解陸橋避難。 | 已故<br>（天裂後於群島坐化，享年約 80 歲） |\n| **「裂地戰酋」阿爾索斯**<br>`Ursos the Earth-Shield` | 荒原巨熊氏<br>太古原初衛隊長 | 約 3055 年前 | 約 3000 年前天塹之裂時，以肉身硬抗海嘯岩崩，背負老弱開闢西遷絕壁險道。 | 已故<br>（掩護撤退時力竭戰死） |\n| **「破誓者」烏爾夫**<br>`Ulf the Oath-Breaker` | 狼犬氏（鐵狼血脈）<br>歐羅巴黑森林狼衛頭領 | 約 1240 年前 | 約 1200 年前反抗裁判所《純潔聖裁敕令》，撕裂銀獅包圍圈，掩護莫爾甘草藥學徒突圍入沼並搶救手卷。 | 已故<br>（享年 65 歲，埋骨悲鳴黑沼） |\n| **「霜枝先知」白芷**<br>`Bai Zhi the Frost-Bough` | 靈鹿氏<br>震旦青冥竹海大長老 | 約 2210 年前 | 約 2130 年前與孤篇劍聖陸白衣立下「竹海石契」，以鹿族靈覺為游俠指引天下大妖動向。 | 已故<br>（享年 120 歲，角冠化為玉石） |\n| **「夜翎斥候」卡拉**<br>`Kara Night-Plume` | 黑羽渡鴉氏<br>歐羅巴峽灣探險領航者 | 約 535 年前 | 約 500 年前受僱於戈德里克船長，憑高空氣流直覺展翼滑翔，率先穿透永夜盲霧鎖定鯨骨島黑色海崖。 | 已故<br>（享年 55 歲） |\n| **「渡海靈貓」雲踏雪**<br>`Yun Ta-Xue the Tide-Prowler` | 靈貓氏<br>震旦辟水浮槎靈官 | 約 530 年前 | 約 500 年前任沈行舟座前首席探海靈官，踏浪定風、夜視破煞，協助浮槎成功首航天塹群島。 | 已故<br>（享年 60 歲） |\n| **「黑羽船長」科爾文**<br>`Captain Corwin Black-Plume` | 黑羽渡鴉氏<br>骨礁海戰傭兵船隊司令 | 約 200 年前 | 約 150 年前策動群島水手與獸族戰士參與柯特起義，促成《天塹海岬不戰公約》附屬自治條款與行會創立。 | 已故<br>（享年 68 歲） |\n| **「撼海者」巴倫**<br>`Baron the Wave-Cleaver` | 荒原巨熊氏<br>群島起義猛將 | 約 190 年前 | 150 年前率巨熊水手以萬斤鐵錨砸毀兩洋封鎖海纜，奠定鯨骨島自由港自治基礎。 | 已故<br>（享年 72 歲） |\n| **「雪嶺先知」希爾達**<br>`Hilda the Frost-Seer` | 靈鹿氏<br>極北流亡先知 | 約 85 年前 | 40 年前預見天塹深海星髓復甦之徵兆，促成獸族各氏族在群島簽署《萬靈同盟憲章》。 | 已故<br>（享年 75 歲） |\n| **「雙天平」索蘭・赤尾**<br>`Soran Red-Tail the Scale-Bearer` | 靈狐氏與狼犬氏混血<br>荒野天平傭兵行會大主裁 | 43 年前<br>（現年 43 歲） | 草莽傭兵崛起；10 年前接任行會大主裁，執掌兩洋獸族傭兵調配權與首府預備借兵談判。 | **在世（現年 43 歲）**<br>耳帶金屬環，手持天平秘銀杖 |\n| **「鐵爪狂煞」格羅姆**<br>`Grom Iron-Claw the Blood-Bound` | 狼犬氏激進派首領<br>狂血戰團督統 | 38 年前<br>（現年 38 歲） | 曾任天行赤焰軍邊境客卿；當前主張吞服異化魂核以覺醒遠古獸性，與索蘭理念嚴重分歧。 | **在世（現年 38 歲）**<br>身披黑鐵重鎧，獸瞳泛赤血光 |\n| **「潮音靈巫」蘇映月**<br>`Su Ying-Yue the Tide-Weaver` | 靈狐氏智者<br>天塹群島萬靈海角長老 | 29 年前<br>（現年 29 歲） | 蘇微月直系血裔；掌管群島始源星髓卜筮，為中立冒險者提供靈脈指引。 | **在世（現年 29 歲）**<br>面容秀雅，赤金狐尾，神色恬淡 |\n\n---\n\n## A. 種族設定\n\n### 1. 種族總稱 (Racial Nomenclature)\n\n本專案堅決排除「獸人」一詞，避免歐美奇幻作品中對粗鄙、低智、綠皮蠻族（Orc）的既定刻板聯想。同時，兩大陸因文化隔閡而存在不同民間稱謂，但必須具備一套通行兩洋的中立正式名稱。\n\n#### 方案比較與裁定\n\n| 提案方案 | 中文正式名 | 英文正式名 | 歐羅巴稱謂（教會／民間） | 震旦稱謂（官府／道門） | 語感解析與優缺點評估 |\n|---|---|---|---|---|---|\n| **方案一（已定案）** | **萬靈裔**<br>（簡稱 **靈裔**） | **The Wildkin** | **荒野血契者** (The Feral-Blooded)<br>／半靈人 (Demi-Folk) | **百靈族** (The Hundred Spirits)<br>／草澤靈裔 (Marsh-Spirits) | **定案採用**：兼顧靈性與自然野性，Wildkin 簡練大氣且極具中世紀傳奇辨識度；徹底排除 Therian 等現實次文化詞彙；中文「萬靈裔」優雅大氣，契合中立第三方身分。 |\n| 方案二 | 羽獸靈裔<br>（簡稱 獸裔） | The Anima-Kin | 受造殘缺者 (The Flawed Creation)<br>／毛皮客 (Fur-Folk) | 化形異族 (Spirit-Shaped Kin)<br>／百形族 (Clan of Many Forms) | **優點**：強調 Anima（生命精魄）與形貌多樣性。<br>**缺點**：英文偏抽象哲學，缺少中世紀傭兵之粗獷厚重感；中文「羽獸」容易忽略水棲與無羽哺乳類。 |\n| 方案三 | 荒原原民<br>（簡稱 荒裔） | The Feralis | 深淵寄宿者 (Abyssal-Touched)<br>／荒野傭民 (Feral Mercs) | 山海遺民 (The Primeval Folk)<br>／化靈族 (The Transmuted) | **優點**：突出其作為大地原住民與傭兵之硬朗歷史。<br>**缺點**：過於強調荒野蠻性，容易削弱狐族、貓族在城市文明中的精明、秘術與商貿特質。 |\n\n> **定案結論**：正式全稱採用 **萬靈裔 (The Wildkin)**。歐羅巴舊神教廷貶稱為「荒野血契者」，震旦民間通稱為「百靈族」或「靈裔」。\n\n---\n\n### 2. 七大核心支系 (Lineages & Sub-Races)\n\n依據指示，設定涵蓋狐、貓、犬狼（包含野狼與獵犬）三核心支系，並補充巨熊、靈鹿、黑羽渡鴉及水棲汐獺，共七大支系。支系英文統一名詞格式為 `The [形容詞] Kin`：\n\n```\n                              ┌── 靈狐氏 (The Vulpine Kin)  ── 智略、秘術、談判\n                              ├── 靈貓氏 (The Feline Kin)   ── 潛伏、刺殺、情報\n                              ├── 狼犬氏 (The Lupine Kin)   ── 陣列、前鋒、忠衛\n     萬靈裔 (The Wildkin) ────┼── 荒原巨熊氏 (The Ursine Kin)  ── 破城、巨盾、重工\n                              ├── 靈鹿氏 (The Cervine Kin)  ── 遠程、領航、療癒\n                              ├── 黑羽渡鴉氏 (The Corvid Kin)  ── 偵察、信使、滑翔\n                              └── 汐獺潮泳氏 (The Lutrine Kin) ── 水鬼、破船、水網\n```\n\n#### 支系詳情表\n\n| 支系名稱（中／英） | 外觀特徵（寫實比例、非萌系） | 天賦與擅長傭兵職能 | 性情與文化精神 | 主要分布區域 |\n|---|---|---|---|---|\n| **靈狐氏**<br>`The Vulpine Kin` | 尖挺立體三角形狐耳（邊緣生細密護毛），蓬鬆纖長單尾（長約 80–100cm，隨步履自然擺動，非多尾萌系）。體態修長勻稱，骨架輕靈；面廓深邃，瞳孔為琥珀金或琉璃色，專注時瞳孔微呈立縫；面頰與手腕隱含極淡天然靈紋。 | **天賦**：幻術擾敵、靈脈感知、毒理與藥草調和。<br>**職能**：秘術干擾、刺客導引、軍師謀士、停戰談判使節。 | 縝密深沉、崇尚智略，嚴格遵守契約的每一條修辭。震旦靈狐具山野隱士與符陣學者氣質；歐羅巴靈狐則精於城鎮暗巷情報網與黑市折衝。 | 天塹群島萬靈自由海角暗市、碧瀾商都水巷閣樓、迷霧低地澤國邊緣廢墟。 |\n| **靈貓氏**<br>`The Feline Kin` | 靈動略帶圓弧的貓耳，長而柔韌之細長平衡尾（徹底避開「狸」字以絕日系 tanuki 聯想）。身形緊實矯健，爆發性肌肉線條明顯；足部具肉墊化步態，行動無聲；手指具可微縮之半月角質硬爪；夜間瞳孔可完全放大為夜視深潭。毛色多為玄黑、玳瑁斑或石板灰。 | **天賦**：極限靜音潛行、夜視洞悉、立體障礙攀躍。<br>**職能**：夜行刺候、屋頂暗殺狙擊、走私貨運破障衛士。 | 孤傲獨立，極重個人隱私與獨立帳目。各氏族以「夜行結社」形式鬆散聯絡，奉行「落子無悔，現金結清」之現實生存哲學。 | 鯨骨自由港肋骨港高架懸索區、落星穹頂下城打撈場、碧瀾商都錦緞坊。 |\n| **狼犬氏**<br>`The Lupine Kin` | 直立厚實耳廓或警惕折耳，粗壯長尾。包含兩大主要血脈分支：<br>① **鐵狼血脈**：身材高大偉岸（雄性均高 190–205cm），背頸生剛硬深灰或鐵黑鬃毛，咬合肌發達，手掌寬厚且覆厚繭；<br>② **獵犬／獒犬血脈**：身形緊實勻稱或敦厚沉穩，毛色多為獵斑、赭黃或黑褐，面容沉著，嗅覺靈敏。 | **天賦**：協同戰陣、嗜血衝鋒、長途越野追蹤、警衛感知。<br>**職能**：重步兵前鋒、突擊狂戰士、陣地要塞守衛、巡邏哨衛。 | 紀律嚴明，視「群體誓約 (Pack-Oath)」重於生命。極重袍澤情誼與軍人榮譽，一旦受僱絕不臨陣脫逃，但對背信棄義之僱主報復極其慘烈。 | 艾森堡外圍軍營防線、斷雲關軍道要衝、鯨骨自由港公約石階傭兵大營、兩洲各城鄉巡邏哨所。 |\n| **荒原巨熊氏**<br>`The Ursine Kin` | 圓厚短耳，粗短絨尾。體魄極其雄壯巍峨（均高 210–235cm），肩胛厚重如山，胸腔寬闊；厚重毛皮呈深棕、黑褐或霜白色；厚實肉掌具粉碎性握力，皮膚角質層具天然抗衝擊減傷。 | **天賦**：破軍巨力、天生霸體硬化、攻城器械操作。<br>**職能**：破城攻堅先鋒、防禦重盾手、野戰工事營造、巨錘力士。 | 沉穩篤厚如磐石，日常少言寡語；極度嗜好烈酒與熟食。作戰時沉著堅定，一旦被激怒進入狂化戰態，則如崩山裂石無可阻擋。 | 霜灣港冰崖重工區、斷雲關熔谷兵器爐外圍、天塹群島東澳採石工坊。 |\n| **靈鹿氏**<br>`The Cervine Kin` | 頭頂具角質冠冕（雄性為枝狀骨角，雌性為小巧玉色短角或額前靈珠），耳廓修長且向兩側微張，短絨尾。體態修長挺拔，肌腱修長極富彈跳韌性；面容清秀冷峻，毛色呈淡栗色點綴白斑，或極地霜白。 | **天賦**：超遠距射準、荒野地勢靈視、靈泉回生法術。<br>**職能**：長弓游擊狙擊手、戰地隨軍醫者、荒原領航嚮導。 | 恬靜超然，深信萬物生態循環與因果報應。厭惡殘虐殺戮，作戰時冷靜精準；長於古老草藥煉製與星象潮汐辨識。 | 暮影黑森林古林幽谷、青冥竹海深處石林、天塹群島北端原林孤島。 |\n| **黑羽渡鴉氏**<br>`The Corvid Kin` | 雙臂外側與肩背生有金屬光澤之深藍墨黑短羽披（滑翔時可展開），手指為修長人指，指節具黑質角質；眼瞳深黑透亮，喙狀微突鼻梁，身形清瘦修長，骨質密度輕且步履迅捷。 | **天賦**：低空滑翔降落、極速風向感知、黑市暗語解碼。<br>**職能**：戰場空域斥候、機密信使、懸崖空降奇兵、贓物估價師。 | 機敏狡黠，說話語速極快，具強烈收集閃光金屬與古代星髓殘片之癖好；熱衷游走於四大陣營密探之間販賣情報。 | 落星穹頂隕星穹頂高架懸廊、鯨骨自由港燈塔暗礁、霧環堡星圖書院外環。 |\n| **汐獺潮泳氏**<br>`The Lutrine Kin` | 圓形小巧緊閉水耳，扁平厚實抗浪長尾。身形柔韌流暢，皮毛分泌天然防水油脂；肺活量驚人，水下潛伏耐力極強；趾間生有半透明蹼膜。 | **天賦**：水下潛行作戰、深海打撈、水下障礙爆破。<br>**職能**：深海蛙人水鬼、戰艦水線鑿穿部隊、險惡暗礁領航員。 | 樂觀幽默、熱愛群居群宿，但在水下搏殺時極其兇殘刁鑽；與群島混血水手私交最深，為兩洋航道不可或缺之水路豪客。 | 斷脊暗礁群水下沉船區、鯨骨自由港肋骨港浮筒區、碧瀾商都外圍水閘。 |\n\n---\n\n### 3. 外觀光譜與風格定義 (Appearance Spectrum)\n\n配合 `experiments/concept-art/STYLE.md` 之視覺規範（不透明水彩厚塗、寫實人體比例、紋理扎實、拒絕日漫萌系誇張大眼與二頭身）：\n\n```\n[初相：荒野獸相] ◄─────────────── [過渡相] ───────────────► [化相：人文靈相]\n· 體表密覆短毛/鬃毛             · 局部短毛/獸斑               · 皮膚與人類完全無異\n· 面顎微突、利齒顯著             · 人類五官但輪廓深邃           · 僅保留耳、尾與感官\n· 骨架粗大、野性悍勇             · 修長肌肉、半伸縮爪           · 骨架優美、面容秀雅\n· 多居於靈脈地穴/海溝深淵        · 傭兵老手/各荒原聚落          · 多居於兩洲名城/商貿行會\n```\n\n#### 光譜成因與世界觀底層邏輯\n\n1. **魂核與靈脈共振世代**：\n   - 萬靈裔之形貌非單純基因突變，而受其血脈長年汲取之「環境靈質密度」調控。\n   - 世代定居於極北冰原邊緣、落星海溝裂隙或黑森林深處之部族，長年承受未被淨化之原初星髓與狂暴地脈衝擊，其體表呈現厚重毛皮、粗大面骨與野獸足爪，被稱為**「初相 (Primordial Phenotype)」**。\n   - 世代定居於城鎮周邊、修習人族幾何聖言或道門打坐吐納之氏族，其體內獸性被文明秩序場域「錨定與梳理」，呈現細緻之人類膚質與立體五官，獸徵僅留於頭頂毛耳、身後尾羽與夜視瞳眸，被稱為**「化相 (Harmonized Phenotype)」**。\n2. **返祖顯相機制 (Ancestral Surge)**：\n   - 當戰鬥陷入極限絕境，萬靈裔戰士主動抽取體內魂核之靈質狂潮時，會觸發短暫之「返祖顯相」：體表鬃毛逆豎、指爪伸長、瞳孔化為燃燒獸芒。此非失去神智之走火入魔，而是遠古獵手戰鬥本能與皮下防禦角質之具象化，戰役結束後隨靈質平復而逐漸褪回原狀。\n\n---\n\n### 4. 矛盾起源三假說 (Contradictory Origins)\n\n為維持世界觀深邃感，依據 `history-mythology.md` §4 規範，起源問題刻意不設單一定論，保留三種互相衝突之歷史假說，嚴禁揭開天塹之裂終極真相：\n\n#### 起源假說對照表\n\n| 假說名稱 | 宣稱者與傳播勢力 | 核心主張與神話詮釋 | 與既有大事件之錨定 | 衝突點與疑點 |\n|---|---|---|---|---|\n| **假說一：造物殘卷說**<br>`The Flawed Blueprint` | 歐羅巴舊神教廷、誓約裁判所 | 太古大造物師羅德里克牽引天外星核前，曾試圖以聖言編織全新勞動衛隊，私自將野獸之骨與泥人胚胎熔鑄。天塹之裂是舊神為淨化此褻瀆生命而降下之神罰。 | 神柱紀巨塔造物、天塹之裂神罰說。 | 教廷無法解釋為何震旦大陸同樣廣泛分布萬靈裔，且其靈脈構造與聖言幾何完全不同。 |\n| **假說二：地劫通靈說**<br>`The Earth-Vein Transmutation` | 震旦欽天道院、凌霄宗道門古籍 | 太古天外熾星刺穿地穴，地脈祖龍翻身重創。四海奔騰之際，無數靈獸與邊地獵戶為抵禦幽冥濁氣，在生死關頭氣血相融，受太初一氣造化點化而化人形。 | 地脈祖龍、大天師姜守虛立九鼎定海。 | 震旦古皇朝太初壁畫上，早在天裂前數百年便已有狐耳、狼面將領輔佐人皇征戰之浮雕。 |\n| **假說三：原初獵群古歌**<br>`The Song of the Primal Pack` | 萬靈裔口述史、荒野長老古歌 | 萬靈裔才是大地真正之原住民。在人族築塔修道前，星髓碎片本是大地母親之心跳。人族是遺忘大地語言、以冰冷方石自囚之殘缺種族。天裂是大地的痛苦翻身。 | 太初原核立基、星瀾潮汐律動。 | 萬靈裔古歌中對「極北寒霜」與「西方失落大陸」有著超越兩大陸史料之驚人精準描述。 |\n\n---\n\n### 5. 居地與分布格局 (Habitats & Distribution)\n\n萬靈裔不佔據現有主城核心，而是依附於地緣邊界、險峻地形與海空交界處：\n\n```\n                      [極北冰原] ── (傳說雪鹿/霜狼始源聖所)\n                           │\n      [歐羅巴]             │             [震旦]\n  · 暮影黑森林外緣林谷 ───┼─── [天塹群島] ───┼── · 青冥竹海伏狐深谷\n  · 悲鳴低地澤國邊緣水道   │  · 鯨骨港萬靈海角 │   · 斷雲關熔谷荒嶺\n  · 艾森堡外圍傭兵大營     │  · 荒原漂流筏城   │   · 碧瀾商都外圍水道\n                           │  · 斷脊暗礁水下寨 │\n                           │\n     [西方失落新大陸] ─────┴───────────────── [南溟歸墟] ── (海獺/羽禽靈島傳說)\n```\n\n1. **核心交會中樞：天塹群島 (The Rift Archipelago)**\n   - **萬靈自由海角 (Wildkin Cape)**：位於鯨骨自由港東澳海灣外緣之險峻海崖，依山傍海搭建連綿之高腳木樓與浮橋，為兩洋萬靈裔最大的中立集散地。依製作人 Rex 裁定，**海角之核心「議事廳」與「大校場」為安全區 (Safe Zone)**；而外圍的沿海棧道與通往筏城的過渡區則屬於允許決鬥與懸賞緝捕之自由區域。\n   - **荒原漂流筏城 (The Drift-Raft Flotilla)**：落星海溝邊界由數百艘退役廢船、巨鯨骨架以鐵索相連之浮動水寨，為水棲氏族與流亡傭兵之走私避風港。\n2. **歐羅巴大陸分布**\n   - 暮影黑森林周邊之「隱風獵谷」：鹿族與狼犬聚落，與黑森林魔女保持互市，阻擋深淵暴化異獸。\n   - 艾森堡外圍軍營之「鐵毛街區」：供鐵銀公約僱用之鐵狼、巨熊重裝傭兵駐紮。\n3. **震旦大陸分布**\n   - 青冥竹海深處之「靈狐隱澗」：隱居避世之狐族與鹿族，研習道法與草藥。\n   - 斷雲關北側熔谷峭壁之「狼嚎隘口」：赤焰軍狂戰士與狼犬、巨熊傭兵共同修築之軍事要塞外哨。\n4. **故土線索（指向預留擴充區）**\n   - 氏族大長老秘傳之故土「古萬靈聖地」不定案於現有地圖，僅留四方讖言：狼與鹿指向**極北冰原 (The Boreal Wastes)** 之萬年溫泉冰谷；渡鴉與狐族指向**西方失落新大陸 (The Far Western Expanse)** 之青銅神樹；水棲氏族指向**南溟歸墟 (The Abyssal Return)** 之垂直巨浪浮島。\n\n---\n\n### 6. 社會、政治與傭兵制度 (Society, Politics & Mercenary Law)\n\n#### 組織架構\n\n萬靈裔不設世俗帝國，對內由各支系長老共組 **「百獸血盟議會 (The Council of Blood-Pact Claws)」** 裁決內部氏族爭端；對外則設立跨洋軍事與商業實體 **「荒野天平傭兵行會 (The Feral Scale Mercenary League)」**，統籌兩洋僱傭契約。\n\n```\n              ┌──────────────────────────────────────────────┐\n              │ 百獸血盟議會 (The Council of Blood-Pact Claws) │ ── 內部氏族律法、血脈裁判\n              └──────────────────────┬───────────────────────┘\n                                     │\n              ┌──────────────────────┴───────────────────────┐\n              │ 荒野天平傭兵行會 (The Feral Scale Mercenary)  │ ── 跨洋契約、出兵調度、金庫\n              └──────────────────────┬───────────────────────┘\n            ┌────────────────────────┼────────────────────────┐\n    【鐵狼戰團】(重裝衝鋒)    【靈貓盟約】(刺候潛伏)    【靈脈賢者】(秘術醫者)\n```\n\n#### 代表人物：荒野天平大主裁・索蘭・赤尾 (Soran Red-Tail)\n\n- **定位**：SP6 第五個 AI 代理人候選（代表中立第三方傭兵力量）。\n- **年齡與身世**：43 歲。靈狐氏與狼犬氏混血。左耳穿戴三枚歐式黃銅契約環，右耳有舊日刀痕；身披震旦玄色鮫綃內襯與歐式雙排扣冷鋼革甲；腰懸一把直刃唐刀與一柄天平雕紋秘銀手杖。\n- **人格卡（148 字，符合 factions.md 規格）**：\n  - **理念**：血脈無分貴賤，契約重於山海。靈裔不是兩洋王座前的走狗，而是維繫破碎天地均勢的天平游標。\n  - **外交**：極度審慎、唯信是圖；弱者瀕危則索重金力挽狂瀾，霸者恃強則聯兵制衡；巧借四強之爭壯大族裔，絕不為任何單一陣營殉葬。\n  - **語氣**：沉著低緩、帶有獵手審視獵物之銳利鋒芒；言談喜以「斤兩、天平、利爪」為喻。\n\n#### 《荒野鐵律》三大至高法則 (The Wildkin Iron Code)\n\n行會頒布之三大鐵律在世界觀、公證契約與行會碑文上完全統一：\n\n1. **「一契抵命」 (The Blood-Bound Pact)**：僱傭契約必須在智能工坊以雙方鮮血與魂核結晶印刻。契約生效期間，萬靈部隊至死不退，誓死履行防衛或攻堅條款。\n2. **「同族異旗」 (Severed Banners, Bound Kin)**：**容許同族甚至同氏族在戰場上為敵對陣營效命！** 戰陣之上各為其主、生死無怨；但戰役鳴金收兵後，雙方退回中立營區即為同胞，嚴禁私仇尋釁，違者由大主裁親執律刃處死。\n3. **「背約必誅」 (The Flayed Traitor)**：任何違背公證契約臨陣倒戈、洩露僱主軍機之傭兵戰團，行會將剝奪其氏族印信，宣告為「無誓野獸」，天下萬靈裔與兩洋陣營共討之。\n\n#### 與現有各大勢力之關係\n\n- **鐵銀公約**：公約重視鐵狼部隊之正面防護力，奧古斯都大元帥常年重金僱傭巨熊與狼衛；但公約嚴苛之軍法與萬靈裔之野性自由時常爆發管轄摩擦。\n- **星盤修會**：修會與靈狐智者合作密切，以星盤算式交換靈脈感知；奧蕾莉亞視其為高效之研究工具，萬靈裔則警惕學者將血肉視為純粹算式。\n- **天行赤焰軍**：赫連烈性烈如火，最喜與狼犬、巨熊戰士角力豪飲結為異姓兄弟；赤焰軍前鋒常有萬靈狂戰士並肩衝鋒，但萬靈長老厭惡赤焰軍偶發之盲目屠戮。\n- **雲海商盟**：商盟是萬靈裔最大之糧餉與軍備供應商，溫九娘將荒野天平視為最靈活之暗盤槓桿；雙方在鯨骨自由港深度捆綁，但靈裔嚴防落入九海高利貸陷阱。\n- **領航者評議會**：彼此為天塹群島生死共榮之盟友；柯特起義時靈裔曾灑血斷鎖。依《不戰公約》，萬靈裔在島上不得成軍，但大量萬靈戰士以個人身分受聘加入**評議會守望隊 (Council Watch)**，行會在島上僅設公證與信託機構。\n- **震旦古王朝**：雲闕城朝廷自命正統，骨子裡視萬靈裔為邊荒蠻獠；萬靈裔視其為日落西山、沉痾難起之腐朽泥偶。\n- **凌霄宗**：宗門秉持天道好生之德，視萬靈裔為天地靈類，偶有收納品行優異者為巡山使；雙方相敬如賓，井水不犯河水。\n- **舊神教廷**：千年血仇難解。教廷殘餘教條仍視其為不潔之異端，萬靈裔亦嚴禁教廷傳教士踏入其任何聚落半步。\n\n#### ADR-0011 首府借兵機制接軌 (Capital Recapture Mercenary System)\n\n依據 ADR-0011 定案，四陣營首府**不是安全區，可被攻佔**；失守後 AI 首領可選擇向第三方萬靈裔借兵反攻：\n\n```\n[首府面臨失守危機] ──► [AI 首領暗中洽談【預備借兵密約】]\n                             │\n[首府不幸陷落後]   ──► [AI 首領判定啟動【向萬靈裔借兵反攻】]\n                             │\n    ┌────────────────────────┴────────────────────────┐\n    ▼                                                 ▼\n【借兵代價 (資源/地緣主權)】                          【行會出兵響應】\n· 割讓收復後首府之「萬靈自由特區」管轄權              · 解鎖精銳「鐵狼突擊軍團」攻城部隊\n· 簽署長年免稅商道特許狀                             · 出動「幻狐秘術斥候隊」破除護城法陣\n· 交付大量高階「原初星髓魂核」抵押                    · 觸發兩洋世界事件【逆浪奪城戰】\n```\n\n---\n\n### 7. 玩家可玩性規劃（依 ADR-0014 修訂）\n\n依據 2026-10-08 製作人 Rex 之裁決與 ADR-0014 之修訂，萬靈裔確定為**玩家可玩種族**，其開放節奏與系統規格定案如下：\n\n#### 開放時機與首波開放支系\n\n- **開放節奏**：**遊戲首發 (M3–M5) 萬靈裔專注作為 NPC 勢力**（傭兵夥伴、世界威脅、劇情首領與城邦居民）；**於第一部大型資料片 (Exp 1.0) 正式解鎖為玩家可選種族**。\n- **第一部資料片首波開放支系**：\n  - 推薦優先開放人體骨架相容度最高、僅具備頭頂獸耳與身後毛尾特徵之三大「化相」核心支系：\n    1. **靈狐氏 (The Vulpine Kin)**\n    2. **靈貓氏 (The Feline Kin)**\n    3. **狼犬氏 (The Lupine Kin)**\n  - *理由*：此三支系完全共用現有人類 6 職業之骨架模型、受擊判定框（Hurtbox）與男女裝備外觀穿插規範；而體型極其魁梧之巨熊（210–235cm）、具備滑翔羽披之渡鴉、具備骨角冠冕之靈鹿及水蹼汐獺，則留待資料片後續階段逐步推出，確保首發排期健康。\n- **系統與職業規格（沿用現制）**：\n  - **出生與職業不鎖定**：資料片開放後，萬靈裔玩家同樣自由選擇出生大陸（歐羅巴或震旦），解鎖該大陸之 3 個基礎職業；種族不綁定職業。\n  - **輕量特性與外觀為主**：種族特性僅提供微量環境適應被動（如夜視距離、特定地形微幅移速加成），不提供顛覆 PvP 平衡之強數值加成。\n  - **陣營獨立性**：達滿級後同樣加入現有四陣營之一；萬靈裔勢力始終為第三方。\n\n#### 故事中為「萬靈裔冒險者登場」留下的伏筆（留白）\n\n為確保資料片開放玩家創建萬靈裔時世界觀自然通暢，故事線於前六章埋設兩條專屬伏筆：\n\n1. **【始源血脈喚醒 (The Primordial Awakening)】**：\n   隨著落星海溝星髓共鳴日漸劇烈，散居於歐羅巴城鄉與震旦市井中、原已高度「化相」隱沒於人群的年輕一代萬靈後裔，體內沉睡千年的獸性靈脈紛紛共振覺醒。他們頭頂萌發獸耳、身後生出靈尾，受天頂星瀾感召，紛紛拾起兵刃，作為獨立冒險者踏入江湖與荒野。\n2. **【天平開拓令 (The Grand Balance Charter)】**：\n   面對兩洋首府動盪與海外未知大洋之異動，荒野天平傭兵行會大主裁索蘭宣告解除「年輕族裔不得擅自跨洋遊歷」之古老族規，正式頒布《天平開拓令》，准許年輕的萬靈裔戰士以自由身分與兩陸凡人冒險者並肩結伴，探尋天地命運。\n\n---\n\n### 8. 命名規範 (Naming Conventions for Beastfolk)\n\n本規範補充至 `naming.md`，專屬規範萬靈裔之人名、氏族名、聚落與物品：\n\n#### 命名規則\n\n- **基調**：野性自然、古樸厚重；融合先秦志怪之清奇與古諾斯／塞爾特部族之剛硬。\n- **人名 (Personal Names)**：\n  - 偏歐羅巴語感支系：採用硬朗短單名，綴以感官特徵或戰功稱號（如：*芬恩・裂石 / Finn Stone-Render*、*布蘭・霜尾 / Bran Frost-Tail*、*艾爾莎・夜爪 / Elsa Night-Claw*）。\n  - 偏震旦語感支系：採用自然天候或草木為姓，單字或雙字古意名（如：*白微雨 / Bai Wei-Yu*、*蒼朔 / Cang Shuo*、*玄行舟 / Xuan Xing-Zhou*、*赤嵐 / Chi Lan*）。\n- **氏族名 (Clan Names)**：\n  - 以「野獸體徵／自然現象」＋「重器／圖騰」構詞（如：*鐵鬃氏 / Iron-Mane*、*月影氏 / Moon-Shadow*、*裂爪氏 / Split-Claw*、*覆雪氏 / Frost-Gale*）。\n- **聚落與地名 (Place Names)**：\n  - 具備鮮明感官與地形描摹（如：*嗅風峽 / Scent-Wind Ravine*、*狼吻海岬 / Wolf-Maw Point*、*斷爪石林 / Severed-Claw Pinnacles*、*隱風林澗 / Wind-Hiding Glen*）。\n- **裝備與物品 (Gear & Artifacts)**：\n  - 突出骨角皮革、野性靈質與戰場實用性（如：*嘯月骨刃 / Moon-Howl Bone-Blade*、*幻狐夜行斗篷 / Fox-Mist Mantle*、*巨熊裂甲戰錘 / Ursine Breaker-Hammer*）。\n\n#### 命名範例與禁用清單\n\n| 類別 | 中文範例 | English 範例 | 命名構詞意境 |\n|---|---|---|---|\n| 人名（歐陸系） | 烏爾夫・破誓者 | Ulf the Oath-Breaker | 古諾斯硬朗單名＋背負之歷史宿命 |\n| 人名（震旦系） | 蘇微月 | Su Wei-Yue | 靈狐靈巧古姓＋清冷月華意境 |\n| 氏族名 | 寒角靈鹿氏 | Frost-Horn Cervines | 自然嚴酷生態＋高貴獸族血統 |\n| 地名 | 萬靈自由海角 | Wildkin Cape | 中立自由港之邊緣高地要塞 |\n| 武器物品 | 裂風牙刺短唐刀 | Wind-Rending Fang Tang-Dao | 尖牙骨刃融入震旦筆直單刃刀型 |\n\n##### 禁用詞清單 (Forbidden Terms)\n\n- **嚴禁日漫萌化用語**：禁用「喵喵、汪醬、獸耳娘、狐仙姐姐、小貓咪、萌獸」。\n- **嚴禁使用「狸」指稱貓族**：禁用「靈狸、狸貓、狸奴」，統一使用「靈貓、幻貓、影貓」。\n- **嚴禁西方家庭寵物名**：禁用「波比 (Bobby)、露西 (Lucy)、豆豆、皮皮」。\n- **嚴禁指涉地球真實薩滿原民部落**：禁用「阿帕契 (Apache)、蘇族 (Sioux)、易洛魁 (Iroquois)」。\n- **嚴禁媚俗九尾妖狐套路**：靈狐氏一律設定為單尾寫實比例，禁用「九尾妖姬、魅惑蒼生」等陳腐仙俠網文標籤。\n\n---\n\n## B. 獸族故事線（六章）\n\n本故事線與 `docs/lore/story.md` 歐羅巴、震旦雙線平行推進，揭示自神柱紀末期至當前星瀾紀元三千年間，萬靈裔作為被兩大文明夾縫擠壓的第三方，如何從流亡生靈崛起為執掌兩洋戰略天平的關鍵力量。\n\n---\n\n### 第一章：裂海狂瀾與靈樞遠渡 (Rage of the Sundered Seas & The Spirit-Pivot Crossing)\n\n- **對應年代**：約三千年前，神柱紀末期。\n- **劇情大綱**：\n  在三千年前的太古時代，中央陸橋平坦廣袤，覆蓋著被萬靈裔稱為「始源大林莽」的浩瀚原始森林。當時的萬靈裔各部族結廬於林莽深處，敬畏地守護著大地深處的原生靈脈與星髓母核，與修築白色天柱的西方造物師及引導靈泉的東方修道先民維持著相安無事的物資互換。\n  然而，災難於毫無預警中降臨。太古末代工匠羅德里克在中央天柱頂端啟動「光輝之喉」，狂暴的天外災星「原初星髓」如神罰重錘鑿穿蒼穹。大地在一夜之間發出萬里哀鳴，中央陸橋從地心深處分崩離析。滾滾海水如同沸騰的熔鉛倒灌進深不見底的漆黑海溝，千萬年繁茂的始源大林莽在烈焰與海嘯中四分五裂。\n  大滅絕降臨之際，靈狐氏大巫「蘇微月」於神魂劇震中感應到地脈祖龍的翻滾絕叫。她不惜燃燒自身神魂，化作照亮黑夜的「靈樞明燈」，聯合巨熊部族戰酋「阿爾索斯」，帶領驚惶失措的百萬走獸與靈裔老弱向兩側斷崖瘋狂突圍。阿爾索斯以雙臂死死抵住坍塌的通天巨岩，以血肉之軀為族人爭取撤退時間，最終被崩落的萬丈斷崖吞沒。蘇微月引導部分殘存的鹿族與狼犬部族向西攀上歐羅巴哀慟海崖，部分族人隨東方難民退入震旦青冥群山；而蘇微月本人則率領最精銳的水棲汐獺水手與黑羽渡鴉斥候，留守在中央陸橋破碎沉陷後僅存的幾座黑色孤島上——這便是日後天塹群島之雛形。萬靈裔在大地撕裂的血與火中，徹底告別了始源安寧，淪為兩岸文明夾縫中的流亡之子。\n- **關鍵人物**：\n  - **「靈樞始祖」蘇微月 (Su Wei-Yue the Spirit-Pivot)**：靈狐氏傳奇大巫，燃燒神魂維繫通靈法陣，指引萬靈裔在天裂浩劫中求生之引路人。\n  - **「裂地戰酋」阿爾索斯 (Ursos the Earth-Shield)**：荒原巨熊氏初代首領，以肉身硬抗海嘯岩崩掩護撤退，力竭殞命於斷崖。\n- **關鍵地點**：\n  - **始源大林莽遺址 (Sunken Primeval Wilds)**：已完全沉入天塹萬丈波濤之下的太古平原，常年翻滾著冰冷洋流。\n  - **哀慟西崖渡口 (The Weeping Steps Landing)**：歐羅巴天塹斷崖西岸，首批靈裔難民攀附登陸之險峻礁岩。\n- **遊戲中的遺跡**：\n  1. *五人探索地下城【沉海聖壇之遺骸】*：位於天塹淺海之半淹沒太古神殿，探索被珊瑚與海藻覆蓋之巨熊戰酋石化斷臂與遠古法陣。\n  2. *工坊催化素材【始源靈骨碎屑】*：太古大林莽萬年靈木沉積化石，用於工坊鍛造時提升武器之「韌性」與最大耐久度。\n  3. *傳奇匕首圖紙【微月靈樞匕】*：依照蘇微月隨身佩刃繪製之精密短刃，具備命中時偷取微量法力並標記目標靈脈弱點之被動特效。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：蘇微月沉海前留下的龜甲靈書記載，當原初星髓砸入地心時，她曾看見一道幽暗深邃的巨大水下漩渦將無數神聖天柱碎片吸入極南深淵。（指向擴充類型：**南溟歸墟 / The Abyssal Return**）。\n  - **次要線索**：天塹斷崖最深處的玄武岩壁上，刻有深達數丈的獸爪抓痕，每逢星瀾退潮會滲出散發微光的深藍色液體。\n\n---\n\n### 第二章：長夜血獵與霜林孤盟 (Blood-Hunt in the Long Night & The Frostwood Pact)\n\n- **對應年代**：約三千年前–五百年前，長夜紀（重點年代：約 1200 年前）。\n- **劇情大綱**：\n  天塹之裂後，兩千五百年的永夜盲霧冰封了大洋，歐羅巴陷入了陰冷壓抑的黑暗歲月。隨著糧食絕收與盲霧異獸蔓延，舊神教廷的誓約裁判所勢力暴漲。首任審判長瓦爾瑟夫頒布《純潔聖裁敕令》，宣布凡非純正人形、體內流淌魔獸靈血者，皆為「深淵魔女的畸變血契」。一場針對萬靈裔的殘酷血獵在歐羅巴低地與黑森林拉開序幕。\n  避難於暮影黑森林的狼犬氏與靈鹿氏族遭受了滅頂之災。騎士團的獵犬與鐵騎踏平了無數部族樹寨，將靈裔老弱推上火刑架。絕境之中，狼犬氏鐵狼頭領「烏爾夫」憤然撕毀了曾與西方領主簽署的效忠羊皮紙，被教會蔑稱為「破誓者」。烏爾夫率領殘存的狼衛在泥濘的黑沼中與銀獅騎士團展開了長達數十年的血腥游擊戰。當教廷大軍重重圍困初代黑森林大魔女莫爾甘的古祭壇時，烏爾夫率狼衛冒死突入包圍圈，**浴血救出了莫爾甘的多名年輕草藥學徒，並搶運出記錄古典鍊金法陣的珍貴手卷鉛盒潛入地下溶洞避難**。莫爾甘本人則在堅守七個月後坦然走上火刑架，留下了震撼後世的冰火鎖鏈讖言。烏爾夫在終末之戰中以一柄斷刃咬斷了教廷審判副長的咽喉，傷重坐化於悲鳴黑沼深處。\n  與此同時，海峽對岸的震旦大陸亦面臨靈脈退潮與妖煞蜂起的慘烈考驗。棲居於青冥竹海的靈鹿大長老「白芷」與隱世靈狐，面對席捲中原的狂暴大妖，並未盲目避世，而是主動聯絡了震旦一代布衣傳奇——「孤篇劍聖」陸白衣。白芷以靈鹿一族敏銳至極的天地嗅覺，踏遍千山萬水，為陸白衣鎖定了禍亂人間的九十九尊上古凶煞方位。陸白衣孤劍斬妖除魔後，感念靈裔之高潔大義，於青冥竹海立下「竹海石契」，誓言震旦游俠一脈永不進犯靈裔深林。東西兩陸的萬靈裔在長達兩千餘年的至暗長夜中，用不屈的鮮血在兩岸各自鑄就了不可侵犯的生存尊嚴。\n- **關鍵人物**：\n  - **「破誓者」烏爾夫 (Ulf the Oath-Breaker)**：狼犬氏傳奇戰將，率部反抗教廷殘酷獵巫，以狼性決死意志撕裂審判防線掩護魔女學徒突圍的孤膽英雄。\n  - **「霜枝先知」白芷 (Bai Zhi the Frost-Bough)**：靈鹿氏大長老，壽逾百載，以靈覺輔佐孤篇劍聖平定妖煞，締造竹海石契之賢者。\n- **關鍵地點**：\n  - **暮影黑森林斷誓沼 (Duskwood Oath-Severed Mire)**：烏爾夫率狼衛決死伏擊誓約騎士團之古戰場，白骨沒於泥淖。\n  - **青冥竹海孤劍亭 (Azure Bamboo Lone-Sword Pavilion)**：陸白衣與白芷立下石契之古亭，四周長年繚繞不散之凌厲劍意。\n- **遊戲中的遺跡**：\n  1. *野外精英祭壇【烏爾夫之斷碑】*：位於悲鳴黑沼深處，冒險者啟動後可召喚出昔日審判騎士與狼衛的怨魂幻象，挑戰成功可獲高階狼紋護腕。\n  2. *鍊金配方古卷【莫爾甘・靈狐調和油】*：記載於鉛盒內的古老草藥配方，用於淬鍊皮革護甲，大幅提升對毒素與陰煞之抗性。\n  3. *傳奇重甲【破誓者之鐵鬃胸甲】*：以烏爾夫遺留鐵鎧鍛造之重型板甲，自帶「血量越低防禦力與移動速度越高」的狂怒被動特效。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：烏爾夫戰死處泥潭下掘出的教廷密匣手札顯示，瓦爾瑟夫審判長獵殺萬靈裔的真正動機，是試圖提煉其心核靈質以修補某座「北境寒霜巨碑」。（指向擴充類型：**極北冰原 / The Boreal Wastes**）。\n  - **次要線索**：青冥竹海地下深處時常湧出散發金屬鐵鏽味的高溫靈泉，其金石靈蘊與五行相生特徵竟與歐羅巴鍊金工坊的高爐冷卻液高度相通。\n\n---\n\n### 第三章：破霧先驅與浮槎引弦 (Pioneers of the Mists & The Star-Tide Bow)\n\n- **對應年代**：約五百年前，破曉紀。\n- **劇情大綱**：\n  長達兩千五百年的深淵大隔絕在天頂星瀾重現的微光中迎來了曙光。天塹海域狂暴的盲霧開始呈現週期性退潮，兩洋文明的無畏者們紛紛將目光投向了未知浩瀚的死寂之海。然而，波濤之下的暗礁、紊亂的磁場與殘留的虛空風暴，依然足以吞噬任何魯莽的艦船。\n  在歐羅巴，風暴探險家戈德里克船長籌組「晨星號」準備冒死起航時，手下水手因恐懼盲霧幾近譁變。危急關頭，棲居於峽灣懸崖的黑羽渡鴉氏女斥候「卡拉・夜翎」揭下了領航懸賞。卡拉憑藉渡鴉一族對氣流微壓的本能感知與超凡的滑翔視野，綁縛於晨星號最高的瞭望桅杆頂端。在七天七夜的怒海盲航中，卡拉數次於狂暴颶風中展翼滑翔，精準穿透死寂盲霧，帶領晨星號避開了無數致命的暗礁獠牙，最終率先登陸鯨骨島，見證了戈德里克導航石碑的立起。\n  幾乎在同一時期，震旦水鄉船幫先驅沈行舟耗盡家資打造「辟水神木浮槎」，亦重金延請了靈貓氏之異士「渡海靈貓」雲踏雪為座前首席探海靈官。雲踏雪身負貓族絕頂之夜視天賦與平衡直覺，立於浮槎船首，於漆黑無月的海天之間解碼墨衡推演的星瀾潮汐，踏波引航，使浮槎奇蹟般突破了斷脊暗礁的重重迷障，駛抵群島東澳避風港。\n  然而，當兩岸先驅懷著發現新世界的狂喜登上鯨骨島海灘時，眼前的一幕讓所有人目瞪口呆——在巨大的古鯨肋骨陰影下，汐獺潮泳氏、靈貓氏與靈狐氏的水手們早已圍坐在篝火旁烤魚曬網數百年之久！萬靈裔作為天塹群島真正的世居守望者，成為東西兩洋探險家首次相遇時不可或缺的翻譯者、嚮導與破冰人。然而，隨著兩洋航海圖的確立，純樸的群島海角隨即被拖入了跨洋爭霸的血雨腥風之中。\n- **關鍵人物**：\n  - **「夜翎斥候」卡拉 (Kara Night-Plume)**：黑羽渡鴉氏領航先驅，晨星號首席導航員，憑肉身羽翼征服盲霧狂風之奇女子。\n  - **「渡海靈貓」雲踏雪 (Yun Ta-Xue the Tide-Prowler)**：靈貓氏探海靈官，沈行舟浮槎之眼，精通星瀾水性與夜視破霧之術。\n- **關鍵地點**：\n  - **鯨骨島卡拉崖 (Kara's Perch, Whalebone Isle)**：鯨骨自由港外海最高黑石海崖，卡拉昔日滑翔辨識航道之起跳點。\n  - **東澳浮槎古渡 (East-Haven Anchorage)**：沈行舟浮槎首度靠岸處，今為天塹水手最繁忙之木棧道泊位。\n- **遊戲中的遺跡**：\n  1. *世界景觀【卡拉之青銅望鏡台】*：矗立於鯨骨自由港燈塔頂端之遠古觀察鏡座，玩家登頂互動可獲得全島海圖探路成就。\n  2. *航海法寶【靈貓辟水羅盤】*：雲踏雪昔日調校之古老羅盤，裝備後可大幅降低在天塹海域遭遇迷霧漩渦之減速懲罰。\n  3. *傳奇輕甲【穿霧者之翎羽皮襖】*：結合渡鴉羽披與抗風魚皮縫製之游俠戰袍，具備從高處跌落時自動展開滑翔翼之特效。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：卡拉在鯨骨島西側礁岩打撈出一具破損的青銅滑輪，上面刻著精密的非歐幾何刻度與淡金色機械齒輪，其工藝遠超當代兩洲水準。（指向擴充類型：**西方失落新大陸 / The Far Western Expanse**）。\n  - **次要線索**：東澳海底深處每逢望朔之夜會發出低沉的鯨鳴，汐獺水手堅稱水下數百丈處沉睡著一具由萬年神木與白銀雕琢的巨型古艦殘骸。\n\n---\n\n### 第四章：暗礁雙戮與海角血契 (Blood on the Reefs & The Cape Blood-Covenant)\n\n- **對應年代**：約三百年前–一百五十年前，重會之役至公約期。\n- **劇情大綱**：\n  兩洲航道確立後，對天塹群島星髓礦藏與航運霸權的爭奪迅速演化為殊死血戰。在長達一百五十餘年的骨礁海戰中，歐羅巴鐵獅重甲艦隊與震旦五行樓船在斷脊暗礁展開了慘絕人寰的拉鋸。戰爭初期，兩大陣營憑藉強大的物資與法理力量，對萬靈裔實施了殘酷的分化與強徵。\n  無數鐵狼與獵犬戰士被迫披上歐羅巴板甲作為衝鋒肉盾，而另一批狼衛則在震旦兵部威逼利誘下淪為樓船死士。在斷脊暗礁連綿數十里的鐵沉船火海中，無數同胞、同氏族的兄弟在不同軍旗下被迫生死相殘，鮮血將森白珊瑚礁染成刺目赤黑。萬靈裔在血泊中清醒地認識到：沒有獨立武裝與統一契約，萬靈裔在兩洋霸主眼中不過是廉價好用的消耗性兵刃。\n  一百五十年前，戰爭走向終局，兩洋底層水手與混血勞工瀕臨崩潰。黑羽渡鴉氏傳奇傭兵船長「科爾文・黑羽」與荒原巨熊氏猛將「撼海者・巴倫」，密會群島水手領袖「刻骨者」柯特。靈裔領袖做出了歷史性的決斷：全面罷工斷航，不再為任何一尊王座流血！巴倫率領巨熊戰士以萬斤重錨砸碎了兩洋封鎖鏈，科爾文則以精準的情報暗線策動了席捲全海域的水手兵變。\n  起義迫使筋疲力盡的歐羅巴統帥康斯坦丁公爵與震旦老將赫連鐵山於鯨骨島簽署《天塹海岬不戰公約》。在公約簽署的同一夜，科爾文與柯特在公約石階地下，代表萬靈裔各大氏族長老立下了永恆的《海角血契》：正式創立「荒野天平傭兵行會」，確立《荒野鐵律》——靈裔從此不再作為任何國家的附庸參戰，只作為獨立的第三方傭兵接受合約。依據不戰公約「島上禁正規軍」條款，**萬靈傭兵在鯨骨島不得成軍，但大量受聘加入評議會守望隊 (Council Watch) 共同維持港口治安；行會在島上僅保留契約公證處與信託金庫**。萬靈裔憑藉利爪、鋒刃與意志，在兩洋之間為自己贏得了一席不容撼動的席位。\n- **關鍵人物**：\n  - **「黑羽船長」科爾文 (Captain Corwin Black-Plume)**：群島傭兵起義總策劃，以鐵血手腕終結族人充當炮灰命運、建立傭兵行會之傳奇先鋒。\n  - **「撼海者」巴倫 (Baron the Wave-Cleaver)**：荒原巨熊氏無雙力士，一臂之力摧毀封鎖海纜，奠定起義勝局之攻堅統帥。\n- **關鍵地點**：\n  - **斷脊暗礁鐵陵墓 (Spine-Breaker Iron-Tomb)**：骨礁海戰主戰場，數百艘兩洋沉船殘骸交錯形成之水下死亡迷宮。\n  - **公約石階地下秘窟 (The Accords Crypt)**：荒野天平傭兵行會最初宣誓成立並銘刻初代血契之隱秘石室。\n- **遊戲中的遺跡**：\n  1. *大型團隊地下城【斷脊鐵陵之哀歌】*：十人團隊副本，深入暗礁沉船深處，挑戰被死者怨念與狂暴魂核寄生之兩洋骸骨戰艦。\n  2. *世界地標【折斷的鐵獅海錨】*：巴倫昔日擊碎之巨大鐵錨，今斜插於鯨骨自由港入口礁石上，成為不戰與自由之圖騰。\n  3. *傳奇雙手巨錘【撼海者之斷鎖錘】*：以戰艦破甲撞角鍛造之重型兵刃，附帶對城牆、工事與霸體目標造成雙倍粉碎傷害之特效。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：科爾文在打撈暗礁沉船時，自一艘古老戰艦龍骨下震落的深海泥沙中發現了一截非金非玉的黑色令牌，上面刻有直立吞噬漩渦紋章。（指向擴充類型：**南溟歸墟 / The Abyssal Return**）。\n  - **次要線索**：斷脊暗礁最深處的落星海溝裂隙邊緣，時常有一尊身披黑金羽衣、非人非神的神秘身影出沒，其氣息與領航者評議會議長極度相似。\n\n---\n\n### 第五章：四強分據與萬靈天平 (Four Pillars Rise & The Scales of the Wild-Kin)\n\n- **對應年代**：約八十年前–遊戲前夕，四強成形期。\n- **劇情大綱**：\n  海岬公約簽署後的百年間，兩大陸政治格局發生劇烈重組，四大新興霸權相繼確立：歐羅巴的鐵銀公約由奧古斯都大元帥集權立誓，星盤修會在天星至聖奧蕾莉亞領導下脫離教廷自立；震旦的北境兵權落入赤炎霸王赫連烈之手，天下金脈則被雲海商盟總舵魁溫九娘盡數收攏。兩洋局勢自「兩大文明對立」轉向「四強博弈割據」。\n  四大霸主皆極具遠見地意識到：橫跨兩洋、在各處險要地界皆有眼線且個體戰力彪悍的萬靈裔傭兵，是足以顛覆均勢的最強第三方槓桿。奧古斯都以正規軍官頭銜與重工板甲利誘狼衛部隊；奧蕾莉亞以星髓幾何解析法與學院秘儀拉攏靈狐智者；赫連烈在斷雲關熔谷擺下百壇烈酒，與巨熊、狼犬悍將折箭為誓拜為生死兄弟；溫九娘則透過千帆商館，向靈裔七大氏族提供無限額度的無息糧草與毛皮收購契約。\n  面對四大首領強大的政治與經濟虹吸，萬靈裔內部再次面臨被各個擊破、徹底割裂為四大派閥附庸的致命危機。危難之際，靈狐與狼犬混血之草莽梟雄「索蘭・赤尾」橫空出世。索蘭敏銳洞悉了四大陣營的弱點與訴求，他在天塹群島召開萬靈大會，歷經七天舌戰與武力壓制，徹底整合了各自為政的七大氏族，宣布「百獸血盟議會」與「荒野天平傭兵行會」緊密協作。\n  索蘭以無與倫比的手腕建立了「傭兵天平配額制」：限制單一氏族在任何單一陣營的參戰人數，規定各大陣營僱用傭兵時必須支付雙倍魂核保證金，且嚴禁簽署排他性從屬條約。索蘭的「天平原則」讓四大首領恨得咬牙切齒，卻又不得不倚重其麾下戰力。萬靈裔在四強博弈的刀尖上優雅起舞，不僅守住了自身獨立性，更在天塹群島累積了富可敵國的魂核儲備與跨洋情報網，正式躋身為兩洋誰也不敢輕易招惹的無冕之王。\n- **關鍵人物**：\n  - **「雙天平」索蘭・赤尾 (Soran Red-Tail)**：荒野天平大主裁，兼具狐族之深沉智謀與狼犬之鐵血手腕，將部族從附庸危機中引向獨立均勢之卓越領袖。\n  - **「雪嶺先知」希爾達 (Hilda the Frost-Seer)**：靈鹿氏極北流亡先知，於群島大會上出示極北冰原之星髓異變預兆，力促全族統一。\n- **關鍵地點**：\n  - **荒野天平大議事廳 (The Grand Scales Chamber)**：位於天塹群島萬靈海角，懸掛巨型青銅雙天平之跨洋傭兵決策中心。\n  - **千帆商館密室 (Thousand-Sails Parlor, Frostfjord)**：溫九娘與索蘭定期秘密會晤、敲定跨洋傭兵糧草調撥之隱秘閣樓。\n- **遊戲中的遺跡**：\n  1. *陣營前哨地標【天平傭兵行會駐所】*：設立於各大陣營首府與前哨周圍的中立辦事處，玩家可在此接取高額中立懸賞與傭兵聲望任務。\n  2. *機密文卷道具【四強密約拓本】*：記錄索蘭與四大首領談判底線之絕密羊皮卷，可用於提高在中立拍賣行的分紅權限。\n  3. *傳奇戒指【平衡大主裁之印】*：象徵索蘭信諾之黃銅天平印戒，裝備後在面對任何陣營 NPC 時皆享有初始聲望友善加成。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：希爾達先知自極北帶回的一枚深藍冰晶碎片，在接觸到溫九娘自南溟拍賣得來的赤銅流火木時，爆發出撕裂空間的雷鳴嗡鳴。（指向擴充類型：**極北冰原與烈日荒原之天地對立極境**）。\n  - **次要線索**：赫連烈曾於斷雲關酒宴上私下向索蘭透露，他在清繳北境地熱熔谷時，曾挖出一具長有狐耳與龍角特徵的太古先祖青銅骨骼。\n\n---\n\n### 第六章：魂核狂潮與裂城之誓 (Surge of the Soul-Cores & The Oath of Sundered Cities)\n\n- **對應年代**：當前星瀾紀元年（進行式，遊戲開始時）。\n- **劇情大綱**：\n  當前現世，落星海溝深處猛然爆發沖天紫藍光柱，沉寂三千年的原初星髓全面復甦，引發全大陸地脈與魔網劇烈共振。鋪天蓋地的「魂核狂潮」席捲兩洲，全境魔獸大面積狂暴異化。與此同時，四大陣營圍繞古代智能工坊與地脈核心的暗戰徹底爆發，全面進入白熱化階段。\n  風暴迅速蔓延至四大陣營的權力中樞——四座陣營首府（艾森堡、霧環堡、碧瀾商都、斷雲關）並非不受侵犯的安全區，皆面臨著敵對大軍的攻城兵燹威脅！雖然**四座首府當前依然在位、尚未陷落**，但公約重裝師團與星盤修士在低地對峙、赤焰軍戰戟在邊境頻繁威逼商都運河，戰局如箭在弦上。\n  面對首府可能失守的嚴峻風險，四大陣營首領暗中派出心腹密使渡海抵達天塹群島萬靈海角，跪倒在荒野天平大議事廳前，與行會秘密洽談**「預備借兵密約」(Contingency Intervention Accords)**——承諾若首府不幸陷落，將以極其優渥的代價（劃定萬靈自由特區、長年免稅商道、高階原初星髓結晶）僱傭行會精銳出兵收復城池。\n  然而，行會大主裁索蘭・赤尾與全體長老站在了前所未有的十字路口：\n  一方面，狂暴魂核在野外的肆虐，引發了年輕一代萬靈戰士的「血脈反噬」——狼犬氏激進督統「格羅姆・鐵爪」公然倡導吞服狂暴魂核以換取肉身弒神之力，部族面臨分裂內戰；\n  另一方面，四大首領的預備借兵開價雖然誘人，但潛在的佔領方亦秘密開出雙倍賞金，要求行會嚴守中立、按兵不動。行會長老們在青銅雙天平前反覆權衡，評估押注，等待歷史第一張骨牌倒下。\n  是遵從古老天平之信諾出兵逆轉戰局？是趁各大文明兩敗俱傷之際舉族自立？抑或是追查海溝異動背後的太古神祇甦醒真相？號角吹響，萬千冒險者踏入天塹，萬靈裔之命運，正交由活生生的世界博弈動態書寫！\n- **交給 AI 首領與 AI Director 推進的 3 條動態衝突／謎團**：\n  1. **【裂城援軍之血契天平 (The Weighing of the Contingency Accords)】**：\n     - *觸發機制*：當任一陣營首府遭受敵對大軍圍攻或不幸陷落時，流亡方 AI 首領將判定是否啟動【向萬靈裔借兵】契約。\n     - *動態博弈*：流亡首領開出「讓渡城內特區管轄權與 30% 稅收」請求出兵；佔領方首領則發動「雙倍暗盤利益與海路封鎖」。AI Director 根據兩洋冒險者在荒野天平行會完成的軍需物資籌備進度，動態決定萬靈裔是否派遣精銳 NPC「鐵狼重裝大進軍」介入攻城戰。\n  2. **【狂血魂核與行會分裂之亂 (The Schism of the Frenzy Core)】**：\n     - *觸發機制*：野外菁英怪產出的「狂暴魂核」若流入智能工坊，武器攻擊力提升 20% 但附加「生命持續流失」負面特性。\n     - *動態博弈*：激進派督統格羅姆在群島私設狂血祭壇，傳統派大主裁索蘭下達清剿令。冒險者可自由選擇立場：支持索蘭維護天平律法，或支持格羅姆獵殺純血長老以換取狂化戰鬥增益。\n  3. **【落星海溝之遠古獸祖共鳴 (The Ancestral Call of the Trench)】**：\n     - *觸發機制*：落星海溝光柱每逢星瀾潮汐達到峰值時，引發全域萬靈裔 NPC 集體朝向海溝深淵長嚎。\n     - *動態博弈*：水下打撈隊報告海溝深處浮現出直徑達數十里的太古巨型浮空島陰影，疑似神柱紀沉沒之「始源大林莽核心天壇」，吸引四陣營精銳探險隊與萬靈先鋒展開水下探索爭奪戰。\n- **關鍵人物**：\n  - **「雙天平」索蘭・赤尾 (Soran Red-Tail)**：行會大主裁，竭力在四大霸權首府爭霸烽火與族內狂血分裂狂潮中維繫萬靈天平之孤傲掌舵人。\n  - **「鐵爪狂煞」格羅姆 (Grom Iron-Claw)**：狂血戰團督統，狼犬氏極端主義領袖，企圖藉由吞噬深淵魂核重塑萬靈統治地位之危險狂人。\n- **關鍵地點**：\n  - **萬靈海角大校場 (Wildkin Cape Great Parade)**：天塹群島萬靈裔集結重裝傭兵、等候出兵令旗之演武場（安全區）。\n  - **落星海溝沸騰裂口 (Boiling Fissure, Falling Star Abyss)**：星髓光柱爆發源頭，海水蒸騰、異化深海巨獸出沒之極限危險區。\n- **遊戲中的遺跡與動態事件**：\n  1. *動態世界事件【首府反攻：萬靈鐵狼大進軍】*：借兵協議達成後，由 AI 統帥率領之巨型熊狼攻城部隊自海角誓師，搭乘巨艦強登首府碼頭，展開宏大攻城戰。\n  2. *日常工坊委託【淨煞草藥煉製】*：冒險者向靈狐長老繳納黑森林草藥與竹海晨露，調配可壓制狂血反噬之清心靈液，獲取行會高階聲望。\n  3. *傳奇戰旗裝備【荒野天平復國戰旗】*：首府借兵部隊核心軍旗，插下後在周圍 50 米範圍內為全體盟友提供 15% 減傷與霸體護盾。\n- **伏筆／擴充鉤子**：\n  - **主鉤子**：海溝光柱噴出的最核心一塊萬斤星髓原石內部，經星盤學者與靈狐大巫聯合探測，赫然封存著一尊非神、非魔、同時具備鹿角與羽翼特徵的太古先民石化身軀。（指向擴充類型：**跨洲共同事件 / 兩陸神代同源真相**）。\n  - **次要線索**：四陣營邊境黑市拍賣行中，流通著一種由神秘黑羽使者拋售的「太古地圖殘片」，拼合後竟指向西方大洋彼岸的發光青銅城郭。\n\n---\n\n## C. 開放結局 (Open Endings)\n\n萬靈裔故事線在第六章停留在烽火連天之進行式。其歷史命運不設死定局，交由 AI 首領、AI Director 與全體玩家之陣營攻防及鍛造抉擇共同推演：\n\n- **走向一：荒野天平的萬邦制衡 (The Reign of the Wildkin Scales)**\n  若大主裁索蘭之天平理念獲得玩家廣泛支持，荒野天平傭兵行會將藉由數次首府攻防之關鍵介入，迫使四大陣營正式承認萬靈裔為「兩洋永久自由主權聯合體」。各大首府均劃出萬靈自治特區，天塹群島成為跨洋政治最高仲裁所，萬靈裔以超然傭兵之姿，在破碎世界中構築起穩固的均勢秩序。\n- **走向二：狂血覺醒與自立為王 (The Blood-Awakened Sovereignty)**\n  若激進派格羅姆與狂血戰團在魂核爭奪中擊潰傳統長老，萬靈裔將全面拋棄中立契約，吞噬原初星髓之力化身狂暴大軍。格羅姆將撕毀《海角血契》，趁兩洋首府空虛之際閃電奇襲鯨骨自由港自立為王，建立鐵血統治的「萬靈獸帝國」，掀起向兩大陸展開血腥復仇與擴張之滔天狂瀾。\n- **走向三：深淵探路與星槎遠航 (The Pathfinding Exodus to the Deep)**\n  若兩洋霸權之全面大戰徹底摧毀了群島生態，且落星海溝之遠古召喚突破極限，萬靈各大氏族長老將判定「現世文明已不可救藥」。部分深海氏族與漂流氏族長老率領一支先遣探路船隊，登上古老辟水浮槎與星髓方舟，向著極南「南溟歸墟」或西方失落大陸探路遠航；而留在兩洋的大多數萬靈氏族則持續守護天平，與陸地生靈共同迎向資料片萬靈覺醒之新時代。\n\n---\n\n## D. 擴充鉤子登錄表 (Expansion Hooks Table)\n\n嚴格逐條對齊獸族六章故事內文，每章對應一條主鉤子及次要線索：\n\n| 伏筆名稱（主鉤子） | 出處章節 | 指向的擴充類型 | 章節內文次要線索 | 未解之謎線索與未來展開方向 |\n|---|---|---|---|---|\n| **蘇微月靈書之極南海淵漩渦** | 獸族 第 1 章 | **南溟歸墟**<br>`The Abyssal Return` | 天塹西崖深處玄武岩壁上，退潮時滲出深藍微光液體的萬丈太古獸爪抓痕。 | 靈書記載天外災星墜落時，海嘯將大量天柱碎片捲入極南海淵。南溟歸墟疑為太古原核崩落之終極海眼，預留為未來「深淵潛航、靈界引渡與水下神殿」資料片。 |\n| **烏爾夫黑沼密匣的極北巨碑手札** | 獸族 第 2 章 | **極北冰原**<br>`The Boreal Wastes` | 青冥竹海地下湧出的高溫金屬泉水，成分與歐陸鍊金高爐冷卻液高度相通。 | 瓦爾瑟夫審判長獵殺靈裔實為抽取靈質修補極北寒霜巨碑。證實極北永凍土下存在抑制全球地脈暴走之太古裝置，預留為未來「極北冰原冒險與寒霜神碑考古」資料片。 |\n| **卡拉在鯨骨島拾獲之青銅幾何滑輪** | 獸族 第 3 章 | **西方失落新大陸**<br>`The Far Western Expanse` | 東澳海底深處每逢望朔之夜發出鯨鳴之萬年神木白銀巨艦遺骸。 | 青銅滑輪銘刻非歐幾何拓撲刻度與淡金齒輪。證實西大洋彼岸存在未被天塹之裂毀滅、具備高階神代機械工藝之獨立文明，預留為「跨洋大航海與青銅大陸遠征」版本。 |\n| **斷脊沉船龍骨下之南溟噬魂令牌** | 獸族 第 4 章 | **南溟歸墟**<br>`The Abyssal Return` | 骨礁海戰期間長年出沒於海溝邊緣、氣息近似評議會議長之黑金羽衣神秘人。 | 黑色令牌刻有垂直吞噬漩渦圖騰，與古王朝密卷進貢錄互為印證。揭示天塹群島評議會高層與南溟幽冥勢力存在古老密約，預留為「群島背叛與深淵世界首領」主線。 |\n| **希爾達冰晶與赤銅流火木之極境共鳴** | 獸族 第 5 章 | **烈日荒原**<br>`The Sunscorched Badlands` | 赫連烈於斷雲關熔谷深處掘出之具備狐耳與龍角特徵之太古青銅先祖骨骼。 | 極北深藍冰晶與極南流火木劇烈相斥又相吸。證實世界南北兩極存在「極寒」與「極炎」之對稱能量極樞，預留為未來「烈日荒原生存與熔岩神殿討伐」高難度資料片。 |\n| **海溝萬斤星髓封存之雙相先祖石骸** | 獸族 第 6 章 | **跨洲共同事件**<br>（神代同源真相） | 四陣營邊境黑市流通之指向西方發光青銅城郭的太古地圖殘片。 | 星髓結晶中封存之石骸同時具備鹿角與羽翼特徵。徹底顛覆「人獸殊途」與「神罰天塹」之宗教偏見，證實兩陸萬物神代同源，為全球大事件「太古神庭重鑄」之核心鑰匙。 |\n\n---\n\n"}, {"id": "glossary", "group": "參考", "title": "專有名詞對照表", "version": "", "file": "docs/glossary.md", "text": "# 專有名詞對照表 (Glossary)\n\n中英對照的唯一來源。翻譯 handoff 簡報與回覆時必須沿用此表；新名詞定案後由 Opus 補入（附來源）。\n\n| 中文 | English | 類別 | 來源 |\n|---|---|---|---|\n| 天塹星瀾（暫定遊戲名，原代號 大陸計畫） | The Sundered Reach | 遊戲名稱 Title | ADR-0004 |\n| 歐羅巴大陸 | Europa | 地理 Geography | GDD |\n| 震旦大陸 | Orientis | 地理 Geography | GDD
