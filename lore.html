re/ |\n| 雲海浮空峰 | Cloudveil Floating Peaks | 地理 Geography | docs/lore/ |\n| 青冥竹海 | Azure Bamboo Sea | 地理 Geography | docs/lore/ |\n| 絲沙瀚海 | The Silk-Sand Wastes | 地理 Geography | docs/lore/ |\n| 神柱紀 | Age of Pillars | 世界觀 Lore | docs/lore/ |\n| 長夜紀 | The Long Night | 世界觀 Lore | docs/lore/ |\n| 破曉紀 | The Dawning | 世界觀 Lore | docs/lore/ |\n| 聖言共鳴 | Logos Resonance | 系統與機制 Systems | docs/lore/ |\n| 言靈化形 | Qi-Word Manifestation | 系統與機制 Systems | docs/lore/ |\n\n## 翻譯規則\n\n- 表內名詞一律照表翻譯，不自行改譯。\n- 表外的新專有名詞：保留原文並在括號附暫譯，回覆中列入「新名詞」清單，由 Opus 定案後入表。\n"}, {"id": "gdd", "group": "參考", "title": "遊戲設計規格書 GDD", "version": "", "file": "docs/GDD.md", "text": "# 《天塹星瀾 The Sundered Reach》（暫定名，原代號 Project: Continents）MMO 核心系統架構與設計規格書 (GDD)\n\n## 1. 遊戲核心願景與定位 (Project Vision & Pillars)\n\n### 1.1 遊戲願景\n\n構建一款兼具「3D 無鎖定極限操作打擊感」**、**「深度裝備驅動生態」**與**「生成式 AI 動態演進」的中世紀奇幻 MMORPG。世界地貌以地球宏觀地質為雛形進行奇幻化重構，早期開放「歐羅巴大陸（歐式中世紀奇幻）」與「震旦/九洲大陸（東方仙俠/武俠中世紀奇幻）」，並以動態 AI 首領引導世界政局演變。\n\n### 1.2 核心設計支柱 (Core Pillars)\n\n1. **極致動作反饋 (Combat)**：以《龍之谷》、《黑色沙漠》為標竿的無鎖定動作體系，強調視角、判定框（Hitbox）、連招取消與受擊硬直。\n\n2. **三位一體玩家生態 (Ecosystem)**：刷怪型玩家、副本討伐型玩家、生活採集與工匠玩家相互依存，所有玩法的產出皆為核心裝備生態的一環。\n\n3. **AI 生成式鍛造 (Generative Crafting)**：傳統固定產出與「文字/圖像/素材特性驅動」的 AI 自由鍛造並行，在嚴謹數值平衡公式下滿足玩家自定義神兵的夢想。\n\n4. **自主演進世界 (Living Geopolitics)**：各大陣營領袖為獨立運行的大型語言模型 (LLM) 代理人，依據伺服器整體資源、領地變化與玩家行為動態決定外交政策（同盟、中立、宣戰）。\n\n## 2. 戰鬥系統設計 (Action & Combat Mechanics)\n\n### 2.1 視角與操作架構\n\n* **3D 非鎖定視角 (True Action Combat)**：十字準星控制角色攻擊朝向與技能釋放點，徹底摒棄傳統 Tab 鍵切換目標。\n\n* **物理判定矩陣 (Hitbox & Hurtbox)**：\n\n  * 所有近戰判定均依據武器揮舞軌跡的實體碰撞盒。\n\n  * 遠程彈道具有飛行時間、下墜（拋物線）與穿透係數。\n\n* **動作流暢度機制**：\n\n  * **閃避/格擋優先級**：翻滾/閃避具備無敵幀（i-Frame），可隨時強制中斷當前攻擊動作後搖。\n\n  * **受擊狀態體系**：霸體（Super Armor）、破霸值、擊飛、浮空（空中連擊 Juggle）、倒地追擊與倒地受身。\n\n  * **資源循環**：體力條（Stamina，用於位移/翻滾/格擋）與法力/內勁條（MP/Qi，用於技能施放）。\n\n## 3. 世界地圖與大陸格局 (World Building & Geography)\n\n在地質分佈上參考地球版圖，但融入高魔奇幻環境異象。保留各大洲板塊交界處的擴展接口（未來版本開放美洲大陸、非洲大陸等）。\n\n```\n                        [極北冰原 - 預留擴展]\n                                  │\n      ┌───────────────────────────┴───────────────────────────┐\n      ▼                                                       ▼\n【歐羅巴大陸 (Europa)】                                    【震旦大陸 (Orientis)】\n· 哥德式城堡與神聖帝國                                   · 靈脈山巒、竹海與古王朝\n· 迷霧低地、黑森林、峽灣                                 · 絲路荒漠、水墨江南、雲海仙宮\n· 核心特色：重裝鎧甲、鍊金術、神恩                       · 核心特色：氣勁、御劍、道法、符籙\n      ▲                                                       ▲\n      └───────────────────────────┬───────────────────────────┘\n                                  │\n                        [交匯海域 / 中立自由貿易港]\n                                  │\n                    [未來擴充版塊：新大陸 / 烈日荒原]\n\n```\n\n### 3.1 區域劃分\n\n* **歐羅巴大陸 (Europa)**：\n\n  * **風貌特徵**：哥德式尖頂建築、古老修道院、鬱鬱蔥蔥的溫帶黑森林、冷冽的峽灣與風暴海岸。\n\n  * **世界觀氣氛**：騎士團的信仰榮耀、古典鍊金術的神秘、舊神教會與異端魔女的角力。\n\n* **震旦大陸 (Orientis)**：\n\n  * **風貌特徵**：雲海浮空峰、青翠竹林、流水水鄉城鎮、浩瀚絲綢荒漠與古道雄關。\n\n  * **世界觀氣氛**：宗門修真、天地靈氣流轉、古代神獸封印與皇權統治。\n\n* **天塹群島 (The Rift Archipelago)**：\n\n  * 兩大洲中繼的無序海域與自由貿易城邦，各陣營與兩洲冒險者自由交流的核心 hub。由領航者評議會 (Council of Helmsmen) 自治，四陣營只能設領事館與商館（ADR-0005）。首府鯨骨自由港為安全區 (Safe Zone)，城內禁止 PvP（ADR-0009）。\n\n## 4. 職業體系 (Class Archetypes)\n\n玩家依據出生大陸解鎖本土基礎職業，**不綁定陣營敵對關係**。到達高階後，可透過跨大陸遊歷學習異域天賦。\n\n| 大陸起源 | 基礎職業 | 戰鬥風格 | 核心機制 | \n| ----- | ----- | ----- | ----- | \n| **歐羅巴** | **聖堂騎士 (Templar)** | 大劍/劍盾、重裝衝鋒、審判光環 | **神聖防衛 (Aegis)**：受擊累積格擋值，釋放高爆發光屬性反擊 | \n| **歐羅巴** | **獵魔斥候 (Inquisitor Scout)** | 雙持弩、刺劍、陷阱、鍊金彈藥 | **弱點洞悉 (Insight)**：標記怪物部位，命中弱點觸發撕裂效果 | \n| **歐羅巴** | **秘術賢者 (Arcanist)** | 法杖/魔導書、元素聚變、時空扭曲 | **共鳴法環 (Harmonics)**：冰火雷元素疊加引發連鎖法術爆炸 | \n| **震旦** | **游俠劍客 (Blademaster)** | 單手唐刀/長劍、高速瞬影突進 | **劍意 (Sword Intent)**：精準時機出招疊加劍氣，解鎖浮空飛劍終結技 | \n| **震旦** | **五行道士 (Taoist)** | 拂塵/符劍、御火引雷、奇門遁甲 | **陰陽雙相 (Yin-Yang)**：切換陰陽氣息，兼顧控場、輔助與範圍真傷 | \n| **震旦** | **破軍力士 (Titan Guard)** | 長柄戰戟/巨斧、近身抓取、大範圍揮砍 | **氣魄 (Unstoppable Qi)**：蓄力霸體抗傷，受擊轉化為外功暴擊率 | \n\n## 5. 三核裝備生態與驅動迴路 (Loot & Economy Loop)\n\n遊戲以「裝備追求」為長期核心，但將產出分配給各類玩家，打破傳統「只有副本打手能獲得頂裝」的弊病。\n\n```\n              ┌─────────────────────────────┐\n              │      刷怪玩家 (Grinders)    │\n              │  大量基底材料 / 怪物魂核 / 催化劑  │\n              └──────────────┬──────────────┘\n                             │\n                             ▼\n┌──────────────────────┐    ┌───────────────────────────┐    ┌──────────────────────┐\n│  挑戰玩家 (Raiders)   │───▶│   AI 智能工坊 (The Forge)  │◀───│  生產玩家 (Crafters)  │\n│ 罕見首領部位/限定詞條基石│    │  平衡預算檢定 ➔ 獨特神兵生成  │    │ 特性提煉/純度萃取/採集原材 │\n└──────────────────────┘    └───────────────────────────┘    └──────────────────────┘\n                             │\n                             ▼\n              ┌─────────────────────────────┐\n              │       自由市場與陣營補給      │\n              │  裝備流通、專屬貿易、陣營武備  │\n              └─────────────────────────────┘\n\n```\n\n### 5.1 玩家角色職能劃分\n\n1. **野外刷怪玩家 (Grinders)**：\n\n   * **職責與收穫**：大量基礎素材、稀有掉落「魂核結晶（Soul Nucleus）」、附魔催化劑。\n\n   * **爽感來源**：大群怪物聚怪割草的打擊反饋與高頻驚喜感。\n\n2. **高端副本玩家 (Raiders)**：\n\n   * **職責與收穫**：攻克高難度首領（Boss），獲得「首領獨特器官/骨骼」、神話品質裝備圖紙、高階特性槽位石。\n\n   * **爽感來源**：極限走位破招、機制破解與頂級榮譽。\n\n3. **生活採集與工匠玩家 (Crafters & Gatherers)**：\n\n   * **職責與收穫**：世界各地稀有草藥、礦脈、奇異木料的採集，熟練度進階，素材提煉純度。\n\n   * **爽感來源**：掌控市場經濟定價權、身為「傳奇神匠」受到全服委託。\n\n## 6. AI 裝備生成系統架構 (Generative Crafting Engine)\n\n為避免玩家純文字/圖像輸入破壞遊戲數值平衡，系統採用「總預算點數約束（Budget Point System）」**與**「語義特徵映射矩陣」。\n\n### 6.1 鍛造工作流 (Pipeline)\n\n```\n[玩家輸入]\n  ├─ 投入素材 (含品質等級、物理/魔法特性標籤)\n  ├─ 自然語言描述 (如: \"帶有黑炎的刺客短刃，攻擊時引爆暗影\")\n  └─ (可選) 參考草圖 / 外觀概念圖\n         │\n         ▼\n[語義解析與安全過濾層 (LLM + Logic Guardrails)]\n  ├─ 敏感詞、破壞氛圍詞語 (如 \"核彈槍\") 剔除與重構\n  ├─ 玩家意圖提取 (偏好: 高攻速、暗影持續傷害、突進強化)\n  └─ 合法性驗證 (素材品質是否能支撐玩家構想)\n         │\n         ▼\n[數值與平衡平衡池 (Balance Budget Engine)]\n  ├─ 總預算點數計算：$P_{total} = f(\\text{Material Tiers}, \\text{Crafting Skill}, \\text{Catalyst})$\n  ├─ 屬性點分配分配至主屬性、副屬性、被動特效 (Affixes)\n  └─ 懲罰機制 (過分追求單一極限值將觸發負面代價，如: -15% 最大生命值)\n         │\n         ▼\n[外觀與程序化資產拼裝 (Visual & Asset Synthesizer)]\n  ├─ 根據玩家草圖/描述，從模組化資產庫中匹配刀柄、刃身、特效粒子 (VFX)\n  └─ 生成裝備唯一 Icon、模型貼圖著色與傳奇敘事文本 (Lore)\n         │\n         ▼\n[產出成品] ➔ 登記至全服裝備資料庫\n\n```\n\n### 6.2 數值平衡公式範式\n\n一件 AI 裝備的綜合屬性強度嚴格受到投入材料與工匠等級的上限約束：\n\n$$\nP_{\\text{total}} = \\sum_{i=1}^{n} (W_i \\cdot Q_i) + B_{\\text{artisan}}\n$$\n\n* $W_i$：各素材的權重階級 (Tier 1 \\~ 5)。\n\n* $Q_i$：各素材的純度 (Purity %，源於生產玩家的高階精煉)。\n\n* $B_{\\text{artisan}}$：打造者生活技能等級加成。\n\n**平衡規則**：玩家在文字中要求「極限攻擊力」，AI 系統將自動壓縮其防禦屬性與裝備耐久度，確保任何自製裝備**無法超越同階副本極限裝備的總等效戰力值**，但能提供獨一無二的戰術機制搭配。\n\n## 7. AI 陣營與動態外交系統 (Dynamic Faction & AI Sovereigns)\n\n玩家在到達等級上限（如 Lv.50）後，脫離初始大陸新手保護，可自由加入世界幾大核心陣營。\n\n### 7.1 核心陣營設定\n\n陣營結構採「地緣雙核＋跨洲分支」：兩個陣營根植歐羅巴、兩個根植震旦，各自在對岸大陸設**駐地 (Enclave，不可攻佔)** 與周邊**前哨 (Outpost，可攻佔)**（ADR-0005、ADR-0008；完整設定見 `docs/lore/`）。\n\n1. **鐵銀公約 (The Iron & Silver Concord)**｜歐羅巴：崇尚秩序、防衛與重工業，注重集體防衛。徽記銀獅。\n\n2. **星盤修會 (Order of the Starlight Astrolabe)**｜歐羅巴：追求世界真理與古老魔法，主張知識共享與中立。\n\n3. **天行赤焰軍 (The Crimson Vanguard)**｜震旦：尚武擴張、強者為尊，注重野外資源爭奪。\n\n4. **雲海商盟 (The Cloudveil Syndicate)**｜震旦：重商主義、金錢至上，善於運用經濟制裁與懸賞。\n\n### 7.2 AI 陣營首領代理人 (Sovereign Agents)\n\n* 每個陣營由具備獨立長短期記憶、性格特徵與戰略偏好的 AI Agent 執掌。\n\n* **動態外交機制**：\n\n  * **數據驅動決策**：AI 首領即時讀取伺服器全體數據（陣營總人口、領地產出、軍備總評分、近期傷亡率）。\n\n  * **外交狀態切換**：\n\n    * **結盟 (Alliance)**：當弱小陣營面對霸權陣營時，AI 領袖會主動發起外交會晤，向對方 AI 發送盟約提議。\n\n    * **中立/貿易通商 (Neutrality/Trade)**：簽署互不侵犯條約，互相開放專屬物資交易所。\n\n    * **全面宣戰 (Warfare)**：發布陣營宣戰動員令，觸發攻城戰與野外大規模 PvPvE 事件。\n\n  * **動態動員公告**：AI 領袖會生成帶有個人風格的演說信件、懸賞任務至所屬陣營玩家信箱。\n\n## 8. 動態世界事件架構 (AI Director & Dynamic Events)\n\n遊戲摒棄固定時間刷新的死板事件，採用類似 AI Director 的中央事件調度器。\n\n### 8.1 事件觸發邏輯\n\n* **環境壓力閥**：若某張地圖的特定怪物被過度刷取，生態將失衡，AI 調度器將生成「狂暴獸潮」反撲城鎮。\n\n* **跨陣營爭端事件**：邊境礦區資源告急時，AI 陣營首領會指派「精銳補給車隊」，並在全服廣播僱用護送與劫鏢任務。\n\n* **突發史詩副本**：大地圖地殼變動或魔力溢出時，AI 動態生成隨機迷宮入口，限定時間內開放，挑戰成功後地貌恢復。\n\n## 9. 系統技術架構與 API 介面規劃 (Technical Architecture)\n\n```\n┌─────────────────────────────────────────────────────────────┐\n│                    客戶端 (Unreal Engine 5)                 │\n│  - 3D 無鎖定戰鬥控制器 (Hitbox 判定 / 動態攝像機 / 技能藍圖)   │\n│  - 模組化裝備拼裝器 (Skeletal Mesh Merge / 動態材質實例)    │\n└──────────────────────────────┬──────────────────────────────┘\n                               │ (gRPC / WebSocket)\n                               ▼\n┌─────────────────────────────────────────────────────────────┐\n│                   遊戲伺服器群 (Dedicated Server)          │\n│  - SpatialOS / 空間分區架構 (支援無縫大世界地圖切換)          │\n│  - 物理與戰鬥驗證 (權威伺服器防作弊、CD檢定、位置同步)       │\n└──────────────────────────────┬──────────────────────────────┘\n                               │ (Internal REST / Event Bus)\n                               ▼\n┌─────────────────────────────────────────────────────────────┐\n│                     AI 微服務中樞 (AI Core Engine)          │\n├──────────────────────────────┬──────────────────────────────┤\n│ 【Forge AI Service】         │ 【World Director Service】   │\n│ - NLP 語義解析 / Prompt 工程  │ - 陣營決策狀態機 (Behavior)   │\n│ - 數值預算分配校驗演算法     │ - LLM 首領人格記憶庫 (RAG)   │\n│ - 外觀模組匹配映射器         │ - 動態事件排程與即時廣播     │\n└──────────────────────────────┴──────────────────────────────┘\n                               │\n                               ▼\n┌─────────────────────────────────────────────────────────────┐\n│                   基礎設施與持久化存儲 (Data Layer)         │\n│  - Redis (即時熱點狀態 / 拍賣行緩存)                         │\n│  - PostgreSQL (玩家資產 / 裝備全屬性二進位儲存)             │\n│  - Vector DB (Milvus/Pinecone - 用於語義與外觀檢索)         │\n└─────────────────────────────────────────────────────────────┘\n\n```\n\n### 9.1 AI 介面規範定義 (Interface Schema 示例)\n\n#### 鍛造請求介面 (`/api/v1/forge/generate`)\n\n* **Request (Payload)**:\n\n  ```\n  {\n    \"crafter_id\": \"UUID\",\n    \"prompt_text\": \"一把能撕裂狂風的刺劍，帶有銀白色羽翼裝飾\",\n    \"image_sketch_url\": \"https://storage.cdn/.../sketch_001.png\",\n    \"materials_input\": [\n      { \"item_id\": \"mat_mithril_ore\", \"count\": 5, \"purity\": 0.95 },\n      { \"item_id\": \"mat_roc_feather\", \"count\": 2, \"trait\": \"wind_strike\" }\n    ],\n    \"artisan_level\": 42\n  }\n  \n  ```\n\n* **Response**:\n\n  ```\n  {\n    \"equipment_id\": \"eq_generated_98231\",\n    \"name\": \"風靈羽斬 (Zephyr Featherblade)\",\n    \"tier\": \"Epic\",\n    \"budget_allocated\": {\n      \"base_patk\": 320,\n      \"attack_speed\": 1.15,\n      \"affixes\": [\n        { \"id\": \"affix_gale_force\", \"desc\": \"普通攻擊最後一段觸發風刃，造成 40% 敏捷加成的風屬性傷害\" }\n      ],\n      \"balance_penalty\": null\n    },\n    \"mesh_blueprint_id\": \"mesh_rapier_feather_v2\",\n    \"lore_text\": \"在狂風呼嘯的崖頂淬煉而成的輕靈之刃，每一次出鞘都伴隨著巨禽的低鳴。\"\n  }\n  \n  ```\n\n## 10. 開發里程碑與初期驗證計畫 (Milestones)\n\n1. **M1 (戰鬥手感原型驗證)**：\n\n   * 實現單人地圖的 3D 無鎖定攻擊、連招打擊硬直、格擋、翻滾手感，對標《黑色沙漠》。\n\n2. **M2 (AI 工坊數值沙盒)**：\n\n   * 建立鍛造預算演算法，進行 10,000+ 次模擬生成，驗證數值浮動範圍是否完全收斂在平衡線以內，杜絕數值膨脹。\n\n3. **M3 (雙大陸核心場景與採集循環)**：\n\n   * 建立歐陸主城、震旦主城各一座，串聯「採集-刷怪-工坊鍛造-拍賣行」的核心經濟循環。\n\n4. **M4 (AI 陣營領袖接入演習)**：\n\n   * 啟動 4 位 AI 首領 Agent，在封閉測試中透過模擬玩家群體行為觀察其外交同盟/宣戰的動態合理性。"}, {"id": "adr-0001", "group": "決策紀錄 ADR", "title": "ADR-0001 專案協作與版控流程", "version": "已採納", "file": "docs/decisions/ADR-0001-workflow.md", "text": "# ADR-0001 專案協作與版控流程\n\n- 日期：2026-10-05\n- 狀態：已採納\n- 決策者：Rex（Opus 提案）\n\n## 決策\n\n1. **子方案拆分**：SP0–SP8，每個子方案一份 md（`docs/subprojects/`），frontmatter 為追蹤資料來源。\n2. **追蹤網頁兩者並用**：repo 內 `tracker/index.html`（由 `tools/build_tracker.py` 從 md 產生，進 git）為唯一真相；另發布 claude.ai 線上版供瀏覽分享。\n3. **多模型接入**：採本機 Claude Code CLI 作主控，搭配本機 gemini-cli、codex（Cowork 雲端與沙盒無法連到 Google/OpenAI API）。\n4. **版控**：先在 `D:\\MMO_` 建本地 git repo，所有改動皆 commit；GitHub 遠端之後接上。\n5. **優先順序**：基建完成後先推進 SP2 戰鬥系統設計（M1）。\n\n## 理由\n\n- md + git 讓所有討論可追溯，網頁只是檢視層。\n- Cowork 環境無法呼叫 Gemini/Codex，本機 CLI 是唯一能全自動調度的方式。\n"}, {"id": "adr-0002", "group": "決策紀錄 ADR", "title": "ADR-0002：Gemini 改由 Antigravity 執行（CLI 自動為主、IDE 為備案）", "version": "已採納", "file": "docs/decisions/ADR-0002-gemini-antigravity.md", "text": "# ADR-0002：Gemini 改由 Antigravity 執行（CLI 自動為主、IDE 為備案）\n\n- 日期：2026-10-05\n- 狀態：已採納（2026-10-05 本機驗證通過）\n- 修訂：ADR-0001 第 3 點（多模型接入）\n\n## 背景\n\nADR-0001 規劃由本機 Claude Code 以 `gemini -p` 非互動呼叫 Gemini。使用者端 gemini-cli 已停用，改用 Google Antigravity。Antigravity 除 IDE 外另有獨立 CLI `agy`，支援 `agy -p` headless 模式（沿用互動登入時快取的憑證；工作區內讀寫檔案預設允許），可由 Claude Code 以子程序呼叫。\n\n## 決策\n\n1. **介面不變**：Gemini 任務仍以 `handoff/gemini/<id>.md` 簡報交付，回覆存為同名 `.response.md`，簡報 `status` 由 `open` → `answered`。\n2. **處理規則集中於一份 skill**：`.agents/skills/handoff-gemini/SKILL.md`（Antigravity workspace skill，CLI 與 IDE 共用），規定讀取範圍、輸出格式、只可寫入 `.response.md` 與 `status` 欄位、不得執行 git。\n3. **主流程（全自動）**：Opus 在 Claude Code 執行\n   `agy -p \"使用 handoff-gemini skill 處理 handoff/gemini/<檔名>.md\"`\n   → 確認 `.response.md` 產生且 `status: answered` → 審閱、整合、log、commit。\n4. **備案（半自動）**：`agy` 不存在、逾時或登入失效時，Opus commit 簡報後停下並通知使用者；使用者在 Antigravity IDE 輸入 `/handoff-gemini`，完成後回報「Gemini 已回覆」。\n5. Codex 維持 `codex exec` 自動呼叫（只限 `experiments/`）。\n\n## 不採用的方案\n\n- **只用 IDE 人工轉交**：每份簡報都需人工操作，無法批次自動化。保留為備案。\n- **Antigravity workflows（`/workflow`）**：官方預告 2026-11-01 由 skills 取代，直接採用 skill。\n- **Gemini API 直接呼叫**：需另管 API key 與費用，且失去 Antigravity agent 讀寫 repo 的能力。\n\n## 影響\n\n- `.claude/settings.json` 移除 `gemini -p`、加入 `agy -p` 授權。\n- 安裝腳本 `scripts/setup/install-clis.ps1` 改為安裝 `agy`（與 IDE 分開安裝）。\n- Gemini 寫入的檔案由 Opus 負責 commit；Antigravity 不得 commit。\n- `agy -p` headless 模式無法詢問權限，寫檔會被自動拒絕。須在 `~/.gemini/antigravity-cli/settings.json` 加入最小授權 `permissions.allow: [\"write_file(D:/MMO_/handoff/gemini)\"]`；不使用 `--dangerously-skip-permissions`。\n\n## 驗證\n\n執行 `scripts/setup/test-orchestration.ps1`，以測試簡報 `handoff/gemini/SP0-000-smoke-test.md` 走完整流程，結果寫入 `logs/setup-test.txt`。通過條件：\n\n- [x] `agy -p` 能在非互動模式回應（登入有效）\n- [x] skill 被觸發，產生 `SP0-000-smoke-test.response.md`\n- [x] 簡報 `status` 改為 `answered`，`git status` 僅出現上述兩個檔案\n\n通過後將狀態改為「已採納」，刪除測試簡報；若 `agy -p` 無法觸發 skill，改為在 prompt 中直接附上 SKILL.md 內容。\n\n**結果（2026-10-05）**：三項皆通過（`git status` 另有測試腳本自身的報告 `logs/setup-test.txt`）。首次執行因缺少 `write_file` 授權失敗，加入上述 allow-rule 後通過；skill 可正常觸發，不需附上 SKILL.md。\n"}, {"id": "adr-0003", "group": "決策紀錄 ADR", "title": "ADR-0003：Codex 任務以英文執行、由 Opus 雙向翻譯（中英雙版本）", "version": "已採納", "file": "docs/decisions/ADR-0003-codex-bilingual-handoff.md", "text": "# ADR-0003：Codex 任務以英文執行、由 Opus 雙向翻譯（中英雙版本）\n\n- 日期：2026-10-05\n- 狀態：已採納\n- 修訂：CLAUDE.md 委派流程（Codex）、AGENTS.md、handoff/README.md\n\n## 背景\n\nADR-0002 驗證時發現：在 Windows PowerShell 以命令列參數傳給 `codex exec` 的中文 prompt 會變成亂碼（英文部分正常）。Codex 仍有回應，但無法可靠理解中文簡報。Gemini（`agy -p`）讀寫中文正常，不受影響。\n\n## 決策\n\n1. **Codex 一律以英文工作**：Opus 撰寫中文簡報後翻成英文版交給 Codex；Codex 以英文思考與產出（含命名）；Opus 再把回覆翻回中文。\n2. **保留中英雙版本**（檔名見下表）。中文版是正式依據，整合進 `docs/` 時採用中文版並附英文原文。\n\n   | 檔案 | 語言 | 作者 |\n   |---|---|---|\n   | `handoff/codex/<id>.md` | 中文簡報（正式） | Opus |\n   | `handoff/codex/<id>.en.md` | 英文簡報（交給 Codex） | Opus 翻譯 |\n   | `handoff/codex/<id>.response.en.md` | 英文回覆（原文） | Codex |\n   | `handoff/codex/<id>.response.md` | 中文回覆（翻譯） | Opus 翻譯 |\n\n3. **翻譯要保留語意與語境，不逐字直譯**：\n   - 專有名詞一律依 `docs/glossary.md`；表外新名詞保留原文並附暫譯，列入「新名詞」清單待定案。\n   - 英文簡報加上 **Context notes** 段落，說明英文難以直接表達的文化語境（如仙俠、宗門、江湖、五行），不要把它們壓扁成泛用的西方奇幻用語。\n   - 命名類任務：Codex 每個名稱都要附 **meaning / etymology / tone**。Opus 翻成中文時依原意命名，並標明譯法（意譯／音譯／改寫）；若直譯會失去原意，寫出取捨理由。中英名稱並列保留。\n   - 中文回覆末尾加「翻譯註記」，列出所有非直譯之處。\n4. **改用 stdin 傳入簡報**，避免命令列參數的編碼問題：\n   `codex exec -C experiments/<slug> - < handoff/codex/<id>.en.md`（Git Bash）\n5. Gemini 流程不變（ADR-0002），繼續用中文。\n\n## 不採用的方案\n\n- **只修正編碼（UTF-8 code page / stdin）後繼續用中文**：可以解決亂碼，但使用者希望同時保有中英兩版內容，且英文命名本身就是需要的產出。stdin 仍一併採用。\n- **讓 Codex 直接產出中文**：中文命名品質與語境由 Opus 負責把關較穩定。\n\n## 影響\n\n- 每個 Codex 任務多兩次翻譯（Opus 負責）。\n- 新增 `docs/glossary.md`，作為中英專有名詞的唯一來源；新名詞定案後由 Opus 補入。\n- `scripts/setup/test-orchestration.ps1` 的 codex 測試改用英文 prompt。\n"}, {"id": "adr-0004", "group": "決策紀錄 ADR", "title": "ADR-0004：暫定遊戲名稱「天塹星瀾 / The Sundered Reach」", "version": "已採納", "file": "docs/decisions/ADR-0004-provisional-title.md", "text": "# ADR-0004：暫定遊戲名稱「天塹星瀾 / The Sundered Reach」\n\n- 日期：2026-10-05\n- 狀態：已採納（暫定，可再改選）\n- 修訂：docs/GDD.md 標題、README.md、tracker/template.html、docs/glossary.md\n\n## 背景\n\nRex 不喜歡專案代號「大陸計畫 / Project: Continents」。SP1-002（Gemini）、SP1-003（Codex）與 Opus 共提出 25 個候選，彙整於 `docs/subprojects/SP1_worldbuilding.md`「遊戲正式名稱候選表」。\n\n## 決策\n\n1. 暫定採用 **G8 天塹星瀾 / The Sundered Reach**（Gemini 提案，「神話地理」方向）：取材自交界區天塹群島與引導航道的星象。\n2. 對外顯示的名稱（GDD 標題、README、追蹤網頁）改用暫定名。\n3. 以下**暫不改名**，避免在名稱未定案前大量改動：repo（`MMO_`）、公開追蹤 repo 與網址（`continents-tracker`）、協作規範檔（CLAUDE.md、AGENTS.md、GEMINI.md）、程式模組名（`ContinentsCombat` 等）。\n\n## 已知風險（Opus 審閱時標記，評等 C）\n\n- 英文 `Sundered` 已有同名遊戲（2017），`Rift`／裂隙類詞與 MMO《RIFT》相近；需查商標。\n- Gemini 的命名說明沿用 SP1-001 已否決的「星天儀軌」；名稱本身不含該詞，但日後撰寫典故時應改用「星盤修會」語感。\n- 「天塹」也是交界區正式名候選（天塹群島），遊戲名與地名重疊；若兩者都採用，需確認是否刻意呼應。\n\n## 後續\n\n正式定名前，對最終名稱做商標（第 9、41 類）、Steam、網域與社群帳號查核；若改選，新增 ADR 取代本文件。\n"}, {"id": "adr-0005", "group": "決策紀錄 ADR", "title": "ADR-0005：四陣營、大陸與交界區命名定案；跨洲據點採混合制", "version": "已採納", "file": "docs/decisions/ADR-0005-faction-geography-naming.md", "text": "# ADR-0005：四陣營、大陸與交界區命名定案；跨洲據點採混合制\n\n- 日期：2026-10-06\n- 狀態：已採納\n- 修訂：docs/glossary.md、docs/GDD.md（§3.1、§7.1）、docs/subprojects/SP1_worldbuilding.md\n\n## 背景\n\nSP1-001 r1（Gemini 提案、Opus 審閱）留下 6 項待決事項，見 `docs/subprojects/SP1_worldbuilding.md`「待討論」。Rex 於 2026-10-06 全部採用 Opus 建議。\n\n## 決策\n\n1. **陣營與大陸結構：方案 C「地緣雙核＋跨洲分支」。** 歐羅巴根基：鐵銀公約、星盤修會；震旦根基：天行赤焰軍、雲海商盟。四陣營都在對岸大陸與天塹群島設分支。\n2. **四陣營中英名：**\n\n   | 舊名（GDD） | 定案中文 | 定案英文 | 備註 |\n   |---|---|---|---|\n   | 白銀獅心同盟 | **鐵銀公約** | **The Iron & Silver Concord** | 銀獅改為徽記，不入名稱 |\n   | 星象觀星者 | **星盤修會** | **Order of the Starlight Astrolabe** | 「星盤」為 astrolabe 標準譯名 |\n   | 天行赤焰軍 | **天行赤焰軍**（不變） | **The Crimson Vanguard**（不變） | 不用 Empyrean；首領格言需改寫，見下 |\n   | 雲海商盟 | **雲海商盟**（不變） | **The Cloudveil Syndicate** | 補冠詞 The |\n\n3. **大陸名：沿用 歐羅巴 Europa／震旦 Orientis，不加別名**（否決「歐菲利亞」「震旦神洲／赤縣九洲」）。\n4. **交界區：天塹群島 / The Rift Archipelago。** 遊戲名「天塹星瀾」刻意呼應這片海域（解決 ADR-0004 標記的重疊問題：視為有意設計）。\n   - 政治地位：自由城邦，由 **領航者評議會 (Council of Helmsmen)** 自治；四陣營只能設領事館與商館，島上禁正規軍交戰，私掠與懸賞合法。\n5. **跨洲據點：混合制。**\n   - **租界 (Concession)**：每個陣營在對岸大陸的核心據點受條約保護，**不可攻佔**；提供傳送、補給、陣營任務。\n   - **前哨 (Outpost)**：租界周邊的礦場、哨站、港口等，**可被敵對陣營攻佔**，作為跨洲 PvP 與 AI Director 事件熱點。\n   - 數量、地點與攻佔規則交 SP6（外交）與 SP7（事件）設計；SP1 只提供設定與命名。\n6. **首領人格量化：交 SP6 決定。** SP1 只提供文字人格（四位首領草稿見 SP1 文件）；Aggression、Greed 等參數屬於 SP6 決策狀態機。\n\n## 後續\n\n- 赫連烈格言「天行健而逆天爭」與「天行健」（順天自強）原意相反，於設定聖經改寫。\n- 新名詞（領航者評議會、租界、前哨，以及設定聖經新增的地名）定案後補入 glossary。\n"}, {"id": "adr-0006", "group": "決策紀錄 ADR", "title": "ADR-0006：執行層進度追蹤（tasks/ CSV + 執行看板）", "version": "已採納", "file": "docs/decisions/ADR-0006-execution-tracking.md", "text": "# ADR-0006：執行層進度追蹤（tasks/ CSV + 執行看板）\n\n- 日期：2026-10-06\n- 狀態：已採納\n- 決策者：Rex（Opus 提案）\n\n## 背景\n\n子方案文件（SP0–SP8）追蹤的是設計與討論進度，缺少「實際做出來了沒有」的執行層追蹤：3D 資產、動畫與動作、引擎程式系統、各 AI 模型手上的任務。\n\n## 決策\n\n1. 新增 `tasks/` 四個 CSV（assets、animation、engine、ai_tasks），欄位相同，可用 Excel 編輯並進 git。\n2. 粒度為「系統／資產群組」（例：Blademaster 普攻四段），細節留在 SP 文件。\n3. 每個軌道有固定階段管線，`stage` 記錄目前所在階段；`progress` 留空時依階段自動計算。\n4. `handoff/` 的簡報自動併入 AI 任務軌道，狀態依簡報 frontmatter 對應（open→簡報、sent→執行中、answered→已回覆、integrated→已整合）。\n5. 追蹤網頁新增「執行看板」：四軌道摘要、里程碑篩選、階段管線、相依項目（已完成的相依顯示綠色）。\n6. CLAUDE.md 委派流程加入「更新 tasks/*.csv」步驟。\n\n## 影響\n\n- 首批資料以 SP2（M1）為主：3D 資產 7 項、動作 8 項、引擎系統 10 項，另含 SP4/SP6/SP8 的前置項。負責人多為「待定」，需 Rex 指派（自製、外包或素材替身）。\n- 引擎項目的負責人寫 Sonnet 指程式撰寫；UE5 編譯、試玩與手感驗收需由 Rex 在本機進行。\n"}, {"id": "adr-0007", "group": "決策紀錄 ADR", "title": "ADR-0007：引擎版本統一為 Unreal Engine 5.8", "version": "已採納", "file": "docs/decisions/ADR-0007-ue-version-5-8.md", "text": "# ADR-0007：引擎版本統一為 Unreal Engine 5.8\n\n- 日期：2026-10-06\n- 狀態：已採納\n- 決策者：Rex（Opus 提案）\n- 影響：SP2 §11、SP8、`docs/setup/local-orchestration.md`、`tasks/engine.csv`\n\n## 背景\n\n專案客戶端採用 UE5（GDD §9），但未鎖定小版本。準備開 UE 專案（E01）並邀請外部協作者（動畫、戰鬥、數值）前，必須全隊統一版本：UE 專案無法降版，版本不一致會導致資產無法開啟。候選為 5.6（教學與第三方插件最多）與 5.8（2026-06-17 發布的最新版）。\n\n## 決策\n\n1. 全專案統一使用 **UE 5.8**，以 Epic Games Launcher 安裝**當下最新的 5.8.x hotfix**。\n2. 升級 hotfix（5.8.x → 5.8.y）由 Rex 決定並在 log 記錄；**不跟進 5.9 / UE6**，除非另立 ADR。\n3. 工具鏈：Visual Studio **2026**（建議）或 VS 2022 **17.14 以上**（最低），安裝「使用 C++ 的遊戲開發」工作負載；Windows SDK 10.0.26100.0（建議）。\n4. 需要安裝 UE 的人：動畫、技術美術、引擎實作者。純文件／數值協作者不需安裝。\n\n## 理由（5.6 → 5.8 對本專案有意義的差異）\n\n| 項目 | 對本專案的影響 |\n|---|---|\n| **官方 Unreal MCP Server 插件**（Experimental） | Claude Code 可直接操作編輯器，支援 AI 動畫／特效流水線；第三方 UEMCP 僅支援到 5.6 |\n| **Iris 正式可用**（Production-Ready） | SP2 §10 的網路架構可直接評估 Iris，D9 的前提改變（SpatialOS 已停止支援） |\n| **Mover 改善**（Montage／Root Motion、ChaosMover 軌跡預測） | M3 評估 Mover 時的基礎較成熟 |\n| **重定向改善**（5.7 Spatially Aware Retargeting、5.8 Foot Definition） | AI 生成動作套用到專案骨架時，腳滑與穿模較少 |\n| **Control Rig Physics 正式可用、Animation Mixer**（Experimental） | 動作修整與預覽 |\n| **Lumen Lite**（Beta）、**MegaLights 正式可用** | MMO 多人場景的效能預算 |\n| **Mesh Terrain**（Experimental）、**PCG 正式可用**（5.7 起） | 交界群島等非高度圖地形 |\n\n## 風險與對策\n\n- **第三方插件／商城素材尚未支援 5.8**：引入前先確認相容版本；不相容者列入 `tasks/engine.csv` 註記。\n- **Experimental 功能不穩**（MCP、Mesh Terrain、Animation Mixer）：只作為工具鏈輔助，**核心玩法不依賴 Experimental 功能**。\n- **教學多為 5.6 以前**：大多數概念相同，差異處由 Opus 對照 5.8 官方文件。\n\n## 後續\n\n- SP2 §11.1 的 Iris、Mover 欄位依本 ADR 加註「5.8 前提下重新評估」，實際是否採用仍待 D9 / M3 決定。\n- E01（UE 專案骨架）以 5.8 建立，`.uproject` 的 `EngineAssociation` 為 `5.8`。\n"}, {"id": "adr-0008", "group": "決策紀錄 ADR", "title": "ADR-0008：九座城市名稱定案；「租界」改為「駐地」；赫連烈格言", "version": "已採納", "file": "docs/decisions/ADR-0008-city-names-enclave.md", "text": "# ADR-0008：九座城市名稱定案；「租界」改為「駐地」；赫連烈格言\n\n- 日期：2026-10-06\n- 狀態：已採納\n- 取代：ADR-0005 第 5 點中的用詞「租界 (Concession)」（混合制規則本身不變）\n- 修訂：docs/glossary.md、docs/GDD.md §7.1、docs/subprojects/SP1_worldbuilding.md、docs/lore/story.md\n\n## 背景\n\nSP1-004（世界觀聖經 v0.1）與 SP1-006（遊戲故事）留下的命名待決事項，見 `docs/subprojects/SP1_worldbuilding.md`「待討論」。Rex 於 2026-10-06 全部採用 Opus 建議。\n\n## 決策\n\n1. **「租界」改為「駐地 / Enclave」。** 「租界」在華語語境會聯想到現實的殖民史（如領事裁判權）。規則不變：駐地受條約保護，不可攻佔；周邊的前哨 (Outpost) 可攻佔。\n2. **九座城市名稱**（ID 對應 SP1-005 形象圖）：\n\n   | ID | 中文 | English | 定位 |\n   |---|---|---|---|\n   | EU-01 | 艾森堡 | Eisenburg | 鐵銀公約首府，河谷要塞聖城 |\n   | EU-02 | 霧環堡 | Nebelburg | 星盤修會總部，迷霧低地學院城 |\n   | EU-03 | 霜灣港 | Frostfjord Port | 北境峽灣港；雲海商盟駐地「千帆商館」所在 |\n   | OR-01 | 雲闕城 | Cloudgate | 古王朝皇城 |\n   | OR-02 | 碧瀾商都 | Jade-Ripple Emporium | 雲海商盟總部，水鄉商都 |\n   | OR-03 | 斷雲關 | Cloud-Sever Pass | 天行赤焰軍總部，北境雄關 |\n   | OR-04 | 凌霄宗 | Cloud-Loft Sect | 浮空宗門（道士與劍修） |\n   | RA-01 | 鯨骨自由港 | Whalebone Freeport | 天塹群島首府，領航者評議會所在 |\n   | RA-02 | 落星穹頂 | Falling Star Vault | 隕星海溝穹頂 |\n\n   否決：「艾森加德」（《魔戒》Isengard 的標準中譯）、「威斯帕學院城 / Whisperingburg」（英德混搭）、「凌霄劍宗」（宗門不只有劍修）。\n3. **赫連烈格言**：「天行剛健，唯武自強；強者立命，逆海奪鼎。」回歸「天行健」的原意；「逆海」指跨越天塹。\n\n## 後續\n\n- 城市名都還沒做商標或撞名檢索；與遊戲名一起在正式定名前查核。\n- SP1-005 形象圖 manifest 補上正式城市名，以及 EU-03-N3 的角色名「賽蓮娜」。\n"}, {"id": "adr-0009", "group": "決策紀錄 ADR", "title": "ADR-0009：鯨骨自由港設為安全區；城內地標與街區名稱收入 glossary", "version": "已採納", "file": "docs/decisions/ADR-0009-whalebone-safe-zone-landmarks.md", "text": "# ADR-0009：鯨骨自由港設為安全區；城內地標與街區名稱收入 glossary\n\n- 日期：2026-10-06\n- 狀態：已採納\n- 修訂：docs/glossary.md、docs/GDD.md §3.1、docs/subprojects/SP1_worldbuilding.md\n\n## 背景\n\nSP1-007 為鯨骨自由港（RA-01）規劃街區配置 v0.1（簡報 `handoff/codex/SP1-007-whalebone-layout.md`）。它是全遊戲的中立主城，玩家抵達點、拍賣行、銀行與 The Forge 都在城內。規劃時有兩個待決事項：主城的 PvP 規則，以及只出現在 `docs/lore/story.md` 的地標英文名是否正式化。Rex 於 2026-10-06 決定。\n\n## 決策\n\n1. **鯨骨自由港是安全區 (Safe Zone)。**\n   - 範圍：街區 1–8（肋骨港、東澳、自由市集、工坊階、公約石階、評議會廳、導航石碑崖、陣營館區）。\n   - 城內禁止一切 PvP，包含陣營戰、懸賞擊殺與私掠；由評議會守望隊 (Council Watch) 維持秩序，符合《天塹海岬不戰公約》「島上禁正規軍」的設定。\n   - 雙方同意的決鬥只能在指定場地進行；場地位置與規則交 SP2（戰鬥）與 SP7（事件）。\n   - 街區 9（暗灣入口）是邊界：穿過海蝕洞進入鏽錨走私暗灣後，即恢復懸賞與 PvP 規則。\n   - 其他主城（各陣營首府）是否為安全區，本 ADR 不決定；與攻城戰規則一起交 SP6、SP7。\n2. **以下名稱收入 glossary**（來源標 ADR-0009）：\n   - 歷史地標：公約石階 The Accords Steps、東澳 Whalebone East-Haven、九方客棧 The Jiufang Inn、戈德里克導航石碑 Godrick's Stele。\n   - 街區名稱（配置 v0.1）：肋骨港 Rib Harbor、自由市集 Free Market、工坊階 Forge Terraces、評議會廳 Helmsmen's Hall。\n   - 政治與系統：評議會守望隊 Council Watch、安全區 Safe Zone。\n   - 順帶補齊 `docs/lore/` 已有、但 glossary 漏收的名詞：銀獅海事衛所 Silver Lion Admiralty、戰修武閣 Vanguard War-Hall、九方錢莊 Nine-Seas Countinghouse、晦明研究所 Dusk-Dawn Scriptorium、鏽錨走私暗灣 Rust-Anchor Smuggler's Cove。\n\n## 影響\n\n- 街區名稱屬於配置 v0.1；SP1-007 審閱後若街區合併或改名，需同步更新 glossary。\n- SP5（經濟）的拍賣行、銀行，以及 SP4（AI 鍛造）的公共鍛造台，預設都在安全區內，不必處理 PvP 干擾。\n"}]}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
(function(){
const D=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md=s=>{try{return window.marked?marked.parse(s):'<pre class="raw">'+esc(s)+'</pre>'}catch(e){return '<pre class="raw">'+esc(s)+'</pre>'}};
const docs=D.docs, byId={}, byFile={};
docs.forEach(d=>{byId[d.id]=d;byFile[d.file.split('/').pop()]=d;byFile[d.file]=d});
let query='';
$('foot').textContent='由 tools/build_tracker.py 於 '+D.generated+' 從 docs/ 產生。內容以 git repo 為準；衝突時依 ADR → 專有名詞表 → 世界觀聖經 → GDD 的順序判定。';

function count(d){if(!query)return 0;const t=d.text.toLowerCase();let n=0,i=0;while((i=t.indexOf(query,i))!==-1){n++;i+=query.length}return n}
function renderNav(cur){
  const groups=[...new Set(docs.map(d=>d.group))];
  $('groups').innerHTML=groups.map(g=>{
    const items=docs.filter(d=>d.group===g).map(d=>({d,n:count(d)})).filter(x=>!query||x.n);
    if(!items.length)return '';
    const open=query||items.some(x=>x.d.id===cur)||!(window.innerWidth<860||g.startsWith('決策'));
    return `<details class="group" ${open?'open':''}><summary>${esc(g)} <span class="cnt">${items.length}</span></summary><ul>${items.map(({d,n})=>`<li><a href="#${d.id}" aria-current="${d.id===cur?'page':'false'}"><span>${esc(d.title)}</span>${query?`<span class="hit">${n}</span>`:(d.version?`<span class="v">${esc(d.version)}</span>`:'')}</a></li>`).join('')}</ul></details>`}).join('')
    ||'<p class="eyebrow">沒有符合的文件</p>'}
function highlight(root){if(!query)return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);const hits=[];let n;
  while(n=w.nextNode()){if(n.nodeValue.toLowerCase().includes(query))hits.push(n)}
  hits.forEach(t=>{const s=t.nodeValue,low=s.toLowerCase();const f=document.createDocumentFragment();let i=0,j;
    while((j=low.indexOf(query,i))!==-1){f.append(s.slice(i,j));const m=document.createElement('mark');m.textContent=s.slice(j,j+query.length);f.append(m);i=j+query.length}
    f.append(s.slice(i));t.replaceWith(f)});
  const first=root.querySelector('mark');if(first)first.scrollIntoView({block:'center'})}
function show(id){
  const d=byId[id]||docs[0];
  $('p-group').textContent=d.group+' · '+d.title;
  $('p-src').textContent=d.file;
  const b=$('body');
  b.innerHTML=(d.image?`<figure class="map"><img src="${esc(d.image.src)}" alt="${esc(d.image.alt)}" loading="lazy"><figcaption>${esc(d.image.alt)}</figcaption></figure>`:'')+md(d.text);
  // 文件間連結 → 站內頁面
  b.querySelectorAll('a[href]').forEach(a=>{const h=a.getAttribute('href');const m=h.match(/([^\/#]+\.md)(#.*)?$/);
    if(m&&byFile[m[1]])a.setAttribute('href','#'+byFile[m[1]].id);else if(/^https?:/.test(h)){a.target='_blank';a.rel='noopener'}});
  // 目錄
  const hs=[...b.querySelectorAll('h2')];
  hs.forEach((h,i)=>h.id=d.id+'--'+i);
  $('toc').innerHTML=hs.length>2?hs.map(h=>`<a href="#${h.id}" data-jump="${h.id}">${esc(h.textContent.replace(/\s*\(.*?\)\s*$/,'').slice(0,24))}</a>`).join(''):'';
  highlight(b);
  renderNav(d.id);
  document.title=d.title+' · 天塹星瀾 設定集';
  if(!query)window.scrollTo({top:0});
}
$('toc').addEventListener('click',e=>{const a=e.target.closest('[data-jump]');if(!a)return;e.preventDefault();document.getElementById(a.dataset.jump)?.scrollIntoView({behavior:'smooth'})});
function route(){const id=decodeURIComponent(location.hash.slice(1));if(id.includes('--'))return;show(byId[id]?id:docs[0].id)}
window.addEventListener('hashchange',route);
let t;$('q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{query=e.target.value.trim().toLowerCase();
  const cur=decodeURIComponent(location.hash.slice(1));
  if(query&&!(byId[cur]&&count(byId[cur]))){const f=docs.find(d=>count(d));if(f){location.hash=f.id;return}}
  route()},200)});
route();
})();
</script>
</body>
</html>
